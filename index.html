<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <!-- ===== PWA / iOS 加入主畫面 ===== -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="家庭記帳">
    <meta name="theme-color" content="#FFF9F2">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./icon-180.png">
    <link rel="icon" href="./icon-192.png">

    <title>家庭記帳</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pastel: {
                            bg: '#FFF9F2', card: '#FFFFFF', text: '#33302E', muted: '#948E88',
                            border: '#F0EBE1', accent: '#FF9F68', accentLight: '#FFEEDD',
                            green: '#4EB883', greenLight: '#E8F7F0', red: '#F06A6A', redLight: '#FDECEC',
                            purple: '#A084E8', blue: '#6499E9', blueLight: '#EDF4FF', yellow: '#FFD966'
                        }
                    },
                    /* ===== 圓角設計 Token（統一量尺，取代先前 11 種散裝圓角） ===== */
                    borderRadius: {
                        'card': '24px',   // 大卡片
                        'sheet': '32px',  // 彈出面板
                        'tile': '16px'    // 小圖示容器 / 輸入框 / 次級按鈕
                    },
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans TC', 'sans-serif'],
                        rounded: ['Comfortaa', 'Noto Sans TC', 'sans-serif']
                    },
                    boxShadow: {
                        'soft': '0 8px 30px rgba(220, 200, 180, 0.2)',
                        'card': '0 4px 20px rgba(0, 0, 0, 0.04)',
                        'glow-gold': '0 0 15px rgba(250, 204, 21, 0.6)'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color:#F4EFEA; font-family:'Inter','Noto Sans TC',sans-serif; color:#33302E; -webkit-tap-highlight-color:transparent; overscroll-behavior:none; }
        .hide-scrollbar::-webkit-scrollbar { display:none; }
        .hide-scrollbar { -ms-overflow-style:none; scrollbar-width:none; }
        input, select, textarea { font-size:16px; } /* 防 iOS 自動放大 */
        @keyframes spin { to { transform:rotate(360deg); } }
        .spinner { animation:spin 0.8s linear infinite; }
        .js-hide { display:none !important; }
    </style>
</head>
<body class="flex justify-center min-h-[100dvh] p-0 md:p-6 text-sm">

<div class="w-full max-w-md bg-pastel-bg h-[100dvh] md:h-[880px] md:rounded-[44px] shadow-2xl flex flex-col overflow-hidden relative border-0 md:border-[10px] border-stone-800">

    <!-- 假狀態列：僅在瀏覽器中顯示，PWA 模式自動隱藏 -->
    <div id="fakeStatusBar" class="pt-3 px-7 pb-1 flex justify-between items-center text-xs text-stone-500 font-medium select-none bg-pastel-bg z-20 shrink-0">
        <span class="font-bold text-stone-700 tracking-wider" id="clock">09:41</span>
        <div class="flex items-center gap-2"><i class="fa-solid fa-wifi text-stone-600"></i><i class="fa-solid fa-battery-full text-stone-700"></i></div>
    </div>
    <!-- PWA 模式的瀏海安全區 -->
    <div class="shrink-0" style="height:env(safe-area-inset-top)"></div>

    <!-- ===== 載入中 ===== -->
    <div id="splash" class="absolute inset-0 bg-pastel-bg z-[80] flex flex-col items-center justify-center gap-4">
        <div class="text-5xl">🏠</div>
        <div class="w-8 h-8 border-4 border-pastel-accentLight border-t-pastel-accent rounded-full spinner"></div>
        <div class="text-xs text-pastel-muted">連線中…</div>
    </div>

    <!-- ===== 登入閘門 ===== -->
    <div id="gateScreen" class="absolute inset-0 bg-pastel-bg z-[70] flex flex-col justify-center px-6 py-8 overflow-y-auto hide-scrollbar js-hide">
        <div class="text-center space-y-2 mb-8">
            <div class="w-20 h-20 bg-white rounded-sheet mx-auto shadow-card flex items-center justify-center text-4xl mb-4">🏠</div>
            <h1 class="text-2xl font-bold text-pastel-text">家庭記帳</h1>
            <p class="text-pastel-muted text-sm">輸入家庭代碼以連線</p>
        </div>

        <div id="gateError" class="hidden mb-4 p-3 rounded-tile bg-pastel-redLight border border-pastel-red/30 text-pastel-red text-xs font-bold"></div>

        <div id="gateStep1" class="bg-white p-6 rounded-sheet shadow-card border border-pastel-border space-y-4">
            <div>
                <label class="block text-sm font-bold text-stone-700 mb-1.5">家庭代碼</label>
                <input type="text" id="gateCode" autocomplete="off" autocapitalize="off" placeholder="向家人索取"
                       class="w-full p-3.5 rounded-tile bg-pastel-bg border border-pastel-border focus:outline-none focus:ring-2 focus:ring-pastel-accent">
            </div>
            <button id="gateCodeBtn" onclick="gateSubmitCode()" class="w-full py-3.5 bg-pastel-accent text-white font-bold rounded-tile shadow-md hover:bg-orange-500 transition-all">下一步</button>
        </div>

        <div id="gateStep2" class="hidden bg-white p-6 rounded-sheet shadow-card border border-pastel-border space-y-4">
            <label class="block text-sm font-bold text-stone-700">你是誰？</label>
            <div id="memberPicker" class="grid grid-cols-3 gap-3"></div>
        </div>

        <p class="text-center text-[10px] text-pastel-muted mt-6">版本 <span id="appVersion">–</span></p>
    </div>

    <!-- ===== Header ===== -->
    <header id="appHeader" class="px-5 py-3 bg-pastel-bg z-20 flex justify-between items-center border-b border-pastel-border/60 js-hide shrink-0">
        <div class="flex items-center gap-3">
            <div class="relative cursor-pointer hover:opacity-80 transition-opacity" onclick="openProfileModal()">
                <div id="userAvatar" class="w-12 h-12 rounded-full border-[3px] flex items-center justify-center text-[22px] shadow-sm transition-all duration-500"></div>
                <div id="levelBadge" class="absolute -bottom-1 -right-1 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full border-2 border-white shadow-sm"></div>
            </div>
            <div>
                <div class="text-xs text-pastel-muted font-medium flex items-center gap-1.5 mb-0.5">
                    Hi, <span id="displayUserName" class="font-bold text-pastel-text text-sm">使用者</span>! <span class="text-sm">👋</span>
                </div>
                <div class="flex items-center gap-1 bg-stone-200/50 p-1 rounded-full mt-1 w-max">
                    <button id="modePersonalBtn" onclick="switchViewMode('personal')" class="px-3 py-1 rounded-full font-bold text-[11px] transition-all bg-white text-pastel-text shadow-sm"><i class="fa-solid fa-user text-[10px] mr-1.5 text-pastel-accent"></i>個人</button>
                    <button id="modeFamilyBtn" onclick="switchViewMode('family')" class="px-3 py-1 rounded-full font-bold text-[11px] text-pastel-muted transition-all"><i class="fa-solid fa-house text-[10px] mr-1.5"></i>家庭</button>
                </div>
            </div>
        </div>
        <button onclick="switchTab('settings')" aria-label="設定" class="w-10 h-10 rounded-full bg-white border border-pastel-border flex items-center justify-center text-pastel-muted hover:text-pastel-accent shadow-sm transition-all"><i class="fa-solid fa-gear text-sm"></i></button>
    </header>

    <!-- ===== Main ===== -->
    <main id="appMain" class="flex-1 overflow-y-auto px-5 py-4 hide-scrollbar pb-32 js-hide bg-[#F4EFEA]">
        <div id="dashboardView" class="space-y-4"></div>
        <div id="transactionsView" class="space-y-4 hidden"></div>
        <div id="addView" class="space-y-4 hidden"></div>
        <div id="statsView" class="space-y-4 hidden"></div>
        <div id="settingsView" class="space-y-4 hidden"></div>
    </main>

    <!-- ===== Toast ===== -->
    <div id="toast" class="absolute left-0 right-0 bottom-28 z-[90] flex justify-center opacity-0 pointer-events-none transition-opacity duration-300"></div>

    <!-- ===== Bottom Nav ===== -->
    <nav id="appNav" class="absolute bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-pastel-border px-6 pt-2.5 flex justify-between items-center z-30 shadow-[0_-10px_40px_rgba(0,0,0,0.03)] js-hide"
         style="padding-bottom:calc(0.625rem + env(safe-area-inset-bottom))">
        <button onclick="switchTab('dashboard')" id="navDashboard" class="flex flex-col items-center text-pastel-accent w-12 nav-btn"><i class="fa-solid fa-house-chimney text-lg mb-1"></i><span class="text-[10px] font-bold">首頁</span></button>
        <button onclick="switchTab('transactions')" id="navTransactions" class="flex flex-col items-center text-pastel-muted w-12 nav-btn"><i class="fa-solid fa-list-ul text-lg mb-1"></i><span class="text-[10px] font-bold">明細</span></button>
        <button onclick="switchTab('add')" id="navAdd" aria-label="新增" class="relative -mt-10 nav-btn">
            <div id="addBtnInner" class="w-16 h-16 bg-pastel-accent text-white rounded-full flex items-center justify-center shadow-soft border-[6px] border-[#F4EFEA] transition-all duration-300"><i class="fa-solid fa-plus text-3xl"></i></div>
        </button>
        <button onclick="switchTab('stats')" id="navStats" class="flex flex-col items-center text-pastel-muted w-12 nav-btn"><i class="fa-solid fa-chart-pie text-lg mb-1"></i><span class="text-[10px] font-bold">圖表</span></button>
        <button onclick="switchTab('settings')" id="navSettings" class="flex flex-col items-center text-pastel-muted w-12 nav-btn"><i class="fa-solid fa-user-group text-lg mb-1"></i><span class="text-[10px] font-bold">設定</span></button>
    </nav>

    <!-- ===== Profile Modal ===== -->
    <div id="profileModal" class="absolute inset-0 bg-stone-900/40 backdrop-blur-sm z-[60] flex items-end justify-center opacity-0 transition-opacity duration-300 js-hide">
        <div class="bg-white w-full rounded-t-sheet p-6 shadow-2xl transform translate-y-full transition-transform duration-300" id="profileModalContent">
            <div class="flex justify-between items-center mb-5">
                <h2 class="text-lg font-bold text-stone-800">個人角色卡</h2>
                <button onclick="closeProfileModal()" aria-label="關閉" class="w-8 h-8 bg-stone-100 rounded-full flex items-center justify-center text-stone-500 shadow-sm"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="flex flex-col items-center text-center space-y-3 mb-6">
                <div class="relative">
                    <div id="modalUserAvatar" class="w-20 h-20 rounded-full border-[4px] flex items-center justify-center text-4xl shadow-md">🐱</div>
                    <div id="modalLevelBadge" class="absolute -bottom-2 -right-2 text-white text-xs font-bold px-2.5 py-1 rounded-full border-2 border-white shadow-sm">LV.1</div>
                </div>
                <div><h3 id="modalUserName" class="text-xl font-bold text-stone-800">暱稱</h3><p id="modalUserPhone" class="text-sm text-pastel-muted"></p></div>
            </div>
            <div class="bg-pastel-bg rounded-tile p-4 border border-pastel-border mb-5">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-sm font-bold text-stone-700">🔥 連續記帳天數</span>
                    <span id="modalStreak" class="text-lg font-bold text-orange-500">0 天</span>
                </div>
                <div class="w-full bg-stone-200 rounded-full h-2 mb-2 overflow-hidden"><div id="modalLevelProgress" class="bg-pastel-accent h-2 rounded-full transition-all duration-500" style="width:0%"></div></div>
                <p id="modalNextLevelText" class="text-[11px] text-pastel-muted text-center"></p>
            </div>
            <button onclick="closeProfileModal()" class="w-full py-3 bg-stone-100 text-stone-700 font-bold rounded-tile text-sm">關閉</button>
        </div>
    </div>
</div>

<script>
  /* 假狀態列時鐘 */
  setInterval(() => {
    const d = new Date();
    const el = document.getElementById('clock');
    if (el) el.innerText = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }, 1000);
</script>
    <script>
    /* ==========================================================
       家庭記帳 PWA  v4.0.0
       前端：GitHub Pages (static)  /  後端：Google Apps Script JSON API
       ========================================================== */

    const CONFIG = {
        VERSION: 'v4.0.0',
        // ↓↓↓ 部署 GAS 後把網址貼在這裡（結尾必須是 /exec） ↓↓↓
        API_URL: 'https://script.google.com/macros/s/AKfycbzCl73_9to7Fmev1slsskZkbZsq2jzc52wYb6ED6Y1u8sbscSsnvRBMQJ55zorbnlEm/exec',
        DEMO: false   // true = 不連後端，用假資料試玩
    };

    /* ---------- 安全工具：所有動態內容一律跳脫，防 Stored XSS ---------- */
    const esc = s => String(s ?? '').replace(/[&<>"']/g,
        c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    const fmt = n => '$' + Number(n || 0).toLocaleString('en-US');
    const todayISO = () => {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    };

    /* ---------- 認證狀態（存 localStorage） ---------- */
    const AUTH = {
        get familyCode() { return localStorage.getItem('fc') || ''; },
        set familyCode(v) { localStorage.setItem('fc', v); },
        get memberId() { return localStorage.getItem('mid') || ''; },
        set memberId(v) { localStorage.setItem('mid', v); },
        clear() { localStorage.removeItem('fc'); localStorage.removeItem('mid'); }
    };

    /* ---------- API Client ----------
       用 text/plain 送出，避開 CORS preflight（GAS 無法正確回應 OPTIONS）
    ---------------------------------- */
    const api = {
        async call(action, payload = {}) {
            if (CONFIG.DEMO) return DEMO_API(action, payload);
            const body = JSON.stringify({
                action, familyCode: AUTH.familyCode, memberId: AUTH.memberId, ...payload
            });
            const res = await fetch(CONFIG.API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body, redirect: 'follow'
            });
            if (!res.ok) throw new Error(`連線失敗 (HTTP ${res.status})`);
            const json = await res.json();
            if (!json.ok) throw new Error(json.error || '後端錯誤');
            return json.data;
        }
    };

    /* ---------- 全域資料狀態 ---------- */
    let STATE = {
        familyName: '', members: [], categories: [], tags: [],
        transactions: [], me: null, poolInitial: 0
    };
    let currentMode = 'personal';
    let currentTab = 'dashboard';
    let isAddFormExpense = true;
    let pendingReceipt = null;   // { base64, mime }

    /* ==========================================================
       等級系統（統一邏輯，含 tier）
       ========================================================== */
    function getLevelInfo(days) {
        days = Number(days) || 0;
        const level = Math.floor(days / 10) + 1;
        let t;
        if (days < 100) t = { tier: 1, name: '奶油米', next: 100, prev: 0, color: 'text-stone-600', border: 'border-[#F0EBE1]', bg: 'bg-stone-50', badge: 'bg-stone-500' };
        else if (days < 200) t = { tier: 2, name: '暖陽橘', next: 200, prev: 100, color: 'text-orange-500', border: 'border-orange-400', bg: 'bg-orange-50', badge: 'bg-orange-500' };
        else if (days < 300) t = { tier: 3, name: '森林薄荷綠', next: 300, prev: 200, color: 'text-[#4EB883]', border: 'border-[#4EB883]', bg: 'bg-emerald-50', badge: 'bg-[#4EB883]' };
        else if (days < 500) t = { tier: 4, name: '海洋靜謐藍', next: 500, prev: 300, color: 'text-[#6499E9]', border: 'border-[#6499E9]', bg: 'bg-blue-50', badge: 'bg-[#6499E9]' };
        else t = { tier: 5, name: '耀眼星光金', next: days, prev: 500, color: 'text-yellow-600', border: 'border-yellow-400 shadow-glow-gold', bg: 'bg-yellow-50', badge: 'bg-yellow-500' };
        const progress = t.tier === 5 ? 100 : ((days - t.prev) / (t.next - t.prev)) * 100;
        return { ...t, level, progress, days };
    }

    function renderAvatar(elId, badgeId, isModal) {
        const el = document.getElementById(elId), badge = document.getElementById(badgeId);
        if (!el || !badge || !STATE.me) return;
        const info = getLevelInfo(STATE.me.streak_days);
        el.className = (isModal
            ? 'w-20 h-20 rounded-full border-[4px] flex items-center justify-center text-4xl shadow-md transition-all duration-500'
            : 'w-12 h-12 rounded-full border-[3px] flex items-center justify-center text-[22px] shadow-sm transition-all duration-500')
            + ` ${info.border} ${info.bg}`;
        el.innerText = STATE.me.avatar_emoji || '🐱';
        badge.className = (isModal
            ? 'absolute -bottom-2 -right-2 text-white text-xs font-bold px-2.5 py-1 rounded-full border-2 border-white shadow-sm'
            : 'absolute -bottom-1 -right-1 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full border-2 border-white shadow-sm')
            + ` ${info.badge}`;
        badge.innerText = `LV.${info.level}`;
    }

    function updateLevelDisplays() {
        if (!STATE.me) return;
        renderAvatar('userAvatar', 'levelBadge', false);
        renderAvatar('modalUserAvatar', 'modalLevelBadge', true);
        const info = getLevelInfo(STATE.me.streak_days);
        const $ = id => document.getElementById(id);
        if ($('modalStreak')) {
            $('modalStreak').innerText = `${info.days} 天`;
            $('modalLevelProgress').style.width = `${info.progress}%`;
            $('modalNextLevelText').innerText = info.tier === 5
                ? '您已達到最高殿堂光環！'
                : `距離解鎖下一階段光環還差 ${info.next - info.days} 天`;
        }
        if ($('settingsAvatarContainer')) {
            const s = $('settingsAvatarContainer');
            s.className = `w-16 h-16 mx-auto rounded-full border-[4px] flex items-center justify-center text-2xl mb-3 ${info.border} ${info.bg}`;
            s.innerText = STATE.me.avatar_emoji || '🐱';
            $('settingsLevelName').className = `font-bold ${info.color}`;
            $('settingsLevelName').innerText = `LV.${info.level} ${info.name}`;
        }
    }

    /* ==========================================================
       統計計算層（唯一真實來源，杜絕硬編數字）
       amount 恆為正數，方向由 entry_type 決定
       is_rollup=true 的父列一律不計入，避免拆帳重複計算
       ========================================================== */
    function activeTxns() {
        return STATE.transactions.filter(t => t.status !== '作廢' && !t.is_rollup);
    }
    function inMonth(dateStr, ym) { return String(dateStr).slice(0, 7) === ym; }
    function currentYM() { return todayISO().slice(0, 7); }

    function computeSummary(mode) {
        const ym = currentYM();
        const meId = STATE.me?.member_id;
        const rows = activeTxns();
        const s = {
            monthlyIncome: 0, monthlyExpense: 0, cashBalance: 0,
            poolOwesMe: 0, iOweOthers: 0, poolBalance: 0,
            poolOwesMembers: [], membersOwePool: [], byCategory: []
        };

        if (mode === 'personal') {
            const mine = rows.filter(t => t.payer_id === meId);
            mine.forEach(t => {
                const amt = Number(t.amount) || 0;
                if (inMonth(t.date, ym)) {
                    if (t.entry_type === '支出') s.monthlyExpense += amt;
                    if (t.entry_type === '收入') s.monthlyIncome += amt;
                }
                // 現金流：收入/還款收到為 +，支出/注資為 -
                if (t.entry_type === '收入') s.cashBalance += amt;
                else if (t.entry_type === '支出' || t.entry_type === '注資') s.cashBalance -= amt;
                else if (t.entry_type === '還款') s.cashBalance += (t.related_id === meId ? amt : -amt);
                // 債務：家庭代墊 = 公帳欠我
                if (t.nature === '家庭代墊' && t.entry_type === '支出') s.poolOwesMe += amt;
                if (t.nature === '私人拆帳' && t.entry_type === '支出') s.iOweOthers += 0;
            });
            s.cashBalance += Number(STATE.me?.initial_balance) || 0;
            // 公帳已還給我的部分要扣掉
            rows.filter(t => t.entry_type === '還款' && t.related_id === meId && t.member_id === 'family_pool')
                .forEach(t => s.poolOwesMe -= Number(t.amount) || 0);
            // 我欠別人（私人拆帳中我是 related_id）
            rows.filter(t => t.nature === '私人拆帳' && t.related_id === meId && t.payer_id !== meId)
                .forEach(t => s.iOweOthers += Number(t.amount) || 0);

            const catMap = {};
            mine.filter(t => t.entry_type === '支出' && inMonth(t.date, ym))
                .forEach(t => { catMap[t.category || '未分類'] = (catMap[t.category || '未分類'] || 0) + Number(t.amount); });
            s.byCategory = Object.entries(catMap).sort((a, b) => b[1] - a[1]);
        } else {
            const fam = rows.filter(t => t.nature === '家庭公帳' || t.nature === '家庭代墊' || t.nature === '公帳注資');
            fam.forEach(t => {
                const amt = Number(t.amount) || 0;
                if (inMonth(t.date, ym)) {
                    if (t.entry_type === '支出') s.monthlyExpense += amt;
                    if (t.entry_type === '收入' || t.entry_type === '注資') s.monthlyIncome += amt;
                }
                if (t.entry_type === '收入' || t.entry_type === '注資') s.poolBalance += amt;
                if (t.entry_type === '支出' && t.nature === '家庭公帳') s.poolBalance -= amt;
                if (t.entry_type === '還款') s.poolBalance -= amt;
            });
            s.poolBalance += Number(STATE.poolInitial) || 0;

            // 公帳欠成員（成員代墊未還）
            const owe = {};
            rows.filter(t => t.nature === '家庭代墊' && t.entry_type === '支出')
                .forEach(t => { owe[t.payer_id] = (owe[t.payer_id] || 0) + Number(t.amount); });
            rows.filter(t => t.entry_type === '還款' && t.member_id === 'family_pool')
                .forEach(t => { owe[t.related_id] = (owe[t.related_id] || 0) - Number(t.amount); });
            s.poolOwesMembers = Object.entries(owe).filter(([, v]) => v > 0.01)
                .map(([id, v]) => ({ member: nameOf(id), amount: v }));

            // 成員欠公帳（預支/分攤）
            const back = {};
            rows.filter(t => t.nature === '公帳注資' && t.entry_type === '支出')
                .forEach(t => { back[t.payer_id] = (back[t.payer_id] || 0) + Number(t.amount); });
            s.membersOwePool = Object.entries(back).filter(([, v]) => v > 0.01)
                .map(([id, v]) => ({ member: nameOf(id), amount: v }));

            const catMap = {};
            fam.filter(t => t.entry_type === '支出' && inMonth(t.date, ym))
                .forEach(t => { catMap[t.category || '未分類'] = (catMap[t.category || '未分類'] || 0) + Number(t.amount); });
            s.byCategory = Object.entries(catMap).sort((a, b) => b[1] - a[1]);
        }
        return s;
    }

    function nameOf(id) {
        const m = STATE.members.find(x => x.member_id === id);
        return m ? m.nickname : id;
    }

    async function bootstrap() {
        document.getElementById('appVersion').innerText = CONFIG.VERSION;
        if (CONFIG.API_URL.includes('PASTE_') && !CONFIG.DEMO) {
            showGateError('尚未設定 API_URL，請先完成 GAS 部署並填入網址。');
            showGate(); return;

        if (AUTH.familyCode && AUTH.memberId) {
            try { await loadAll(); enterApp(); return; }
            catch (e) { AUTH.clear(); }
        }
        showGate();
    }

    function showGate() {
        document.getElementById('gateScreen').classList.remove('js-hide');
        document.getElementById('splash').classList.add('js-hide');
    }
    function showGateError(msg) {
        const el = document.getElementById('gateError');
        el.innerText = msg; el.classList.remove('hidden');
    }

    async function gateSubmitCode() {
        const code = document.getElementById('gateCode').value.trim();
        if (!code) return showGateError('請輸入家庭代碼');
        const btn = document.getElementById('gateCodeBtn');
        btn.disabled = true; btn.innerText = '連線中...';
        try {
            AUTH.familyCode = code;
            const data = await api.call('listMembers');
            STATE.members = data.members; STATE.familyName = data.familyName;
            renderMemberPicker();
            document.getElementById('gateStep1').classList.add('hidden');
            document.getElementById('gateStep2').classList.remove('hidden');
            document.getElementById('gateError').classList.add('hidden');
        } catch (e) {
            AUTH.clear(); showGateError(e.message);
        } finally { btn.disabled = false; btn.innerText = '下一步'; }
    }

    function renderMemberPicker() {
        document.getElementById('memberPicker').innerHTML = STATE.members
            .filter(m => m.member_id !== 'family_pool' && m.status !== '停用')
            .map(m => `
            <button onclick="pickMember('${esc(m.member_id)}')" class="flex flex-col items-center gap-2 p-3 rounded-tile bg-pastel-bg border-2 border-pastel-border hover:border-pastel-accent transition-all">

                <span class="text-xs font-bold text-stone-700">${esc(m.nickname)}</span>

    async function pickMember(id) {
        AUTH.memberId = id;
        document.getElementById('gateStep2').classList.add('hidden');
        document.getElementById('splash').classList.remove('js-hide');
        try { await loadAll(); enterApp(); }
        catch (e) { document.getElementById('splash').classList.add('js-hide'); document.getElementById('gateStep2').classList.remove('hidden'); showGateError(e.message); }
    }

    async function loadAll() {
        const d = await api.call('bootstrap');
        STATE.familyName = d.familyName;
        STATE.members = d.members;
        STATE.categories = d.categories;
        STATE.tags = d.tags;
        STATE.transactions = d.transactions;
        STATE.poolInitial = d.poolInitial;
        STATE.me = STATE.members.find(m => m.member_id === AUTH.memberId);
        if (!STATE.me) throw new Error('找不到此成員，請重新選擇');
    }

    function enterApp() {
        document.getElementById('gateScreen').classList.add('js-hide');
        document.getElementById('splash').classList.add('js-hide');

        document.getElementById('appHeader').classList.remove('js-hide');

    const PIE_COLORS = ['bg-pastel-accent', 'bg-pastel-blue', 'bg-pastel-green', 'bg-pastel-purple', 'bg-pastel-yellow'];
    const PIE_STROKE = ['text-pastel-accent', 'text-pastel-blue', 'text-pastel-green', 'text-pastel-purple', 'text-pastel-yellow'];

    function pieHtml(byCategory, total) {
        if (!total) return `<div class="text-center text-xs text-pastel-muted py-8">本月尚無支出紀錄</div>`;
        const top = byCategory.slice(0, 4);
        const rest = byCategory.slice(4).reduce((a, b) => a + b[1], 0);
        const items = rest > 0 ? [...top, ['其他', rest]] : top;
        let offset = 0;
        const arcs = items.map((it, i) => {
            const pct = (it[1] / total) * 100;
            const a = `<path class="${PIE_STROKE[i]}" stroke-dasharray="${pct.toFixed(1)}, 100" stroke-dashoffset="${-offset.toFixed(1)}" stroke-width="4.5" stroke-linecap="butt" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831" />`;
            offset += pct; return a;
        }).join('');
        const legend = items.map((it, i) => `
            <div class="flex justify-between items-center">
                <span class="flex items-center gap-2 text-stone-700"><span class="w-2.5 h-2.5 rounded-full ${PIE_COLORS[i]}"></span>${esc(it[0])} ${Math.round(it[1] / total * 100)}%</span>
                <span class="font-bold text-stone-800 font-rounded">${fmt(it[1])}</span>
            </div>`).join('');
        return `
        <div class="flex items-center gap-5">
            <div class="relative w-24 h-24 flex-shrink-0 flex items-center justify-center">
                <svg class="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                    <path class="text-stone-100" stroke-width="4.5" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                    ${arcs}
                </svg>
                <div class="absolute text-center">
                    <div class="text-[10px] text-pastel-muted leading-tight">總計</div>
                    <div class="text-sm font-bold text-stone-800 font-rounded leading-tight">${fmt(total)}</div>
                </div>
            </div>
            <div class="flex-1 space-y-2.5 text-xs">${legend}</div>
        </div>`;
    }

    function relativeDateLabel(iso) {
        const t = todayISO();
        const d = new Date(iso + 'T00:00:00'), now = new Date(t + 'T00:00:00');
        const diff = Math.round((now - d) / 86400000);
        const md = `${d.getMonth() + 1}/${d.getDate()}`;
        if (diff === 0) return `今天 (${md})`;
        if (diff === 1) return `昨天 (${md})`;
        return `${md}（${['日', '一', '二', '三', '四', '五', '六'][d.getDay()]}）`;
    }

    let txnFilter = 'all';
    function setTxnFilter(f) { txnFilter = f; renderTransactions(); }

    function visibleTxns() {
        const meId = STATE.me?.member_id;
        let rows = activeTxns();
        rows = currentMode === 'personal'
            ? rows.filter(t => t.payer_id === meId)
            : rows.filter(t => ['家庭公帳', '家庭代墊', '公帳注資'].includes(t.nature));
        if (txnFilter === 'expense') rows = rows.filter(t => t.entry_type === '支出');
        if (txnFilter === 'income') rows = rows.filter(t => t.entry_type === '收入');
        const q = (document.getElementById('txnSearch')?.value || '').trim().toLowerCase();
        if (q) rows = rows.filter(t => (t.note + t.category + t.tag).toLowerCase().includes(q));
        return rows.sort((a, b) => (b.date + b.created_at).localeCompare(a.date + a.created_at));
    }

        c.innerHTML = `

    /* 前端壓縮圖片，避免 GAS payload 過大 */
    function handleReceipt(e) {
        const file = e.target.files[0]; if (!file) return;
        const img = new Image(), reader = new FileReader();
        reader.onload = ev => { img.src = ev.target.result; };
        img.onload = () => {
            const max = 1280, scale = Math.min(1, max / Math.max(img.width, img.height));
            const cv = document.createElement('canvas');
            cv.width = img.width * scale; cv.height = img.height * scale;
            cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
            const dataUrl = cv.toDataURL('image/jpeg', 0.75);
            pendingReceipt = { base64: dataUrl.split(',')[1], mime: 'image/jpeg' };
            document.getElementById('receiptBox').innerHTML =
                `<i class="fa-solid fa-circle-check text-lg text-pastel-green"></i><span class="font-bold text-pastel-green">單據已附加（點擊可更換）</span>`;
        };
        reader.readAsDataURL(file);
    }

    async function saveTransaction() {
        const amount = Number(document.getElementById('inpAmount').value);
        if (!amount || amount <= 0) return toast('請輸入正確金額', true);
        const nature = document.getElementById('inpNature')?.value || '純個人';
        const btn = document.getElementById('saveBtn');
        btn.disabled = true; btn.innerText = '儲存中...';
        try {
            await api.call('addTransaction', {
                txn: {
                    date: document.getElementById('inpDate').value || todayISO(),
                    entry_type: isAddFormExpense ? '支出' : '收入',
                    category: document.getElementById('inpCategory').value,
                    tag: document.getElementById('inpTag').value,
                    amount, note: document.getElementById('inpNote').value,
                    nature,
                    related_id: nature === '私人拆帳' ? (document.getElementById('inpRelated')?.value || '') : '',
                    member_id: STATE.me.member_id,
                    payer_id: currentMode === 'family' && isAddFormExpense && nature === '家庭公帳'
                        ? 'family_pool' : STATE.me.member_id
                },
                receipt: pendingReceipt
            });
            pendingReceipt = null;
            toast('記錄成功 ✓');
            initAddForm();
            await refreshData();
            switchTab('dashboard');
        } catch (e) { toast(e.message, true); }
        finally { btn.disabled = false; btn.innerText = '儲存紀錄'; }
    }

                <button onclick="logout()" class="w-full py-2.5 bg-white text-pastel-red font-bold rounded-tile text-xs border border-pastel-red/30">登出</button>
            </div>`;
        updateLevelDisplays();
    }

    async function addItem(group) {
        const name = prompt(group === 'PAYMENT_TAG' ? '新增帳戶／標籤名稱：' : '新增分類名稱：');
        if (!name) return;
        const icon = group === 'PAYMENT_TAG' ? '💳' : (prompt('選一個 Emoji 圖示：', '🏷️') || '🏷️');
        try {
            await api.call('addItem', { item: { item_name: name, item_group: group, icon_emoji: icon } });
            const d = await api.call('bootstrap');
            STATE.categories = d.categories; STATE.tags = d.tags;
            renderSettings(); initAddForm(); toast('已新增');
        } catch (e) { toast(e.message, true); }
    }

    async function archiveItem(name, group) {
        if (!confirm(`確定要停用「${name}」嗎？（歷史紀錄不受影響）`)) return;
        try {
            await api.call('archiveItem', { item_name: name, item_group: group });
            const d = await api.call('bootstrap');
            STATE.categories = d.categories; STATE.tags = d.tags;
            renderSettings(); initAddForm(); toast('已停用');
        } catch (e) { toast(e.message, true); }
    }

    /* ==========================================================
       Modal
       ========================================================== */
    function openProfileModal() {
        const m = document.getElementById('profileModal');
        document.getElementById('modalUserName').innerText = STATE.me?.nickname || '';
        document.getElementById('modalUserPhone').innerText = STATE.me?.phone || STATE.me?.email || '';
        updateLevelDisplays();
        m.classList.remove('js-hide'); void m.offsetWidth;
        m.classList.remove('opacity-0');
        document.getElementById('profileModalContent').classList.remove('translate-y-full');
    }
    function closeProfileModal() {
        const m = document.getElementById('profileModal');
        m.classList.add('opacity-0');
        document.getElementById('profileModalContent').classList.add('translate-y-full');
        setTimeout(() => m.classList.add('js-hide'), 300);
    }
