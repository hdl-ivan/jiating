<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <!-- black-translucent：讓網頁內容延伸到狀態列底下，狀態列才會是我們的奶油色而不是系統白 -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="家庭記帳">
    <meta name="theme-color" content="#FFF8F0">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./icon-180.png">
    <link rel="icon" href="./icon-192.png">

    <title>家庭記帳</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        /* 取自角色頭像的色票，飽和度提高、色溫轉暖 */
                        pastel: {
                            bg: '#FFF8F0', card: '#FFFFFF', text: '#3A3330', muted: '#9A918A', border: '#F3E7D8',
                            accent: '#F8A048', accentLight: '#FFEEDA',
                            red: '#F05838', redLight: '#FFE8E2',
                            green: '#40B868', greenLight: '#E2F6E9',
                            blue: '#3090F8', blueLight: '#E4F0FF',
                            sky: '#88D8F8', skyLight: '#E9F7FE',
                            yellow: '#F8C850', yellowLight: '#FFF4D8',
                            pink: '#F0A8B0', pinkLight: '#FDECEF',
                            purple: '#A084E8'
                        }
                    },
                    borderRadius: { 'card': '24px', 'sheet': '32px', 'tile': '16px' },
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans TC', 'sans-serif'],
                        rounded: ['Comfortaa', 'Noto Sans TC', 'sans-serif']
                    },
                    boxShadow: {
                        'soft': '0 10px 30px rgba(248, 160, 72, 0.22)',
                        'card': '0 4px 18px rgba(160, 130, 100, 0.07)',
                        'glow-gold': '0 0 16px rgba(248, 200, 80, 0.75)'
                    }
                }
            }
        }
    </script>
    <style>
        html, body { background-color:#FBF2E6; }
        body { font-family:'Inter','Noto Sans TC',sans-serif; color:#3A3330; -webkit-tap-highlight-color:transparent; overscroll-behavior:none; }
        /* 已加入主畫面時，整個底色改成 App 奶油色，狀態列區域才不會露出不同色 */
        @media (display-mode: standalone) { html, body { background-color:#FFF8F0; } }
        .hide-scrollbar::-webkit-scrollbar { display:none; }
        .hide-scrollbar { -ms-overflow-style:none; scrollbar-width:none; }
        input, select, textarea { font-size:16px; }

        input[type="date"], input[type="month"], input[type="time"] {
            -webkit-appearance:none; appearance:none;
            width:100%; min-width:0; max-width:100%; box-sizing:border-box; display:block;
        }
        input[type="date"]::-webkit-date-and-time-value { text-align:left; }
        input[type="date"]::-webkit-calendar-picker-indicator { opacity:.45; }
        select { -webkit-appearance:none; appearance:none; background-image:none; min-width:0; }
        .field { min-width:0; }

        .swipe-wrap { touch-action:pan-y; }
        .swipe-inner { will-change:transform; transition:transform .24s cubic-bezier(.22,.61,.36,1); }
        .swipe-inner.dragging { transition:none; }
        .swipe-bg { transition:background-color .15s linear; }

        .js-hide { display:none !important; }
        @keyframes spin { to { transform:rotate(360deg); } }
        .spinner { animation:spin .8s linear infinite; }
        @keyframes pulseSoft { 0%,100%{opacity:.5} 50%{opacity:1} }
        .pending { animation:pulseSoft 1.1s ease-in-out infinite; }
        @keyframes popIn { from{transform:scale(.8);opacity:0} to{transform:scale(1);opacity:1} }
        .pop { animation:popIn .35s cubic-bezier(.34,1.56,.64,1) both; }
    </style>
</head>
<body class="flex justify-center min-h-[100dvh] p-0 md:p-6 text-sm">

<div class="w-full max-w-md bg-pastel-bg h-[100dvh] md:h-[880px] md:rounded-[44px] shadow-2xl flex flex-col overflow-hidden relative border-0 md:border-[10px] border-stone-800">

    <div id="fakeStatusBar" class="pt-3 px-7 pb-1 flex justify-between items-center text-xs text-stone-500 font-medium select-none bg-pastel-bg z-20 shrink-0">
        <span class="font-bold text-stone-700 tracking-wider" id="clock">09:41</span>
        <div class="flex items-center gap-2"><i class="fa-solid fa-wifi text-stone-600"></i><i class="fa-solid fa-battery-full text-stone-700"></i></div>
    </div>
    <!-- 瀏海／狀態列安全區，底色與 Header 相同 -->
    <div class="shrink-0 bg-pastel-bg" style="height:env(safe-area-inset-top)"></div>

    <div id="splash" class="absolute inset-0 bg-pastel-bg z-[80] flex flex-col items-center justify-center gap-4">
        <div class="text-5xl">🏠</div>
        <div class="w-8 h-8 border-4 border-pastel-accentLight border-t-pastel-accent rounded-full spinner"></div>
        <div class="text-xs text-pastel-muted">連線中…</div>
    </div>

    <div id="gateScreen" class="absolute inset-0 bg-pastel-bg z-[70] flex flex-col justify-center px-6 py-8 overflow-y-auto hide-scrollbar js-hide">
        <div class="text-center space-y-2 mb-8">
            <div class="w-20 h-20 bg-white rounded-sheet mx-auto shadow-card flex items-center justify-center text-4xl mb-4">🏠</div>
            <h1 class="text-2xl font-bold text-pastel-text">家庭記帳</h1>
            <p class="text-pastel-muted text-sm">輸入家庭代碼以連線</p>
        </div>
        <div id="gateError" class="hidden mb-4 p-3 rounded-tile bg-pastel-redLight border border-pastel-red/30 text-pastel-red text-xs font-bold"></div>
        <div id="gateStep1" class="bg-white p-6 rounded-sheet shadow-card border border-pastel-border space-y-4">
            <div>
                <label class="block text-sm font-bold text-stone-700 mb-1.5">家庭代碼</label>
                <input type="text" id="gateCode" autocomplete="off" autocapitalize="characters" placeholder="向家人索取"
                       class="w-full p-3.5 rounded-tile bg-pastel-bg border border-pastel-border focus:outline-none focus:ring-2 focus:ring-pastel-accent">
            </div>
            <button id="gateCodeBtn" onclick="gateSubmitCode()" class="w-full py-3.5 bg-pastel-accent text-white font-bold rounded-tile shadow-md">下一步</button>
        </div>
        <div id="gateStep2" class="hidden bg-white p-6 rounded-sheet shadow-card border border-pastel-border space-y-4">
            <label class="block text-sm font-bold text-stone-700">你是誰？</label>
            <div id="memberPicker" class="grid grid-cols-3 gap-3"></div>
        </div>
        <p class="text-center text-[10px] text-pastel-muted mt-6">版本 <span id="appVersion">–</span></p>
    </div>

    <header id="appHeader" class="px-5 py-3 bg-pastel-bg z-20 flex justify-between items-center border-b border-pastel-border/70 js-hide shrink-0">
        <div class="flex items-center gap-3 min-w-0">
            <div class="relative cursor-pointer flex-shrink-0" onclick="openProfileModal()">
                <div id="userAvatar" class="w-12 h-12 rounded-full border-[3px] flex items-center justify-center text-[22px] overflow-hidden shadow-sm transition-all duration-500"></div>
                <div id="levelBadge" class="absolute -bottom-1 -right-1 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full border-2 border-white shadow-sm"></div>
            </div>
            <div class="min-w-0">
                <div class="text-xs text-pastel-muted font-medium flex items-center gap-1.5 mb-0.5 truncate">
                    Hi, <span id="displayUserName" class="font-bold text-pastel-text text-sm">使用者</span>! <span class="text-sm">👋</span>
                </div>
                <div class="flex items-center gap-1 bg-stone-200/40 p-1 rounded-full mt-1 w-max">
                    <button id="modePersonalBtn" onclick="switchViewMode('personal')" class="px-3 py-1 rounded-full font-bold text-[11px] transition-all bg-white text-pastel-text shadow-sm"><i class="fa-solid fa-user text-[10px] mr-1.5 text-pastel-accent"></i>個人</button>
                    <button id="modeFamilyBtn" onclick="switchViewMode('family')" class="px-3 py-1 rounded-full font-bold text-[11px] text-pastel-muted transition-all"><i class="fa-solid fa-house text-[10px] mr-1.5"></i>家庭</button>
                </div>
            </div>
        </div>
        <button id="titleChip" onclick="openProfileModal()" class="flex-shrink-0 max-w-[92px] text-[10px] font-bold px-2.5 py-1.5 rounded-full bg-white border border-pastel-border text-pastel-muted shadow-sm truncate"></button>
    </header>

    <main id="appMain" class="flex-1 overflow-y-auto px-5 py-4 hide-scrollbar pb-32 js-hide bg-[#FBF2E6]">
        <div id="dashboardView" class="space-y-4"></div>
        <div id="transactionsView" class="space-y-4 hidden"></div>
        <div id="addView" class="space-y-4 hidden"></div>
        <div id="statsView" class="space-y-4 hidden"></div>
        <div id="settingsView" class="space-y-4 hidden"></div>
    </main>

    <div id="toast" class="absolute left-0 right-0 bottom-28 z-[95] flex justify-center opacity-0 pointer-events-none transition-opacity duration-300"></div>

    <nav id="appNav" class="absolute bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-pastel-border px-6 pt-2.5 flex justify-between items-center z-30 shadow-[0_-10px_40px_rgba(160,130,100,0.06)] js-hide"
         style="padding-bottom:calc(0.625rem + env(safe-area-inset-bottom))">
        <button onclick="switchTab('dashboard')" id="navDashboard" class="flex flex-col items-center text-pastel-accent w-12 nav-btn"><i class="fa-solid fa-house-chimney text-lg mb-1"></i><span class="text-[10px] font-bold">首頁</span></button>
        <button onclick="switchTab('transactions')" id="navTransactions" class="flex flex-col items-center text-pastel-muted w-12 nav-btn"><i class="fa-solid fa-list-ul text-lg mb-1"></i><span class="text-[10px] font-bold">明細</span></button>
        <button onclick="switchTab('add')" id="navAdd" aria-label="新增" class="relative -mt-10 nav-btn">
            <div id="addBtnInner" class="w-16 h-16 bg-pastel-accent text-white rounded-full flex items-center justify-center shadow-soft border-[6px] border-[#FBF2E6] transition-all duration-300"><i class="fa-solid fa-plus text-3xl"></i></div>
        </button>
        <button onclick="switchTab('stats')" id="navStats" class="flex flex-col items-center text-pastel-muted w-12 nav-btn"><i class="fa-solid fa-chart-pie text-lg mb-1"></i><span class="text-[10px] font-bold">圖表</span></button>
        <button onclick="switchTab('settings')" id="navSettings" class="flex flex-col items-center text-pastel-muted w-12 nav-btn"><i class="fa-solid fa-user-group text-lg mb-1"></i><span class="text-[10px] font-bold">設定</span></button>
    </nav>

    <div id="profileModal" class="absolute inset-0 bg-stone-900/40 backdrop-blur-sm z-[60] flex items-end justify-center opacity-0 transition-opacity duration-300 js-hide" onclick="if(event.target===this)closeProfileModal()">
        <div class="bg-white w-full rounded-t-sheet p-6 shadow-2xl transform translate-y-full transition-transform duration-300 max-h-[88%] overflow-y-auto hide-scrollbar" id="profileModalContent"></div>
    </div>

    <div id="sheetModal" class="absolute inset-0 bg-stone-900/40 backdrop-blur-sm z-[65] flex items-end justify-center opacity-0 transition-opacity duration-300 js-hide" onclick="if(event.target===this)closeSheet()">
        <div id="sheetContent" class="bg-white w-full rounded-t-sheet p-6 shadow-2xl transform translate-y-full transition-transform duration-300 max-h-[86%] overflow-y-auto hide-scrollbar"></div>
    </div>
</div>

<script>
  setInterval(() => {
    const d = new Date(), el = document.getElementById('clock');
    if (el) el.innerText = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }, 1000);
</script>
    <script>
    /* ==========================================================
       家庭記帳 PWA  v4.2.0
       ========================================================== */

    const CONFIG = {
        VERSION: 'v4.2.0',
        // ↓↓↓ 部署 GAS 後把網址貼在這裡（結尾必須是 /exec） ↓↓↓
        API_URL: 'https://script.google.com/macros/s/AKfycbzCl73_9to7Fmev1slsskZkbZsq2jzc52wYb6ED6Y1u8sbscSsnvRBMQJ55zorbnlEm/exec',
        DEMO: false
    };

    const esc = s => String(s ?? '').replace(/[&<>"']/g,
        c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const fmt = n => '$' + Math.round(Number(n) || 0).toLocaleString('en-US');
    const pad2 = n => String(n).padStart(2, '0');
    const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
    const currentYM = () => todayISO().slice(0, 7);
    const daysInYM = ym => new Date(Number(ym.slice(0, 4)), Number(ym.slice(5, 7)), 0).getDate();
    const uid = () => 'tmp_' + Math.random().toString(36).slice(2, 10);

    const AVATARS = ['av2', 'av4', 'av5', 'av12', 'av14', 'av20', 'av21', 'av37', 'av46', 'av48'];
    const EMOJI_AVATARS = ['🐱', '🐻', '🐰', '🦊', '🐼', '🐨', '🐸', '🐧', '🦉', '🐢', '🐔', '🦖'];

    /** 頭像可能是圖片代號（av20）或 Emoji，兩種都要能畫 */
    function avatarInner(v) {
        v = v || '🐱';
        return String(v).startsWith('av')
            ? `<img src="./${esc(v)}.png" alt="" class="w-full h-full object-cover">`
            : `<span class="leading-none">${esc(v)}</span>`;
    }

    const AUTH = {
        get familyCode() { return localStorage.getItem('fc') || ''; },
        set familyCode(v) { localStorage.setItem('fc', v); },
        get memberId() { return localStorage.getItem('mid') || ''; },
        set memberId(v) { localStorage.setItem('mid', v); },
        clear() { localStorage.removeItem('fc'); localStorage.removeItem('mid'); }
    };

    const api = {
        async call(action, payload = {}) {
            if (CONFIG.DEMO) return DEMO_API(action, payload);
            const res = await fetch(CONFIG.API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action, familyCode: AUTH.familyCode, memberId: AUTH.memberId, ...payload }),
                redirect: 'follow'
            });
            if (!res.ok) throw new Error(`連線失敗 (HTTP ${res.status})`);
            const j = await res.json();
            if (!j.ok) throw new Error(j.error || '後端錯誤');
            return j.data;
        }
    };

    let STATE = { familyName: '', members: [], categories: [], tags: [], transactions: [], rules: [], me: null, poolInitial: 0 };
    let currentMode = 'personal';
    let currentTab = 'dashboard';
    let isAddFormExpense = true;
    let pendingReceipt = null;
    let editingTxnId = null;
    let viewYM = currentYM();
    let filters = { type: 'all', natures: [], cats: [], tags: [], min: '', max: '', q: '' };

    /* ==========================================================
       等級光環（連續記帳天數）
       ========================================================== */
    function getLevelInfo(days) {
        days = Number(days) || 0;
        const level = Math.floor(days / 10) + 1;
        let t;
        if (days < 100) t = { tier: 1, name: '奶油米', next: 100, prev: 0, color: 'text-stone-500', border: 'border-[#F3E7D8]', bg: 'bg-[#FDF7EF]', badge: 'bg-stone-400', ring: '#F3E7D8' };
        else if (days < 200) t = { tier: 2, name: '暖陽橘', next: 200, prev: 100, color: 'text-[#F8A048]', border: 'border-[#F8A048]', bg: 'bg-[#FFEEDA]', badge: 'bg-[#F8A048]', ring: '#F8A048' };
        else if (days < 300) t = { tier: 3, name: '森林薄荷綠', next: 300, prev: 200, color: 'text-[#40B868]', border: 'border-[#40B868]', bg: 'bg-[#E2F6E9]', badge: 'bg-[#40B868]', ring: '#40B868' };
        else if (days < 500) t = { tier: 4, name: '海洋天空藍', next: 500, prev: 300, color: 'text-[#3090F8]', border: 'border-[#88D8F8]', bg: 'bg-[#E9F7FE]', badge: 'bg-[#3090F8]', ring: '#88D8F8' };
        else t = { tier: 5, name: '耀眼星光金', next: days, prev: 500, color: 'text-[#D9A216]', border: 'border-[#F8C850] shadow-glow-gold', bg: 'bg-[#FFF4D8]', badge: 'bg-[#F8C850]', ring: '#F8C850' };
        return { ...t, level, days, progress: t.tier === 5 ? 100 : ((days - t.prev) / (t.next - t.prev)) * 100 };
    }

    /* ==========================================================
       成就任務系統
       ========================================================== */
    const FUN_CATS = ['休閒娛樂', '訂閱服務'];

    function monthKeys(n) { const o = []; let ym = currentYM(); for (let i = 0; i < n; i++) { o.push(ym); ym = shiftYM(ym, -1); } return o; }

    function achievementStats() {
        const meId = STATE.me?.member_id;
        const mine = activeTxns().filter(t => t.payer_id === meId);
        const per = {};
        mine.forEach(t => {
            const k = String(t.date).slice(0, 7);
            per[k] = per[k] || { inc: 0, exp: 0, fun: 0 };
            const a = Number(t.amount) || 0;
            if (t.entry_type === '收入') per[k].inc += a;
            if (t.entry_type === '支出') { per[k].exp += a; if (FUN_CATS.includes(t.category)) per[k].fun += a; }
        });
        const ks = monthKeys(24);
        let surplusStreak = 0, funStreak = 0;
        for (const k of ks) { const m = per[k]; if (m && m.inc - m.exp > 0) surplusStreak++; else break; }
        for (const k of ks) { const m = per[k]; if (m && m.inc > 0 && m.fun <= m.inc * 0.1) funStreak++; else break; }
        const cur = per[currentYM()] || { inc: 0, exp: 0 };
        return {
            streak: Number(STATE.me?.streak_days) || 0,
            count: mine.length,
            receipts: mine.filter(t => t.receipt_file_id).length,
            advances: mine.filter(t => t.nature === '家庭代墊').length,
            surplusStreak, funStreak,
            savingRate: cur.inc > 0 ? Math.round((cur.inc - cur.exp) / cur.inc * 100) : 0
        };
    }

    const ACHIEVEMENTS = [
        { id: 's30', icon: '🔥', name: '習慣養成', hue: 'accent', desc: '連續記帳 30 天', val: x => x.streak, goal: 30, unit: '天' },
        { id: 'c100', icon: '📝', name: '百筆達人', hue: 'blue', desc: '累積記帳 100 筆', val: x => x.count, goal: 100, unit: '筆' },
        { id: 'sp3', icon: '🌱', name: '存錢新芽', hue: 'green', desc: '連續 3 個月有結餘', val: x => x.surplusStreak, goal: 3, unit: '個月' },
        { id: 'fun3', icon: '🧘', name: '自律修行者', hue: 'sky', desc: '娛樂支出佔收入 10% 以下，連續 3 個月', val: x => x.funStreak, goal: 3, unit: '個月' },
        { id: 'sr30', icon: '🏦', name: '三成儲蓄率', hue: 'green', desc: '本月儲蓄率達 30%', val: x => x.savingRate, goal: 30, unit: '%' },
        { id: 's100', icon: '💎', name: '百日堅持', hue: 'sky', desc: '連續記帳 100 天', val: x => x.streak, goal: 100, unit: '天' },
        { id: 'adv10', icon: '🤝', name: '家庭支柱', hue: 'pink', desc: '為公帳代墊 10 次', val: x => x.advances, goal: 10, unit: '次' },
        { id: 'rec20', icon: '🧾', name: '單據魔人', hue: 'yellow', desc: '上傳 20 張單據', val: x => x.receipts, goal: 20, unit: '張' },
        { id: 'sp6', icon: '🌳', name: '存錢大樹', hue: 'green', desc: '連續 6 個月有結餘', val: x => x.surplusStreak, goal: 6, unit: '個月' },
        { id: 'sr50', icon: '💰', name: '五成儲蓄率', hue: 'yellow', desc: '本月儲蓄率達 50%', val: x => x.savingRate, goal: 50, unit: '%' },
        { id: 'fun6', icon: '🕊️', name: '清心寡慾', hue: 'sky', desc: '娛樂支出佔收入 10% 以下，連續 6 個月', val: x => x.funStreak, goal: 6, unit: '個月' },
        { id: 'c500', icon: '📚', name: '五百筆宗師', hue: 'blue', desc: '累積記帳 500 筆', val: x => x.count, goal: 500, unit: '筆' },
        { id: 's365', icon: '👑', name: '一年不斷', hue: 'accent', desc: '連續記帳 365 天', val: x => x.streak, goal: 365, unit: '天' }
    ];

    const HUE = {
        accent: ['bg-pastel-accentLight', 'text-pastel-accent'], blue: ['bg-pastel-blueLight', 'text-pastel-blue'],
        green: ['bg-pastel-greenLight', 'text-pastel-green'], sky: ['bg-pastel-skyLight', 'text-pastel-blue'],
        pink: ['bg-pastel-pinkLight', 'text-pastel-pink'], yellow: ['bg-pastel-yellowLight', 'text-[#D9A216]']
    };

    /** 回傳 [{...成就, done, cur}]，並依定義順序排列（越後面越難） */
    function achievementList() {
        const x = achievementStats();
        return ACHIEVEMENTS.map(a => { const cur = a.val(x); return { ...a, cur, done: cur >= a.goal }; });
    }
    /** 稱號＝已解鎖中最後（最難）的那個 */
    function currentTitle(list) {
        const done = (list || achievementList()).filter(a => a.done);
        return done.length ? done[done.length - 1] : null;
    }

    /* ==========================================================
       頭像渲染
       ========================================================== */
    function renderAvatar(elId, badgeId, isModal) {
        const el = document.getElementById(elId), badge = document.getElementById(badgeId);
        if (!el || !STATE.me) return;
        const i = getLevelInfo(STATE.me.streak_days);
        el.className = (isModal

    /* ==========================================================
       計算層
       ========================================================== */
    const FAMILY_NATURES = ['家庭公帳', '家庭代墊', '公帳注資'];
    function activeTxns() { return STATE.transactions.filter(t => t.status !== '作廢' && t.status !== '已修訂' && !t.is_rollup); }
    function inMonth(d, ym) { return String(d).slice(0, 7) === ym; }
    function nameOf(id) { const m = STATE.members.find(x => x.member_id === id); return m ? m.nickname : id; }
    function catIcon(name) { const c = STATE.categories.find(x => x.item_name === name); return c ? c.icon_emoji : ''; }

    function computeSummary(mode, ym) {
        ym = ym || currentYM();
        const meId = STATE.me?.member_id, rows = activeTxns();
        const s = { monthlyIncome: 0, monthlyExpense: 0, cashBalance: 0, poolOwesMe: 0, iOweOthers: 0, poolBalance: 0, poolOwesMembers: [], membersOwePool: [], byCategory: [] };

        if (mode === 'personal') {
            const mine = rows.filter(t => t.payer_id === meId);
            mine.forEach(t => {
                const a = Number(t.amount) || 0;
                if (inMonth(t.date, ym)) {
                    if (t.entry_type === '支出') s.monthlyExpense += a;
                    if (t.entry_type === '收入') s.monthlyIncome += a;
                }
                if (t.entry_type === '收入') s.cashBalance += a;
                else if (t.entry_type === '支出' || t.entry_type === '注資') s.cashBalance -= a;
                else if (t.entry_type === '還款') s.cashBalance += (t.related_id === meId ? a : -a);
                if (t.nature === '家庭代墊' && t.entry_type === '支出') s.poolOwesMe += a;
            });
            s.cashBalance += Number(STATE.me?.initial_balance) || 0;
            rows.filter(t => t.entry_type === '還款' && t.related_id === meId && t.member_id === 'family_pool')
                .forEach(t => s.poolOwesMe -= Number(t.amount) || 0);
            rows.filter(t => t.nature === '私人拆帳' && t.related_id === meId && t.payer_id !== meId)
                .forEach(t => s.iOweOthers += Number(t.amount) || 0);
            const cm = {};
            mine.filter(t => t.entry_type === '支出' && inMonth(t.date, ym))
                .forEach(t => { const k = t.category || '未分類'; cm[k] = (cm[k] || 0) + Number(t.amount); });
            s.byCategory = Object.entries(cm).sort((a, b) => b[1] - a[1]);
        } else {
            const fam = rows.filter(t => FAMILY_NATURES.includes(t.nature));
            fam.forEach(t => {
                const a = Number(t.amount) || 0;
                if (inMonth(t.date, ym)) {
                    if (t.entry_type === '支出') s.monthlyExpense += a;
                    if (t.entry_type === '收入' || t.entry_type === '注資') s.monthlyIncome += a;
                }
                if (t.entry_type === '收入' || t.entry_type === '注資') s.poolBalance += a;
                if (t.entry_type === '支出' && t.nature === '家庭公帳') s.poolBalance -= a;
                if (t.entry_type === '還款') s.poolBalance -= a;
            });
            s.poolBalance += Number(STATE.poolInitial) || 0;
            const owe = {};
            rows.filter(t => t.nature === '家庭代墊' && t.entry_type === '支出').forEach(t => { owe[t.payer_id] = (owe[t.payer_id] || 0) + Number(t.amount); });
            rows.filter(t => t.entry_type === '還款' && t.member_id === 'family_pool').forEach(t => { owe[t.related_id] = (owe[t.related_id] || 0) - Number(t.amount); });
            s.poolOwesMembers = Object.entries(owe).filter(([, v]) => v > 0.01).map(([id, v]) => ({ member: nameOf(id), amount: v }));
            const back = {};
            rows.filter(t => t.nature === '公帳注資' && t.entry_type === '支出').forEach(t => { back[t.payer_id] = (back[t.payer_id] || 0) + Number(t.amount); });
            s.membersOwePool = Object.entries(back).filter(([, v]) => v > 0.01).map(([id, v]) => ({ member: nameOf(id), amount: v }));
            const cm = {};
            fam.filter(t => t.entry_type === '支出' && inMonth(t.date, ym))
                .forEach(t => { const k = t.category || '未分類'; cm[k] = (cm[k] || 0) + Number(t.amount); });
            s.byCategory = Object.entries(cm).sort((a, b) => b[1] - a[1]);
        }
        return s;
    }

        if (!code) return showGateError('請輸入家庭代碼');
        const b = document.getElementById('gateCodeBtn'); b.disabled = true; b.innerText = '連線中…';

    async function loadAll() {
        const d = await api.call('bootstrap');
        Object.assign(STATE, {
            familyName: d.familyName, members: d.members, categories: d.categories,
            tags: d.tags, transactions: d.transactions, rules: d.rules || [], poolInitial: d.poolInitial
        });
        STATE.me = STATE.members.find(m => m.member_id === AUTH.memberId);
        if (!STATE.me) throw new Error('找不到此成員，請重新選擇');
        if (d.generated > 0) setTimeout(() => toast(`已自動補記 ${d.generated} 筆重複性收支`), 800);

        document.getElementById('gateScreen').classList.add('js-hide');

    /* ==========================================================

    const PIE_BG = ['bg-pastel-accent', 'bg-pastel-blue', 'bg-pastel-green', 'bg-pastel-pink', 'bg-pastel-yellow'];
    const PIE_HEX = ['#F8A048', '#3090F8', '#40B868', '#F0A8B0', '#F8C850'];

    function pieHtml(byCategory, total) {
        if (!total) return `<div class="text-center text-xs text-pastel-muted py-8">本月尚無支出紀錄</div>`;
        const top = byCategory.slice(0, 4), rest = byCategory.slice(4).reduce((a, b) => a + b[1], 0);
        const items = rest > 0 ? [...top, ['其他', rest]] : top;
        let off = 0;
        /* 修正：色弧必須用「完整圓」的 path，並宣告 pathLength=100，
           dasharray 的百分比才會對。舊版只畫半圓，弧長 50，比例全被放大兩倍。 */
        const FULL = 'M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831';
        const arcs = items.map((it, i) => {
            const p = (it[1] / total) * 100;
            const a = `<path pathLength="100" stroke-dasharray="${p.toFixed(2)} ${(100 - p).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" stroke-width="5" stroke-linecap="butt" stroke="${PIE_HEX[i]}" fill="none" d="${FULL}" />`;
            off += p; return a;
        }).join('');
        return `<div class="flex items-center gap-5">
            <div class="relative w-24 h-24 flex-shrink-0 flex items-center justify-center">
                <svg class="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                    <path pathLength="100" stroke-width="5" stroke="#F3E7D8" fill="none" d="${FULL}" />${arcs}
                </svg>
                <div class="absolute text-center">
                    <div class="text-[10px] text-pastel-muted leading-tight">總計</div>
                    <div class="text-sm font-bold text-stone-800 font-rounded leading-tight">${fmt(total)}</div>
                </div>
            </div>
            <div class="flex-1 space-y-2.5 text-xs min-w-0">${items.map((it, i) => `
                <div class="flex justify-between items-center gap-2">
                    <span class="flex items-center gap-2 text-stone-700 truncate"><span class="w-2.5 h-2.5 rounded-full ${PIE_BG[i]} flex-shrink-0"></span>${esc(it[0])} ${Math.round(it[1] / total * 100)}%</span>
                    <span class="font-bold text-stone-800 font-rounded flex-shrink-0">${fmt(it[1])}</span>
                </div>`).join('')}</div>
        </div>`;
    }

    function statCard(label, icon, ct, cb, value, sub) {

            <div class="text-xs font-bold ${ct} flex items-center gap-1.5 mb-2"><span class="${cb} p-1 rounded-md"><i class="fa-solid ${icon}"></i></span> ${esc(label)}</div>
            <div class="text-2xl font-bold text-pastel-text font-rounded tracking-tight truncate">${fmt(value)}</div>
            <div class="text-[11px] text-pastel-muted mt-1.5 truncate">${esc(sub)}</div></div>`;
    }

    async function settleUp(memberName, amount, dir) {
        if (!confirm(`確定要記錄一筆 ${fmt(amount)} 的結算給「${memberName}」嗎？`)) return;
        const m = STATE.members.find(x => x.nickname === memberName), isPay = dir === 'pool2member';
        await optimisticAdd({
            date: todayISO(), entry_type: '還款', category: '', tag: '結算', amount,
            note: `結算：${memberName}`, nature: '家庭公帳',
            member_id: isPay ? 'family_pool' : m?.member_id,

       ========================================================== */
    async function optimisticAdd(txn, receipt, okMsg) {
        const local = {
            txn_id: uid(), created_at: new Date().toISOString(), is_rollup: false,
            status: '有效', parent_txn_id: '', recurring_rule_id: '', receipt_file_id: '',
            member_id: STATE.me.member_id, payer_id: STATE.me.member_id, related_id: '',
            _pending: true, ...txn
        };
        STATE.transactions.push(local);
        renderDataViews();
        toast(okMsg || '已記錄 ✓');
        try {
            const r = await api.call('addTransaction', { txn, receipt });
            const i = STATE.transactions.findIndex(t => t.txn_id === local.txn_id);
            if (i >= 0) STATE.transactions[i] = r.txn;
            renderDataViews();
        } catch (e) {
            STATE.transactions = STATE.transactions.filter(t => t.txn_id !== local.txn_id);
            renderDataViews(); toast('儲存失敗：' + e.message, true);
        }
    }

    function shiftYM(ym, n) {
        let y = Number(ym.slice(0, 4)), m = Number(ym.slice(5, 7)) + n;
        y += Math.floor((m - 1) / 12); m = ((m - 1) % 12 + 12) % 12 + 1;
        return `${y}-${pad2(m)}`;
    }
    function relativeDateLabel(iso) {
        const d = new Date(iso + 'T00:00:00'), now = new Date(todayISO() + 'T00:00:00');
        const diff = Math.round((now - d) / 86400000), md = `${d.getMonth() + 1}/${d.getDate()}`;
        if (diff === 0) return `今天 (${md})`;
        if (diff === 1) return `昨天 (${md})`;
        return `${md}（${['日', '一', '二', '三', '四', '五', '六'][d.getDay()]}）`;
    }
    function scopedTxns(ym) {
        const meId = STATE.me?.member_id;
        const rows = activeTxns().filter(t => inMonth(t.date, ym));
        return currentMode === 'personal' ? rows.filter(t => t.payer_id === meId) : rows.filter(t => FAMILY_NATURES.includes(t.nature));
    }
    function filteredTxns() {
        let rows = scopedTxns(viewYM);
        if (filters.type === 'expense') rows = rows.filter(t => t.entry_type === '支出');
        if (filters.type === 'income') rows = rows.filter(t => t.entry_type === '收入');
        if (filters.natures.length) rows = rows.filter(t => filters.natures.includes(t.nature));
        if (filters.cats.length) rows = rows.filter(t => filters.cats.includes(t.category));
        if (filters.tags.length) rows = rows.filter(t => filters.tags.includes(t.tag));
        if (filters.min !== '') rows = rows.filter(t => Number(t.amount) >= Number(filters.min));
        if (filters.max !== '') rows = rows.filter(t => Number(t.amount) <= Number(filters.max));
        if (filters.q) { const q = filters.q.toLowerCase(); rows = rows.filter(t => `${t.note}${t.category}${t.tag}`.toLowerCase().includes(q)); }
        return rows.sort((a, b) => (b.date + b.created_at).localeCompare(a.date + a.created_at));
    }
    function activeFilterCount() {
        return (filters.type !== 'all' ? 1 : 0) + filters.natures.length + filters.cats.length +
            filters.tags.length + (filters.min !== '' ? 1 : 0) + (filters.max !== '' ? 1 : 0);
    }

    function trendChartHtml(ym) {
        const rows = scopedTxns(ym), n = daysInYM(ym);
        const inc = Array(n).fill(0), exp = Array(n).fill(0);
        rows.forEach(t => {
            const d = Number(String(t.date).slice(8, 10)) - 1;
            if (d < 0 || d >= n) return;
            if (t.entry_type === '收入' || t.entry_type === '注資') inc[d] += Number(t.amount);
            if (t.entry_type === '支出') exp[d] += Number(t.amount);
        });
        let ci = 0, ce = 0;
        const cumI = inc.map(v => (ci += v)), cumE = exp.map(v => (ce += v));
        const max = Math.max(ci, ce, 1);
        const W = 320, H = 132, L = 6, R = 6, T = 10, B = 24, pw = W - L - R, ph = H - T - B;
        const pts = a => a.map((v, i) => `${(L + (n === 1 ? pw / 2 : (i / (n - 1)) * pw)).toFixed(1)},${(T + ph - (v / max) * ph).toFixed(1)}`).join(' ');
        if (!ci && !ce) return `<div class="text-center text-xs text-pastel-muted py-10">本月尚無資料</div>`;
        return `
        <svg viewBox="0 0 ${W} ${H}" class="w-full" style="height:132px" preserveAspectRatio="none">
            <defs><linearGradient id="gExp" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#F8A048" stop-opacity=".3"/><stop offset="100%" stop-color="#F8A048" stop-opacity="0"/></linearGradient></defs>
            <line x1="${L}" y1="${T + ph}" x2="${W - R}" y2="${T + ph}" stroke="#F3E7D8" stroke-width="1"/>
            <line x1="${L}" y1="${T + ph / 2}" x2="${W - R}" y2="${T + ph / 2}" stroke="#F3E7D8" stroke-width="1" stroke-dasharray="3 4"/>
            <polygon points="${L},${T + ph} ${pts(cumE)} ${W - R},${T + ph}" fill="url(#gExp)"/>
            <polyline points="${pts(cumI)}" fill="none" stroke="#40B868" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
            <polyline points="${pts(cumE)}" fill="none" stroke="#F8A048" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
        </svg>
        <div class="flex justify-between text-[10px] text-pastel-muted px-1 mt-1"><span>1日</span><span>${Math.ceil(n / 2)}日</span><span>${n}日</span></div>
        <div class="flex justify-between items-center mt-3 pt-3 border-t border-pastel-border text-xs">
            <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-pastel-green"></span>收入累計 <b class="font-rounded">${fmt(ci)}</b></span>
            <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-pastel-accent"></span>支出累計 <b class="font-rounded">${fmt(ce)}</b></span>
        </div>`;
    }

    /* --- 滑動：方向鎖定 + 阻尼 + 滿版底色 --- */
    function bindSwipe() {
        document.querySelectorAll('.swipe-wrap').forEach(wrap => {
            if (wrap._bound) return; wrap._bound = true;
            const inner = wrap.querySelector('.swipe-inner');
            const bg = wrap.querySelector('.swipe-bg');
            const eEdit = wrap.querySelector('.sw-edit'), eVoid = wrap.querySelector('.sw-void');
            const id = wrap.dataset.id;
            const T = 78, MAX = 132;
            let x0 = 0, y0 = 0, dx = 0, lock = null, active = false, moved = false;

            const paint = () => {
                const a = Math.min(Math.abs(dx) / T, 1);
                bg.style.opacity = a;
                bg.style.backgroundColor = dx >= 0 ? '#3090F8' : '#F05838';
                eEdit.style.opacity = dx >= 0 ? 1 : 0;
                eVoid.style.opacity = dx < 0 ? 1 : 0;
            };
            const reset = () => { dx = 0; inner.style.transform = 'translateX(0)'; bg.style.opacity = 0; };

            const start = (x, y) => { x0 = x; y0 = y; dx = 0; lock = null; active = true; moved = false; inner.classList.add('dragging'); };
            const move = (x, y, e) => {
                if (!active) return;
                const ddx = x - x0, ddy = y - y0;
                if (lock === null) {
                    if (Math.abs(ddx) < 8 && Math.abs(ddy) < 8) return;
                    lock = Math.abs(ddx) > Math.abs(ddy) * 1.2 ? 'h' : 'v';
                    if (lock === 'v') { active = false; return; }   // 判定為捲動就完全放手
                }
                if (lock !== 'h') return;
                if (e && e.cancelable) e.preventDefault();
                moved = true;
                // 超過門檻後加阻尼，手感更穩、不會一路滑到底
                const raw = ddx, over = Math.max(Math.abs(raw) - T, 0);
                const mag = Math.min(T + over * 0.35, MAX);
                dx = raw >= 0 ? mag : -mag;
                inner.style.transform = `translate3d(${dx}px,0,0)`;
                paint();
            };
            const end = () => {
                if (!active) { inner.classList.remove('dragging'); return; }
                active = false; inner.classList.remove('dragging');
                if (dx <= -T) { inner.style.transform = 'translateX(-110%)'; bg.style.opacity = 1; setTimeout(() => voidTxn(id), 190); }
                else if (dx >= T) { reset(); editTxn(id); }
                else reset();
            };

            wrap.addEventListener('touchstart', e => start(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
            wrap.addEventListener('touchmove', e => move(e.touches[0].clientX, e.touches[0].clientY, e), { passive: false });
            wrap.addEventListener('touchend', end);
            wrap.addEventListener('touchcancel', () => { active = false; reset(); });
            wrap.addEventListener('mousedown', e => {
                start(e.clientX, e.clientY);
                const mm = ev => move(ev.clientX, ev.clientY, ev);
                const mu = () => { end(); document.removeEventListener('mousemove', mm); document.removeEventListener('mouseup', mu); };
                document.addEventListener('mousemove', mm); document.addEventListener('mouseup', mu);
            });
            inner.addEventListener('click', () => { if (!moved) openTxnSheet(id); });
        });
    }

    function handleReceipt(e) {
        const file = e.target.files[0]; if (!file) return;
        const img = new Image(), reader = new FileReader();
        reader.onload = ev => { img.src = ev.target.result; };
        img.onload = () => {
            const max = 1280, sc = Math.min(1, max / Math.max(img.width, img.height));
            const cv = document.createElement('canvas');
            cv.width = img.width * sc; cv.height = img.height * sc;
            cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
            pendingReceipt = { base64: cv.toDataURL('image/jpeg', 0.75).split(',')[1], mime: 'image/jpeg' };
            document.getElementById('receiptBox').innerHTML = `<i class="fa-solid fa-circle-check text-lg text-pastel-green"></i><span class="font-bold text-pastel-green">單據已附加（點擊可更換）</span>`;
        };
        reader.readAsDataURL(file);
    }

    async function saveTransaction() {
        const amount = Number(document.getElementById('inpAmount').value);
        if (!amount || amount <= 0) return toast('請輸入正確金額', true);
        const nature = document.getElementById('inpNature')?.value || '純個人';
        const txn = {
            date: document.getElementById('inpDate').value || todayISO(),
            entry_type: isAddFormExpense ? '支出' : '收入',
            category: document.getElementById('inpCategory').value,
            tag: document.getElementById('inpTag').value,
            amount, note: document.getElementById('inpNote').value, nature,
            related_id: nature === '私人拆帳' ? (document.getElementById('inpRelated')?.value || '') : '',
            member_id: STATE.me.member_id,
            payer_id: (currentMode === 'family' && isAddFormExpense && nature === '家庭公帳') ? 'family_pool' : STATE.me.member_id
        };
        const receipt = pendingReceipt;
        const wantRec = document.getElementById('isRecurring')?.checked;
        const rec = wantRec ? {
            name: txn.note || txn.category, entry_type: txn.entry_type, category: txn.category,
            tag: txn.tag, amount, note: txn.note, nature,
            freq: document.getElementById('recFreq').value,
            auto_mode: document.getElementById('recMode').value,
            start_date: txn.date, end_date: document.getElementById('recEnd').value || ''
        } : null;

        if (editingTxnId) {
            const oldId = editingTxnId, idx = STATE.transactions.findIndex(t => t.txn_id === oldId);
            const backup = idx >= 0 ? { ...STATE.transactions[idx] } : null;
            if (idx >= 0) Object.assign(STATE.transactions[idx], txn, { _pending: true });
            editingTxnId = null; pendingReceipt = null;
            initAddForm(); renderDataViews(); switchTab('transactions'); toast('已更新 ✓');
            try {
                const r = await api.call('updateTransaction', { txn_id: oldId, txn, receipt });
                const i2 = STATE.transactions.findIndex(t => t.txn_id === oldId);
                if (i2 >= 0) STATE.transactions[i2] = r.txn;
                renderDataViews();
            } catch (e) {
                if (backup && idx >= 0) STATE.transactions[idx] = backup;
                renderDataViews(); toast('更新失敗：' + e.message, true);
            }
            return;
        }

        pendingReceipt = null; initAddForm(); switchTab('dashboard');
        await optimisticAdd(txn, receipt);
        if (rec) {
            try {
                /* 修正：今天這筆已經記過了，規則的 next_run 必須跳到「下一期」，
                   否則下次開 App 後端會再補記一次，造成同一筆重複、金額加倍。 */
                const r = await api.call('saveRule', { rule: rec, first_run_done: true });
                STATE.rules.push(r.rule); renderSettings(); toast('重複性收支已建立');
            } catch (e) { toast('重複規則建立失敗：' + e.message, true); }
        }
    }

    function ruleTypeChanged() {
        const isExp = document.getElementById('rType').value === '支出';
        document.getElementById('rCat').innerHTML = STATE.categories
            .filter(c => c.item_group === (isExp ? 'EXPENSE_CATEGORY' : 'INCOME_CATEGORY'))
            .map(c => `<option value="${esc(c.item_name)}">${esc(c.icon_emoji)} ${esc(c.item_name)}</option>`).join('');
    }
    async function saveRule(ruleId) {
        const rule = {
            rule_id: ruleId || '', name: document.getElementById('rName').value.trim(),
            entry_type: document.getElementById('rType').value,
            amount: Number(document.getElementById('rAmount').value),
            category: document.getElementById('rCat').value, tag: document.getElementById('rTag').value,
            freq: document.getElementById('rFreq').value, auto_mode: document.getElementById('rMode').value,
            start_date: document.getElementById('rStart').value || todayISO(),
            end_date: document.getElementById('rEnd').value || '',
            nature: document.getElementById('rNature').value, note: document.getElementById('rName').value.trim(),
            status: document.getElementById('rPaused')?.checked ? '停用' : '啟用'
        };
        if (!rule.name) return toast('請輸入名稱', true);
        if (!rule.amount || rule.amount <= 0) return toast('請輸入正確金額', true);
        closeSheet();
        try {
            const r = await api.call('saveRule', { rule });
            const i = STATE.rules.findIndex(x => x.rule_id === r.rule.rule_id);
            if (i >= 0) STATE.rules[i] = r.rule; else STATE.rules.push(r.rule);
            renderSettings(); toast('已儲存');
        } catch (e) { toast('儲存失敗：' + e.message, true); }
    }
    async function deleteRule(ruleId) {
        if (!confirm('確定要刪除這個重複性收支規則嗎？（已產生的紀錄不受影響）')) return;
        const backup = [...STATE.rules];
        STATE.rules = STATE.rules.filter(r => r.rule_id !== ruleId);
        renderSettings();
        try { await api.call('deleteRule', { rule_id: ruleId }); toast('已刪除'); }
        catch (e) { STATE.rules = backup; renderSettings(); toast('刪除失敗：' + e.message, true); }
    }

    async function addItem(group) {
        const name = prompt(group === 'PAYMENT_TAG' ? '新增帳戶／標籤名稱：' : '新增分類名稱：');
        if (!name) return;
        const icon = group === 'PAYMENT_TAG' ? '💳' : (prompt('選一個 Emoji 圖示：', '🏷️') || '🏷️');
        const item = { item_name: name, item_group: group, icon_emoji: icon };
        if (group === 'PAYMENT_TAG') STATE.tags.push(item); else STATE.categories.push(item);
        renderSettings(); initAddForm();
        try { await api.call('addItem', { item }); toast('已新增'); }
        catch (e) {
            if (group === 'PAYMENT_TAG') STATE.tags = STATE.tags.filter(x => x.item_name !== name);
            else STATE.categories = STATE.categories.filter(x => x.item_name !== name);
            renderSettings(); initAddForm(); toast(e.message, true);
        }
    }
    async function archiveItem(name, group) {
        if (!confirm(`確定要停用「${name}」嗎？（歷史紀錄不受影響）`)) return;
        const bc = [...STATE.categories], bt = [...STATE.tags];
        if (group === 'PAYMENT_TAG') STATE.tags = STATE.tags.filter(x => x.item_name !== name);
        else STATE.categories = STATE.categories.filter(x => !(x.item_name === name && x.item_group === group));
        renderSettings(); initAddForm();
        try { await api.call('archiveItem', { item_name: name, item_group: group }); toast('已停用'); }
        catch (e) { STATE.categories = bc; STATE.tags = bt; renderSettings(); initAddForm(); toast(e.message, true); }
    }
