<!DOCTYPE html>
<html lang="zh-TW">
<head>

    <meta name="mobile-web-app-capable" content="yes">

    <title>家庭記帳</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        /* 取自角色頭像的色票，飽和度提高、色溫轉暖 */
                        pastel: {
                            bg: '#FFF8F0', card: '#FFFFFF', text: '#3A3330', muted: '#9A918A', border: '#F3E7D8',
                            accent: '#F8A048', accentLight: '#FFEEDA',
                            red: '#F05838', redLight: '#FFE8E2',
                            green: '#40B868', greenLight: '#E2F6E9',
                            blue: '#3090F8', blueLight: '#E4F0FF',
                            sky: '#88D8F8', skyLight: '#E9F7FE',
                            yellow: '#F8C850', yellowLight: '#FFF4D8',
                            pink: '#F0A8B0', pinkLight: '#FDECEF',
                            purple: '#A084E8'
                        }
                    },
                    borderRadius: { 'card': '24px', 'sheet': '32px', 'tile': '16px' },
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans TC', 'sans-serif'],
                        rounded: ['Comfortaa', 'Noto Sans TC', 'sans-serif']
                    },
                    boxShadow: {
                        'soft': '0 10px 30px rgba(248, 160, 72, 0.22)',
                        'card': '0 4px 18px rgba(160, 130, 100, 0.07)',
                        'glow-gold': '0 0 16px rgba(248, 200, 80, 0.75)'
                    }
                }

        }

    <style>
        /* 版面錨定：不使用任何百分比高度。
           iOS 的 position:fixed + height:100% 在工具列伸縮時解析出的值不等於實際可視高度，
           底部會差一截；直接把外框釘在視窗四邊（inset:0）才會真正貼底。 */
        html, body {
            background-color:#FBF2E6; height:100%; margin:0; padding:0;
            overflow:hidden; overscroll-behavior:none; touch-action:manipulation;
        }
        body { font-family:'Inter','Noto Sans TC',sans-serif; color:#3A3330; -webkit-tap-highlight-color:transparent; }

        /* ID 選擇器優先權高於 Tailwind class，直接覆寫外框定位。
           高度不用 inset:0 也不用 dvh —— iOS 對這兩者的解析在標準列／安全區存在時
           不見得等於使用者實際看到的高度。改由 JS 量測 visualViewport 寫入 --appH，
           這是唯一保證與螢幕所見一致的來源。 */
        #appFrame {
            position:fixed; inset:0;
            width:100%; max-width:none;
            height:var(--appH, 100dvh);
            border-radius:0; border:0;
            display:flex; flex-direction:column;
        }

        /* ── 手機：導覽列不再依賴外框的 flex 計算，直接釘在「視窗」底邊 ──
           先前三個版本都是想辦法讓外框高度正確、再讓 flex 把 nav 推到底。
           只要外框高度有一點誤差，nav 就會懸空。改成 fixed 之後，
           不論外框算成多高，nav 永遠貼在螢幕最底。 */
        @media (max-width:767px) {
            #appNav   { position:fixed; left:0; right:0; bottom:0; }
            #appMain  { padding-bottom:var(--navH, 92px); }
            #toast    { position:fixed; left:0; right:0; bottom:calc(var(--navH, 92px) + 14px); }
        }
        /* 桌機恢復置中的手機外框 */
        @media (min-width:768px) {
            html, body { height:auto; overflow:auto; }
            #appFrame {
                position:relative; top:auto; left:auto; right:auto; bottom:auto; margin:0 auto;
                width:100%; max-width:28rem; height:880px;
                border-radius:44px; border-width:10px;
                display:flex; flex-direction:column;
            }
        }
        #appMain { -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }
        /* 導覽列背景延伸到 Home Indicator 底下，padding 只負責把內容推上來 */
        #appNav { padding-bottom:calc(0.625rem + var(--sab, env(safe-area-inset-bottom, 0px))); }
        /* 已加入主畫面時，整個底色改成 App 奶油色，狀態列區域才不會露出不同色 */
        @media (display-mode: standalone) { html, body { background-color:#FFF8F0; } }
        .hide-scrollbar::-webkit-scrollbar { display:none; }
        .hide-scrollbar { -ms-overflow-style:none; scrollbar-width:none; }
        input, select, textarea { font-size:16px; }

        input[type="date"], input[type="month"], input[type="time"] {
            -webkit-appearance:none; appearance:none;
            width:100%; min-width:0; max-width:100%; box-sizing:border-box; display:block;
        }
        input[type="date"]::-webkit-date-and-time-value { text-align:left; }
        input[type="date"]::-webkit-calendar-picker-indicator { opacity:.45; }
        select { -webkit-appearance:none; appearance:none; background-image:none; min-width:0; }
        .field { min-width:0; }

        .swipe-wrap { touch-action:pan-y; }
        .swipe-inner { will-change:transform; transition:transform .24s cubic-bezier(.22,.61,.36,1); }
        .swipe-inner.dragging { transition:none; }
        .swipe-bg { transition:background-color .15s linear; }

        .js-hide { display:none !important; }

        /* 橫向時擋住主畫面（排除桌機大螢幕） */
        #rotateGate { display:none; }
        @media (orientation:landscape) and (max-height:560px) {
            #rotateGate { display:flex; }
            #appFrame  { display:none; }
        }

        /* 6. 觸覺感 UI：按下時輕微下沉 */
        .tactile { transition:transform .09s ease, box-shadow .09s ease; }
        .tactile:active { transform:translateY(2px); box-shadow:0 1px 4px rgba(160,130,100,.14) !important; }

        /* 8. 記帳完成微互動：金幣飛向大頭貼 */
        .coin { position:absolute; width:26px; height:26px; border-radius:9999px;
                background:radial-gradient(circle at 32% 30%, #FFE9A8, #F8C850 60%, #E0A81E);
                box-shadow:0 2px 8px rgba(224,168,30,.5); z-index:96; pointer-events:none;
                display:flex; align-items:center; justify-content:center;
                font-size:13px; font-weight:700; color:#8A6410; }

        /* 新增後在明細高亮該筆 */
        @keyframes newFlash { 0%{box-shadow:0 0 0 0 rgba(248,160,72,.65)} 100%{box-shadow:0 0 0 14px rgba(248,160,72,0)} }
        .is-new > .swipe-inner { animation:newFlash 1.6s ease-out 2; border-color:#F8A048 !important; }
        @keyframes spin { to { transform:rotate(360deg); } }
        .spinner { animation:spin .8s linear infinite; }
        @keyframes pulseSoft { 0%,100%{opacity:.5} 50%{opacity:1} }
        .pending { animation:pulseSoft 1.1s ease-in-out infinite; }
        @keyframes popIn { from{transform:scale(.8);opacity:0} to{transform:scale(1);opacity:1} }
        .pop { animation:popIn .35s cubic-bezier(.34,1.56,.64,1) both; }

        /* 等寬數字：金額直排時不會左右跳動，是財務介面精緻感的關鍵 */
        .num, .font-rounded, input[type="number"] { font-variant-numeric: tabular-nums; font-feature-settings:"tnum" 1; }
        .num-sym { opacity:.45; font-weight:600; }   /* $ 與千分位降一階，凸顯數字本體 */

        /* 卡片依序入場 */
        @keyframes riseIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:none} }
        .stagger > * { animation:riseIn .34s cubic-bezier(.22,.61,.36,1) both; }
        .stagger > *:nth-child(1){animation-delay:0ms}   .stagger > *:nth-child(2){animation-delay:45ms}
        .stagger > *:nth-child(3){animation-delay:90ms}  .stagger > *:nth-child(4){animation-delay:135ms}
        .stagger > *:nth-child(5){animation-delay:180ms} .stagger > *:nth-child(6){animation-delay:225ms}
        .stagger > *:nth-child(n+7){animation-delay:270ms}

        /* 自建數字鍵盤 */
        .kp { -webkit-user-select:none; user-select:none; }
        .kp button { transition:transform .08s ease, background-color .12s ease; }
        .kp button:active { transform:scale(.94); }

        @keyframes floatY { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
        .float { animation:floatY 2.6s ease-in-out infinite; }
        @keyframes confettiFall { to { transform:translateY(320px) rotate(540deg); opacity:0 } }
        .confetti i { position:absolute; width:8px; height:12px; border-radius:2px; animation:confettiFall 1.5s ease-in forwards; }

        @media (prefers-reduced-motion: reduce) {
            .stagger > *, .float, .pop, .confetti i { animation:none !important; }
        }
    </style>
</head>
<body class="flex justify-center p-0 md:p-6 text-sm">

    <script>
    /* ==========================================================
       家庭記帳 PWA  v4.2.0
       ========================================================== */

    const CONFIG = {
        VERSION: 'v4.4.5',
        // ↓↓↓ 部署 GAS 後把網址貼在這裡（結尾必須是 /exec） ↓↓↓
        API_URL: 'https://script.google.com/macros/s/AKfycbzCl73_9to7Fmev1slsskZkbZsq2jzc52wYb6ED6Y1u8sbscSsnvRBMQJ55zorbnlEm/exec',
        DEMO: false
    };

    const esc = s => String(s ?? '').replace(/[&<>"']/g,
        c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const fmt = n => '$' + Math.round(Number(n) || 0).toLocaleString('en-US');
    const pad2 = n => String(n).padStart(2, '0');
    const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
    const currentYM = () => todayISO().slice(0, 7);
    const daysInYM = ym => new Date(Number(ym.slice(0, 4)), Number(ym.slice(5, 7)), 0).getDate();
    const uid = () => 'tmp_' + Math.random().toString(36).slice(2, 10);
    /* 後端寫入的 created_at 是台北時間、無時區字尾；前端若用 toISOString()（UTC）
       會比後端小 8 小時，導致剛新增的那筆在排序時沉到同日其他紀錄下面。 */
    const localStamp = () => {
        const d = new Date();
        return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
    };

    const AVATARS = ['av2', 'av4', 'av5', 'av12', 'av14', 'av20', 'av21', 'av37', 'av46', 'av48'];
    const EMOJI_AVATARS = ['🐱', '🐻', '🐰', '🦊', '🐼', '🐨', '🐸', '🐧', '🦉', '🐢', '🐔', '🦖'];

    /** 頭像可能是圖片代號（av20）或 Emoji，兩種都要能畫 */
    function avatarInner(v) {
        v = v || '🐱';
        return String(v).startsWith('av')
            ? `<img src="./${esc(v)}.png" alt="" class="w-full h-full object-cover">`
            : `<span class="leading-none">${esc(v)}</span>`;
    }

    const AUTH = {
        get familyCode() { return localStorage.getItem('fc') || ''; },
        set familyCode(v) { localStorage.setItem('fc', v); },
        get memberId() { return localStorage.getItem('mid') || ''; },
        set memberId(v) { localStorage.setItem('mid', v); },
        clear() { localStorage.removeItem('fc'); localStorage.removeItem('mid'); }
    };

    const api = {
        async call(action, payload = {}) {
            if (CONFIG.DEMO) return DEMO_API(action, payload);
            const res = await fetch(CONFIG.API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action, familyCode: AUTH.familyCode, memberId: AUTH.memberId, ...payload }),
                redirect: 'follow'
            });
            if (!res.ok) throw new Error(`連線失敗 (HTTP ${res.status})`);
            const j = await res.json();
            if (!j.ok) throw new Error(j.error || '後端錯誤');
            return j.data;
        }
    };

    let STATE = { familyName: '', members: [], categories: [], tags: [], transactions: [], rules: [], budgets: [], me: null, poolInitial: 0 };

/* 記住上次選擇：零記帳習慣的人，每次重選帳戶與歸屬是最容易讓人放棄的摩擦 */
const PREF = {
    get(k, d) { try { return JSON.parse(localStorage.getItem('pref_' + k)) ?? d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('pref_' + k, JSON.stringify(v)); } catch (e) { } }
};

/* 分類顏色：讓每個分類有自己的識別色，明細與圖表一致 */
const FALLBACK_HEX = ['#F8A048', '#3090F8', '#40B868', '#F0A8B0', '#F8C850', '#88D8F8', '#A084E8', '#F05838'];
function catColor(name) {
    const c = STATE.categories.find(x => x.item_name === name) || STATE.tags.find(x => x.item_name === name);
    if (c && c.hex_color) return c.hex_color;
    // 沒設顏色的自訂項目（例如手動新增的「富邦-信用卡」）用名稱雜湊，
    // 保證同名永遠同色、不同名盡量不同色
    let h = 0;
    for (let i = 0; i < String(name).length; i++) h = (h * 31 + String(name).charCodeAt(i)) >>> 0;
    return FALLBACK_HEX[h % FALLBACK_HEX.length];
}
function hexA(hex, a) {
    const h = String(hex).replace('#', '');
    const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
    return `rgba(${r},${g},${b},${a})`;
}

    /* ==========================================================

    const FUN_CATS = ['休閒娛樂', '訂閱服務'];

    function monthKeys(n) { const o = []; let ym = currentYM(); for (let i = 0; i < n; i++) { o.push(ym); ym = shiftYM(ym, -1); } return o; }

    function achievementStats() {
        const meId = STATE.me?.member_id;
        const mine = activeTxns().filter(t => t.payer_id === meId);
        const per = {};
        mine.forEach(t => {
            const k = String(t.date).slice(0, 7);
            per[k] = per[k] || { inc: 0, exp: 0, fun: 0 };
            const a = Number(t.amount) || 0;
            if (t.entry_type === '收入') per[k].inc += a;
            if (t.entry_type === '支出') { per[k].exp += a; if (FUN_CATS.includes(t.category)) per[k].fun += a; }
        });
        const ks = monthKeys(24);
        let surplusStreak = 0, funStreak = 0;
        for (const k of ks) { const m = per[k]; if (m && m.inc - m.exp > 0) surplusStreak++; else break; }
        for (const k of ks) { const m = per[k]; if (m && m.inc > 0 && m.fun <= m.inc * 0.1) funStreak++; else break; }
        const cur = per[currentYM()] || { inc: 0, exp: 0 };
        return {
            streak: Number(STATE.me?.streak_days) || 0,
            count: mine.length,
            receipts: mine.filter(t => t.receipt_file_id).length,
            advances: mine.filter(t => t.nature === '家庭代墊').length,
            surplusStreak, funStreak,
            savingRate: cur.inc > 0 ? Math.round((cur.inc - cur.exp) / cur.inc * 100) : 0
        };
    }

    /* ==========================================================
       計算層
       ========================================================== */
    const FAMILY_NATURES = ['家庭公帳', '家庭代墊', '公帳注資'];
    function activeTxns() { return STATE.transactions.filter(t => t.status !== '作廢' && t.status !== '已修訂' && !t.is_rollup); }
    function inMonth(d, ym) { return String(d).slice(0, 7) === ym; }
    function nameOf(id) { const m = STATE.members.find(x => x.member_id === id); return m ? m.nickname : id; }
    function catIcon(name) { const c = STATE.categories.find(x => x.item_name === name); return c ? c.icon_emoji : ''; }

    function computeSummary(mode, ym) {
        ym = ym || currentYM();
        const meId = STATE.me?.member_id, rows = activeTxns();
        const s = { monthlyIncome: 0, monthlyExpense: 0, cashBalance: 0, poolOwesMe: 0, iOweOthers: 0, poolBalance: 0, poolOwesMembers: [], membersOwePool: [], byCategory: [] };

        if (mode === 'personal') {
            const mine = rows.filter(t => t.payer_id === meId);
            mine.forEach(t => {
                const a = Number(t.amount) || 0;
                if (inMonth(t.date, ym)) {
                    if (t.entry_type === '支出') s.monthlyExpense += a;
                    if (t.entry_type === '收入') s.monthlyIncome += a;
                }
                if (t.entry_type === '收入') s.cashBalance += a;
                else if (t.entry_type === '支出' || t.entry_type === '注資') s.cashBalance -= a;
                else if (t.entry_type === '還款') s.cashBalance += (t.related_id === meId ? a : -a);
                if (t.nature === '家庭代墊' && t.entry_type === '支出') s.poolOwesMe += a;
            });
            s.cashBalance += Number(STATE.me?.initial_balance) || 0;
            rows.filter(t => t.entry_type === '還款' && t.related_id === meId && t.member_id === 'family_pool')
                .forEach(t => s.poolOwesMe -= Number(t.amount) || 0);
            rows.filter(t => t.nature === '私人拆帳' && t.related_id === meId && t.payer_id !== meId)
                .forEach(t => s.iOweOthers += Number(t.amount) || 0);
            const cm = {};
            mine.filter(t => t.entry_type === '支出' && inMonth(t.date, ym))
                .forEach(t => { const k = t.category || '未分類'; cm[k] = (cm[k] || 0) + Number(t.amount); });
            s.byCategory = Object.entries(cm).sort((a, b) => b[1] - a[1]);
        } else {
            const fam = rows.filter(t => FAMILY_NATURES.includes(t.nature));
            fam.forEach(t => {
                const a = Number(t.amount) || 0;
                if (inMonth(t.date, ym)) {
                    if (t.entry_type === '支出') s.monthlyExpense += a;
                    if (t.entry_type === '收入' || t.entry_type === '注資') s.monthlyIncome += a;
                }
                if (t.entry_type === '收入' || t.entry_type === '注資') s.poolBalance += a;
                if (t.entry_type === '支出' && t.nature === '家庭公帳') s.poolBalance -= a;
                if (t.entry_type === '還款') s.poolBalance -= a;
            });
            s.poolBalance += Number(STATE.poolInitial) || 0;
            const owe = {};
            rows.filter(t => t.nature === '家庭代墊' && t.entry_type === '支出').forEach(t => { owe[t.payer_id] = (owe[t.payer_id] || 0) + Number(t.amount); });
            rows.filter(t => t.entry_type === '還款' && t.member_id === 'family_pool').forEach(t => { owe[t.related_id] = (owe[t.related_id] || 0) - Number(t.amount); });
            s.poolOwesMembers = Object.entries(owe).filter(([, v]) => v > 0.01).map(([id, v]) => ({ member: nameOf(id), amount: v }));
            const back = {};
            rows.filter(t => t.nature === '公帳注資' && t.entry_type === '支出').forEach(t => { back[t.payer_id] = (back[t.payer_id] || 0) + Number(t.amount); });
            s.membersOwePool = Object.entries(back).filter(([, v]) => v > 0.01).map(([id, v]) => ({ member: nameOf(id), amount: v }));
            const cm = {};
            fam.filter(t => t.entry_type === '支出' && inMonth(t.date, ym))
                .forEach(t => { const k = t.category || '未分類'; cm[k] = (cm[k] || 0) + Number(t.amount); });
            s.byCategory = Object.entries(cm).sort((a, b) => b[1] - a[1]);
        }
        return s;
    }

    /* ---------- 記帳完成微互動：金幣飛向大頭貼 ---------- */
    function coinFly() {
        const frame = document.getElementById('appFrame'), av = document.getElementById('userAvatar');
        if (!frame || !av) return;
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        const fr = frame.getBoundingClientRect(), ar = av.getBoundingClientRect();
        const tx = ar.left - fr.left + ar.width / 2 - 13, ty = ar.top - fr.top + ar.height / 2 - 13;
        const sx = fr.width / 2 - 13, sy = fr.height * 0.52;
        for (let i = 0; i < 5; i++) {
            const c = document.createElement('div');
            c.className = 'coin'; c.textContent = '$';
            c.style.left = sx + (Math.random() * 40 - 20) + 'px';
            c.style.top = sy + 'px';
            frame.appendChild(c);
            const dur = 620 + i * 70;
            c.animate([
                { transform: 'translate(0,0) scale(.5)', opacity: 0 },
                { transform: `translate(${(tx - sx) * .35}px, ${-70 - i * 8}px) scale(1)`, opacity: 1, offset: .35 },
                { transform: `translate(${tx - sx}px, ${ty - sy}px) scale(.35)`, opacity: 0 }
            ], { duration: dur, easing: 'cubic-bezier(.35,.6,.3,1)', delay: i * 55 })
                .onfinish = () => c.remove();
        }
        buzz(12);
    }

            localStorage.setItem(initKey, '1');
            localStorage.setItem(achKey(), JSON.stringify(doneIds));
            return;   // 第一次載入不慶祝既有成就
        }
        let seen = [];
        try { seen = JSON.parse(localStorage.getItem(achKey()) || '[]'); } catch (e) { }
        const fresh = doneIds.filter(id => !seen.includes(id));
        if (fresh.length) {
            localStorage.setItem(achKey(), JSON.stringify(doneIds));
            celebrate(list.find(a => a.id === fresh[0]));

       ========================================================== */
    let toastTimer;
    function toast(msg, isError, action) {
        const el = document.getElementById('toast');
        el.innerHTML = `<div class="flex items-center gap-3 pl-4 pr-2 py-2.5 rounded-tile shadow-lg text-sm font-bold ${isError ? 'bg-pastel-red' : 'bg-stone-800'} text-white">
            <span>${esc(msg)}</span>
            ${action ? `<button onclick="${action.fn}" class="px-3 py-1.5 rounded-lg bg-white/20 text-white text-xs font-bold">${esc(action.label)}</button>` : ''}</div>`;
        el.classList.remove('opacity-0');
        el.classList.toggle('pointer-events-none', !action);
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.add('opacity-0', 'pointer-events-none'), action ? 5200 : 2600);
    }
    function hideToast() { const el = document.getElementById('toast'); el.classList.add('opacity-0', 'pointer-events-none'); }
    function openSheet(html) {
        const m = document.getElementById('sheetModal'), c = document.getElementById('sheetContent');
        c.innerHTML = `<div class="w-12 h-1.5 bg-stone-200 rounded-full mx-auto mb-5"></div>` + html;
        m.classList.remove('js-hide'); void m.offsetWidth;
        m.classList.remove('opacity-0'); c.classList.remove('translate-y-full');
    }
    function closeSheet() {
        const m = document.getElementById('sheetModal'), c = document.getElementById('sheetContent');
        m.classList.add('opacity-0'); c.classList.add('translate-y-full');
        setTimeout(() => m.classList.add('js-hide'), 300);
    }

    const PIE_BG = ['bg-pastel-accent', 'bg-pastel-blue', 'bg-pastel-green', 'bg-pastel-pink', 'bg-pastel-yellow'];
    const PIE_HEX = ['#F8A048', '#3090F8', '#40B868', '#F0A8B0', '#F8C850'];

    function pieHtml(byCategory, total) {
        if (!total) return `<div class="flex flex-col items-center py-6 gap-2"><img src="./av46.png" alt="" class="w-14 h-14 opacity-70"><span class="text-xs text-pastel-muted">本月尚無支出紀錄</span></div>`;
        const top = byCategory.slice(0, 4), rest = byCategory.slice(4).reduce((a, b) => a + b[1], 0);
        const items = rest > 0 ? [...top, ['其他', rest]] : top;
        let off = 0;
        /* 修正：色弧必須用「完整圓」的 path，並宣告 pathLength=100，
           dasharray 的百分比才會對。舊版只畫半圓，弧長 50，比例全被放大兩倍。 */
        const FULL = 'M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831';
        const arcs = items.map((it, i) => {
            const p = (it[1] / total) * 100;
            const col = it[0] === '其他' ? '#9A918A' : catColor(it[0]);
            const a = `<path pathLength="100" stroke-dasharray="${p.toFixed(2)} ${(100 - p).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" stroke-width="5" stroke-linecap="butt" stroke="${col}" fill="none" d="${FULL}" />`;
            off += p; return a;
        }).join('');
        return `<div class="flex items-center gap-5">
            <div class="relative w-24 h-24 flex-shrink-0 flex items-center justify-center">
                <svg class="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                    <path pathLength="100" stroke-width="5" stroke="#F3E7D8" fill="none" d="${FULL}" />${arcs}
                </svg>
                <div class="absolute text-center">
                    <div class="text-[10px] text-pastel-muted leading-tight">總計</div>
                    <div class="text-sm font-bold text-stone-800 font-rounded leading-tight">${fmt(total)}</div>
                </div>
            </div>
            <div class="flex-1 space-y-2.5 text-xs min-w-0">${items.map((it, i) => `
                <div class="flex justify-between items-center gap-2">
                    <span class="flex items-center gap-2 text-stone-700 truncate"><span class="w-2.5 h-2.5 rounded-full flex-shrink-0" style="background:${it[0] === '其他' ? '#9A918A' : catColor(it[0])}"></span>${esc(it[0])} ${Math.round(it[1] / total * 100)}%</span>
                    <span class="font-bold text-stone-800 font-rounded flex-shrink-0">${fmt(it[1])}</span>
                </div>`).join('')}</div>
        </div>`;
    }

    /* 數字滾動：小成本、感受明顯 */
    function animateCounts(root) {
        root.querySelectorAll('[data-count]').forEach(el => {
            const to = Number(el.dataset.count) || 0, pre = el.dataset.pre || '', dur = 620, t0 = performance.now();
            const step = t => {
                const p = Math.min((t - t0) / dur, 1), e = 1 - Math.pow(1 - p, 3);
                el.textContent = pre + Math.round(to * e).toLocaleString('en-US');
                if (p < 1) requestAnimationFrame(step);
            };
            requestAnimationFrame(step);
        });
    }

    /* ---------- 預算 ---------- */
    function budgetKey(scope, category) {
        return [scope === 'family' ? 'family' : STATE.me?.member_id, scope, 'DEFAULT', category || ''].join('|');
    }
    function budgetFor(scope, category) {
        const b = STATE.budgets.find(x => x.budget_id === budgetKey(scope, category));
        return b ? Number(b.amount) || 0 : 0;
    }
    function budgetMood(pct) {
        if (pct > 100) return { av: 'av4', word: '已超出預算，先煞車一下' };
        if (pct > 80) return { av: 'av48', word: '快到上限了，留意一下' };
        if (pct > 50) return { av: 'av21', word: '節奏還可以，繼續保持' };
        return { av: 'av5', word: '目前非常有餘裕！' };
    }

    function budgetHero(s) {
        const total = budgetFor(currentMode, '');
        if (!total) {
            return `<button onclick="openBudgetSheet()" class="w-full text-left bg-white border border-dashed border-pastel-accent/50 rounded-card p-5 shadow-card flex items-center gap-4">
                <img src="./av48.png" alt="" class="w-12 h-12 flex-shrink-0">
                <div class="min-w-0"><div class="font-bold text-sm text-stone-800">設定${currentMode === 'family' ? '公帳' : '每月'}預算</div>
                <div class="text-xs text-pastel-muted mt-0.5">知道「還能花多少」，比知道「花了多少」更有用</div></div>
                <i class="fa-solid fa-chevron-right text-pastel-accent ml-auto"></i></button>`;
        }
        const used = s.monthlyExpense, left = total - used;
        const pct = Math.min(used / total * 100, 100), over = used > total;
        const n = daysInYM(currentYM()), day = Number(todayISO().slice(8, 10));
        const remainDays = Math.max(n - day + 1, 1);
        const daily = Math.max(left, 0) / remainDays;
        const mood = budgetMood(used / total * 100);
        return `
        <div onclick="openBudgetSheet()" class="rounded-card p-5 shadow-md text-white relative overflow-hidden"
             style="background:linear-gradient(135deg, ${over ? '#F05838' : '#F8A048'} 0%, ${over ? '#D8452A' : '#F0863A'} 100%)">
            <img src="./${mood.av}.png" alt="" class="absolute -right-3 -bottom-3 w-24 h-24 opacity-90 pointer-events-none">
            <div class="relative">

                <div class="text-4xl font-bold font-rounded tracking-tight mb-1">
                    <span class="num-sym text-2xl">$</span><span data-count="${Math.abs(left)}" data-pre="${over ? '-' : ''}">0</span></div>
                <div class="text-[11px] opacity-90 mb-3">預算 ${fmt(total)} · 已用 ${fmt(used)}</div>
                <div class="w-full bg-white/25 rounded-full h-2.5 overflow-hidden mb-2 max-w-[62%]">
                    <div class="bg-white h-2.5 rounded-full transition-all duration-700" style="width:${pct}%"></div></div>
                <div class="flex items-center gap-2 text-[11px] font-bold">
                    <span class="bg-white/25 px-2 py-1 rounded-md">每日可用 ${fmt(daily)}</span>
                    <span class="opacity-85">${esc(mood.word)}</span></div>
            </div>
        </div>`;
    }

    function categoryBudgets(s) {
        const set = STATE.budgets.filter(b => b.scope === currentMode && b.category &&
            b.budget_id === budgetKey(currentMode, b.category));
        if (!set.length) return '';
        const spent = Object.fromEntries(s.byCategory);
        return `<div class="bg-white border border-pastel-border/60 rounded-card p-5 shadow-card space-y-3.5">
            <div class="flex justify-between items-center">
                <span class="text-sm font-bold text-stone-800">分類預算</span>
                <button onclick="openBudgetSheet()" class="text-xs font-bold text-pastel-accent">調整</button></div>
            ${set.map(b => {
                const used = spent[b.category] || 0, pct = Math.min(used / b.amount * 100, 100), over = used > b.amount;
                const col = catColor(b.category);
                return `<div class="space-y-1.5">
                    <div class="flex justify-between text-xs">
                        <span class="text-stone-700 truncate">${esc(catIcon(b.category))} ${esc(b.category)}</span>
                        <span class="font-bold font-rounded flex-shrink-0 ml-2 ${over ? 'text-pastel-red' : 'text-stone-700'}">${fmt(used)} / ${fmt(b.amount)}</span></div>

            </div>`);
    }

    async function saveBudgets(scope) {
        const total = Number(document.getElementById('bTotal').value) || 0;
        const items = [{ category: '', amount: total }];
        document.querySelectorAll('.bud-inp').forEach(i => items.push({ category: i.dataset.cat, amount: Number(i.value) || 0 }));
        closeSheet();
        // 先更新本地讓畫面即時反應，再依序同步
        items.forEach(it => {
            const key = budgetKey(scope, it.category);
            const i = STATE.budgets.findIndex(b => b.budget_id === key);
            if (it.amount > 0) {
                const row = { budget_id: key, scope, ym: 'DEFAULT', category: it.category, amount: it.amount };
                if (i >= 0) STATE.budgets[i] = row; else STATE.budgets.push(row);
            } else if (i >= 0) STATE.budgets.splice(i, 1);
        });
        renderDashboard(); toast('預算已更新');
        try {
            for (const it of items) await api.call('saveBudget', { budget: { scope, ym: 'DEFAULT', category: it.category, amount: it.amount } });
        } catch (e) { toast('部分預算同步失敗：' + e.message, true); }
    }

    function settleRow(r, dir) {
        const isPay = dir === 'pool2member';
        return `<div class="bg-pastel-bg p-4 rounded-tile flex justify-between items-center">
            <div class="font-bold text-stone-800 text-sm truncate">${esc(r.member)}</div>
            <div class="text-right flex-shrink-0 ml-2">

            </div></div>`;
    }

    async function settleUp(memberName, amount, dir) {
        if (!confirm(`確定要記錄一筆 ${fmt(amount)} 的結算給「${memberName}」嗎？`)) return;
        const m = STATE.members.find(x => x.nickname === memberName), isPay = dir === 'pool2member';
        await optimisticAdd({
            date: todayISO(), entry_type: '還款', category: '', tag: '結算', amount,
            note: `結算：${memberName}`, nature: '家庭公帳',
            member_id: isPay ? 'family_pool' : m?.member_id,
            payer_id: isPay ? 'family_pool' : m?.member_id,
            related_id: isPay ? m?.member_id : 'family_pool'
        }, null, '結算已記錄');
    }

    /* ==========================================================
       樂觀寫入
       ========================================================== */
    async function optimisticAdd(txn, receipt, okMsg) {
        const local = {
            txn_id: uid(), created_at: localStamp(), is_rollup: false, _new: true,
            status: '有效', parent_txn_id: '', recurring_rule_id: '', receipt_file_id: '',
            member_id: STATE.me.member_id, payer_id: STATE.me.member_id, related_id: '',
            _pending: true, ...txn
        };
        STATE.transactions.push(local);
        renderDataViews();
        toast(okMsg || '已記錄 ✓');
        try {
            const r = await api.call('addTransaction', { txn, receipt });
            const i = STATE.transactions.findIndex(t => t.txn_id === local.txn_id);
            if (i >= 0) STATE.transactions[i] = { ...r.txn, _new: true };
            renderDataViews();
            coinFly();                       // 寫入成功之後才播動畫，不會出現「慶祝了但其實失敗」
            setTimeout(() => {
                const x = STATE.transactions.find(t => t._new);
                if (x) { delete x._new; renderTransactions(); }
            }, 3600);
        } catch (e) {
            STATE.transactions = STATE.transactions.filter(t => t.txn_id !== local.txn_id);
            renderDataViews(); toast('儲存失敗：' + e.message, true);
        }

    function shiftYM(ym, n) {
        let y = Number(ym.slice(0, 4)), m = Number(ym.slice(5, 7)) + n;
        y += Math.floor((m - 1) / 12); m = ((m - 1) % 12 + 12) % 12 + 1;
        return `${y}-${pad2(m)}`;
    }
    function relativeDateLabel(iso) {
        const d = new Date(iso + 'T00:00:00'), now = new Date(todayISO() + 'T00:00:00');
        const diff = Math.round((now - d) / 86400000), md = `${d.getMonth() + 1}/${d.getDate()}`;
        if (diff === 0) return `今天 (${md})`;
        if (diff === 1) return `昨天 (${md})`;
        return `${md}（${['日', '一', '二', '三', '四', '五', '六'][d.getDay()]}）`;
    }
    function scopedTxns(ym) {
        const meId = STATE.me?.member_id;
        const rows = activeTxns().filter(t => !ym || inMonth(t.date, ym));
        return currentMode === 'personal' ? rows.filter(t => t.payer_id === meId) : rows.filter(t => FAMILY_NATURES.includes(t.nature));
    }
    function filteredTxns() {
        // 全期間模式：跨月搜尋，找「去年那台除濕機多少錢」不必先猜月份
        let rows = filters.allTime ? scopedTxns(null) : scopedTxns(viewYM);
        if (filters.type === 'expense') rows = rows.filter(t => t.entry_type === '支出');
        if (filters.type === 'income') rows = rows.filter(t => t.entry_type === '收入');
        if (filters.natures.length) rows = rows.filter(t => filters.natures.includes(t.nature));
        if (filters.cats.length) rows = rows.filter(t => filters.cats.includes(t.category));
        if (filters.tags.length) rows = rows.filter(t => filters.tags.includes(t.tag));
        if (filters.min !== '') rows = rows.filter(t => Number(t.amount) >= Number(filters.min));
        if (filters.max !== '') rows = rows.filter(t => Number(t.amount) <= Number(filters.max));
        if (filters.q) { const q = filters.q.toLowerCase(); rows = rows.filter(t => `${t.note}${t.category}${t.tag}`.toLowerCase().includes(q)); }
        return rows.sort((a, b) => (b.date + b.created_at).localeCompare(a.date + a.created_at));
    }
    function activeFilterCount() {
        return (filters.type !== 'all' ? 1 : 0) + filters.natures.length + filters.cats.length +

    function trendChartHtml(ym) {
        const rows = scopedTxns(ym), n = daysInYM(ym);
        const inc = Array(n).fill(0), exp = Array(n).fill(0);
        rows.forEach(t => {
            const d = Number(String(t.date).slice(8, 10)) - 1;
            if (d < 0 || d >= n) return;
            if (t.entry_type === '收入' || t.entry_type === '注資') inc[d] += Number(t.amount);
            if (t.entry_type === '支出') exp[d] += Number(t.amount);
        });
        let ci = 0, ce = 0;
        const cumI = inc.map(v => (ci += v)), cumE = exp.map(v => (ce += v));
        const max = Math.max(ci, ce, 1);
        const W = 320, H = 132, L = 6, R = 6, T = 10, B = 24, pw = W - L - R, ph = H - T - B;
        const pts = a => a.map((v, i) => `${(L + (n === 1 ? pw / 2 : (i / (n - 1)) * pw)).toFixed(1)},${(T + ph - (v / max) * ph).toFixed(1)}`).join(' ');
        if (!ci && !ce) return `<div class="flex flex-col items-center py-6 gap-2"><img src="./av14.png" alt="" class="w-14 h-14 opacity-70"><span class="text-xs text-pastel-muted">這個月還沒有資料</span></div>`;
        return `
        <svg viewBox="0 0 ${W} ${H}" class="w-full" style="height:132px" preserveAspectRatio="none">
            <defs><linearGradient id="gExp" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#F8A048" stop-opacity=".3"/><stop offset="100%" stop-color="#F8A048" stop-opacity="0"/></linearGradient></defs>
            <line x1="${L}" y1="${T + ph}" x2="${W - R}" y2="${T + ph}" stroke="#F3E7D8" stroke-width="1"/>
            <line x1="${L}" y1="${T + ph / 2}" x2="${W - R}" y2="${T + ph / 2}" stroke="#F3E7D8" stroke-width="1" stroke-dasharray="3 4"/>
            <polygon points="${L},${T + ph} ${pts(cumE)} ${W - R},${T + ph}" fill="url(#gExp)"/>
            <polyline points="${pts(cumI)}" fill="none" stroke="#40B868" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
            <polyline points="${pts(cumE)}" fill="none" stroke="#F8A048" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
        </svg>
        <div class="flex justify-between text-[10px] text-pastel-muted px-1 mt-1"><span>1日</span><span>${Math.ceil(n / 2)}日</span><span>${n}日</span></div>
        <div class="flex justify-between items-center mt-3 pt-3 border-t border-pastel-border text-xs">
            <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-pastel-green"></span>收入累計 <b class="font-rounded">${fmt(ci)}</b></span>
            <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-pastel-accent"></span>支出累計 <b class="font-rounded">${fmt(ce)}</b></span>
        </div>`;
    }

    /* --- 滑動：方向鎖定 + 阻尼 + 滿版底色 --- */
    function bindSwipe() {
        document.querySelectorAll('.swipe-wrap').forEach(wrap => {
            if (wrap._bound) return; wrap._bound = true;
            const inner = wrap.querySelector('.swipe-inner');
            const bg = wrap.querySelector('.swipe-bg');
            const eEdit = wrap.querySelector('.sw-edit'), eVoid = wrap.querySelector('.sw-void');
            const id = wrap.dataset.id;
            const T = 78, MAX = 132;
            let x0 = 0, y0 = 0, dx = 0, lock = null, active = false, moved = false;

            const paint = () => {
                const a = Math.min(Math.abs(dx) / T, 1);
                bg.style.opacity = a;
                bg.style.backgroundColor = dx >= 0 ? '#3090F8' : '#F05838';
                eEdit.style.opacity = dx >= 0 ? 1 : 0;
                eVoid.style.opacity = dx < 0 ? 1 : 0;
            };
            const reset = () => { dx = 0; inner.style.transform = 'translateX(0)'; bg.style.opacity = 0; };

            const start = (x, y) => { x0 = x; y0 = y; dx = 0; lock = null; active = true; moved = false; inner.classList.add('dragging'); };
            const move = (x, y, e) => {
                if (!active) return;
                const ddx = x - x0, ddy = y - y0;
                if (lock === null) {
                    if (Math.abs(ddx) < 8 && Math.abs(ddy) < 8) return;
                    lock = Math.abs(ddx) > Math.abs(ddy) * 1.2 ? 'h' : 'v';
                    if (lock === 'v') { active = false; return; }   // 判定為捲動就完全放手
                }
                if (lock !== 'h') return;
                if (e && e.cancelable) e.preventDefault();
                moved = true;
                // 超過門檻後加阻尼，手感更穩、不會一路滑到底
                const raw = ddx, over = Math.max(Math.abs(raw) - T, 0);
                const mag = Math.min(T + over * 0.35, MAX);
                dx = raw >= 0 ? mag : -mag;
                inner.style.transform = `translate3d(${dx}px,0,0)`;
                paint();
            };
            const end = () => {
                if (!active) { inner.classList.remove('dragging'); return; }
                active = false; inner.classList.remove('dragging');
                if (dx <= -T) { inner.style.transform = 'translateX(-110%)'; bg.style.opacity = 1; setTimeout(() => voidTxn(id), 190); }
                else if (dx >= T) { reset(); editTxn(id); }
                else reset();
            };

            wrap.addEventListener('touchstart', e => start(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
            wrap.addEventListener('touchmove', e => move(e.touches[0].clientX, e.touches[0].clientY, e), { passive: false });
            wrap.addEventListener('touchend', end);
            wrap.addEventListener('touchcancel', () => { active = false; reset(); });
            wrap.addEventListener('mousedown', e => {
                start(e.clientX, e.clientY);
                const mm = ev => move(ev.clientX, ev.clientY, ev);
                const mu = () => { end(); document.removeEventListener('mousemove', mm); document.removeEventListener('mouseup', mu); };
                document.addEventListener('mousemove', mm); document.addEventListener('mouseup', mu);
            });
            inner.addEventListener('click', () => { if (!moved) openTxnSheet(id); });
        });
    }

    const OPS = ['+', '-', '×', '÷'];

    function evalExpr(e) {
        const t = String(e).match(/(\d+\.?\d*|[+\-×÷])/g) || ['0'];
        const s1 = [];
        for (let i = 0; i < t.length; i++) {
            const x = t[i];
            if (x === '×' || x === '÷') {
                const b = Number(t[++i] || 0), a = Number(s1.pop());
                s1.push(x === '×' ? a * b : (b ? a / b : 0));
            } else s1.push(OPS.includes(x) ? x : Number(x));
        }
        let r = Number(s1[0]) || 0;
        for (let i = 1; i < s1.length; i += 2) {
            const op = s1[i], v = Number(s1[i + 1]) || 0;
            r = op === '+' ? r + v : r - v;
        }
        return Math.round(r * 100) / 100;
    }
    const hasOp = e => OPS.some(o => String(e).slice(1).includes(o));

    function kp(k) {
        buzz(6);
        let e = addState.expr;
        if (k === 'C') e = '0';
        else if (k === 'del') { e = e.length > 1 ? e.slice(0, -1) : '0'; }
        else if (OPS.includes(k)) {
            if (OPS.includes(e.slice(-1))) e = e.slice(0, -1) + k; else e += k;
        } else if (k === '.') {
            const last = e.split(/[+\-×÷]/).pop();
            if (!last.includes('.')) e += last === '' ? '0.' : '.';
        } else {
            const last = e.split(/[+\-×÷]/).pop();
            e = (e === '0') ? k : (last === '0' ? e.slice(0, -1) + k : e + k);
        }
        addState.expr = e;
        paintAmount();
    }

    function paintAmount() {
        const d = document.getElementById('kpAmt'), h = document.getElementById('kpHint');
        if (!d) return;
        const v = evalExpr(addState.expr);
        d.innerHTML = hasOp(addState.expr)
            ? `<span class="text-2xl text-pastel-muted">${esc(addState.expr)}</span>`
            : `<span class="num-sym text-2xl">$</span>${Number(v).toLocaleString('en-US')}`;
        if (h) h.innerText = hasOp(addState.expr) ? `= ${fmt(v)}` : '';
    }

    function handleReceipt(e) {
        const file = e.target.files[0]; if (!file) return;
        const img = new Image(), reader = new FileReader();
        reader.onload = ev => { img.src = ev.target.result; };
        img.onload = () => {
            const max = 1280, sc = Math.min(1, max / Math.max(img.width, img.height));
            const cv = document.createElement('canvas');
            cv.width = img.width * sc; cv.height = img.height * sc;
            cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
            pendingReceipt = { base64: cv.toDataURL('image/jpeg', 0.75).split(',')[1], mime: 'image/jpeg' };
            document.getElementById('receiptBox').innerHTML = `<i class="fa-solid fa-circle-check text-lg text-pastel-green"></i><span class="font-bold text-pastel-green">單據已附加（點擊可更換）</span>`;
        };
        reader.readAsDataURL(file);
    }

    function editTxn(id) {
        const t = STATE.transactions.find(x => x.txn_id === id); if (!t) return;
        editingTxnId = id;
        addState = {
            mode: t.entry_type === '收入' ? 'income' : (t.entry_type === '轉帳' ? 'transfer' : 'expense'),
            expr: String(t.amount), cat: t.category, tag: t.tag, nature: t.nature,
            date: t.date, note: t.note || '', more: true, from: t.tag, to: t.related_id || ''

    function cancelEdit() { editingTxnId = null; pendingReceipt = null; initAddForm(); toast('已取消編輯'); }

    async function saveTransaction() {
        const amount = evalExpr(addState.expr);
        if (!amount || amount <= 0) { buzz(30); openKeypadDrawer(); return toast('請先輸入金額', true); }
        const isTr = addState.mode === 'transfer';
        if (!isTr && !addState.cat) { buzz(30); openCatDrawer(); return toast('請先選擇分類', true); }
        if (isTr) {
            const from = document.getElementById('trFrom').value, to = document.getElementById('trTo').value;
            if (from === to) return toast('轉出與轉入帳戶不能相同', true);
            PREF.set('tag', from);
            const note = addState.note || `${from} → ${to}`;
            initAddForm();
            switchTab('transactions'); buzz(14);
            viewYM = addState.date.slice(0, 7);
            return optimisticAdd({
                date: addState.date, entry_type: '轉帳', category: '', tag: from, amount, note,
                nature: '純個人', related_id: to, member_id: STATE.me.member_id, payer_id: STATE.me.member_id
            }, null, '轉帳已記錄 ✓');
        }

        const nature = document.getElementById('inpNature')?.value || '純個人';
        const isExp = addState.mode === 'expense';
        const txn = {
            date: addState.date || todayISO(),
            entry_type: isExp ? '支出' : '收入',
            category: addState.cat, tag: addState.tag, amount,
            note: addState.note, nature,
            related_id: nature === '私人拆帳' ? (document.getElementById('inpRelated')?.value || '') : '',
            member_id: STATE.me.member_id,
            payer_id: (currentMode === 'family' && isExp && nature === '家庭公帳') ? 'family_pool' : STATE.me.member_id
        };
        // 記住這次的選擇，下次直接帶入
        PREF.set('tag', addState.tag);
        PREF.set('nature', nature);
        PREF.set('cat_' + (isExp ? 'EXPENSE_CATEGORY' : 'INCOME_CATEGORY'), addState.cat);

        const receipt = pendingReceipt;
        const wantRec = document.getElementById('isRecurring')?.checked;
        const rec = wantRec ? {
            name: txn.note || txn.category, entry_type: txn.entry_type, category: txn.category,
            tag: txn.tag, amount, note: txn.note, nature,
            freq: document.getElementById('recFreq').value,
            auto_mode: document.getElementById('recMode').value,
            start_date: txn.date, end_date: document.getElementById('recEnd').value || '',
            scope: currentMode === 'family' ? 'family' : 'personal'
        } : null;

        if (editingTxnId) {
            const oldId = editingTxnId, idx = STATE.transactions.findIndex(t => t.txn_id === oldId);
            const backup = idx >= 0 ? { ...STATE.transactions[idx] } : null;
            if (idx >= 0) Object.assign(STATE.transactions[idx], txn, { _pending: true });
            editingTxnId = null; pendingReceipt = null;
            initAddForm(); renderDataViews(); switchTab('transactions'); toast('已更新 ✓'); buzz(14);
            try {
                const r = await api.call('updateTransaction', { txn_id: oldId, txn, receipt });
                const i2 = STATE.transactions.findIndex(t => t.txn_id === oldId);
                if (i2 >= 0) STATE.transactions[i2] = r.txn;
                renderDataViews();
            } catch (e) {
                if (backup && idx >= 0) STATE.transactions[idx] = backup;
                renderDataViews(); toast('更新失敗：' + e.message, true);
            }
            return;
        }

        pendingReceipt = null; initAddForm();
        viewYM = txn.date.slice(0, 7);          // 跳到該筆所在月份，確保看得到
        filters.q = ''; filters.type = 'all';
        switchTab('transactions'); buzz(14);
        await optimisticAdd(txn, receipt);
        document.getElementById('appMain').scrollTop = 0;
        if (rec) {
            try {
                const r = await api.call('saveRule', { rule: rec, first_run_done: true });
                STATE.rules.push(r.rule); renderSettings(); toast('重複性收支已建立');
            } catch (e) { toast('重複規則建立失敗：' + e.message, true); }
        }
    }

    function ruleTypeChanged() {
        const isExp = document.getElementById('rType').value === '支出';

    async function saveRule(ruleId) {
        const rule = {
            rule_id: ruleId || '', name: document.getElementById('rName').value.trim(),
            entry_type: document.getElementById('rType').value,
            amount: Number(document.getElementById('rAmount').value),
            category: document.getElementById('rCat').value, tag: document.getElementById('rTag').value,
            freq: document.getElementById('rFreq').value, auto_mode: document.getElementById('rMode').value,
            start_date: document.getElementById('rStart').value || todayISO(),
            end_date: document.getElementById('rEnd').value || '',
            nature: document.getElementById('rNature').value, note: document.getElementById('rName').value.trim(),
            scope: document.getElementById('rScope')?.value || 'personal',
            status: document.getElementById('rPaused')?.checked ? '停用' : '啟用'
        };
        if (!rule.name) return toast('請輸入名稱', true);
        if (!rule.amount || rule.amount <= 0) return toast('請輸入正確金額', true);
        closeSheet();
        try {
            const r = await api.call('saveRule', { rule });
            const i = STATE.rules.findIndex(x => x.rule_id === r.rule.rule_id);
            if (i >= 0) STATE.rules[i] = r.rule; else STATE.rules.push(r.rule);
            renderSettings(); toast('已儲存');
        } catch (e) { toast('儲存失敗：' + e.message, true); }
    }
    async function deleteRule(ruleId) {
        if (!confirm('確定要刪除這個重複性收支規則嗎？（已產生的紀錄不受影響）')) return;
        const backup = [...STATE.rules];
        STATE.rules = STATE.rules.filter(r => r.rule_id !== ruleId);
        renderSettings();
        try { await api.call('deleteRule', { rule_id: ruleId }); toast('已刪除'); }
        catch (e) { STATE.rules = backup; renderSettings(); toast('刪除失敗：' + e.message, true); }
    }

    async function addItem(group) {
        const name = prompt(group === 'PAYMENT_TAG' ? '新增帳戶／標籤名稱：' : '新增分類名稱：');
        if (!name) return;
        const icon = group === 'PAYMENT_TAG' ? '💳' : (prompt('選一個 Emoji 圖示：', '🏷️') || '🏷️');
        const item = { item_name: name, item_group: group, icon_emoji: icon };
        if (group === 'PAYMENT_TAG') STATE.tags.push(item); else STATE.categories.push(item);
        renderSettings(); initAddForm();
        try { await api.call('addItem', { item }); toast('已新增'); }
        catch (e) {
            if (group === 'PAYMENT_TAG') STATE.tags = STATE.tags.filter(x => x.item_name !== name);
            else STATE.categories = STATE.categories.filter(x => x.item_name !== name);
            renderSettings(); initAddForm(); toast(e.message, true);
        }
    }
    async function archiveItem(name, group) {
        if (!confirm(`確定要停用「${name}」嗎？（歷史紀錄不受影響）`)) return;
        const bc = [...STATE.categories], bt = [...STATE.tags];
        if (group === 'PAYMENT_TAG') STATE.tags = STATE.tags.filter(x => x.item_name !== name);
        else STATE.categories = STATE.categories.filter(x => !(x.item_name === name && x.item_group === group));
        renderSettings(); initAddForm();
        try { await api.call('archiveItem', { item_name: name, item_group: group }); toast('已停用'); }
        catch (e) { STATE.categories = bc; STATE.tags = bt; renderSettings(); initAddForm(); toast(e.message, true); }
    }

    /* ---------- CSV 匯出 ---------- */
    function exportCSV() {
        const rows = filteredTxns();
        if (!rows.length) return toast('目前沒有可匯出的紀錄', true);
        const head = ['日期', '類型', '分類', '帳戶標籤', '金額', '備註', '費用歸屬', '記帳者'];
        const cell = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
        const csv = '\uFEFF' + [head.map(cell).join(',')]     // BOM 讓 Excel 正確辨識中文
            .concat(rows.map(t => [t.date, t.entry_type, t.category, t.tag, t.amount, t.note, t.nature, nameOf(t.member_id)].map(cell).join(',')))
            .join('\r\n');
        const name = `家庭記帳_${filters.allTime ? '全期間' : viewYM}_${currentMode === 'family' ? '家庭' : STATE.me?.nickname}.csv`;
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });

        // iOS PWA 對 <a download> 支援差，優先用系統分享
        const file = (typeof File !== 'undefined') ? new File([blob], name, { type: 'text/csv' }) : null;
        if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
            navigator.share({ files: [file], title: name }).catch(() => { });
            return;
        }
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = name; document.body.appendChild(a); a.click();
        setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1200);
        toast(`已匯出 ${rows.length} 筆`);
    }

    /* ==========================================================
       版面高度：唯一可靠的來源是 visualViewport / innerHeight
       ========================================================== */
    let LAYOUT = {};
    function syncFrameHeight() {
        if (window.innerWidth >= 768) {                 // 桌機交回 CSS 處理
            document.documentElement.style.removeProperty('--appH');
            return;
        }
        const vv = window.visualViewport;
        // 鍵盤彈出時 visualViewport 會縮小；此時改用 innerHeight，避免導覽列被頂上來
        const kbOpen = vv && (window.innerHeight - vv.height) > 120;
        const h = Math.round(kbOpen ? window.innerHeight : (vv ? vv.height : window.innerHeight));
        document.documentElement.style.setProperty('--appH', h + 'px');
        // 導覽列是 fixed，主內容區必須自己讓出等高的底部空間
        const nav = document.getElementById('appNav');
        const navH = nav && !nav.classList.contains('js-hide') ? Math.round(nav.getBoundingClientRect().height) : 0;
        if (navH > 0) document.documentElement.style.setProperty('--navH', navH + 'px');

        const frame = document.getElementById('appFrame');
        LAYOUT = {
            innerH: window.innerHeight,
            visualH: vv ? Math.round(vv.height) : null,
            used: h,
            screenH: window.screen ? Math.round(window.screen.height) : null,
            frameBottom: frame ? Math.round(frame.getBoundingClientRect().bottom) : null,
            navBottom: nav ? Math.round(nav.getBoundingClientRect().bottom) : null,
            navH: navH,
            standalone: !!(window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches),
            safeBottom: getComputedStyle(document.documentElement).getPropertyValue('--sab').trim() || '?'
        };
    }
    function bindLayout() {
        // 讀出安全區數值供診斷用
        const probe = document.createElement('div');
        probe.style.cssText = 'position:fixed;bottom:0;height:env(safe-area-inset-bottom,0px);width:0';
        document.body.appendChild(probe);
        let sab = Math.round(probe.getBoundingClientRect().height);
        probe.remove();
        // iOS 偶爾在 standalone 下把 env(safe-area-inset-bottom) 回報成 0，
        // 但機身其實有 Home Indicator。以「無實體 Home 鍵機型」為判準補上固定值。
        const standalone = !!(window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches);
        if (sab === 0 && standalone && window.innerHeight >= 780) sab = 20;
        document.documentElement.style.setProperty('--sab', sab + 'px');

        syncFrameHeight();
        window.addEventListener('resize', syncFrameHeight);
        window.addEventListener('orientationchange', () => setTimeout(syncFrameHeight, 260));
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', syncFrameHeight);
            window.visualViewport.addEventListener('scroll', syncFrameHeight);
        }
    }

    /* ==========================================================
       自動更新：偵測到新版就跳橫幅，不必再手動刪圖示重加
       ========================================================== */
    let swReg = null, reloadedOnce = false;
    function showUpdateBar() { document.getElementById('updateBar').classList.remove('js-hide'); }
    function applyUpdate() {
        document.getElementById('updateBar').classList.add('js-hide');
        toast('更新中…');
        if (swReg && swReg.waiting) swReg.waiting.postMessage({ type: 'SKIP_WAITING' });
        setTimeout(() => location.reload(), 600);
    }
    function initServiceWorker() {
        if (!('serviceWorker' in navigator)) return;
        navigator.serviceWorker.register('./sw.js').then(reg => {
            swReg = reg;
            if (reg.waiting) showUpdateBar();
            reg.addEventListener('updatefound', () => {
                const nw = reg.installing;
                if (!nw) return;
                nw.addEventListener('statechange', () => {
                    if (nw.state === 'installed' && navigator.serviceWorker.controller) showUpdateBar();
                });
            });
            setInterval(() => reg.update().catch(() => { }), 30 * 60 * 1000);   // 每 30 分鐘查一次
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden) reg.update().catch(() => { });
            });
        }).catch(() => { });
        navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (reloadedOnce) return; reloadedOnce = true;
            location.reload();
        });
    }

    /* ---------- 啟動 ---------- */
    if (window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches) {
        document.getElementById('fakeStatusBar').classList.add('js-hide');
    }
    try { screen.orientation && screen.orientation.lock && screen.orientation.lock('portrait').catch(() => { }); } catch (e) { }
    initServiceWorker();
    window.addEventListener('DOMContentLoaded', () => { bindLayout(); bootstrap(); });
    </script>

</body>
</html>
