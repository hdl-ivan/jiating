<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <!-- black-translucent：讓網頁內容延伸到狀態列底下，狀態列才會是我們的奶油色而不是系統白 -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="家庭記帳">
    <meta name="theme-color" content="#FFF8F0">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./icon-180.png">
    <link rel="icon" href="./icon-192.png">

    <title>家庭記帳</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.3.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        /* 取自角色頭像的色票，飽和度提高、色溫轉暖 */
                        pastel: {
                            bg: '#FFF8F0', card: '#FFFFFF', text: '#3A3330', muted: '#9A918A', border: '#F3E7D8',
                            accent: '#F8A048', accentLight: '#FFEEDA',
                            red: '#F05838', redLight: '#FFE8E2',
                            green: '#40B868', greenLight: '#E2F6E9',
                            blue: '#3090F8', blueLight: '#E4F0FF',
                            sky: '#88D8F8', skyLight: '#E9F7FE',
                            yellow: '#F8C850', yellowLight: '#FFF4D8',
                            pink: '#F0A8B0', pinkLight: '#FDECEF',
                            purple: '#A084E8'
                        }
                    },
                    borderRadius: { 'card': '24px', 'sheet': '32px', 'tile': '16px' },
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans TC', 'sans-serif'],
                        rounded: ['Comfortaa', 'Noto Sans TC', 'sans-serif']
                    },
                    boxShadow: {
                        'soft': '0 10px 30px rgba(248, 160, 72, 0.22)',
                        'card': '0 4px 18px rgba(160, 130, 100, 0.07)',
                        'glow-gold': '0 0 16px rgba(248, 200, 80, 0.75)'
                    }
                }
            }
        }
    </script>
    <style>
        /* 版面錨定：不使用任何百分比高度。
           iOS 的 position:fixed + height:100% 在工具列伸縮時解析出的值不等於實際可視高度，
           底部會差一截；直接把外框釘在視窗四邊（inset:0）才會真正貼底。 */
        html, body {
            background-color:#FBF2E6; height:100%; margin:0; padding:0;
            overflow:hidden; overscroll-behavior:none; touch-action:manipulation;
        }
        body { font-family:'Inter','Noto Sans TC',sans-serif; color:#3A3330; -webkit-tap-highlight-color:transparent; }

        /* ID 選擇器優先權高於 Tailwind class，直接覆寫外框定位。
           高度不用 inset:0 也不用 dvh —— iOS 對這兩者的解析在標準列／安全區存在時
           不見得等於使用者實際看到的高度。改由 JS 量測 visualViewport 寫入 --appH，
           這是唯一保證與螢幕所見一致的來源。 */
        #appFrame {
            position:fixed; inset:0;
            width:100%; max-width:none;
            /* iOS PWA 三個高度來源（innerHeight / visualViewport / 100dvh）
               都會少報一個「上方安全區」的量，但畫面其實是從 y=0 開始畫的，
               因此真正的可畫高度 = 100dvh + safe-area-inset-top。 */
            height:calc(100dvh + env(safe-area-inset-top, 0px));
            height:var(--appH, calc(100dvh + env(safe-area-inset-top, 0px)));
            border-radius:0; border:0;
            display:flex; flex-direction:column;
        }

        /* ── 手機：導覽列不再依賴外框的 flex 計算，直接釘在「視窗」底邊 ──
           先前三個版本都是想辦法讓外框高度正確、再讓 flex 把 nav 推到底。
           只要外框高度有一點誤差，nav 就會懸空。改成 fixed 之後，
           不論外框算成多高，nav 永遠貼在螢幕最底。 */
        @media (max-width:767px) {
            /* 必須是 absolute 不能是 fixed：
               fixed 錨定的是「視窗」（iOS 少報 62px），absolute 才錨定「外框」（實際 874）。
               這是導覽列一直懸空 62px 的最後一個原因。 */
            #appNav   { position:absolute; left:0; right:0; bottom:0; }
            #appMain  { padding-bottom:var(--navH, 92px); }
            #toast    { position:absolute; left:0; right:0; bottom:calc(var(--navH, 92px) + 14px); }
        }
        /* 桌機恢復置中的手機外框 */
        @media (min-width:768px) {
            html, body { height:auto; overflow:auto; }
            #appFrame {
                position:relative; top:auto; left:auto; right:auto; bottom:auto; margin:0 auto;
                width:100%; max-width:28rem; height:880px;
                border-radius:44px; border-width:10px;
                display:flex; flex-direction:column;
            }
        }
        #appMain { -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }
        /* 導覽列背景延伸到 Home Indicator 底下，padding 只負責把內容推上來 */
        #appNav { background-color:#FFFFFF; padding-bottom:calc(0.35rem + var(--sab, env(safe-area-inset-bottom, 0px))); }
        html.dark #appNav { background-color:#221F1D !important; }
        /* 已加入主畫面時，整個底色改成 App 奶油色，狀態列區域才不會露出不同色 */
        @media (display-mode: standalone) { html, body { background-color:#FFF8F0; } }
        .hide-scrollbar::-webkit-scrollbar { display:none; }
        .hide-scrollbar { -ms-overflow-style:none; scrollbar-width:none; }
        input, select, textarea { font-size:16px; }

        input[type="date"], input[type="month"], input[type="time"] {
            -webkit-appearance:none; appearance:none;
            width:100%; min-width:0; max-width:100%; box-sizing:border-box; display:block;
        }
        input[type="date"]::-webkit-date-and-time-value { text-align:left; }
        input[type="date"]::-webkit-calendar-picker-indicator { opacity:.45; }
        select { -webkit-appearance:none; appearance:none; background-image:none; min-width:0; }
        .field { min-width:0; }

        .swipe-wrap { touch-action:pan-y; }
        .swipe-inner { will-change:transform; transition:transform .24s cubic-bezier(.22,.61,.36,1); }
        .swipe-inner.dragging { transition:none; }
        .swipe-bg { transition:background-color .15s linear; }

        .js-hide { display:none !important; }

        /* ───────── 深色模式 ─────────
           以覆寫實際使用到的 Tailwind 工具類別實作，
           不必改動任何一處 markup，切換即時生效。 */
        html.dark { color-scheme:dark; }
        html.dark, html.dark body { background-color:#171514 !important; color:#E9E2D8; }
        html.dark .bg-white, html.dark .bg-white\/95, html.dark .bg-white\/70, html.dark .bg-white\/60 { background-color:#221F1D !important; }
        html.dark .bg-pastel-bg { background-color:#2B2724 !important; }
        html.dark .bg-\[\#FBF2E6\] { background-color:#171514 !important; }
        html.dark .bg-stone-800 { background-color:#3A3430 !important; }
        html.dark .bg-stone-100, html.dark .bg-stone-200\/40, html.dark .bg-stone-200\/50 { background-color:#332F2C !important; }
        html.dark .text-pastel-text, html.dark .text-stone-800, html.dark .text-stone-700 { color:#EFE7DC !important; }
        html.dark .text-stone-600, html.dark .text-stone-500 { color:#BDB3A6 !important; }
        html.dark .text-pastel-muted, html.dark .text-stone-400 { color:#8F857A !important; }
        html.dark .border-pastel-border, html.dark .border-stone-100, html.dark .border-stone-200 { border-color:#3A3430 !important; }
        html.dark .border-pastel-border\/60, html.dark .border-pastel-border\/70 { border-color:#332F2C !important; }
        html.dark .bg-pastel-accentLight { background-color:rgba(248,160,72,.16) !important; }
        html.dark .bg-pastel-greenLight  { background-color:rgba(64,184,104,.16) !important; }
        html.dark .bg-pastel-redLight    { background-color:rgba(240,88,56,.16) !important; }
        html.dark .bg-pastel-blueLight   { background-color:rgba(48,144,248,.16) !important; }
        html.dark .bg-pastel-yellowLight { background-color:rgba(248,200,80,.16) !important; }
        html.dark .bg-pastel-skyLight    { background-color:rgba(136,216,248,.16) !important; }
        html.dark .bg-pastel-pinkLight   { background-color:rgba(240,168,176,.16) !important; }
        html.dark .shadow-card, html.dark .shadow-sm, html.dark .shadow-md { box-shadow:0 4px 18px rgba(0,0,0,.35) !important; }
        html.dark #appFrame { border-color:#000 !important; }
        html.dark img[src*="av"] { filter:brightness(.94); }
        /* 深色下未選取的選項底色若跟背景太接近會看不見，這裡拉高對比並補上邊框 */
        html.dark .bg-pastel-bg { background-color:#33302C !important; }
        html.dark .border-pastel-border { border-color:#4A443E !important; }
        html.dark [style*="background:rgba"] { outline:1px solid rgba(255,255,255,.10); outline-offset:-1px; }
        html.dark .text-stone-600 { color:#CFC5B8 !important; }
        html.dark input, html.dark select, html.dark textarea { color:#EFE7DC !important; }
        html.dark input::placeholder { color:#8F857A !important; }

        /* 橫向時擋住主畫面（排除桌機大螢幕） */
        #rotateGate { display:none; }
        @media (orientation:landscape) and (max-height:560px) {
            #rotateGate { display:flex; }
            #appFrame  { display:none; }
        }

        /* 6. 觸覺感 UI：按下時輕微下沉 */
        .tactile { transition:transform .09s ease, box-shadow .09s ease; }
        .tactile:active { transform:translateY(2px); box-shadow:0 1px 4px rgba(160,130,100,.14) !important; }

        /* 8. 記帳完成微互動：金幣飛向大頭貼 */
        .coin { position:absolute; width:26px; height:26px; border-radius:9999px;
                background:radial-gradient(circle at 32% 30%, #FFE9A8, #F8C850 60%, #E0A81E);
                box-shadow:0 2px 8px rgba(224,168,30,.5); z-index:96; pointer-events:none;
                display:flex; align-items:center; justify-content:center;
                font-size:13px; font-weight:700; color:#8A6410; }

        /* 新增後在明細高亮該筆 */
        @keyframes newFlash { 0%{box-shadow:0 0 0 0 rgba(248,160,72,.65)} 100%{box-shadow:0 0 0 14px rgba(248,160,72,0)} }
        .is-new > .swipe-inner { animation:newFlash 1.6s ease-out 2; border-color:#F8A048 !important; }
        @keyframes spin { to { transform:rotate(360deg); } }
        .spinner { animation:spin .8s linear infinite; }
        @keyframes pulseSoft { 0%,100%{opacity:.5} 50%{opacity:1} }
        .pending { animation:pulseSoft 1.1s ease-in-out infinite; }
        @keyframes popIn { from{transform:scale(.8);opacity:0} to{transform:scale(1);opacity:1} }
        .pop { animation:popIn .35s cubic-bezier(.34,1.56,.64,1) both; }

        /* 等寬數字：金額直排時不會左右跳動，是財務介面精緻感的關鍵 */
        .num, .font-rounded, input[type="number"] { font-variant-numeric: tabular-nums; font-feature-settings:"tnum" 1; }
        .num-sym { opacity:.45; font-weight:600; }   /* $ 與千分位降一階，凸顯數字本體 */

        /* 卡片依序入場 */
        @keyframes riseIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:none} }
        .stagger > * { animation:riseIn .34s cubic-bezier(.22,.61,.36,1) both; }
        .stagger > *:nth-child(1){animation-delay:0ms}   .stagger > *:nth-child(2){animation-delay:45ms}
        .stagger > *:nth-child(3){animation-delay:90ms}  .stagger > *:nth-child(4){animation-delay:135ms}
        .stagger > *:nth-child(5){animation-delay:180ms} .stagger > *:nth-child(6){animation-delay:225ms}
        .stagger > *:nth-child(n+7){animation-delay:270ms}

        /* 自建數字鍵盤 */
        .kp { -webkit-user-select:none; user-select:none; }
        .kp button { transition:transform .08s ease, background-color .12s ease; }
        .kp button:active { transform:scale(.94); }

        @keyframes floatY { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
        .float { animation:floatY 2.6s ease-in-out infinite; }
        @keyframes confettiFall { to { transform:translateY(320px) rotate(540deg); opacity:0 } }
        .confetti i { position:absolute; width:8px; height:12px; border-radius:2px; animation:confettiFall 1.5s ease-in forwards; }

        @media (prefers-reduced-motion: reduce) {
            .stagger > *, .float, .pop, .confetti i { animation:none !important; }
        }
    </style>
</head>
<body class="flex justify-center p-0 md:p-6 text-sm">

<!-- 1. 直向鎖定：iOS 不支援 Screen Orientation API，只能用提示層擋住橫向 -->
<div id="rotateGate" class="fixed inset-0 z-[200] bg-pastel-bg flex-col items-center justify-center text-center px-10 gap-4">
    <img src="./av48.png" alt="" class="w-20 h-20 float">
    <div class="font-bold text-stone-800">請把手機轉回直向</div>
    <div class="text-xs text-pastel-muted leading-relaxed">家庭記帳為直向設計。<br>若轉回後仍是橫的，請從控制中心開啟「直向鎖定」。</div>
</div>

<div id="appFrame" class="w-full max-w-md bg-pastel-bg md:h-[880px] md:rounded-[44px] shadow-2xl flex flex-col overflow-hidden relative border-0 md:border-[10px] border-stone-800">

    <div id="fakeStatusBar" class="pt-3 px-7 pb-1 flex justify-between items-center text-xs text-stone-500 font-medium select-none bg-pastel-bg z-20 shrink-0">
        <span class="font-bold text-stone-700 tracking-wider" id="clock">09:41</span>
        <div class="flex items-center gap-2"><i class="fa-solid fa-wifi text-stone-600"></i><i class="fa-solid fa-battery-full text-stone-700"></i></div>
    </div>
    <!-- 瀏海安全區：只在系統「沒有」自己保留狀態列時才補，避免重複佔掉一整條 -->
    <div id="topSafe" class="shrink-0 bg-pastel-bg" style="height:var(--topPad, env(safe-area-inset-top, 0px))"></div>

    <div id="splash" class="absolute inset-0 bg-pastel-bg z-[80] flex flex-col items-center justify-center gap-4">
        <img src="./av5.png" alt="" class="w-24 h-24 float">
        <div class="w-8 h-8 border-4 border-pastel-accentLight border-t-pastel-accent rounded-full spinner"></div>
        <div class="text-xs text-pastel-muted">連線中…</div>
    </div>

    <div id="gateScreen" class="absolute inset-0 bg-pastel-bg z-[70] flex flex-col justify-center px-6 py-8 overflow-y-auto hide-scrollbar js-hide">
        <div class="text-center space-y-2 mb-8">
            <img src="./av5.png" alt="" class="w-24 h-24 mx-auto mb-2 float">
            <div class="relative inline-block max-w-[280px]">
                <div class="absolute -top-1.5 left-1/2 -translate-x-1/2 w-3 h-3 rotate-45 bg-white border-l border-t border-pastel-border"></div>
                <p id="gateSpeech" class="bg-white border border-pastel-border rounded-2xl px-4 py-2.5 text-sm font-bold text-stone-700 shadow-card">
                    請輸入 8 位家庭代碼，跟家人連線吧！</p>
            </div>
        </div>
        <div id="gateError" class="hidden mb-4 p-3 rounded-tile bg-pastel-redLight border border-pastel-red/30 text-pastel-red text-xs font-bold"></div>
        <div id="gateStep1" class="bg-white p-6 rounded-sheet shadow-card border border-pastel-border space-y-4">
            <div>
                <label class="block text-sm font-bold text-stone-700 mb-2.5 text-center">家庭代碼</label>
                <div class="relative" onclick="document.getElementById('gateCode').focus()">
                    <!-- 真正的輸入框透明疊在方格上：可貼上、可用系統自動填入，也不必處理逐格跳焦點 -->
                    <!-- 不能用 opacity-0：iOS 對不可見元素不會跳出「貼上」選單。
                         改為元素可見、但文字與游標透明，長按即可貼上。 -->
                    <input type="text" id="gateCode" maxlength="8" inputmode="latin" autocomplete="one-time-code"
                           autocapitalize="characters" autocorrect="off" spellcheck="false"
                           oninput="paintOtp()" onpaste="setTimeout(paintOtp,0)"
                           style="color:transparent;caret-color:transparent;background:transparent;border:0;-webkit-text-fill-color:transparent"
                           class="absolute inset-0 w-full h-full z-10 outline-none">
                    <div id="otpBoxes" class="flex gap-1.5 justify-center"></div>
                </div>
                <div class="flex items-center justify-center gap-3 mt-3">
                    <button type="button" onclick="pasteCode()" class="px-3 py-1.5 rounded-full bg-pastel-bg border border-pastel-border text-[11px] font-bold text-stone-600 tactile"><i class="fa-solid fa-paste mr-1"></i>貼上</button>
                    <button type="button" onclick="clearCode()" class="px-3 py-1.5 rounded-full bg-pastel-bg border border-pastel-border text-[11px] font-bold text-stone-600 tactile"><i class="fa-solid fa-eraser mr-1"></i>清除</button>
                </div>
            </div>
            <button id="gateCodeBtn" onclick="gateSubmitCode()" class="w-full py-3.5 bg-pastel-accent text-white font-bold rounded-tile shadow-md">下一步</button>
        </div>
        <div id="gateStep2" class="hidden bg-white p-6 rounded-sheet shadow-card border border-pastel-border space-y-4">
            <label class="block text-sm font-bold text-stone-700">你是誰？</label>
            <div id="memberPicker" class="grid grid-cols-3 gap-3"></div>
        </div>
        <p class="text-center text-[10px] text-pastel-muted mt-6">版本 <span id="appVersion">–</span></p>
    </div>

    <header id="appHeader" class="px-5 py-3 bg-pastel-bg z-20 flex justify-between items-center border-b border-pastel-border/70 js-hide shrink-0">
        <div class="flex items-center gap-3 min-w-0">
            <div class="relative cursor-pointer flex-shrink-0" onclick="openProfileModal()">
                <div id="userAvatar" class="w-12 h-12 rounded-full border-[3px] flex items-center justify-center text-[22px] overflow-hidden shadow-sm transition-all duration-500"></div>
                <div id="levelBadge" class="absolute -bottom-1 -right-1 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full border-2 border-white shadow-sm"></div>
            </div>
            <div class="min-w-0">
                <div class="text-xs text-pastel-muted font-medium flex items-center gap-1.5 mb-0.5 truncate">
                    Hi, <span id="displayUserName" class="font-bold text-pastel-text text-sm">使用者</span>! <i class="fa-solid fa-hand-sparkles text-pastel-accent text-xs"></i>
                </div>
                <div class="flex items-center gap-1 bg-stone-200/40 p-1 rounded-full mt-1 w-max">
                    <button id="modePersonalBtn" onclick="switchViewMode('personal')" class="px-3 py-1 rounded-full font-bold text-[11px] transition-all bg-white text-pastel-text shadow-sm"><i class="fa-solid fa-user text-[10px] mr-1.5 text-pastel-accent"></i>個人</button>
                    <button id="modeFamilyBtn" onclick="switchViewMode('family')" class="px-3 py-1 rounded-full font-bold text-[11px] text-pastel-muted transition-all"><i class="fa-solid fa-house text-[10px] mr-1.5"></i>家庭</button>
                </div>
            </div>
        </div>
        <button id="titleChip" onclick="openProfileModal()" class="flex-shrink-0 max-w-[92px] text-[10px] font-bold px-2.5 py-1.5 rounded-full bg-white border border-pastel-border text-pastel-muted shadow-sm truncate"></button>
    </header>

    <main id="appMain" class="flex-1 min-h-0 flex-shrink overflow-y-auto px-5 py-4 hide-scrollbar js-hide bg-[#FBF2E6]">
        <div id="dashboardView" class="space-y-4"></div>
        <div id="transactionsView" class="space-y-4 hidden"></div>
        <div id="addView" class="space-y-4 hidden"></div>
        <div id="statsView" class="space-y-4 hidden"></div>
        <div id="settingsView" class="space-y-4 hidden"></div>
    </main>

    <div id="updateBar" class="js-hide absolute left-0 right-0 top-0 z-[99] px-4 pt-2">
        <button onclick="applyUpdate()" class="w-full flex items-center justify-center gap-2 py-3 rounded-tile bg-stone-800 text-white text-xs font-bold shadow-lg tactile">
            <i class="fa-solid fa-arrow-rotate-right"></i> 有新版本可用，點此更新
        </button>
    </div>

    <div id="toast" class="absolute left-0 right-0 bottom-24 z-[95] flex justify-center opacity-0 pointer-events-none transition-opacity duration-300"></div>

    <nav id="appNav" class="mt-auto shrink-0 bg-white border-t border-pastel-border px-6 pt-2.5 flex justify-between items-center z-30 shadow-[0_-10px_40px_rgba(160,130,100,0.06)] js-hide">
        <button onclick="switchTab('dashboard')" id="navDashboard" class="flex flex-col items-center text-pastel-accent w-12 nav-btn"><i class="fa-solid fa-house-chimney text-lg mb-1"></i><span class="text-[10px] font-bold">首頁</span></button>
        <button onclick="switchTab('transactions')" id="navTransactions" class="flex flex-col items-center text-pastel-muted w-12 nav-btn"><i class="fa-solid fa-list-ul text-lg mb-1"></i><span class="text-[10px] font-bold">明細</span></button>
        <button onclick="switchTab('add')" id="navAdd" aria-label="新增" class="relative -mt-10 nav-btn tactile">
            <div id="addBtnInner" class="w-16 h-16 bg-pastel-accent text-white rounded-full flex items-center justify-center shadow-soft border-[6px] border-[#FBF2E6] transition-all duration-300"><i class="fa-solid fa-plus text-3xl"></i></div>
        </button>
        <button onclick="switchTab('stats')" id="navStats" class="flex flex-col items-center text-pastel-muted w-12 nav-btn"><i class="fa-solid fa-chart-pie text-lg mb-1"></i><span class="text-[10px] font-bold">圖表</span></button>

/* 新增頁狀態（自建鍵盤用） */

/* 分類顏色：讓每個分類有自己的識別色，明細與圖表一致 */

    /* ==========================================================

    const FUN_CATS = ['休閒娛樂', '訂閱服務'];

    function monthKeys(n) { const o = []; let ym = currentYM(); for (let i = 0; i < n; i++) { o.push(ym); ym = shiftYM(ym, -1); } return o; }

    function achievementStats() {
        const meId = STATE.me?.member_id;
        const mine = activeTxns().filter(t => t.payer_id === meId);
        const per = {};
        mine.forEach(t => {
            const k = String(t.date).slice(0, 7);
            per[k] = per[k] || { inc: 0, exp: 0, fun: 0 };
            const a = Number(t.amount) || 0;
            if (t.entry_type === '收入') per[k].inc += a;
            if (t.entry_type === '支出') { per[k].exp += a; if (FUN_CATS.includes(t.category)) per[k].fun += a; }
        });
        const ks = monthKeys(24);
        let surplusStreak = 0, funStreak = 0;
        for (const k of ks) { const m = per[k]; if (m && m.inc - m.exp > 0) surplusStreak++; else break; }
        for (const k of ks) { const m = per[k]; if (m && m.inc > 0 && m.fun <= m.inc * 0.1) funStreak++; else break; }
        const cur = per[currentYM()] || { inc: 0, exp: 0 };

            streak: Number(STATE.me?.streak_days) || 0,
            count: mine.length,
            receipts: mine.filter(t => t.receipt_file_id).length,
            advances: mine.filter(t => t.nature === '家庭代墊').length,

            savingRate: cur.inc > 0 ? Math.round((cur.inc - cur.exp) / cur.inc * 100) : 0

    const GROWTH = [

    function growthStage(days) {
        days = Number(days) || 0;

       因此分開實作，不與 achievementList() 混在一起。 */
    function weekStartISO() {
        const d = new Date(todayISO() + 'T00:00:00');
        d.setDate(d.getDate() - ((d.getDay() + 6) % 7));   // 以週一為起點
        return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;

        ];
    }
    function weeklyTasks() {
        const ws = weekStartISO(), mine = myTxns().filter(x => x.date >= ws);
        const days = new Set(mine.map(x => x.date)).size;
        const budget = budgetFor('personal', '');

            if (iso > t) break;
            if (iso < t && !spent.has(iso)) return true;      // 今天還沒過完不算
        }

    async function skipReminder(id) {

    /* ==========================================================
       計算層
       ========================================================== */
    const FAMILY_NATURES = ['家庭公帳', '家庭代墊', '公帳注資'];
    function activeTxns() { return STATE.transactions.filter(t => t.status !== '作廢' && t.status !== '已修訂' && !t.is_rollup); }
    function inMonth(d, ym) { return String(d).slice(0, 7) === ym; }
    function nameOf(id) { const m = STATE.members.find(x => x.member_id === id); return m ? m.nickname : id; }
    function catIcon(name) {
        const c = STATE.categories.find(x => x.item_name === name) || STATE.tags.find(x => x.item_name === name);
        return normIcon(c ? c.icon_emoji : '', c ? c.item_group : '');
    }

    /* ---------- 分攤（split_detail）解析 ----------
       家庭代墊與私人拆帳共用同一結構；舊資料（單一 related_id）視為長度 1 的陣列，
       讀取端只有一套邏輯，不需要資料遷移。 */
    function parseSplit(t) {
        if (t.split_detail) {
            try {
                const a = JSON.parse(t.split_detail);
                if (Array.isArray(a)) return a.filter(x => x && x.member_id && Number(x.amount) > 0)
                    .map(x => ({ member_id: x.member_id, amount: Number(x.amount) }));
            } catch (e) { }
        }
        if (t.nature === '私人拆帳' && t.related_id) return [{ member_id: t.related_id, amount: Number(t.amount) || 0 }];
        return [];
    }
    /** 這筆代墊／拆帳中，某成員已還了多少 */
    function paidFor(srcId, memberId) {
        return activeTxns().filter(t => t.entry_type === '還款' && t.parent_txn_id === srcId &&
            t.settle_member_id === memberId).reduce((a, b) => a + (Number(b.amount) || 0), 0);
    }
    /** 我被指定、還沒還完的所有項目（公帳代墊分攤 ＋ 私人拆帳，統一視圖） */
    function myPendingSettlements() {
        const meId = STATE.me?.member_id;
        const out = [];
        activeTxns().filter(t => (t.nature === '家庭代墊' || t.nature === '私人拆帳') && t.payer_id !== meId)
            .forEach(src => {
                const mine = parseSplit(src).find(x => x.member_id === meId);
                if (!mine) return;
                const remaining = mine.amount - paidFor(src.txn_id, meId);
                if (remaining <= 0.01) return;
                const intent = STATE.intents.find(i => i.parent_txn_id === src.txn_id && i.member_id === meId);
                out.push({
                    itemType: src.nature === '家庭代墊' ? 'pool' : 'private',
                    srcId: src.txn_id, payerId: src.payer_id, payerName: nameOf(src.payer_id),
                    category: src.category, note: src.note, date: src.date,
                    expected: mine.amount, remaining, marked: !!intent
                });
            });
        return out.sort((a, b) => b.date.localeCompare(a.date));
    }
    /** 別人欠我、還沒還完的（付款人視角） */
    function othersOweMe() {
        const meId = STATE.me?.member_id;
        const out = [];
        activeTxns().filter(t => (t.nature === '家庭代墊' || t.nature === '私人拆帳') && t.payer_id === meId)
            .forEach(src => parseSplit(src).forEach(x => {
                const remaining = x.amount - paidFor(src.txn_id, x.member_id);
                if (remaining > 0.01) out.push({
                    srcId: src.txn_id, memberId: x.member_id, memberName: nameOf(x.member_id),
                    category: src.category, note: src.note, date: src.date, expected: x.amount, remaining,
                    itemType: src.nature === '家庭代墊' ? 'pool' : 'private'
                });
            }));
        return out.sort((a, b) => b.date.localeCompare(a.date));
    }

    function computeSummary(mode, ym) {
        ym = ym || currentYM();
        const meId = STATE.me?.member_id, rows = activeTxns();
        const s = { monthlyIncome: 0, monthlyExpense: 0, cashBalance: 0, poolOwesMe: 0, iOweOthers: 0, poolBalance: 0, poolOwesMembers: [], membersOwePool: [], byCategory: [] };

        if (mode === 'personal') {
            const mine = rows.filter(t => t.payer_id === meId);
            mine.forEach(t => {
                const a = Number(t.amount) || 0;
                if (inMonth(t.date, ym)) {
                    if (t.entry_type === '支出') s.monthlyExpense += a;
                    if (t.entry_type === '收入') s.monthlyIncome += a;
                }
                if (t.entry_type === '收入') s.cashBalance += a;
                else if (t.entry_type === '支出' || t.entry_type === '注資') s.cashBalance -= a;
                else if (t.entry_type === '還款') s.cashBalance += (t.related_id === meId ? a : -a);
                if (t.nature === '家庭代墊' && t.entry_type === '支出') {
                    // 有分攤明細時，只有「其他人該還我」的部分算應收；
                    // 自己吸收的那一份不是任何人的債務。這是本次最重要的金額修正。
                    const sp = parseSplit(t);
                    s.poolOwesMe += t.split_detail && sp.length ? sp.reduce((x, y) => x + y.amount, 0) : a;
                }
            });
            s.cashBalance += Number(STATE.me?.initial_balance) || 0;
            // 還款扣減：公帳撥款與成員直接還款都算（舊資料只有前者，行為不變）
            rows.filter(t => t.entry_type === '還款' && t.related_id === meId)
                .forEach(t => s.poolOwesMe -= Number(t.amount) || 0);
            s.iOweOthers = myPendingSettlements().reduce((x, y) => x + y.remaining, 0);
            const cm = {};
            mine.filter(t => t.entry_type === '支出' && inMonth(t.date, ym))
                .forEach(t => { const k = t.category || '未分類'; cm[k] = (cm[k] || 0) + Number(t.amount); });
            s.byCategory = Object.entries(cm).sort((a, b) => b[1] - a[1]);
        } else {
            const fam = rows.filter(t => FAMILY_NATURES.includes(t.nature));
            fam.forEach(t => {
                const a = Number(t.amount) || 0;
                if (inMonth(t.date, ym)) {
                    if (t.entry_type === '支出') s.monthlyExpense += a;
                    if (t.entry_type === '收入' || t.entry_type === '注資') s.monthlyIncome += a;
                }
                if (t.entry_type === '收入' || t.entry_type === '注資') s.poolBalance += a;
                if (t.entry_type === '支出' && t.nature === '家庭公帳') s.poolBalance -= a;
                if (t.entry_type === '還款') s.poolBalance -= a;
            });
            s.poolBalance += Number(STATE.poolInitial) || 0;
            const owe = {};
            // 已指定分攤的代墊是「成員之間」的債務，不是公帳整筆欠款，
            // 因此不列入此區塊（改由待沖銷區處理），維持舊資料行為不變。
            rows.filter(t => t.nature === '家庭代墊' && t.entry_type === '支出' && !t.split_detail)
                .forEach(t => { owe[t.payer_id] = (owe[t.payer_id] || 0) + Number(t.amount); });
            rows.filter(t => t.entry_type === '還款' && t.member_id === 'family_pool' && !t.parent_txn_id)
                .forEach(t => { owe[t.related_id] = (owe[t.related_id] || 0) - Number(t.amount); });
            s.poolOwesMembers = Object.entries(owe).filter(([, v]) => v > 0.01).map(([id, v]) => ({ member: nameOf(id), amount: v }));
            const back = {};
            rows.filter(t => t.nature === '公帳注資' && t.entry_type === '支出').forEach(t => { back[t.payer_id] = (back[t.payer_id] || 0) + Number(t.amount); });
            s.membersOwePool = Object.entries(back).filter(([, v]) => v > 0.01).map(([id, v]) => ({ member: nameOf(id), amount: v }));
            const cm = {};
            fam.filter(t => t.entry_type === '支出' && inMonth(t.date, ym))
                .forEach(t => { const k = t.category || '未分類'; cm[k] = (cm[k] || 0) + Number(t.amount); });
            s.byCategory = Object.entries(cm).sort((a, b) => b[1] - a[1]);
        }
        return s;
    }

    async function bootstrap() {
        document.getElementById('appVersion').innerText = CONFIG.VERSION;
        if (CONFIG.API_URL.includes('PASTE_') && !CONFIG.DEMO) { showGateError('尚未設定 API_URL，請先完成 GAS 部署並填入網址。'); return showGate(); }

    function paintOtp() {
        const el = document.getElementById('gateCode'); if (!el) return;
        const v = el.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
        if (el.value !== v) el.value = v;
        const focused = document.activeElement === el;
        document.getElementById('otpBoxes').innerHTML = Array.from({ length: 8 }, (_, i) => {
            const ch = v[i] || '';
            const active = focused && i === Math.min(v.length, 7) && v.length < 8;
            return `<div class="flex-1 aspect-[3/4] max-w-[38px] rounded-xl border-2 flex items-center justify-center font-bold text-lg font-rounded transition-all
                ${ch ? 'bg-pastel-accentLight border-pastel-accent text-pastel-accent'
                     : active ? 'bg-white border-pastel-accent' : 'bg-pastel-bg border-pastel-border'}">${esc(ch)}</div>`;
        }).join('');
        if (v.length === 8 && !_otpAuto) { _otpAuto = true; setTimeout(gateSubmitCode, 180); }
        if (v.length < 8) _otpAuto = false;
    }
    let _otpAuto = false;
    async function pasteCode() {
        const el = document.getElementById('gateCode');
        try {
            const txt = await navigator.clipboard.readText();
            el.value = String(txt || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
            paintOtp(); buzz();
        } catch (e) { el.focus(); toast('請長按方格選擇「貼上」', true); }
    }
    function clearCode() {
        const el = document.getElementById('gateCode');
        el.value = ''; _otpAuto = false; paintOtp(); el.focus(); buzz();
    }
    function gateSay(text) {
        const el = document.getElementById('gateSpeech');
        if (!el) return;
        el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
        el.innerHTML = esc(text);
    }

    function showGate() {
        paintOtp();
        const el = document.getElementById('gateCode');
        if (el) { el.addEventListener('focus', paintOtp); el.addEventListener('blur', paintOtp); } document.getElementById('gateScreen').classList.remove('js-hide'); document.getElementById('splash').classList.add('js-hide'); }
    function showGateError(m) { const e = document.getElementById('gateError'); e.innerText = m; e.classList.remove('hidden'); }

    async function gateSubmitCode() {

    /* ---------- 記帳完成微互動：金幣飛向大頭貼 ---------- */
    function coinFly() {
        const frame = document.getElementById('appFrame'), av = document.getElementById('userAvatar');
        if (!frame || !av) return;
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        const fr = frame.getBoundingClientRect(), ar = av.getBoundingClientRect();
        const tx = ar.left - fr.left + ar.width / 2 - 13, ty = ar.top - fr.top + ar.height / 2 - 13;
        const sx = fr.width / 2 - 13, sy = fr.height * 0.52;
        for (let i = 0; i < 5; i++) {
            const c = document.createElement('div');
            c.className = 'coin'; c.textContent = '$';
            c.style.left = sx + (Math.random() * 40 - 20) + 'px';
            c.style.top = sy + 'px';
            frame.appendChild(c);
            const dur = 620 + i * 70;
            c.animate([
                { transform: 'translate(0,0) scale(.5)', opacity: 0 },
                { transform: `translate(${(tx - sx) * .35}px, ${-70 - i * 8}px) scale(1)`, opacity: 1, offset: .35 },
                { transform: `translate(${tx - sx}px, ${ty - sy}px) scale(.35)`, opacity: 0 }
            ], { duration: dur, easing: 'cubic-bezier(.35,.6,.3,1)', delay: i * 55 })
                .onfinish = () => c.remove();
        }
        buzz(12);
    }

    /* ---------- 成就解鎖慶祝 ---------- */
    function achKey() { return 'ach_' + AUTH.memberId; }
    function checkNewAchievements() {
        if (!STATE.me) return;
        const list = achievementList(), doneIds = list.filter(a => a.done).map(a => a.id);
        const initKey = 'achInit_' + AUTH.memberId;
        if (!localStorage.getItem(initKey)) {
            localStorage.setItem(initKey, '1');
            localStorage.setItem(achKey(), JSON.stringify(doneIds));
            return;   // 第一次載入不慶祝既有成就
        }
        let seen = [];
        try { seen = JSON.parse(localStorage.getItem(achKey()) || '[]'); } catch (e) { }
        const fresh = doneIds.filter(id => !seen.includes(id));
        if (fresh.length) {
            localStorage.setItem(achKey(), JSON.stringify(doneIds));
            celebrate(list.find(a => a.id === fresh[0]));
        }
    }

    function celebrate(a) {
        if (!a) return;
        const el = document.getElementById('celebrate');
        const cols = ['#F8A048', '#40B868', '#3090F8', '#F8C850', '#F0A8B0', '#88D8F8'];
        const bits = Array.from({ length: 26 }, () => {
            const l = Math.random() * 100, d = Math.random() * .5, c = cols[Math.floor(Math.random() * cols.length)];
            return `<i style="left:${l}%;top:-20px;background:${c};animation-delay:${d}s"></i>`;
        }).join('');
        el.innerHTML = `
            <div class="confetti absolute inset-0 overflow-hidden">${bits}</div>
            <div class="pop bg-white rounded-sheet px-8 py-7 shadow-2xl text-center max-w-[280px] border-4 border-pastel-yellow">
                <img src="./av5.png" alt="" class="w-20 h-20 mx-auto mb-3 float">
                <div class="text-[11px] font-bold text-pastel-accent mb-1">成就解鎖！</div>
                <div class="text-3xl mb-2 ${HUE[a.hue][1]}"><i class="fa-solid ${a.icon} fa-bounce"></i></div>
                <div class="text-lg font-bold text-stone-800">${esc(a.name)}</div>
                <div class="text-xs text-pastel-muted mt-1 leading-relaxed">${esc(a.desc)}</div>
            </div>`;
        el.classList.remove('js-hide');
        buzz([12, 60, 12, 60, 24]);
        setTimeout(() => { el.classList.add('js-hide'); el.innerHTML = ''; }, 3200);
    }

    async function refreshData() {
        try {
            const d = await api.call('bootstrap');
            Object.assign(STATE, { transactions: d.transactions, rules: d.rules || [], budgets: d.budgets || [], intents: d.intents || [], categories: d.categories, tags: d.tags, members: d.members });
            STATE.me = STATE.members.find(m => m.member_id === AUTH.memberId) || STATE.me;

    function applyTheme() {
        const t = getTheme();
        const dark = t === 'dark' || (t === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        const m = document.querySelector('meta[name="theme-color"]');

        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.add('opacity-0', 'pointer-events-none'), action ? 5200 : 2600);

    function pieHtml(byCategory, total) {
        if (!total) return `<div class="flex flex-col items-center py-6 gap-2"><img src="./av46.png" alt="" class="w-14 h-14 opacity-70"><span class="text-xs text-pastel-muted">本月尚無支出紀錄</span></div>`;
        const top = byCategory.slice(0, 4), rest = byCategory.slice(4).reduce((a, b) => a + b[1], 0);
        const items = rest > 0 ? [...top, ['其他', rest]] : top;
        let off = 0;
        /* 修正：色弧必須用「完整圓」的 path，並宣告 pathLength=100，
           dasharray 的百分比才會對。舊版只畫半圓，弧長 50，比例全被放大兩倍。 */
        const FULL = 'M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831';
        const arcs = items.map((it, i) => {
            const p = (it[1] / total) * 100;
            const col = it[0] === '其他' ? '#9A918A' : catColor(it[0]);
            const a = `<path pathLength="100" stroke-dasharray="${p.toFixed(2)} ${(100 - p).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" stroke-width="5" stroke-linecap="butt" stroke="${col}" fill="none" d="${FULL}" />`;
            off += p; return a;
        }).join('');
        return `<div class="flex items-center gap-5">
            <div class="relative w-24 h-24 flex-shrink-0 flex items-center justify-center">
                <svg class="w-full h-full transform -rotate-90" viewBox="-1.6 -1.6 39.2 39.2">
                    <path pathLength="100" stroke-width="5" stroke="#F3E7D8" fill="none" d="${FULL}" />${arcs}
                </svg>
                <div class="absolute text-center">
                    <div class="text-[10px] text-pastel-muted leading-tight">總計</div>
                    <div class="text-sm font-bold text-stone-800 font-rounded leading-tight">${fmt(total)}</div>

            <div class="flex-1 space-y-2.5 text-xs min-w-0">${items.map((it, i) => `

                    <span class="font-bold text-stone-800 font-rounded flex-shrink-0">${fmt(it[1])}</span>
                </div>`).join('')}</div>
        </div>`;
    }

    /* 數字滾動：小成本、感受明顯 */
    function animateCounts(root) {
        root.querySelectorAll('[data-count]').forEach(el => {
            const to = Number(el.dataset.count) || 0, pre = el.dataset.pre || '', dur = 620, t0 = performance.now();
            const step = t => {
                const p = Math.min((t - t0) / dur, 1), e = 1 - Math.pow(1 - p, 3);
                el.textContent = pre + Math.round(to * e).toLocaleString('en-US');
                if (p < 1) requestAnimationFrame(step);
            };
            requestAnimationFrame(step);
        });
    }

    /* ---------- 預算 ---------- */
    function budgetKey(scope, category) {
        return [scope === 'family' ? 'family' : STATE.me?.member_id, scope, 'DEFAULT', category || ''].join('|');
    }
    function budgetFor(scope, category) {
        const b = STATE.budgets.find(x => x.budget_id === budgetKey(scope, category));
        return b ? Number(b.amount) || 0 : 0;
    }
    /* 角色情緒狀態機。動畫只給「真的需要注意」的狀態，
       全部都在動的話，動這件事本身就失去強調的意義。
       FA 的動畫會自動遵守系統的「減少動態效果」設定，不必額外防護。 */
    function getMascotState(pct, hasData) {
        if (!hasData) return { mood: 'FREEZE', av: 'av14', word: '這個月還沒開張，記一筆吧', color: '#88D8F8', badge: { icon: 'fa-moon', anim: 'fa-fade' } };
        if (pct > 100) return { mood: 'DANGER', av: 'av4', word: '已超出預算，先煞車一下', color: '#F05838', badge: { icon: 'fa-triangle-exclamation', anim: 'fa-beat-fade' } };
        if (pct > 80) return { mood: 'WARNING', av: 'av48', word: '快到上限了，留意一下', color: '#F8C850', badge: { icon: 'fa-triangle-exclamation', anim: 'fa-shake' } };
        if (pct > 50) return { mood: 'GOOD', av: 'av21', word: '節奏還可以，繼續保持', color: '#3090F8', badge: null };
        return { mood: 'GREAT', av: 'av5', word: '目前非常有餘裕！', color: '#40B868', badge: { icon: 'fa-star', anim: 'fa-beat' } };
    }
    function mascotBadge(state) {
        if (!state.badge) return '';
        return `<span class="absolute -top-1 -right-1 w-7 h-7 rounded-full bg-white shadow-md flex items-center justify-center">
            <i class="fa-solid ${state.badge.icon} ${state.badge.anim} text-xs" style="color:${state.color}"></i></span>`;
    }

    function budgetHero(s) {
        const total = budgetFor(currentMode, '');
        if (!total) {
            return `<button onclick="openBudgetSheet()" class="w-full text-left bg-white border border-dashed border-pastel-accent/50 rounded-card p-5 shadow-card flex items-center gap-4">
                <img src="./av48.png" alt="" class="w-12 h-12 flex-shrink-0">
                <div class="min-w-0"><div class="font-bold text-sm text-stone-800">設定${currentMode === 'family' ? '公帳' : '每月'}預算</div>
                <div class="text-xs text-pastel-muted mt-0.5">知道「還能花多少」，比知道「花了多少」更有用</div></div>
                <i class="fa-solid fa-chevron-right text-pastel-accent ml-auto"></i></button>`;
        }
        const used = s.monthlyExpense, left = total - used;
        const pct = Math.min(used / total * 100, 100), over = used > total;
        const n = daysInYM(currentYM()), day = Number(todayISO().slice(8, 10));
        const remainDays = Math.max(n - day + 1, 1);
        const daily = Math.max(left, 0) / remainDays;
        const mood = getMascotState(used / total * 100, s.monthlyExpense > 0 || s.monthlyIncome > 0);
        return `
        <div onclick="openBudgetSheet()" class="rounded-card p-5 shadow-md text-white relative overflow-hidden"
             style="background:linear-gradient(135deg, ${over ? '#F05838' : '#F8A048'} 0%, ${over ? '#D8452A' : '#F0863A'} 100%)">
            <div class="absolute right-1 bottom-1 w-24 h-24 pointer-events-none">
                <img src="./${mood.av}.png" alt="" class="w-full h-full opacity-90">

            <div class="relative">
                <div class="text-[11px] font-bold opacity-80 mb-1">${currentMode === 'family' ? '公帳本月可用' : '本月還能花'}</div>
                <div class="text-4xl font-bold font-rounded tracking-tight mb-1">
                    <span class="num-sym text-2xl">$</span><span data-count="${Math.abs(left)}" data-pre="${over ? '-' : ''}">0</span></div>
                <div class="text-[11px] opacity-90 mb-3">預算 ${fmt(total)} · 已用 ${fmt(used)}</div>
                <div class="w-full bg-white/25 rounded-full h-2.5 overflow-hidden mb-2 max-w-[62%]">
                    <div class="bg-white h-2.5 rounded-full transition-all duration-700" style="width:${pct}%"></div></div>
                <div class="flex items-center gap-2 text-[11px] font-bold">
                    <span class="bg-white/25 px-2 py-1 rounded-md">每日可用 ${fmt(daily)}</span>

    async function saveBudgets(scope) {
        const total = Number(document.getElementById('bTotal').value) || 0;
        const items = [{ category: '', amount: total }];
        document.querySelectorAll('.bud-inp').forEach(i => items.push({ category: i.dataset.cat, amount: Number(i.value) || 0 }));
        closeSheet();
        // 先更新本地讓畫面即時反應，再依序同步
        items.forEach(it => {
            const key = budgetKey(scope, it.category);
            const i = STATE.budgets.findIndex(b => b.budget_id === key);
            if (it.amount > 0) {
                const row = { budget_id: key, scope, ym: 'DEFAULT', category: it.category, amount: it.amount };
                if (i >= 0) STATE.budgets[i] = row; else STATE.budgets.push(row);
            } else if (i >= 0) STATE.budgets.splice(i, 1);
        });
        renderDashboard(); toast('預算已更新');
        try {
            for (const it of items) await api.call('saveBudget', { budget: { scope, ym: 'DEFAULT', category: it.category, amount: it.amount } });
        } catch (e) { toast('部分預算同步失敗：' + e.message, true); }
    }

    /* ---------- 統一待清償中心 ---------- */

                            ${type === 'pool' ? `<button onclick="${x.marked ? `unmarkPool('${esc(x.srcId)}')` : `markPool('${esc(x.srcId)}')`}" class="py-2 rounded-lg text-xs font-bold tactile ${x.marked ? 'bg-pastel-blueLight text-pastel-blue border border-pastel-blue/30' : 'bg-white border border-pastel-border text-stone-600'}"><i class="fa-solid fa-building-columns mr-1"></i>${x.marked ? '取消公帳月結' : '記為公帳扣抵'}</button>` : ''}

    /* 快速歸還：金額預帶剩餘、備註自動生成，parent_txn_id 與 settle_member_id 自動寫入 */

    function buildRepayTxn(x, amount, date, note, tag) {
        return {
            date: date || todayISO(), entry_type: '還款', category: '', tag: tag || '結算',
            amount, note: note || `${x.payerName}代墊：${x.category || x.note || ''}`,
            nature: x.itemType === 'pool' ? '家庭代墊' : '私人拆帳',
            member_id: STATE.me.member_id, payer_id: STATE.me.member_id,
            related_id: x.payerId, parent_txn_id: x.srcId, settle_member_id: STATE.me.member_id
        };
    }

    async function doRepay(srcId) {
        const x = myPendingSettlements().find(i => i.srcId === srcId); if (!x) return;
        const amt = Number(document.getElementById('rpAmt').value);
        if (!amt || amt <= 0) { buzz(30); return toast('請輸入金額', true); }
        if (amt > x.remaining + 0.01) { buzz(30); return toast(`不能超過應付的 ${fmt(x.remaining)}`, true); }
        const txn = buildRepayTxn(x, amt, document.getElementById('rpDate').value,
            document.getElementById('rpNote').value, document.getElementById('rpTag').value);
        closeSheet();
        if (x.marked) { try { await api.call('deleteIntent', { intent_id: `${x.srcId}|${STATE.me.member_id}` }); STATE.intents = STATE.intents.filter(i => i.parent_txn_id !== x.srcId || i.member_id !== STATE.me.member_id); } catch (e) { } }
        await optimisticAdd(txn, null, '已歸還');
    }

    async function repayAllPrivate() {
        const list = myPendingSettlements().filter(x => x.itemType === 'private');
        if (!list.length) return;
        const total = list.reduce((a, b) => a + b.remaining, 0);
        const detail = list.map(x => `・${x.payerName}：${fmt(x.remaining)}`).join('\n');
        if (!confirm(`將產生 ${list.length} 筆還款交易，合計 ${fmt(total)}：\n\n${detail}\n\n確定嗎？`)) return;
        let okN = 0, failN = 0;
        for (const x of list) {
            try { await api.call('addTransaction', { txn: buildRepayTxn(x, x.remaining) }); okN++; }
            catch (e) { failN++; }
        }
        await refreshData();
        toast(failN ? `成功 ${okN} 筆、失敗 ${failN} 筆` : `已歸還 ${okN} 筆`, !!failN);
    }

    async function markPool(srcId) {
        const x = myPendingSettlements().find(i => i.srcId === srcId); if (!x) return;
        STATE.intents.push({ intent_id: `${srcId}|${STATE.me.member_id}`, parent_txn_id: srcId, member_id: STATE.me.member_id, payer_id: x.payerId, amount: x.remaining, status: '待沖銷' });
        renderDashboard(); toast('已標記為公帳月結');
        try { await api.call('saveIntent', { parent_txn_id: srcId, payer_id: x.payerId, amount: x.remaining }); }
        catch (e) { STATE.intents = STATE.intents.filter(i => i.parent_txn_id !== srcId || i.member_id !== STATE.me.member_id); renderDashboard(); toast(e.message, true); }
    }
    async function unmarkPool(srcId) {
        const bak = [...STATE.intents];
        STATE.intents = STATE.intents.filter(i => i.parent_txn_id !== srcId || i.member_id !== STATE.me.member_id);
        renderDashboard(); toast('已取消');
        try { await api.call('deleteIntent', { intent_id: `${srcId}|${STATE.me.member_id}` }); }
        catch (e) { STATE.intents = bak; renderDashboard(); toast(e.message, true); }
    }

    /* 家庭模式：公帳待沖銷（路徑 B 的核銷區） */
    function intentCard() {
        if (!STATE.intents.length) return '';
        return `<div class="bg-white border border-pastel-border/60 rounded-card p-5 shadow-card space-y-3">
            <div class="text-sm font-bold text-stone-800"><i class="fa-solid fa-building-columns text-pastel-blue mr-1.5"></i>待公帳撥款沖銷</div>
            <p class="text-[11px] text-pastel-muted">成員已標記「由公帳月結」的分攤，確認撥款後才會寫入實際交易。</p>
            ${STATE.intents.map(i => {
                const src = STATE.transactions.find(t => t.txn_id === i.parent_txn_id);
                return `<div class="bg-pastel-bg rounded-tile p-3 border border-pastel-border flex justify-between items-center gap-2">
                    <div class="min-w-0">
                        <div class="font-bold text-sm text-stone-800 truncate">${esc(nameOf(i.member_id))} → ${esc(nameOf(i.payer_id))}</div>

    async function settleIntent(id) {
        const it = STATE.intents.find(i => i.intent_id === id); if (!it) return;
        if (!confirm(`確認由公帳撥款 ${fmt(it.amount)} 給 ${nameOf(it.payer_id)}？`)) return;
        try {
            const res = await api.call('settleIntent', { intent_id: id });
            STATE.transactions.push(res.txn);
            if (res.remaining > 0.01) it.amount = res.remaining;
            else STATE.intents = STATE.intents.filter(i => i.intent_id !== id);
            renderDataViews(); toast('已撥款結清');
        } catch (e) { toast(e.message, true); }
    }

    function settleRow(r, dir) {
        const isPay = dir === 'pool2member';
        return `<div class="bg-pastel-bg p-4 rounded-tile flex justify-between items-center">
            <div class="font-bold text-stone-800 text-sm truncate">${esc(r.member)}</div>

                <button onclick="settleUp('${esc(r.member)}',${r.amount},'${dir}')" class="px-3 py-1.5 ${isPay ? 'bg-pastel-accent text-white' : 'bg-white border border-pastel-border text-stone-600'} rounded-lg text-[10px] font-bold shadow-sm">${isPay ? '撥款還款' : '標記已繳回'}</button>
            </div></div>`;

    async function settleUp(memberName, amount, dir) {
        if (!confirm(`確定要記錄一筆 ${fmt(amount)} 的結算給「${memberName}」嗎？`)) return;
        const m = STATE.members.find(x => x.nickname === memberName), isPay = dir === 'pool2member';
        await optimisticAdd({
            date: todayISO(), entry_type: '還款', category: '', tag: '結算', amount,
            note: `結算：${memberName}`, nature: '家庭公帳',
            member_id: isPay ? 'family_pool' : m?.member_id,
            payer_id: isPay ? 'family_pool' : m?.member_id,
            related_id: isPay ? m?.member_id : 'family_pool'
        }, null, '結算已記錄');

    /* ==========================================================
       樂觀寫入
       ========================================================== */
    async function optimisticAdd(txn, receipt, okMsg) {
        const local = {
            txn_id: uid(), created_at: localStamp(), is_rollup: false, _new: true,
            status: '有效', parent_txn_id: '', recurring_rule_id: '', receipt_file_id: '',
            member_id: STATE.me.member_id, payer_id: STATE.me.member_id, related_id: '',
            _pending: true, ...txn
        };
        STATE.transactions.push(local);
        renderDataViews();
        toast(okMsg || '已記錄');
        try {
            const r = await api.call('addTransaction', { txn, receipt });
            const i = STATE.transactions.findIndex(t => t.txn_id === local.txn_id);
            if (i >= 0) STATE.transactions[i] = { ...r.txn, _new: true };
            renderDataViews();
            coinFly();                       // 寫入成功之後才播動畫，不會出現「慶祝了但其實失敗」
            setTimeout(() => {
                const x = STATE.transactions.find(t => t._new);
                if (x) { delete x._new; renderTransactions(); }
            }, 3600);
        } catch (e) {
            STATE.transactions = STATE.transactions.filter(t => t.txn_id !== local.txn_id);
            renderDataViews(); toast('儲存失敗：' + e.message, true);
        }
    }

    /* ==========================================================
       明細
       ========================================================== */
    /* 空狀態讓角色出場，而不是一行冷冰冰的灰字 */
    function emptyState(av, title, sub, action) {
        return `<div class="flex flex-col items-center justify-center py-12 px-6 text-center">
            <img src="./${av}.png" alt="" class="w-24 h-24 mb-4 float">
            <div class="font-bold text-stone-700 text-sm mb-1">${esc(title)}</div>
            <div class="text-xs text-pastel-muted leading-relaxed max-w-[240px]">${esc(sub)}</div>
            ${action ? `<button onclick="${action.fn}" class="mt-4 px-5 py-2.5 bg-pastel-accent text-white font-bold rounded-full text-xs shadow-soft">${esc(action.label)}</button>` : ''}
        </div>`;
    }

    function shiftYM(ym, n) {
        let y = Number(ym.slice(0, 4)), m = Number(ym.slice(5, 7)) + n;
        y += Math.floor((m - 1) / 12); m = ((m - 1) % 12 + 12) % 12 + 1;
        return `${y}-${pad2(m)}`;
    }
    function relativeDateLabel(iso) {
        const d = new Date(iso + 'T00:00:00'), now = new Date(todayISO() + 'T00:00:00');
        const diff = Math.round((now - d) / 86400000), md = `${d.getMonth() + 1}/${d.getDate()}`;
        if (diff === 0) return `今天 (${md})`;
        if (diff === 1) return `昨天 (${md})`;
        return `${md}（${['日', '一', '二', '三', '四', '五', '六'][d.getDay()]}）`;
    }
    function scopedTxns(ym) {
        const meId = STATE.me?.member_id;
        const rows = activeTxns().filter(t => !ym || inMonth(t.date, ym));
        return currentMode === 'personal' ? rows.filter(t => t.payer_id === meId) : rows.filter(t => FAMILY_NATURES.includes(t.nature));
    }
    function filteredTxns() {
        // 全期間模式：跨月搜尋，找「去年那台除濕機多少錢」不必先猜月份
        let rows = filters.allTime ? scopedTxns(null) : scopedTxns(viewYM);
        if (filters.type === 'expense') rows = rows.filter(t => t.entry_type === '支出');
        if (filters.type === 'income') rows = rows.filter(t => t.entry_type === '收入');
        if (filters.natures.length) rows = rows.filter(t => filters.natures.includes(t.nature));
        if (filters.cats.length) rows = rows.filter(t => filters.cats.includes(t.category));
        if (filters.tags.length) rows = rows.filter(t => filters.tags.includes(t.tag));
        if (filters.min !== '') rows = rows.filter(t => Number(t.amount) >= Number(filters.min));
        if (filters.max !== '') rows = rows.filter(t => Number(t.amount) <= Number(filters.max));
        if (filters.q) { const q = filters.q.toLowerCase(); rows = rows.filter(t => `${t.note}${t.category}${t.tag}`.toLowerCase().includes(q)); }
        return rows.sort((a, b) => (b.date + b.created_at).localeCompare(a.date + a.created_at));
    }
    function activeFilterCount() {
        return (filters.type !== 'all' ? 1 : 0) + filters.natures.length + filters.cats.length +
            filters.tags.length + (filters.min !== '' ? 1 : 0) + (filters.max !== '' ? 1 : 0);
    }

    /* ---------- 合併分析圖 ----------
       上半：收支累計 + 預算應有進度（判斷「是否超前花費」）
       下半：每日支出柱（判斷「哪幾天爆掉」）
       兩者共用同一條時間軸，且只畫到今天為止——未來還沒發生的日子不該有線。 */
    function comboChartHtml(ym) {
        const rows = scopedTxns(ym), n = daysInYM(ym);
        const isCur = ym === currentYM();
        const last = isCur ? Number(todayISO().slice(8, 10)) : n;   // 只畫到今天
        const inc = Array(n).fill(0), exp = Array(n).fill(0);
        rows.forEach(t => {
            const d = Number(String(t.date).slice(8, 10)) - 1;
            if (d < 0 || d >= n) return;
            if (t.entry_type === '收入' || t.entry_type === '注資') inc[d] += Number(t.amount);
            if (t.entry_type === '支出') exp[d] += Number(t.amount);
        });
        let ci = 0, ce = 0;
        const cumI = inc.map(v => (ci += v)).slice(0, last);
        const cumE = exp.map(v => (ce += v)).slice(0, last);
        const dayExp = exp.slice(0, last);
        const totalI = cumI.length ? cumI[cumI.length - 1] : 0;
        const totalE = cumE.length ? cumE[cumE.length - 1] : 0;
        if (!totalI && !totalE) return `<div class="flex flex-col items-center py-8 gap-2"><img src="./av14.png" alt="" class="w-14 h-14 opacity-70"><span class="text-xs text-pastel-muted">這個月還沒有資料</span></div>`;

        const budget = budgetFor(currentMode, '');
        const W = 320, H = 176, L = 8, R = 8, pw = W - L - R;
        const T1 = 10, B1 = 104, T2 = 116, B2 = 152;          // 上下兩個繪圖帶
        const maxLine = Math.max(totalI, totalE, budget, 1);
        const maxBar = Math.max(...dayExp, 1);
        const x = i => L + (n === 1 ? pw / 2 : (i / (n - 1)) * pw);
        const yL = v => B1 - (v / maxLine) * (B1 - T1);
        const pts = a => a.map((v, i) => `${x(i).toFixed(1)},${yL(v).toFixed(1)}`).join(' ');
        const bw = Math.max(pw / n - 1, 1.2);
        const bars = dayExp.map((v, i) => v > 0
            ? `<rect x="${(x(i) - bw / 2).toFixed(1)}" y="${(B2 - (v / maxBar) * (B2 - T2)).toFixed(1)}" width="${bw.toFixed(1)}" height="${((v / maxBar) * (B2 - T2)).toFixed(1)}" rx="${Math.min(bw / 2, 1.5).toFixed(1)}" fill="#F8A048"/>` : '').join('');
        // 預算應有進度：整月均speed的斜直線，用來對照實際累計快或慢
        const pace = budget ? `<line x1="${x(0)}" y1="${yL(budget / n)}" x2="${x(n - 1)}" y2="${yL(budget)}" stroke="#9A918A" stroke-width="1.5" stroke-dasharray="4 4"/>` : '';
        const ideal = budget ? budget / n * last : 0;
        const diff = ideal ? totalE - ideal : 0;

        return `
        <svg viewBox="0 0 ${W} ${H}" class="w-full" style="height:176px" preserveAspectRatio="none">
            <line x1="${L}" y1="${B1}" x2="${W - R}" y2="${B1}" stroke="#F3E7D8" stroke-width="1"/>
            <line x1="${L}" y1="${(T1 + B1) / 2}" x2="${W - R}" y2="${(T1 + B1) / 2}" stroke="#F3E7D8" stroke-width="1" stroke-dasharray="3 4"/>
            ${pace}
            <polyline points="${pts(cumI)}" fill="none" stroke="#40B868" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
            <polyline points="${pts(cumE)}" fill="none" stroke="#F05838" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
            <line x1="${L}" y1="${B2}" x2="${W - R}" y2="${B2}" stroke="#F3E7D8" stroke-width="1"/>
            ${bars}
        </svg>
        <div class="flex justify-between text-[10px] text-pastel-muted px-1 mt-1"><span>1日</span><span>${Math.ceil(n / 2)}日</span><span>${n}日${isCur ? `（今天 ${last} 日）` : ''}</span></div>
        <div class="grid grid-cols-2 gap-x-3 gap-y-1.5 mt-3 pt-3 border-t border-pastel-border text-[11px]">
            <span class="flex items-center gap-1.5"><span class="w-3 h-0.5 rounded bg-pastel-green"></span>收入累計 <b class="font-rounded">${fmt(totalI)}</b></span>
            <span class="flex items-center gap-1.5"><span class="w-3 h-0.5 rounded bg-pastel-red"></span>支出累計 <b class="font-rounded">${fmt(totalE)}</b></span>
            <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-sm bg-pastel-accent"></span>每日支出（下半）</span>
            ${budget ? `<span class="flex items-center gap-1.5"><span class="w-3 h-0.5 rounded" style="background:repeating-linear-gradient(90deg,#9A918A 0 3px,transparent 3px 6px)"></span>預算應有進度</span>` : '<span></span>'}
        </div>
        ${budget ? `<div class="mt-2.5 px-3 py-2 rounded-tile text-[11px] font-bold ${diff > 0 ? 'bg-pastel-redLight text-pastel-red' : 'bg-pastel-greenLight text-pastel-green'}">
            <i class="fa-solid ${diff > 0 ? 'fa-gauge-high' : 'fa-gauge-simple'} mr-1.5"></i>
            到第 ${last} 天應花 ${fmt(ideal)}，實際花了 ${fmt(totalE)}
            ${diff > 0 ? `，<u>超前 ${fmt(diff)}</u>，剩下 ${n - last} 天要收斂` : `，<u>省下 ${fmt(-diff)}</u>，保持這個節奏`}

    /* --- 滑動：方向鎖定 + 阻尼 + 滿版底色 --- */
    function bindSwipe() {
        document.querySelectorAll('.swipe-wrap').forEach(wrap => {
            if (wrap._bound) return; wrap._bound = true;
            const inner = wrap.querySelector('.swipe-inner');
            const bg = wrap.querySelector('.swipe-bg');
            const eEdit = wrap.querySelector('.sw-edit'), eVoid = wrap.querySelector('.sw-void');
            const id = wrap.dataset.id;
            const T = 78, MAX = 132;
            let x0 = 0, y0 = 0, dx = 0, lock = null, active = false, moved = false;

            const paint = () => {
                const a = Math.min(Math.abs(dx) / T, 1);
                bg.style.opacity = a;
                bg.style.backgroundColor = dx >= 0 ? '#3090F8' : '#F05838';
                eEdit.style.opacity = dx >= 0 ? 1 : 0;
                eVoid.style.opacity = dx < 0 ? 1 : 0;
            };
            const reset = () => { dx = 0; inner.style.transform = 'translateX(0)'; bg.style.opacity = 0; };

            const start = (x, y) => { x0 = x; y0 = y; dx = 0; lock = null; active = true; moved = false; inner.classList.add('dragging'); };
            const move = (x, y, e) => {
                if (!active) return;
                const ddx = x - x0, ddy = y - y0;
                if (lock === null) {
                    if (Math.abs(ddx) < 8 && Math.abs(ddy) < 8) return;
                    lock = Math.abs(ddx) > Math.abs(ddy) * 1.2 ? 'h' : 'v';
                    if (lock === 'v') { active = false; return; }   // 判定為捲動就完全放手
                }
                if (lock !== 'h') return;
                if (e && e.cancelable) e.preventDefault();
                moved = true;
                // 超過門檻後加阻尼，手感更穩、不會一路滑到底
                const raw = ddx, over = Math.max(Math.abs(raw) - T, 0);
                const mag = Math.min(T + over * 0.35, MAX);
                dx = raw >= 0 ? mag : -mag;
                inner.style.transform = `translate3d(${dx}px,0,0)`;
                paint();
            };
            const end = () => {
                if (!active) { inner.classList.remove('dragging'); return; }
                active = false; inner.classList.remove('dragging');
                if (dx <= -T) { inner.style.transform = 'translateX(-110%)'; bg.style.opacity = 1; setTimeout(() => voidTxn(id), 190); }
                else if (dx >= T) { reset(); editTxn(id); }
                else reset();
            };

            wrap.addEventListener('touchstart', e => start(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
            wrap.addEventListener('touchmove', e => move(e.touches[0].clientX, e.touches[0].clientY, e), { passive: false });
            wrap.addEventListener('touchend', end);
            wrap.addEventListener('touchcancel', () => { active = false; reset(); });
            wrap.addEventListener('mousedown', e => {
                start(e.clientX, e.clientY);
                const mm = ev => move(ev.clientX, ev.clientY, ev);
                const mu = () => { end(); document.removeEventListener('mousemove', mm); document.removeEventListener('mouseup', mu); };
                document.addEventListener('mousemove', mm); document.addEventListener('mouseup', mu);
            });
            inner.addEventListener('click', () => { if (!moved) openTxnSheet(id); });
        });
    }
