    /* --- 滑動：漸進阻力 + 可反悔 + 兩段式 ---
       輕滑放手 → 停在「展開」狀態並露出按鈕，可再滑回去或點別處取消
       重滑到底 → 直接執行
       全程有阻尼，越滑越重，跨過門檻時給一次觸覺提示 --- */
    function closeAllSwipes(except) {
        document.querySelectorAll('.swipe-wrap').forEach(w => {
            if (w !== except && w._close) w._close();
        });
    }
    function bindSwipe() {
        document.querySelectorAll('.swipe-wrap').forEach(wrap => {
            if (wrap._bound) return; wrap._bound = true;
            const inner = wrap.querySelector('.swipe-inner');
            const bg = wrap.querySelector('.swipe-bg');
            const eEdit = wrap.querySelector('.sw-edit'), eVoid = wrap.querySelector('.sw-void');
            const eCopy = wrap.querySelector('.sw-copy');
            const id = wrap.dataset.id;
            /* 右滑露出兩顆按鈕（編輯／再記一次），所以展開距離要比左滑寬。
               FIRE / FIRE_R 是「手指實際滑動距離」的門檻，不是位移量。
               左滑（作廢）刻意設得比右滑遠 —— 破壞性的動作應該難一點。 */
            const OPEN = 92, OPEN_R = 148, FIRE = 280, FIRE_R = 240;
            let x0 = 0, y0 = 0, dx = 0, rawMag = 0, lock = null, active = false, moved = false, armed = false;
            let rest = 0;                        // 目前停靠位置（0 或 ±OPEN）

            const paint = () => {
                const mag = Math.abs(dx);
                bg.style.opacity = Math.min(mag / (dx >= 0 ? OPEN_R : OPEN), 1);
                bg.style.backgroundColor = dx >= 0 ? '#3090F8' : '#F05838';
                eEdit.style.opacity = eCopy.style.opacity = dx > 0 ? 1 : 0;
                eVoid.style.opacity = dx < 0 ? 1 : 0;
                // 放大＝「放開就會直接執行」的預告，跟震動的觸發條件一致
                eEdit.style.transform = `scale(${dx > 0 && armed ? 1.2 : 1})`;
                eVoid.style.transform = `scale(${dx < 0 && armed ? 1.25 : 1})`;
            };
            const settle = (to) => {
                rest = to; dx = to;
                inner.style.transform = `translate3d(${to}px,0,0)`;
                if (!to) bg.style.opacity = 0; else paint();
            };
            wrap._close = () => { if (rest) settle(0); };

            const start = (x, y) => {
                x0 = x - rest; y0 = y; lock = null; active = true; moved = false; armed = false;
                inner.classList.add('dragging');
            };
            const move = (x, y, e) => {
                if (!active) return;
                const ddx = x - x0, ddy = y - y0;
                if (lock === null) {
                    // 啟動距離 12px、水平必須是垂直的 1.8 倍才算橫滑。
                    // 原本 8px / 1.2 倍太鬆，上下捲動時手指自然的斜向軌跡就會誤觸。
                    if (Math.abs(ddx - rest) < 12 && Math.abs(ddy) < 12) return;
                    lock = Math.abs(ddx - rest) > Math.abs(ddy) * 1.8 ? 'h' : 'v';
                    if (lock === 'v') { active = false; return; }
                    closeAllSwipes(wrap);
                }
                if (lock !== 'h') return;
                if (e && e.cancelable) e.preventDefault();
                moved = true;
                /* 漸進阻力：展開距離之內 1:1，之後阻尼 0.45，越滑越重。
                   關鍵是「觸發門檻要用手指真的滑了多遠」來判斷，不能用阻尼後的位移 ——
                   阻尼是 0.45，用位移判斷等於要求手指滑兩倍多的距離。
                   先前右滑要 232 的位移，換算回手指是 403px，比手機還寬，永遠滑不到。 */
                const raw = ddx, sign = raw >= 0 ? 1 : -1;
                rawMag = Math.abs(raw);
                const open = sign > 0 ? OPEN_R : OPEN, fire = sign > 0 ? FIRE_R : FIRE;
                const damped = rawMag <= open ? rawMag : open + (rawMag - open) * 0.45;
                dx = sign * Math.min(damped, open + 30);
                if (!armed && rawMag >= fire) { armed = true; buzz(14); }
                if (armed && rawMag < fire) armed = false;
                inner.style.transform = `translate3d(${dx}px,0,0)`;
                paint();
            };
            const end = () => {
                if (!active) { inner.classList.remove('dragging'); return; }
                active = false; inner.classList.remove('dragging');
                const mag = Math.abs(dx);
                const fire = dx > 0 ? FIRE_R : FIRE, open = dx > 0 ? OPEN_R : OPEN;
                if (rawMag >= fire) {                    // 重滑到底：直接執行
                    if (dx < 0) { inner.style.transform = 'translateX(-110%)'; bg.style.opacity = 1; setTimeout(() => voidTxn(id), 190); }
                    else { settle(0); editTxn(id); }
                } else if (mag >= open * 0.55) {         // 輕滑：停在展開狀態，可反悔
                    settle(dx < 0 ? -OPEN : OPEN_R); buzz(6);
                } else settle(0);                        // 滑回來：取消
            };

            wrap.addEventListener('touchstart', e => start(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
            wrap.addEventListener('touchmove', e => move(e.touches[0].clientX, e.touches[0].clientY, e), { passive: false });
            wrap.addEventListener('touchend', end);
            wrap.addEventListener('touchcancel', () => { active = false; settle(rest); });
            wrap.addEventListener('mousedown', e => {
                start(e.clientX, e.clientY);
                const mm = ev => move(ev.clientX, ev.clientY, ev);
                const mu = () => { end(); document.removeEventListener('mousemove', mm); document.removeEventListener('mouseup', mu); };
                document.addEventListener('mousemove', mm); document.addEventListener('mouseup', mu);
            });
            // 展開狀態下點露出的按鈕就執行；沒展開時點列開詳情
            bg.addEventListener('click', ev => {
                if (!rest) return;
                ev.stopPropagation();
                // 右滑展開有兩顆按鈕，看點到哪一顆；左滑展開只有作廢
                const copy = rest > 0 && ev.target.closest('.sw-copy');
                const act = rest < 0 ? voidTxn : (copy ? copyTxn : editTxn);
                settle(0);
                setTimeout(() => act(id), 140);
            });
            inner.addEventListener('click', () => {
                if (moved) return;
                if (rest) { settle(0); return; }          // 展開時點一下＝收回，不誤開詳情
                openTxnSheet(id);
            });
        });
    }

    function clearAllFilters() { filters = { type: 'all', natures: [], cats: [], tags: [], members: [], min: '', max: '', q: '', allTime: false }; renderTransactions(); }

    /* 使用者自訂的分類／標籤名稱可能含有單引號（例如「媽媽's 卡」），

    function toggleFilterAt(key, idx) {

        // 同類清單項目改用留白引導視覺，不再逐列畫線
        const row = (k, v) => `<div class="flex justify-between py-3 text-sm"><span class="text-pastel-muted">${esc(k)}</span><span class="font-bold text-stone-800 text-right ml-3 truncate">${esc(v)}</span></div>`;
        openSheet(`
            <h3 class="selectable text-lg font-bold text-stone-800 mb-4">${esc(t.note || t.category || '交易明細')}</h3>
            <div class="text-3xl font-bold font-rounded mb-4 ${t.entry_type === '支出' ? 'text-pastel-red' : 'text-pastel-green'}">${t.entry_type === '支出' ? '-' : '+'}${fmt(t.amount)}</div>
            ${row('日期', t.date)}${row('類型', t.entry_type)}${row('分類', t.category || '—')}${row('帳戶', t.tag || '—')}

            <button onclick="closeSheet();copyTxn('${esc(id)}')" class="w-full mt-4 py-3.5 bg-pastel-blue text-white font-bold rounded-tile text-sm shadow-md tactile"><i class="fa-solid fa-copy mr-1.5"></i> 再記一次</button>
            <div class="grid grid-cols-2 gap-3 mt-3">

                <button onclick="closeSheet();voidTxn('${esc(id)}')" class="py-3 bg-pastel-redLight text-pastel-red font-bold rounded-tile text-sm"><i class="fa-solid fa-trash mr-1"></i> 作廢</button></div>
            ${t.receipt_file_id ? `<button onclick="window.open('https://drive.google.com/file/d/${esc(t.receipt_file_id)}/view','_blank')" class="w-full mt-3 py-3 bg-pastel-bg text-stone-700 font-bold rounded-tile text-sm"><i class="fa-solid fa-receipt mr-1"></i> 檢視單據照片</button>` : ''}`);

    /* ---------- 事後調整分攤 ----------
       已還款的部分不能改小，否則會出現「還太多」的負數餘額，因此以已還金額為下限。 */
    let _editSplit = { id: '', map: {} };
    function openEditSplit(id) {
        const t = STATE.transactions.find(x => x.txn_id === id); if (!t) return;
        _editSplit = { id, map: {} };
        parseSplit(t).forEach(x => _editSplit.map[x.member_id] = x.amount);
        paintEditSplit();
    }
    function paintEditSplit() {
        const t = STATE.transactions.find(x => x.txn_id === _editSplit.id); if (!t) return;
        const total = Number(t.amount) || 0;
        const sum = Object.values(_editSplit.map).reduce((a, b) => a + (Number(b) || 0), 0);
        const rest = total - sum, over = sum > total + 0.01;
        openSheet(`
            <h3 class="text-lg font-bold text-stone-800 mb-1">調整分攤</h3>
            <p class="text-xs text-pastel-muted mb-5">${esc(t.note || t.category || '')} ・ 總額 ${fmt(total)}</p>
            <div class="space-y-2 mb-4">
                ${splitMembers().map(m => {
                    const on = _editSplit.map[m.member_id] !== undefined;
                    const paid = paidFor(t.txn_id, m.member_id);
                    return `<div class="flex items-center gap-2">
                        <button type="button" onclick="toggleEditSplitMember('${esc(m.member_id)}')"
                            class="w-6 h-6 rounded-md border-2 flex items-center justify-center flex-shrink-0 ${on ? 'bg-pastel-accent border-pastel-accent text-white' : 'border-pastel-border bg-pastel-bg text-transparent'}">
                            <i class="fa-solid fa-check text-[10px]"></i></button>

                        <div class="relative w-28 flex-shrink-0">
                            <span class="absolute left-2.5 top-1/2 -translate-y-1/2 text-xs text-pastel-muted">$</span>
                            <input type="number" inputmode="decimal" ${on ? '' : 'disabled'} value="${on ? esc(_editSplit.map[m.member_id]) : ''}"
                                oninput="setEditSplit('${esc(m.member_id)}', this.value)"
                                class="w-full py-2 pl-6 pr-2 rounded-lg border text-sm text-right font-rounded ${on ? 'bg-pastel-bg border-pastel-border text-stone-800' : 'bg-stone-100/60 border-transparent text-stone-300'}">
                        </div></div>`;
                }).join('')}
            </div>
            <div class="text-[11px] pt-2 border-t border-pastel-border flex justify-between mb-4 ${over ? 'text-pastel-red font-bold' : 'text-pastel-muted'}">
                <span>已分攤 ${fmt(sum)} / 總額 ${fmt(total)}</span>
                <span>${over ? '超過總額！' : rest > 0.01 ? `你自己吸收 ${fmt(rest)}` : '無人吸收剩餘'}</span></div>
            <button onclick="saveEditSplit()" class="w-full py-4 bg-pastel-accent text-white font-bold rounded-tile shadow-md text-sm tactile">儲存分攤設定</button>`);
    }
    function toggleEditSplitMember(id) {
        buzz();
        const t = STATE.transactions.find(x => x.txn_id === _editSplit.id);
        if (_editSplit.map[id] !== undefined) {
            if (paidFor(t.txn_id, id) > 0) return toast('對方已還款，不能整筆移除', true);

    function setEditSplit(id, v) { _editSplit.map[id] = Number(v) || 0; }

    async function saveEditSplit() {
        const t = STATE.transactions.find(x => x.txn_id === _editSplit.id); if (!t) return;
        const total = Number(t.amount) || 0;
        const list = Object.entries(_editSplit.map).filter(([, v]) => Number(v) > 0)
            .map(([member_id, amount]) => ({ member_id, amount: Number(amount) }));
        if (list.reduce((a, b) => a + b.amount, 0) > total + 0.01) { buzz(30); return toast('分攤加總超過總額', true); }
        for (const x of list) {
            const paid = paidFor(t.txn_id, x.member_id);
            if (x.amount < paid - 0.01) { buzz(30); return toast(`${nameOf(x.member_id)} 已還 ${fmt(paid)}，分攤不能低於此數`, true); }
        }
        closeSheet();
        const backup = { ...t };
        t.split_detail = list.length ? JSON.stringify(list) : '';
        t.related_id = list.length === 1 ? list[0].member_id : '';
        t._pending = true;
        renderDataViews(); toast('分攤已更新');
        try {
            // 走 updateTransaction：舊列標「已修訂」、新列以 parent_txn_id 指回，稽核軌跡完整
            const r2 = await api.call('updateTransaction', {
                txn_id: backup.txn_id,
                txn: { ...backup, split_detail: t.split_detail, related_id: t.related_id }
            });
            const i = STATE.transactions.findIndex(x => x.txn_id === backup.txn_id);
            if (i >= 0) STATE.transactions[i] = r2.txn;
            renderDataViews();
        } catch (e) {
            const i = STATE.transactions.findIndex(x => x.txn_id === backup.txn_id);
            if (i >= 0) STATE.transactions[i] = backup;
            renderDataViews(); toast('更新失敗：' + e.message, true);
        }
    }

    /* ---------- 單據檢視 ----------
       透過 API 取回，Drive 檔案維持私有（不設公開連結）。
       取回後快取在記憶體，同一張不會重複下載。 */
    const _rcCache = {};
    async function loadReceipt(id, full) {
        const box = document.getElementById('rcBox'); if (!box) return;
        const key = id + (full ? '_full' : '_thumb');
        if (_rcCache[key]) return paintReceipt(id, _rcCache[key], full);
        if (!full) box.innerHTML = `<div class="py-8 flex flex-col items-center gap-2 text-pastel-muted">
            <i class="fa-solid fa-circle-notch fa-spin text-xl"></i><span class="text-xs">載入單據中…</span></div>`;
        try {
            // 預覽先抓縮圖（約 10-30KB），放大時才抓原圖——快很多，也不容易傳輸失敗
            const r2 = await api.call('getReceipt', { txn_id: id, thumb: !full });
            if (!r2.base64) throw new Error('單據內容是空的');
            _rcCache[key] = `data:${r2.mime || 'image/jpeg'};base64,${r2.base64}`;
            if (full) return _rcCache[key];
            paintReceipt(id, _rcCache[key], false);
        } catch (e) {
            if (full) throw e;
            receiptError(id, e.message);
        }
    }
    function paintReceipt(id, src) {
        const box = document.getElementById('rcBox'); if (!box) return;
        box.innerHTML = `<button onclick="openLightbox('${esc(id)}')" class="block w-full">
            <img src="${src}" alt="單據" class="w-full max-h-52 object-cover"

            <div class="px-3 py-2 text-[10px] text-pastel-muted text-center border-t border-pastel-border">點擊放大</div>`;
    }
    /* 影像本身載入失敗時（例如 base64 不完整）也要有出口，
       而不是留一個破圖給使用者 */
    function receiptError(id, msg) {
        const box = document.getElementById('rcBox'); if (!box) return;
        delete _rcCache[id + '_thumb']; delete _rcCache[id + '_full'];
        box.innerHTML = `<div class="py-6 px-4 text-center text-xs text-pastel-red">
            <i class="fa-solid fa-triangle-exclamation mb-1.5 block text-lg"></i>${esc(msg || '載入失敗')}
            <button onclick="loadReceipt('${esc(id)}')" class="block mx-auto mt-2 underline font-bold">重試</button></div>`;

    async function openLightbox(id) {
        const el = document.getElementById('lightbox'), img = document.getElementById('lightboxImg');

        el.classList.remove('js-hide');
        requestAnimationFrame(() => el.classList.remove('opacity-0'));
        if (_rcCache[id + '_full']) { img.src = _rcCache[id + '_full']; hint.classList.add('js-hide'); return; }

        try {
            const full = await loadReceipt(id, true);

    /* ==========================================================
       新增 / 編輯（自建鍵盤 + 分類宮格 + 記住上次）
       ========================================================== */
    const OPS = ['+', '-', '×', '÷'];

    function evalExpr(e) {
        const t = String(e).match(/(\d+\.?\d*|[+\-×÷])/g) || ['0'];
        const s1 = [];
        for (let i = 0; i < t.length; i++) {
            const x = t[i];
            if (x === '×' || x === '÷') {
                const b = Number(t[++i] || 0), a = Number(s1.pop());
                s1.push(x === '×' ? a * b : (b ? a / b : 0));
            } else s1.push(OPS.includes(x) ? x : Number(x));
        }
        let r = Number(s1[0]) || 0;
        for (let i = 1; i < s1.length; i += 2) {
            const op = s1[i], v = Number(s1[i + 1]) || 0;
            r = op === '+' ? r + v : r - v;
        }
        return Math.round(r * 100) / 100;
    }
    const hasOp = e => OPS.some(o => String(e).slice(1).includes(o));

    function kp(k) {
        buzz(6);
        let e = addState.expr;
        /* 複製上一筆之後，金額視為「已選取」：按下第一個數字就整個換掉，
           而不是接在後面變成 180500。按運算子或刪除則保留原值繼續編輯。 */
        if (addState.replaceAmt) {
            addState.replaceAmt = false;
            if (/^[0-9]$/.test(k)) e = '0';
        }
        if (k === 'C') e = '0';
        else if (k === 'del') { e = e.length > 1 ? e.slice(0, -1) : '0'; }
        else if (OPS.includes(k)) {
            if (OPS.includes(e.slice(-1))) e = e.slice(0, -1) + k; else e += k;
        } else if (k === '.') {
            const last = e.split(/[+\-×÷]/).pop();
            if (!last.includes('.')) e += last === '' ? '0.' : '.';
        } else {
            const last = e.split(/[+\-×÷]/).pop();
            e = (e === '0') ? k : (last === '0' ? e.slice(0, -1) + k : e + k);
        }
        addState.expr = e;
        paintAmount();
        /* 均分／比例是「跟著總額走」的，金額一改就要重算，
           否則使用者先設好分攤再改金額，畫面上的數字會停在舊值。 */
        if (splitMode() !== 'amt' && Object.keys(addState.splits || {}).length) {
            recalcSplits();
            const box = document.getElementById('splitDetailBox');
            if (box && !box.classList.contains('hidden')) renderSplitBox(document.getElementById('inpNature')?.value);
        }
        paintSplitSummary();
    }

        const d = document.getElementById('kpAmt'), h = document.getElementById('kpHint');
        if (!d) return;
        const v = evalExpr(addState.expr);
        d.innerHTML = hasOp(addState.expr)
            ? `<span class="text-2xl text-pastel-muted">${esc(addState.expr)}</span>`
            : `<span class="num-sym text-2xl">$</span>${Number(v).toLocaleString('en-US')}`;
        if (h) h.innerText = hasOp(addState.expr) ? `= ${fmt(v)}` : '';
    }

    /* ---------- 分攤設定：三模一體面板 ----------
       所有參與者（含記帳者自己）都是可編輯的一員。
       自己不再是「剩下的自動吸收」—— 代墊買便當但自己沒買的情況很常見，
       那時候自己就該是 0，而不是被系統塞一份。 */
    function splitMembers() {
        return (STATE.members || []).filter(m => m.member_id !== 'family_pool' &&
            m.member_id !== STATE.me?.member_id && m.status !== '停用');
    }
    const ME_ID = () => STATE.me?.member_id || 'me';
    /** 參與分攤的人（含自己），依畫面順序 */
    function splitParticipants() {
        const me = STATE.me;
        return [...(me ? [{ member_id: ME_ID(), nickname: (me.nickname || '我') + '（我）', avatar_emoji: me.avatar_emoji, streak_days: me.streak_days, _self: true }] : []),
        ...splitMembers()];
    }
    /** 別人欠的錢：split_detail 只記錄別人，自己那份是自己吸收 */
    function splitSum() {
        return Object.entries(addState.splits || {})
            .filter(([id]) => id !== ME_ID())
            .reduce((a, [, v]) => a + (Number(v) || 0), 0);
    }
    const selfAmount = () => Number((addState.splits || {})[ME_ID()]) || 0;
    const allocated = () => splitSum() + selfAmount();
    const splitMode = () => addState.splitMode || 'even';
    const splitTotal = () => Math.round(evalExpr(addState.expr) || 0);
    const pctSum = () => Object.keys(addState.splits || {})
        .reduce((a, i) => a + (Number((addState.pcts || {})[i]) || 0), 0);

    /** 記住這組成員上次用的比例，下次切到 % 直接預填 */
    const ratioKey = () => Object.keys(addState.splits || {}).sort().join('|');
    function rememberRatio() {
        const k = ratioKey(); if (!k) return;
        const m = PREF.get('ratios', {}) || {};
        m[k] = Object.fromEntries(Object.keys(addState.splits).map(i => [i, Number(addState.pcts[i]) || 0]));
        PREF.set('ratios', m);
    }
    function recallRatio() {
        const k = ratioKey(); if (!k) return false;
        const saved = (PREF.get('ratios', {}) || {})[k];
        if (!saved) return false;
        addState.pcts = { ...saved };
        return true;
    }

    function recalcSplits() {
        const total = splitTotal();
        const ids = Object.keys(addState.splits || {});
        if (!ids.length) return;
        if (splitMode() === 'even') {
            const each = Math.floor(total / ids.length);
            ids.forEach(i => addState.splits[i] = each);
            /* 除不盡的餘數要有人扛，否則分攤總額會少幾塊，對帳時很惱人。
               自己有參與就自己吸收，沒有就加在最後一位身上。 */
            const rest = total - each * ids.length;
            if (rest) addState.splits[ids.includes(ME_ID()) ? ME_ID() : ids[ids.length - 1]] += rest;
        } else if (splitMode() === 'pct') {
            addState.pcts = addState.pcts || {};
            ids.forEach(i => addState.splits[i] = Math.round(total * (Number(addState.pcts[i]) || 0) / 100));
        }
    }
    function toggleSplitConfig() {
        const v = document.getElementById('inpNature')?.value, b = document.getElementById('splitDetailBox');
        if (!b) return;
        const on = (v === '私人拆帳' || v === '家庭代墊');
        b.classList.toggle('hidden', !on);
        if (on) {
            // 預設把自己也算一份 —— 最常見的情況，但點頭像就能取消
            if (!Object.keys(addState.splits || {}).length) addState.splits = { [ME_ID()]: 0 };
            recalcSplits();
            renderSplitBox(v);
        } else addState.splits = {};
        lockSaveIfOver();
    }
    function setSplitMode(m) {
        buzz();
        const prev = splitMode();
        addState.splitMode = m;
        PREF.set('splitMode', m);
        const total = splitTotal();
        addState.pcts = addState.pcts || {};
        if (m === 'pct') {
            /* 先找這組人上次用過的比例，沒有才從目前金額回推。
               固定比例（情侶 6:4、室友 1:1:1）不必每次重打，這是最有感的省時。 */
            const hit = prev === 'even' ? false : recallRatio();
            if (!hit) {
                Object.keys(addState.splits).forEach(i => {
                    addState.pcts[i] = total ? Math.round((Number(addState.splits[i]) || 0) / total * 100) : 0;
                });
            }
        }
        recalcSplits();
        renderSplitBox(document.getElementById('inpNature')?.value);
    }

                    ${splitParticipants().map(m => {

            return `<div class="flex flex-col items-center gap-1 flex-shrink-0 w-16 transition-transform ${on ? '-translate-y-0.5' : ''}">

                                    placeholder="${md === 'pct' ? '%' : '$'}">`}

                </div>

                    ${MODES.map(([k, label, ic]) => `<button type="button" onclick="setSplitMode('${k}')"
                        class="flex-1 py-1.5 rounded-full text-[11px] font-bold transition-all ${md === k ? 'bg-white text-stone-800 shadow-sm' : 'text-pastel-muted'}">
                        <i class="fa-solid ${ic} mr-1 text-[9px]"></i>${label}</button>`).join('')}
                </div>
                <div id="splitSummary" class="text-[11px] pt-2 border-t border-pastel-border"></div>

    }
    function paintSplitSummary() {
        const el = document.getElementById('splitSummary'); if (!el) return;
        const total = splitTotal(), others = splitSum(), mine = selfAmount(), used = allocated();
        const over = used > total + 0.01;
        const pctOver = splitMode() === 'pct' && pctSum() > 100.01;
        const rest = total - used;
        el.innerHTML = `<div class="${over || pctOver ? 'text-pastel-red font-bold' : 'text-pastel-muted'}">
            已分攤 ${fmt(others)} / 總額 ${fmt(total)}
            ${over ? `（超額 ${fmt(used - total)}）⚠️`
                : pctOver ? `（比例合計 ${pctSum()}%）⚠️`
                    : rest > 0.01 ? `（你自己吸收 ${fmt(mine + rest)}）🤝`
                        : mine > 0 ? `（你自己吸收 ${fmt(mine)}）🤝` : '（你不分攤）🤝'}</div>`;
        lockSaveIfOver();
    }
    /** 超額時鎖住儲存鍵：讓錯的資料存不進去，比事後對帳好 */
    function lockSaveIfOver() {
        const btn = document.getElementById('saveBtn'); if (!btn) return;
        const box = document.getElementById('splitDetailBox');
        const active = box && !box.classList.contains('hidden');
        const bad = active && (allocated() > splitTotal() + 0.01 ||
            (splitMode() === 'pct' && pctSum() > 100.01));
        btn.disabled = !!bad;
        btn.classList.toggle('opacity-40', !!bad);
        btn.classList.toggle('pointer-events-none', !!bad);
    }
    function toggleSplitMember(id) {
        buzz();
        addState.splits = addState.splits || {};
        addState.pcts = addState.pcts || {};
        if (addState.splits[id] !== undefined) { delete addState.splits[id]; delete addState.pcts[id]; }
        else {
            addState.splits[id] = 0;
            if (splitMode() === 'pct') addState.pcts[id] = Math.max(0, 100 - pctSum());
        }
        if (splitMode() === 'pct') recallRatio();
        recalcSplits();
        renderSplitBox(document.getElementById('inpNature')?.value);
    }
    function setSplitAmount(id, v) { addState.splits[id] = Number(v) || 0; paintSplitSummary(); }
    function setSplitPct(id, v) {
        addState.pcts = addState.pcts || {};
        addState.pcts[id] = Number(v) || 0;
        recalcSplits();
        paintSplitSummary();
        rememberRatio();
    }
    function splitEven() { setSplitMode('even'); }
    function splitList() {
        // split_detail 只記錄別人欠的錢，自己那一份是自己吸收，不是債務
        return Object.entries(addState.splits || {})
            .filter(([id, v]) => id !== ME_ID() && Number(v) > 0)
            .map(([member_id, amount]) => ({ member_id, amount: Number(amount) }));

    function confirmAmount() {

    function handleReceipt(e) {
        const file = e.target.files[0]; if (!file) return;
        const img = new Image(), reader = new FileReader();
        reader.onload = ev => { img.src = ev.target.result; };
        img.onload = () => {
            const max = 1280, sc = Math.min(1, max / Math.max(img.width, img.height));
            const cv = document.createElement('canvas');
            cv.width = img.width * sc; cv.height = img.height * sc;
            cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
            pendingReceipt = { base64: cv.toDataURL('image/jpeg', 0.75).split(',')[1], mime: 'image/jpeg' };
            document.getElementById('receiptBox').innerHTML = `<i class="fa-solid fa-circle-check text-lg text-pastel-green"></i><span class="font-bold text-pastel-green">單據已附加（點擊可更換）</span>`;
        };
        reader.readAsDataURL(file);
    }

    function editTxn(id) {
        const t = STATE.transactions.find(x => x.txn_id === id); if (!t) return;
        editingTxnId = id;
        addState = {
            mode: t.entry_type === '收入' ? 'income' : (t.entry_type === '轉帳' ? 'transfer' : 'expense'),
            expr: String(t.amount), cat: t.category, tag: t.tag, nature: t.nature,
            date: t.date, note: t.note || '', more: true, from: t.tag, to: t.related_id || '',
            /* 既有紀錄的分攤金額是既成事實，一律用金額模式載入，
               否則切回均分會把原本談好的數字覆寫掉。 */
            splitMode: 'amt', pcts: {},
            /* 付款人以原紀錄為準並鎖住：否則在家庭模式編輯一筆「我請客」的舊帳，
               存回去會被改成公帳出錢，金額憑空從公帳消失。 */
            poolPayer: t.payer_id === 'family_pool' ? 'pool' : 'me', poolPayerLocked: t.nature === '家庭公帳',
            splits: (() => {
                const o = parseSplit(t).reduce((m, s2) => (m[s2.member_id] = s2.amount, m), {});
                const others = Object.values(o).reduce((a, b) => a + b, 0);
                const mine = Math.round(Number(t.amount) || 0) - others;
                if (Object.keys(o).length && mine > 0) o[STATE.me?.member_id || 'me'] = mine;
                return o;
            })()
        };
        switchTab('add'); initAddForm(true);
        toast('已載入，修改後按更新');
    }
    /* ---------- 備註自動聯想 ----------
       純前端，用已經在記憶體裡的 STATE.transactions 建索引，不打任何 API。

       隱私防線：只用「自己記的」紀錄（member_id === 我）。
       原提案是依 payer_id 過濾，但這個 App 的 payer_id 是「誰付的錢」，
       代墊時常常是別人；member_id 才是記帳者本人。用錯欄位會讓
       家人代墊時打的備註出現在別人的聯想清單裡。 */
    let memoIndex = [], _memoComposing = false;
    function buildMemoIndex() {
        const myId = STATE.me?.member_id;
        if (!myId) { memoIndex = []; return; }
        const map = new Map();
        (STATE.transactions || []).forEach(t => {
            if (t.status === '作廢' || t.member_id !== myId) return;
            if (t.entry_type === '還款' || t.entry_type === '劃撥儲蓄') return;   // 這兩種不是「再記一次」的對象
            const key = String(t.note || '').trim();
            if (key.length < 2) return;
            const prev = map.get(key);
            // 同一句備註取「最近一次」的金額與設定 —— 價格會變，舊的沒有參考價值
            if (!prev) map.set(key, { note: key, count: 1, date: t.date, txn_id: t.txn_id, amount: t.amount });
            else {
                prev.count++;
                if (String(t.date) >= String(prev.date)) { prev.date = t.date; prev.txn_id = t.txn_id; prev.amount = t.amount; }
            }
        });
        memoIndex = [...map.values()].sort((a, b) => b.count - a.count || String(b.date).localeCompare(String(a.date))).slice(0, 60);
    }
    function memoBar() { return document.getElementById('memoBar'); }
    function hideMemoBar() { const b = memoBar(); if (b) { b.innerHTML = ''; b.classList.add('js-hide'); } }
    function onMemoInput(v) {
        addState.note = v;
        if (_memoComposing) return;      // 注音組字中不干擾，等使用者選完字
        paintMemoBar(v);
    }
    function paintMemoBar(query) {
        const b = memoBar(); if (!b) return;
        const q = String(query || '').trim().toLowerCase();
        if (!q) return hideMemoBar();
        const hits = memoIndex.filter(m => m.note.toLowerCase().includes(q) && m.note.toLowerCase() !== q).slice(0, 6);
        if (!hits.length) return hideMemoBar();
        b.innerHTML = hits.map(m => `<button type="button" onclick="applyMemo('${esc(m.txn_id)}')"
            class="flex-shrink-0 px-3 py-1.5 bg-pastel-bg border border-pastel-border rounded-full text-[11px] text-stone-700 tactile">
            <span class="font-bold">${esc(m.note)}</span>
            <span class="text-pastel-muted ml-1">${fmt(m.amount)}</span></button>`).join('');
        b.classList.remove('js-hide');
    }
    /* 套用聯想＝把那一筆整個複製過來（金額、分類、帳戶、性質、分攤），
       但保留使用者當下已經輸入的其他欄位不被洗掉的部分由 copyTxn 決定。 */
    function applyMemo(txnId) {
        const t = (STATE.transactions || []).find(x => x.txn_id === txnId); if (!t) return;
        buzz(6);
        hideMemoBar();
        document.getElementById('inpNote')?.blur();
        copyTxn(txnId);
        setTimeout(() => {
            ['kpCard', 'catRow', 'tagRow'].forEach(id => {
                const el = document.getElementById(id); if (!el) return;
                el.classList.add('pop-fill');
                setTimeout(() => el.classList.remove('pop-fill'), 240);
            });
        }, 60);
    }
    /* ---------- 再記一次（複製上一筆） ----------
       複製的是「肌肉記憶」：金額、分類、性質、帳戶、備註、分攤結構。
       重置的是「每一筆都應該獨一無二」的東西：日期、單據、存錢目標。
       日期若照抄舊值，使用者會在不知情的狀況下記到上個月去；
       單據每筆不同不該繼承；目標標籤繼承會造成重複劃撥。 */
    function cancelEdit() { editingTxnId = null; pendingReceipt = null; initAddForm(); toast('已取消編輯'); }

    function copyTxn(id) {
        const t = STATE.transactions.find(x => x.txn_id === id); if (!t) return;
        buzz(6);
        editingTxnId = null;              // 這是新的一筆，不是編輯
        pendingReceipt = null;            // 單據不繼承
        const isGoalTag = (STATE.goals || []).some(g => g.project_tag && g.project_tag === t.tag);
        addState = {
            mode: t.entry_type === '收入' ? 'income' : (t.entry_type === '轉帳' ? 'transfer' : 'expense'),
            expr: String(Math.round(Number(t.amount) || 0)),
            cat: t.category,
            tag: isGoalTag ? (PREF.get('tag', '') || STATE.tags[0]?.item_name || '') : t.tag,
            nature: t.nature,
            date: todayISO(),             // 一律改成今天
            note: t.note || '',
            more: true,
            from: t.tag, to: t.related_id || '',
            replaceAmt: true,             // 金額視為已選取
            poolPayer: t.payer_id === 'family_pool' ? 'pool' : 'me', poolPayerLocked: t.nature === '家庭公帳',
            splitMode: 'amt', pcts: {},
            splits: (() => {
                const o = parseSplit(t).reduce((m, s2) => (m[s2.member_id] = s2.amount, m), {});
                const others = Object.values(o).reduce((a, b) => a + b, 0);
                const mine = Math.round(Number(t.amount) || 0) - others;
                if (Object.keys(o).length && mine > 0) o[STATE.me?.member_id || 'me'] = mine;
                return o;
            })()
        };
        switchTab('add'); initAddForm(true);
        setTimeout(openKeypadDrawer, 260);
        toast('已複製，確認金額後按儲存');
    }

    async function saveTransaction() {
        const amount = evalExpr(addState.expr);
        if (!amount || amount <= 0) { buzz(30); openKeypadDrawer(); return toast('請先輸入金額', true); }
        const isTr = addState.mode === 'transfer';
        if (!isTr && !addState.cat) { buzz(30); openCatDrawer(); return toast('請先選擇分類', true); }
        if (isTr) {
            const from = document.getElementById('trFrom').value, to = document.getElementById('trTo').value;
            if (from === to) return toast('轉出與轉入帳戶不能相同', true);
            PREF.set('tag', from);
            const note = addState.note || `${from} → ${to}`;
            initAddForm();
            switchTab('transactions'); buzz(14);
            viewYM = addState.date.slice(0, 7);
            return optimisticAdd({
                date: addState.date, entry_type: '轉帳', category: '', tag: from, amount, note,
                nature: '純個人', related_id: to, member_id: STATE.me.member_id, payer_id: STATE.me.member_id
            }, null, '轉帳已記錄');
        }

        const nature = document.getElementById('inpNature')?.value || '純個人';
        const isExp = addState.mode === 'expense';
        const sl = (nature === '家庭代墊' || nature === '私人拆帳') ? splitList() : [];
        if (sl.reduce((a, b) => a + b.amount, 0) > amount + 0.01) {
            buzz(30); return toast('分攤金額加總超過總額，請調整', true);
        }
        // 歸屬決定「錢從誰的口袋動」與「算哪一種型態」，集中在這裡判斷：
        //   家庭公帳 → 錢在家庭帳戶進出，payer 是公帳，不碰個人現金（收入與支出都是）
        //   公帳注資 → 我拿自己的錢挹注公帳，型態改為「注資」：個人現金減少、公帳增加
        //   其餘     → 我自己的錢
        const isPoolMoney = nature === '家庭公帳';
        /* 「歸屬」和「誰的錢包出的錢」是兩件事，先前被綁死成一件。
           歸屬家庭公帳的花費，錢可能從公帳帳戶扣，也可能是我自己請客。
           後者我的錢包確實少了錢，個人明細就必須看得到。 */
        const poolFromMe = isPoolMoney && addState.poolPayer !== 'pool';
        const isInject = !isExp && nature === '公帳注資';
        const txn = {
            date: addState.date || todayISO(),
            entry_type: isInject ? '注資' : (isExp ? '支出' : '收入'),
            category: addState.cat, tag: addState.tag, amount,
            note: addState.note, nature,
            split_detail: sl.length ? JSON.stringify(sl) : '',
            related_id: sl.length === 1 ? sl[0].member_id : '',
            member_id: STATE.me.member_id,
            payer_id: (isPoolMoney && !poolFromMe) ? 'family_pool' : STATE.me.member_id
        };
        // 記住這次的選擇，下次直接帶入
        PREF.set('tag', addState.tag);
        PREF.set('nature', nature);
        PREF.set('cat_' + (isExp ? 'EXPENSE_CATEGORY' : 'INCOME_CATEGORY'), addState.cat);

        const receipt = pendingReceipt;
        const wantRec = document.getElementById('isRecurring')?.checked;
        const rec = wantRec ? {
            name: txn.note || txn.category, entry_type: txn.entry_type, category: txn.category,
            tag: txn.tag, amount, note: txn.note, nature,
            freq: document.getElementById('recFreq').value,
            auto_mode: document.getElementById('recMode').value,
            start_date: txn.date, end_date: document.getElementById('recEnd').value || '',
            scope: currentMode === 'family' ? 'family' : 'personal'
        } : null;

        if (editingTxnId) {
            const oldId = editingTxnId, idx = STATE.transactions.findIndex(t => t.txn_id === oldId);
            const backup = idx >= 0 ? { ...STATE.transactions[idx] } : null;
            if (idx >= 0) Object.assign(STATE.transactions[idx], txn, { _pending: true });
            editingTxnId = null; pendingReceipt = null;
            initAddForm(); renderDataViews(); switchTab('transactions'); toast('已更新'); buzz(14);
            try {
                const r = await api.call('updateTransaction', { txn_id: oldId, txn, receipt });
                const i2 = STATE.transactions.findIndex(t => t.txn_id === oldId);
                if (i2 >= 0) STATE.transactions[i2] = r.txn;
                renderDataViews();
            } catch (e) {
                if (backup && idx >= 0) STATE.transactions[idx] = backup;
                renderDataViews(); toast('更新失敗：' + e.message, true);
            }
            return;
        }

        pendingReceipt = null; initAddForm();
        viewYM = txn.date.slice(0, 7);          // 跳到該筆所在月份，確保看得到
        filters.q = ''; filters.type = 'all';
        switchTab('transactions'); buzz(14);
        await optimisticAdd(txn, receipt);
        document.getElementById('appMain').scrollTop = 0;
        if (rec) {
            try {
                const r = await api.call('saveRule', { rule: rec, first_run_done: true });
                STATE.rules.push(r.rule); renderSettings(); toast('重複性收支已建立');
            } catch (e) { toast('重複規則建立失敗：' + e.message, true); }
        }
    }

    /* 綁累積筆數：只進不退，即使連續紀錄斷掉，植物依然穩穩長大 */
    const GROWTH = [
        { id: 0, name: '種子', icon: 'fa-seedling', min: 0, next: 50, color: '#9A918A', word: '剛播下，先記個 50 筆看看' },

    ];

    /* 成長軌跡改綁「累積筆數」而非連續天數。
       光環負責製造緊張感（斷了會掉），成長軌跡負責提供安全網（只進不退）。
       兩者原本都吃 streak_days，等於同一件事畫兩次。 */
    function growthStage(count) {
        count = Number(count) || 0;
        let g = GROWTH[0];
        for (const x of GROWTH) if (count >= x.min) g = x;
        const prog = g.next ? Math.min((count - g.min) / (g.next - g.min) * 100, 100) : 100;
        return { ...g, count, days: count, progress: prog, remain: g.next ? Math.max(g.next - count, 0) : 0 };
    }

    function growthCard() {
        const g = growthStage(achievementStats().count);
        return `<div class="rounded-tile p-4 mb-5 border" style="background:${hexA(g.color, .1)};border-color:${hexA(g.color, .3)}">

                <div class="min-w-0 flex-1">

            </div>
            <div class="flex gap-1.5 mb-2">
                ${GROWTH.map(x => `<div class="flex-1 h-1.5 rounded-full" style="background:${x.id <= g.id ? g.color : 'rgba(0,0,0,.08)'}"></div>`).join('')}

    /* 短週期任務改為橫向微型方塊。
       注意：這些任務是由資料自動判定的（例如「今天記一筆」看的是有沒有紀錄），
       不是待辦清單那種手動打勾——所以點擊不是「完成」，而是「跳到能完成它的地方」。
       達成的瞬間會播放打勾彈跳動畫，那才是真正的「劃掉清單」回饋。 */
    function taskGroup(title, icon, tasks) {
        const done = tasks.filter(t => t.done).length;
        return `<div class="mb-5">
            <div class="flex justify-between items-center mb-2">
                <h3 class="text-sm font-bold text-stone-800"><i class="fa-solid ${icon} mr-1.5 text-pastel-accent"></i>${esc(title)}</h3>
                <span class="text-xs text-pastel-muted">${done}/${tasks.length}</span></div>
            <div class="task-rail flex gap-2.5 overflow-x-auto hide-scrollbar -mx-1 px-1 pb-1">
                ${tasks.map((t, i) => `
                    <button onclick="${t.done ? `buzz(6)` : `goTask('${esc(t.go || '')}')`}"
                        class="task-card flex-shrink-0 w-[132px] rounded-tile border p-3 text-left transition-all tactile
                               ${t.done ? 'bg-pastel-greenLight border-transparent' : 'bg-white border-pastel-border'}">
                        <div class="w-8 h-8 rounded-full flex items-center justify-center mb-2 ${t.done ? 'bg-white/70 text-pastel-green task-tick' : 'bg-pastel-bg text-pastel-muted'}">
                            <i class="fa-solid ${t.done ? 'fa-circle-check' : t.icon} text-sm"></i></div>
                        <div class="text-[12px] font-bold leading-tight mb-1 ${t.done ? 'text-pastel-green' : 'text-stone-700'}">${esc(t.name)}</div>
                        <div class="text-[10px] text-pastel-muted leading-tight line-clamp-2">${esc(t.hint)}</div>
                    </button>`).join('')}
            </div></div>`;
    }
    /** 點未完成的任務 → 直接帶到能完成它的地方 */
    function goTask(go) {
        buzz();
        closeProfileModal();
        setTimeout(() => {
            if (go === 'budget') return openBudgetSheet();
            if (go === 'list') return switchTab('transactions');
            switchTab('add');
        }, 260);
    }

    function closeProfileModal() {
        const m = document.getElementById('profileModal');
        m.classList.add('opacity-0');
        document.getElementById('profileModalContent').classList.add('translate-y-full');
        setTimeout(() => m.classList.add('js-hide'), 300);

    async function setAvatar(v) {
        const backup = STATE.me.avatar_emoji;
        STATE.me.avatar_emoji = v;
        const mi = STATE.members.findIndex(m => m.member_id === STATE.me.member_id);
        if (mi >= 0) STATE.members[mi].avatar_emoji = v;
        closeSheet(); updateLevelDisplays(); openProfileModal(); renderSettings();
        try { await api.call('updateMember', { patch: { avatar_emoji: v } }); toast('大頭貼已更新'); }
        catch (e) {
            STATE.me.avatar_emoji = backup;
            if (mi >= 0) STATE.members[mi].avatar_emoji = backup;
            updateLevelDisplays(); renderSettings(); toast('更新失敗：' + e.message, true);
        }
    }

       在前端也算一次，是為了讓彈窗的預覽色就是最後存下來的顏色。 */
    function nextColor(group) {
        const list = [...(STATE.categories || []), ...(STATE.tags || [])].filter(c => c.item_group === group);
        const used = {};
        list.forEach(c => { const h = String(c.hex_color || '').toUpperCase(); if (h) used[h] = (used[h] || 0) + 1; });

    /* ---------- 分類排序：拖曳（SortableJS） ----------
       原本手刻了約 110 行（連續位移、FLIP 讓位、邊緣自動捲動、換位後的基準補正）。
       它在單純情境下可以用，但拖到螢幕最上緣時 iOS 會把觸控事件收走去處理系統手勢，
       而且不保證發出 pointercancel —— 收尾函式不執行，狀態機就卡在「拖曳中」，
       rAF 迴圈不停、指標捕捉不放、卡片的 z-index 蓋在最上層，整頁跟著凍住。

       教訓不是「計算寫錯」，而是：在行動裝置上，任何靠 pointerup 收尾的狀態機
       都必須假設那個事件可能不會來。要處理的邊界不只這一個，所以改用 SortableJS。 */
    let sortingGroup = null, sortDirty = false, sortable = null;

    function destroySortable() {
        if (!sortable) return;
        try { sortable.destroy(); } catch (e) { }
        sortable = null;
    }
    function toggleSortMode(group) {
        buzz();
        if (sortingGroup === group) {
            const g = sortingGroup;
            sortingGroup = null;
            destroySortable();          // 一定要在重畫之前銷毀，否則監聽器會留在被丟掉的 DOM 上
            renderSettings();
            saveOrder(g);
        } else {
            if (typeof Sortable === 'undefined') { toast('排序功能尚未載入，請連線後重試', true); return; }
            sortingGroup = group;
            sortDirty = false;
            renderSettings();          // renderSettings 會負責重綁
        }
    }
    function bindDragSort() {
        const list = document.getElementById('sortList');
        if (!list || typeof Sortable === 'undefined') return;
        destroySortable();
        sortable = new Sortable(list, {
            handle: '.drag-handle',
            animation: 200,
            /* 強制走 fallback：iOS 本來就沒有 HTML5 drag，強制之後桌機與手機行為一致，
               而且分身的外觀由我們的 CSS 決定，不會出現瀏覽器預設的半透明拖影。 */
            forceFallback: true,
            fallbackOnBody: false,
            fallbackTolerance: 3,       // 手指抖 3px 內不算拖曳，避免點一下就位移
            fallbackClass: 'dragging',
            ghostClass: 'drag-ghost',
            /* 明確指定捲動容器，不讓它自己猜。上一版的卡死就發生在捲動邊界。 */
            scroll: document.getElementById('appMain'),
            scrollSensitivity: 64,
            scrollSpeed: 10,
            bubbleScroll: false,
            onStart: () => buzz(10),
            onChange: () => buzz(6),    // 每次擠開別人給一下輕震，維持實體卡片的手感
            onEnd: (e) => {
                if (e.oldIndex !== e.newIndex) sortDirty = true;
                commitDomOrder();
            }
        });
    }

    /** 把畫面上的順序寫回 STATE（只動這個群組，其他群組的位置不變） */
    function commitDomOrder() {
        const list = document.getElementById('sortList'); if (!list) return;
        const group = list.dataset.group;
        const names = [...list.querySelectorAll('.drag-row')].map(r => r.dataset.n);
        const isTag = group === 'PAYMENT_TAG';
        const all = isTag ? STATE.tags : STATE.categories;
        const view = names.map(n => all.find(c => c.item_name === n && c.item_group === group)).filter(Boolean);
        let k = 0;
        const merged = all.map(c => c.item_group === group ? view[k++] : c);
        if (isTag) STATE.tags = merged; else STATE.categories = merged;
    }

        if (!sortDirty) return;
        sortDirty = false;
        const list = (group === 'PAYMENT_TAG' ? STATE.tags : STATE.categories).filter(c => c.item_group === group);

            await api.call('reorderItems', { item_group: group, names: list.map(c => c.item_name) });
            initAddForm(true); paintTagRow();

        } catch (e) { toast(e.message, true); }
    }

    /* 改名要同步改掉本地的引用，否則畫面上的舊紀錄會暫時「找不到分類」，
       等到下次同步才恢復 —— 那幾秒看起來就像資料掉了。 */
    function renameLocalRefs(group, oldName, newName) {
        const key = group === 'PAYMENT_TAG' ? 'tag' : 'category';
        (STATE.transactions || []).forEach(t => { if (t[key] === oldName) t[key] = newName; });
        (STATE.rules || []).forEach(r => { if (r[key] === oldName) r[key] = newName; });
        if (group !== 'PAYMENT_TAG') (STATE.budgets || []).forEach(b => { if (b.category === oldName) b.category = newName; });
        if (addState.cat === oldName && group !== 'PAYMENT_TAG') addState.cat = newName;
        if (addState.tag === oldName && group === 'PAYMENT_TAG') addState.tag = newName;
    }
    async function confirmEditItem() {
        const newName = (document.getElementById('niName')?.value || '').trim();
        if (!newName) { buzz(30); return toast('請輸入名稱', true); }
        const group = _newItem.group, oldName = _newItem.editing;
        const patch = { icon_emoji: _newItem.icon, hex_color: _newItem.color };
        closeSheet();
        const list = group === 'PAYMENT_TAG' ? STATE.tags : STATE.categories;
        const i = list.findIndex(x => x.item_name === oldName && x.item_group === group);
        if (i < 0) return;
        const backup = { list: [...list], txns: (STATE.transactions || []).map(t => ({ ...t })) };
        list[i] = { ...list[i], item_name: newName, ...patch };
        if (newName !== oldName) renameLocalRefs(group, oldName, newName);
        renderSettings(); initAddForm(true); paintTagRow();
        try {
            const d = await api.call('updateItem', { item_name: oldName, item_group: group, new_name: newName, ...patch });
            if (d && d.item) {
                const j = (group === 'PAYMENT_TAG' ? STATE.tags : STATE.categories)
                    .findIndex(x => x.item_name === newName && x.item_group === group);
                if (j >= 0) (group === 'PAYMENT_TAG' ? STATE.tags : STATE.categories)[j] = { ...d.item };
            }
            renderSettings(); initAddForm(true); paintTagRow(); renderAll();
            const n = d && d.moved ? (d.moved.transactions || 0) : 0;
            toast(d && d.renamed ? (n ? `已更名，${n} 筆紀錄一起更新` : '已更名') : '已更新');
        } catch (e) {
            if (group === 'PAYMENT_TAG') STATE.tags = backup.list; else STATE.categories = backup.list;
            STATE.transactions = backup.txns;
            renderSettings(); initAddForm(true); paintTagRow(); toast(e.message, true);
        }
    }
    async function confirmAddItem() {
        const name = (document.getElementById('niName')?.value || '').trim();
        if (!name) { buzz(30); return toast('請輸入名稱', true); }
        const group = _newItem.group;

            // 以後端回傳的為準：顏色可能被後端改過（例如兩台裝置同時新增）
            if (d && d.item) {

            box.innerHTML = rows.map(r => `
                <div class="flex gap-2 p-2.5 rounded-tile border ${r.ok ? 'bg-pastel-greenLight/40 border-pastel-green/30' : 'bg-pastel-redLight border-pastel-red/30'}">
                    <i class="fa-solid ${r.ok ? 'fa-circle-check text-pastel-green' : 'fa-triangle-exclamation text-pastel-red'} text-xs mt-0.5"></i>
                    <div class="min-w-0">
                        <div class="text-[11px] font-bold ${r.ok ? 'text-stone-700' : 'text-pastel-red'}">${esc(r.name)}</div>
                        <div class="selectable text-[10px] text-pastel-muted leading-relaxed break-all">${esc(r.detail)}</div>
                    </div></div>`).join('');
        };

        // ① 後端可達（不帶家庭代碼，才能跟「代碼錯」分開）
        let reachable = false;
        try {
            const d = await api.call('ping');
            BACKEND_VERSION = d.apiVersion || '';
            reachable = true;
            rows.push({ ok: true, name: '後端可達', detail: d.ready ? '連線正常，帳本已初始化' : '連得上，但還沒初始化 —— 請到試算表選單執行「① 初始化 / 升級系統」' });
            if (!d.ready) rows[0].ok = false;
        } catch (e) {
            rows.push({
                ok: false, name: '後端可達',
                detail: diagnoseConnError(e, BACKEND.url)
            });
        }
        paint();

        // ② 家庭代碼
        if (reachable) {
            try {
                await api.call('listMembers');
                rows.push({ ok: true, name: '家庭代碼', detail: '代碼正確，成員讀取成功' });
            } catch (e) {
                rows.push({ ok: false, name: '家庭代碼', detail: /代碼/.test(e.message) ? '代碼不符。請到試算表選單「② 顯示安裝碼」核對後重新登入。' : e.message });
            }
            paint();
        }

        // ③ 版本握手
        rows.push(backendOutdated()
            ? { ok: false, name: '版本', detail: outdatedMsg() }
            : { ok: true, name: '版本', detail: `介面 ${CONFIG.VERSION} ／ 後端 ${BACKEND_VERSION}，相容` });
        paint();

        // ④ 單據資料夾（含「初始化與部署不同人」這個最難自己看出來的狀況）
        if (reachable) {
            try {
                const d = await api.call('diagnose');
                (d.checks || []).filter(c => c.key === 'receipt' || c.key === 'identity' || c.key === 'sheets')
                    .forEach(c => rows.push({ ok: c.ok, name: c.name, detail: c.detail }));
            } catch (e) {
                rows.push({ ok: false, name: '單據資料夾', detail: '無法檢查（後端可能是舊版，請先更新 Code.gs）' });
            }
            paint();
        }

        done();
        toast(rows.every(r => r.ok) ? '一切正常' : '有項目需要處理', !rows.every(r => r.ok));
    }

    /* ---------- CSV 匯出 ---------- */
    function exportCSV() {
        const rows = filteredTxns();
        if (!rows.length) return toast('目前沒有可匯出的紀錄', true);
        const head = ['日期', '類型', '分類', '帳戶標籤', '金額', '備註', '費用歸屬', '記帳者'];
        const cell = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
        const csv = '\uFEFF' + [head.map(cell).join(',')]     // BOM 讓 Excel 正確辨識中文
            .concat(rows.map(t => [t.date, t.entry_type, t.category, t.tag, t.amount, t.note, t.nature, nameOf(t.member_id)].map(cell).join(',')))
            .join('\r\n');
        const name = `家庭記帳_${filters.allTime ? '全期間' : viewYM}_${currentMode === 'family' ? '家庭' : STATE.me?.nickname}.csv`;
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });

        // iOS PWA 對 <a download> 支援差，優先用系統分享
        const file = (typeof File !== 'undefined') ? new File([blob], name, { type: 'text/csv' }) : null;
        if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
            navigator.share({ files: [file], title: name }).catch(() => { });
            return;
        }
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = name; document.body.appendChild(a); a.click();
        setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1200);
        toast(`已匯出 ${rows.length} 筆`);
    }

    /* ==========================================================
       版面高度：唯一可靠的來源是 visualViewport / innerHeight
       ========================================================== */
    let LAYOUT = {};
    function measureDvh() {
        const dp = document.createElement('div');
        dp.style.cssText = 'position:fixed;top:0;left:0;width:0;height:100dvh;pointer-events:none;visibility:hidden';
        document.body.appendChild(dp);
        const px = Math.round(dp.getBoundingClientRect().height);
        dp.remove();
        return px;
    }
    function syncFrameHeight() {
        measureSafeAreas();          // 安全區可能在啟動後才算好，每次都重量
        if (window.innerWidth >= 768) {                 // 桌機交回 CSS 處理
            document.documentElement.style.removeProperty('--appH');
            return;
        }
        const vv = window.visualViewport;
        // 鍵盤彈出時 iOS 會把整個版面往上捲，導致上方 Header 消失。
        // 對策：讓外框直接縮到「鍵盤上方的可視高度」，並強制把捲動位置歸零。
        const kbOpen = !!(vv && (window.innerHeight - vv.height) > 120);
        // 平時不覆寫高度：iOS PWA 的 innerHeight 會比實體可視高度少一個安全區，
        // 只有 CSS 的 100dvh 是對的。只有鍵盤彈出、需要縮小版面時才由 JS 接手。
        let h;
        if (kbOpen) {
            h = Math.round(vv.height);
            document.documentElement.style.setProperty('--appH', h + 'px');
            window.scrollTo(0, 0); document.body.scrollTop = 0;
        } else {
            // iOS PWA 的 dvh / innerHeight / visualViewport 都少報一個上方安全區，
            // 但畫面是從 y=0 開始畫的，真正可畫高度 = dvh + sat。
            // 再以 screen.height 為上限，避免其他平台重複相加而溢出。
            const satPx = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--sat')) || 0;
            const base = measureDvh();
            const scr = (window.screen && window.screen.height) ? window.screen.height : Infinity;
            h = Math.round(Math.min(base + satPx, scr));
            document.documentElement.style.setProperty('--appH', h + 'px');
        }
        /* 導覽列貼齊外框底邊，主內容要讓出「導覽列頂端到外框底邊」的高度。
           不直接用 offsetHeight，是因為那個值在導覽列被 transform 位移時仍然不變，
           而量距離的寫法對貼底與懸浮兩種版面都成立。 */
        const nav = document.getElementById('appNav');
        let navH = 0;
        if (nav && !nav.classList.contains('js-hide')) {
            const frameEl = document.getElementById('appFrame');
            const fb = frameEl ? frameEl.getBoundingClientRect().bottom : window.innerHeight;
            navH = Math.max(0, Math.round(fb - nav.getBoundingClientRect().top));
        }
        if (navH > 0) document.documentElement.style.setProperty('--navH', navH + 'px');
        // 實測 100dvh 換算出的像素，用來確認它是否等於實體螢幕高度
        const dvhPx = measureDvh();

        const frame = document.getElementById('appFrame');
        LAYOUT = {
            innerH: window.innerHeight,
            visualH: vv ? Math.round(vv.height) : null,
            used: h,
            screenH: window.screen ? Math.round(window.screen.height) : null,
            dvh: dvhPx,
            frameBottom: frame ? Math.round(frame.getBoundingClientRect().bottom) : null,
            navBottom: nav ? Math.round(nav.getBoundingClientRect().bottom) : null,
            navH: navH,
            standalone: !!(window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches),
            safeBottom: getComputedStyle(document.documentElement).getPropertyValue('--sab').trim() || '?',
            safeTop: getComputedStyle(document.documentElement).getPropertyValue('--sat').trim() || '?'
        };
        paintDiag();          // 量完立刻更新讀數，避免顯示的是開機當下的舊值
    }

    function diagText() {
        const L = LAYOUT;
        const gap = (L.screenH != null && L.navBottom != null) ? (L.screenH - L.navBottom) : null;
        return `frameH=${L.used ?? '?'} dvh=${L.dvh ?? '-'} in=${L.innerH ?? '?'} vv=${L.visualH ?? '-'} scr=${L.screenH ?? '-'}
frameBtm=${L.frameBottom ?? '-'} navBtm=${L.navBottom ?? '-'} navH=${L.navH ?? '-'}
底部落差=${(L.dvh != null && L.navBottom != null) ? (L.dvh - L.navBottom) : '-'}  sat=${L.safeTop || '?'}  sab=${L.safeBottom || '?'}
${L.standalone ? 'PWA' : 'WEB(Safari)'}  dpr=${window.devicePixelRatio}  statusBar=${(L.screenH != null && L.innerH != null) ? (L.screenH - L.innerH) : '-'}`;
    }
    function paintDiag() {
        const el = document.getElementById('diagBox');
        if (el) el.textContent = diagText();
    }
    function measureSafeAreas() {
        const probe = document.createElement('div');
        probe.style.cssText = 'position:fixed;bottom:0;height:env(safe-area-inset-bottom,0px);width:0';
        document.body.appendChild(probe);
        let sab = Math.round(probe.getBoundingClientRect().height);
        probe.remove();
        const probeT = document.createElement('div');
        probeT.style.cssText = 'position:fixed;top:0;height:env(safe-area-inset-top,0px);width:0';
        document.body.appendChild(probeT);
        const sat = Math.round(probeT.getBoundingClientRect().height);
        probeT.remove();
        const standalone = !!(window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches);
        if (sab === 0 && standalone && window.innerHeight >= 780) sab = 20;
        document.documentElement.style.setProperty('--sab', sab + 'px');
        if (sat > 0) document.documentElement.style.setProperty('--topPad', sat + 'px');
        document.documentElement.style.setProperty('--sat', sat + 'px');
        return { sat, sab };
    }

    function bindLayout() {
        // 讀出安全區數值供診斷用
        const probe = document.createElement('div');
        probe.style.cssText = 'position:fixed;bottom:0;height:env(safe-area-inset-bottom,0px);width:0';
        document.body.appendChild(probe);
        const probeT = document.createElement('div');
        probeT.style.cssText = 'position:fixed;top:0;height:env(safe-area-inset-top,0px);width:0';
        document.body.appendChild(probeT);
        const sat = Math.round(probeT.getBoundingClientRect().height);
        probeT.remove();
        document.documentElement.style.setProperty('--sat', sat + 'px');
        // 修正 v4.5.0 的誤判：iOS PWA 確實從 Y=0 開始繪製（所以這段留白是必要的），
        // 少報的是 innerHeight 而不是安全區。直接沿用安全區原值。
        // 冷啟動時 iOS 可能尚未算好安全區而回報 0，此時不要寫入變數，
        // 讓 CSS 的 env() 自行生效；之後每次重量若拿到有效值再覆蓋。
        if (sat > 0) document.documentElement.style.setProperty('--topPad', sat + 'px');
        let sab = Math.round(probe.getBoundingClientRect().height);
        probe.remove();
        // iOS 偶爾在 standalone 下把 env(safe-area-inset-bottom) 回報成 0，
        // 但機身其實有 Home Indicator。以「無實體 Home 鍵機型」為判準補上固定值。
        const standalone = !!(window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches);
        if (sab === 0 && standalone && window.innerHeight >= 780) sab = 20;
        document.documentElement.style.setProperty('--sab', sab + 'px');

        syncFrameHeight();
        // 導覽列一開始帶著 js-hide（display:none），量到的高度必然是 0。
        // 用 ResizeObserver 追蹤，它一顯示或高度變動就自動重量。
        const nav = document.getElementById('appNav');
        if (nav && window.ResizeObserver) new ResizeObserver(() => syncFrameHeight()).observe(nav);
        window.addEventListener('resize', syncFrameHeight);
        window.addEventListener('orientationchange', () => setTimeout(syncFrameHeight, 260));
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', syncFrameHeight);
            window.visualViewport.addEventListener('scroll', () => { window.scrollTo(0, 0); syncFrameHeight(); });
        }
        // 輸入框取得焦點時 iOS 常會自行捲動版面，這裡把它拉回來
        document.addEventListener('focusin', e => {
            if (!/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
            setTimeout(() => { window.scrollTo(0, 0); syncFrameHeight(); }, 120);
            setTimeout(() => { window.scrollTo(0, 0); syncFrameHeight(); }, 420);
        });
        document.addEventListener('focusout', () => setTimeout(() => { window.scrollTo(0, 0); syncFrameHeight(); }, 200));
    }

    /* ==========================================================
       自動更新：偵測到新版就跳橫幅，不必再手動刪圖示重加
       ========================================================== */
    let swReg = null, reloadedOnce = false;
    function showUpdateBar() { document.getElementById('updateBar').classList.remove('js-hide'); }
    function applyUpdate() {
        document.getElementById('updateBar').classList.add('js-hide');
        toast('更新中…');
        if (swReg && swReg.waiting) swReg.waiting.postMessage({ type: 'SKIP_WAITING' });
        setTimeout(() => location.reload(), 600);
    }
    function initServiceWorker() {
        if (!('serviceWorker' in navigator)) return;
        navigator.serviceWorker.register('./sw.js').then(reg => {
            swReg = reg;
            if (reg.waiting) showUpdateBar();
            reg.addEventListener('updatefound', () => {
                const nw = reg.installing;
                if (!nw) return;
                nw.addEventListener('statechange', () => {
                    if (nw.state === 'installed' && navigator.serviceWorker.controller) showUpdateBar();
                });
            });
            setInterval(() => reg.update().catch(() => { }), 30 * 60 * 1000);   // 每 30 分鐘查一次
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden) reg.update().catch(() => { });
            });
        }).catch(() => { });
        navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (reloadedOnce) return; reloadedOnce = true;
            location.reload();
        });
    }

    /* ---------- 啟動 ---------- */
    if (window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches) {
        document.getElementById('fakeStatusBar').classList.add('js-hide');
    }
    try { screen.orientation && screen.orientation.lock && screen.orientation.lock('portrait').catch(() => { }); } catch (e) { }
    initServiceWorker();
    applyTheme();
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (getTheme() === 'auto') applyTheme(); });
    /* 鍵盤打開時，底部導覽列會被頂上來壓住輸入框（iOS 特別明顯）。
       打字時導覽列本來就用不到，直接收起來，並把焦點欄位捲進可視範圍。 */
    function bindKeyboardNav() {
        const nav = document.getElementById('appNav');
        const isField = el => el && /^(INPUT|TEXTAREA)$/.test(el.tagName) &&
            !/^(button|submit|checkbox|radio|file)$/.test(el.type || '');
        document.addEventListener('focusin', e => {
            if (!isField(e.target)) return;
            nav?.classList.add('kb-hide');
            setTimeout(() => e.target.scrollIntoView({ block: 'center', behavior: 'smooth' }), 260);
        });
        document.addEventListener('focusout', e => {
            if (!isField(e.target)) return;
            // 延遲一下：從一個欄位跳到下一個欄位時不要閃一下
            setTimeout(() => { if (!isField(document.activeElement)) nav?.classList.remove('kb-hide'); }, 120);
        });
    }
    window.addEventListener('DOMContentLoaded', () => { bindLayout(); bindKeyboardNav(); bootstrap(); });
    </script>
