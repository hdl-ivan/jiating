    /* ==========================================================
       新增 / 編輯（自建鍵盤 + 分類宮格 + 記住上次）
       ========================================================== */
    const OPS = ['+', '-', '×', '÷'];

    function evalExpr(e) {
        const t = String(e).match(/(\d+\.?\d*|[+\-×÷])/g) || ['0'];
        const s1 = [];
        for (let i = 0; i < t.length; i++) {
            const x = t[i];
            if (x === '×' || x === '÷') {
                const b = Number(t[++i] || 0), a = Number(s1.pop());
                s1.push(x === '×' ? a * b : (b ? a / b : 0));
            } else s1.push(OPS.includes(x) ? x : Number(x));
        }
        let r = Number(s1[0]) || 0;
        for (let i = 1; i < s1.length; i += 2) {
            const op = s1[i], v = Number(s1[i + 1]) || 0;
            r = op === '+' ? r + v : r - v;
        }
        return Math.round(r * 100) / 100;
    }
    const hasOp = e => OPS.some(o => String(e).slice(1).includes(o));

    function kp(k) {
        buzz(6);
        let e = addState.expr;
        if (k === 'C') e = '0';
        else if (k === 'del') { e = e.length > 1 ? e.slice(0, -1) : '0'; }
        else if (OPS.includes(k)) {
            if (OPS.includes(e.slice(-1))) e = e.slice(0, -1) + k; else e += k;
        } else if (k === '.') {
            const last = e.split(/[+\-×÷]/).pop();
            if (!last.includes('.')) e += last === '' ? '0.' : '.';
        } else {
            const last = e.split(/[+\-×÷]/).pop();
            e = (e === '0') ? k : (last === '0' ? e.slice(0, -1) + k : e + k);
        }
        addState.expr = e;
        paintAmount();
        paintSplitSummary();
    }

    function paintAmount() {
        const d = document.getElementById('kpAmt'), h = document.getElementById('kpHint');
        if (!d) return;
        const v = evalExpr(addState.expr);
        d.innerHTML = hasOp(addState.expr)
            ? `<span class="text-2xl text-pastel-muted">${esc(addState.expr)}</span>`
            : `<span class="num-sym text-2xl">$</span>${Number(v).toLocaleString('en-US')}`;
        if (h) h.innerText = hasOp(addState.expr) ? `= ${fmt(v)}` : '';
    }

    function setAddMode(m) {
        buzz();
        addState.mode = m;
        addState.cat = '';
        initAddForm(true);
        if (m !== 'transfer') setTimeout(openCatDrawer, 180);
    }
    function pickTag(n) { buzz(); addState.tag = n; paintTagRow(); }
    function toggleMore() { addState.more = !addState.more; document.getElementById('moreBox').classList.toggle('hidden', !addState.more); document.getElementById('moreCaret').className = `fa-solid fa-chevron-${addState.more ? 'up' : 'down'} text-xs`; }

    /* 修正：原本只更新 className、從未寫入文字，所以按鈕是一顆顆空色塊。
       改為整列重繪，並帶上標籤名稱與識別色點。 */
    function paintTagRow() {
        const r = document.getElementById('tagRow'); if (!r) return;
        if (!STATE.tags.length) {
            r.innerHTML = `<button onclick="addItem('PAYMENT_TAG')" class="flex-shrink-0 px-4 py-2 rounded-full text-xs font-bold border border-dashed border-pastel-border text-pastel-muted">＋ 先新增一個帳戶</button>`;
            return;
        }
        r.innerHTML = STATE.tags.map(t => {
            const on = t.item_name === addState.tag, col = catColor(t.item_name);
            return `<button onclick="pickTag('${esc(t.item_name)}')"
                class="flex-shrink-0 flex items-center gap-2 px-3.5 py-2 rounded-full text-xs font-bold border transition-all tactile ${on ? 'text-white border-transparent shadow-sm' : 'bg-white text-stone-700 border-pastel-border'}"
                style="${on ? `background:${col}` : ''}">
                <span class="w-2.5 h-2.5 rounded-full flex-shrink-0" style="background:${on ? 'rgba(255,255,255,.9)' : col}"></span>
                <span class="whitespace-nowrap">${esc(t.item_name)}</span>
                ${on ? '<i class="fa-solid fa-check text-[10px]"></i>' : ''}
            </button>`;
        }).join('') +
            `<button onclick="addItem('PAYMENT_TAG')" class="flex-shrink-0 px-3.5 py-2 rounded-full text-xs font-bold border border-dashed border-pastel-border text-pastel-muted">＋</button>`;
    }

    function renderAddFormLogic(keepNature) {
        const c = document.getElementById('advancedLogicContainer'); if (!c) return;
        const prev = keepNature || addState.nature || document.getElementById('inpNature')?.value;
        if (addState.mode === 'transfer') { c.innerHTML = `<input type="hidden" id="inpNature" value="純個人">`; return; }
        if (addState.mode === 'income') {
            c.innerHTML = `<div class="p-4 bg-pastel-greenLight border border-pastel-green/20 rounded-tile space-y-3">
                <div class="font-bold text-pastel-green text-xs">收入歸屬</div>
                <select id="inpNature" onchange="addState.nature=this.value" class="w-full p-3 rounded-xl bg-white border border-pastel-green/20 text-stone-800 text-sm font-medium">
                    <option value="純個人">個人收入（不進公帳）</option><option value="家庭公帳">直接入家庭公帳</option></select></div>`;
        } else if (currentMode === 'personal') {
            c.innerHTML = `<div class="p-4 bg-pastel-accentLight border border-pastel-accent/25 rounded-tile space-y-3">
                <div class="font-bold text-pastel-accent text-xs">費用歸屬與代墊</div>
                <select id="inpNature" onchange="addState.nature=this.value;toggleSplitConfig()" class="w-full p-3 rounded-xl bg-white border border-pastel-accent/25 text-stone-800 text-sm font-medium">
                    <option value="純個人">純個人私費（不進家庭表）</option>
                    <option value="家庭代墊">我先代墊，公帳要還我</option>
                    <option value="家庭公帳">我贊助家用（不需歸還）</option>
                    <option value="私人拆帳">與指定成員拆帳</option></select>
                <div id="splitDetailBox" class="hidden"></div></div>`;
        } else {
            c.innerHTML = `<div class="p-4 bg-pastel-greenLight border border-pastel-green/20 rounded-tile">
                <div class="font-bold text-pastel-green text-xs mb-1">家庭公帳直接支出</div>
                <p class="text-[11px] text-stone-600">動用公帳資金，不產生個人代墊債務。</p>
                <input type="hidden" id="inpNature" value="家庭公帳"></div>`;
        }
        const el = document.getElementById('inpNature');
        if (prev && el && el.options && [...el.options].some(o => o.value === prev)) el.value = prev;
        addState.nature = el ? el.value : '純個人';
        toggleSplitConfig();
    }

    /* ---------- 分攤設定：家庭代墊與私人拆帳共用同一組 UI 與 split_detail 結構 ---------- */
    function splitMembers() {
        return STATE.members.filter(m => m.member_id !== 'family_pool' &&
            m.member_id !== STATE.me?.member_id && m.status !== '停用');
    }
    function splitSum() {
        return Object.values(addState.splits || {}).reduce((a, b) => a + (Number(b) || 0), 0);
    }
    function toggleSplitConfig() {
        const v = document.getElementById('inpNature')?.value, b = document.getElementById('splitDetailBox');
        if (!b) return;
        const on = (v === '私人拆帳' || v === '家庭代墊');
        b.classList.toggle('hidden', !on);
        if (on) renderSplitBox(v);
        else addState.splits = {};
    }
    function renderSplitBox(mode) {
        const b = document.getElementById('splitDetailBox'); if (!b) return;
        const isPool = mode === '家庭代墊';
        addState.splits = addState.splits || {};
        b.innerHTML = `
            <div class="p-3 bg-white rounded-xl border border-pastel-accent/25 space-y-3">
                <div class="flex justify-between items-center">
                    <div class="font-bold text-stone-700 text-xs">${isPool ? '要分攤給誰？（可複選）' : '與誰拆帳？（可複選）'}</div>
                    ${isPool ? `<button type="button" onclick="splitEven()" class="text-[11px] font-bold text-pastel-accent">平均分攤</button>` : ''}
                </div>
                <div class="space-y-2">
                    ${splitMembers().map(m => {
            const on = addState.splits[m.member_id] !== undefined;
            return `<div class="flex items-center gap-2">
                            <button type="button" onclick="toggleSplitMember('${esc(m.member_id)}')"
                                class="w-6 h-6 rounded-md border-2 flex items-center justify-center flex-shrink-0 ${on ? 'bg-pastel-accent border-pastel-accent text-white' : 'border-pastel-border bg-pastel-bg text-transparent'}">
                                <i class="fa-solid fa-check text-[10px]"></i></button>
                            <span class="flex-1 text-sm text-stone-700 truncate">${esc(m.nickname)}</span>
                            <div class="relative w-28 flex-shrink-0">
                                <span class="absolute left-2.5 top-1/2 -translate-y-1/2 text-xs text-pastel-muted">$</span>
                                <input type="number" inputmode="decimal" ${on ? '' : 'disabled'}
                                    value="${on ? esc(addState.splits[m.member_id]) : ''}"
                                    oninput="setSplitAmount('${esc(m.member_id)}', this.value)"
                                    class="w-full py-2 pl-6 pr-2 rounded-lg border text-sm text-right font-rounded ${on ? 'bg-pastel-bg border-pastel-border text-stone-800' : 'bg-stone-100/60 border-transparent text-stone-300'}">
                            </div></div>`;
        }).join('')}
                </div>
                <div id="splitSummary" class="text-[11px] pt-2 border-t border-pastel-border"></div>
            </div>`;
        paintSplitSummary();
    }
    function paintSplitSummary() {
        const el = document.getElementById('splitSummary'); if (!el) return;
        const total = evalExpr(addState.expr), sum = splitSum(), rest = total - sum;
        const over = sum > total + 0.01;
        el.innerHTML = `<div class="flex justify-between ${over ? 'text-pastel-red font-bold' : 'text-pastel-muted'}">
                <span>已分攤 ${fmt(sum)} / 總額 ${fmt(total)}</span>
                <span>${over ? '超過總額！' : rest > 0.01 ? `你自己吸收 ${fmt(rest)}` : '無人吸收剩餘'}</span></div>`;
    }
    function toggleSplitMember(id) {
        buzz();
        addState.splits = addState.splits || {};
        if (addState.splits[id] !== undefined) delete addState.splits[id];
        else addState.splits[id] = 0;
        renderSplitBox(document.getElementById('inpNature')?.value);
    }
    function setSplitAmount(id, v) { addState.splits[id] = Number(v) || 0; paintSplitSummary(); }
    function splitEven() {
        const ids = Object.keys(addState.splits || {});
        if (!ids.length) return toast('請先勾選要分攤的成員', true);
        const total = evalExpr(addState.expr);
        const each = Math.round(total / (ids.length + 1));    // ＋1＝付款人自己也算一份
        ids.forEach(i => addState.splits[i] = each);
        renderSplitBox(document.getElementById('inpNature')?.value);
    }
    function splitList() {
        return Object.entries(addState.splits || {})
            .filter(([, v]) => Number(v) > 0)
            .map(([member_id, amount]) => ({ member_id, amount: Number(amount) }));
    }
    function toggleRecurringBox() { document.getElementById('recurringBox').classList.toggle('hidden', !document.getElementById('isRecurring').checked); }

    /* ==========================================================
       新增流程（抽屜式）
       點 + → 選收支類型 → 分類抽屜 → 數字鍵盤抽屜（金額與分類同框可見）
              → 日期 → 備註 → 標籤 → 照片 → 重複性 → 費用歸屬
       ========================================================== */
    function initAddForm(keepValues) {
        if (!keepValues) {
            addState = {
                mode: 'expense', expr: '0', cat: '', note: '', date: todayISO(), more: false,
                tag: PREF.get('tag', '') || (STATE.tags[0]?.item_name || ''),
                nature: PREF.get('nature', '純個人'),
                from: PREF.get('tag', '') || (STATE.tags[0]?.item_name || ''),
                to: STATE.tags[1]?.item_name || '', splits: {}
            };
            editingTxnId = null; pendingReceipt = null;
        }
        const isExp = addState.mode === 'expense', isTr = addState.mode === 'transfer';
        const group = isExp ? 'EXPENSE_CATEGORY' : 'INCOME_CATEGORY';
        const amt = evalExpr(addState.expr);
        const col = isTr ? '#3090F8' : isExp ? '#F05838' : '#40B868';

        const rowBtn = (label, valueHtml, onclick) => `
            <button onclick="${onclick}" class="w-full flex items-center justify-between gap-3 px-4 py-3.5 tactile text-left">
                <span class="text-sm text-stone-600 flex-shrink-0">${label}</span>
                <span class="flex items-center gap-2 min-w-0">
                    <span class="text-sm font-bold text-stone-800 truncate">${valueHtml}</span>
                    <i class="fa-solid fa-chevron-right text-[10px] text-pastel-muted flex-shrink-0"></i></span></button>`;

        document.getElementById('addView').innerHTML = `
            <div id="editBanner" class="${editingTxnId ? '' : 'hidden'} bg-pastel-blueLight border border-pastel-blue/30 text-pastel-blue rounded-tile p-3 text-xs font-bold flex justify-between items-center">
                <span><i class="fa-solid fa-pen mr-1"></i> 編輯模式</span><button onclick="cancelEdit()" class="underline">取消編輯</button></div>

            <div class="flex bg-stone-200/40 p-1.5 rounded-tile w-full">
                ${[['expense', '支出', 'text-pastel-red'], ['income', '收入', 'text-pastel-green'], ['transfer', '轉帳', 'text-pastel-blue']]
                .map(([m, l, c]) => `<button onclick="setAddMode('${m}')" class="flex-1 py-2 rounded-xl text-sm font-bold transition-all tactile ${addState.mode === m ? `bg-white ${c} shadow-sm` : 'text-pastel-muted'}">${l}</button>`).join('')}
            </div>

            <!-- 金額（點擊開鍵盤抽屜） -->
            <button onclick="openKeypadDrawer()" class="w-full rounded-card p-5 shadow-md text-white text-left tactile"
                    style="background:linear-gradient(135deg,${isTr ? '#3090F8,#2B7BD6' : isExp ? '#F8A048,#F0863A' : '#40B868,#35A25A'})">
                <div class="flex justify-between items-center mb-1">
                    <span class="text-[11px] font-bold opacity-85">${isTr ? '轉帳金額' : isExp ? '支出金額' : '收入金額'}</span>
                    <span class="text-[10px] font-bold bg-white/25 px-2 py-1 rounded-md">點擊輸入 <i class="fa-solid fa-calculator ml-1"></i></span></div>
                <div class="text-5xl font-bold font-rounded tracking-tight leading-none">
                    <span class="num-sym text-2xl">$</span>${Number(amt).toLocaleString('en-US')}</div>
            </button>

            <div class="bg-white border border-pastel-border/60 rounded-card shadow-card divide-y divide-pastel-border/70 overflow-hidden">
                ${isTr ? `
                <div class="px-4 py-3.5 grid grid-cols-2 gap-3">
                    <div class="field"><label class="block text-[11px] font-bold text-stone-500 mb-1.5">從</label>
                        <select id="trFrom" class="w-full p-2.5 rounded-xl bg-pastel-bg border border-pastel-border text-sm truncate">
                            ${STATE.tags.map(t => `<option ${addState.from === t.item_name ? 'selected' : ''}>${esc(t.item_name)}</option>`).join('')}</select></div>
                    <div class="field"><label class="block text-[11px] font-bold text-stone-500 mb-1.5">到</label>
                        <select id="trTo" class="w-full p-2.5 rounded-xl bg-pastel-bg border border-pastel-border text-sm truncate">
                            ${STATE.tags.map(t => `<option ${addState.to === t.item_name ? 'selected' : ''}>${esc(t.item_name)}</option>`).join('')}</select></div>
                </div>`
                : rowBtn('分類', addState.cat
                    ? `<i class="fa-solid ${esc(catIcon(addState.cat))} mr-1.5" style="color:${catColor(addState.cat)}"></i>${esc(addState.cat)}`
                    : '<span class="text-pastel-muted font-normal">請選擇</span>', 'openCatDrawer()')}

                <div class="px-4 py-3 flex items-center justify-between gap-3">
                    <span class="text-sm text-stone-600 flex-shrink-0">日期</span>
                    <input id="inpDate" type="date" value="${esc(addState.date)}" onchange="addState.date=this.value"
                        class="field flex-1 max-w-[190px] py-2 px-3 rounded-xl bg-pastel-bg border border-pastel-border text-sm font-bold text-stone-800 font-sans"></div>

                <div class="px-4 py-3 flex items-center gap-3">
                    <span class="text-sm text-stone-600 flex-shrink-0">備註</span>
                    <input id="inpNote" type="text" value="${esc(addState.note)}" oninput="addState.note=this.value" placeholder="寫點什麼…"
                        class="field flex-1 py-2 px-3 rounded-xl bg-pastel-bg border border-pastel-border text-sm text-right text-stone-800"></div>

                <div class="px-4 py-3">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-sm text-stone-600">標籤 / 帳戶</span>
                        <span class="text-xs font-bold ${addState.tag ? 'text-stone-800' : 'text-pastel-muted'}">${esc(addState.tag || '未選擇')}</span></div>
                    <div id="tagRow" class="flex gap-2 overflow-x-auto hide-scrollbar pb-1"></div></div>

                <input type="file" id="inpReceipt" accept="image/*" class="hidden" onchange="handleReceipt(event)">
                <button id="receiptBox" onclick="document.getElementById('inpReceipt').click()" class="w-full flex items-center justify-between px-4 py-3.5 tactile">
                    <span class="text-sm text-stone-600">單據照片</span>
                    <span class="flex items-center gap-2 text-sm ${pendingReceipt ? 'text-pastel-green font-bold' : 'text-pastel-muted'}">
                        ${pendingReceipt ? '<i class="fa-solid fa-circle-check"></i> 已附加' : '<i class="fa-solid fa-camera"></i> 選填'}</span></button>

                ${isTr || editingTxnId ? '' : `
                <div class="px-4 py-3.5">
                    <label class="flex items-center justify-between cursor-pointer">
                        <span class="text-sm text-stone-600">設為重複性收支</span>
                        <span class="relative flex items-center">
                            <input type="checkbox" id="isRecurring" onchange="toggleRecurringBox()" class="peer w-5 h-5 appearance-none border-2 border-pastel-border rounded checked:bg-pastel-accent checked:border-pastel-accent transition-all">
                            <i class="fa-solid fa-check absolute text-white text-xs left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 opacity-0 peer-checked:opacity-100 pointer-events-none"></i></span></label>
                    <div id="recurringBox" class="hidden mt-3 p-4 bg-pastel-bg border border-pastel-border rounded-tile space-y-3">
                        <div class="grid grid-cols-2 gap-3">
                            <div class="field"><label class="block text-[11px] font-bold text-stone-600 mb-1">週期</label>
                                <select id="recFreq" class="w-full p-2.5 rounded-xl bg-white border border-pastel-border text-sm truncate">
                                    <option>每日</option><option>每週</option><option>每兩週</option><option selected>每月</option><option>每季</option><option>每半年</option><option>每年</option></select></div>
                            <div class="field"><label class="block text-[11px] font-bold text-stone-600 mb-1">處理方式</label>
                                <select id="recMode" class="w-full p-2.5 rounded-xl bg-white border border-pastel-border text-sm truncate">
                                    <option>自動記帳</option><option>僅提醒</option></select></div></div>
                        <div class="field"><label class="block text-[11px] font-bold text-stone-600 mb-1">結束日期（可留空）</label>
                            <input id="recEnd" type="date" class="w-full py-2.5 px-3 rounded-xl bg-white border border-pastel-border text-sm"></div>
                        <p class="text-[11px] text-pastel-muted">歸屬：${currentMode === 'family' ? '家庭公帳（全家可見）' : '個人（只有你看得到）'}</p>
                    </div>
                </div>`}
            </div>

            <div id="advancedLogicContainer"></div>
            <button id="saveBtn" onclick="saveTransaction()" class="w-full py-4 bg-pastel-accent text-white font-bold rounded-tile shadow-soft text-base tactile">${editingTxnId ? '更新紀錄' : '儲存紀錄'}</button>`;

        if (!isTr) paintTagRow();
        renderAddFormLogic();
    }

    /* 進入新增頁時自動彈出分類抽屜，少一次點擊 */
    function maybeAutoOpenDrawer() {
        if (currentTab !== 'add' || editingTxnId) return;
        if (addState.mode === 'transfer') return;
        if (evalExpr(addState.expr) > 0) return;
        openCatDrawer();
    }

    function openCatDrawer() {
        const group = addState.mode === 'income' ? 'INCOME_CATEGORY' : 'EXPENSE_CATEGORY';
        const cats = STATE.categories.filter(c => c.item_group === group);
        openSheet(`
            <h3 class="text-lg font-bold text-stone-800 mb-1">選擇分類</h3>
            <p class="text-xs text-pastel-muted mb-5">選好後會自動跳出金額鍵盤</p>
            <div class="grid grid-cols-4 gap-2.5">
                ${cats.map(c => {
            const on = c.item_name === addState.cat, col = catColor(c.item_name);
            return `<button onclick="chooseCat('${esc(c.item_name)}')" class="rounded-tile py-3 px-1 flex flex-col items-center gap-1 tactile transition-all"
                        style="background:${on ? col : hexA(col, .12)};color:${on ? '#fff' : '#3A3330'};${on ? `box-shadow:0 4px 14px ${hexA(col, .45)}` : ''}">
                        <i class="fa-solid ${esc(normIcon(c.icon_emoji, c.item_group))} text-xl leading-none"></i>
                        <span class="text-[10px] font-bold leading-tight text-center truncate w-full px-0.5">${esc(c.item_name)}</span></button>`;
        }).join('')}
                <button onclick="addItem('${group}')" class="rounded-tile py-3 px-1 flex flex-col items-center gap-1 border-2 border-dashed border-pastel-border text-pastel-muted">
                    <i class="fa-solid fa-plus text-xl leading-none"></i><span class="text-[10px] font-bold">新增</span></button>
            </div>`);
    }

    function chooseCat(name) {
        buzz();
        addState.cat = name;
        closeSheet();
        setTimeout(openKeypadDrawer, 260);
    }

    /* 鍵盤抽屜：金額與分類同框顯示，輸入時永遠看得到自己打了多少 */
    function openKeypadDrawer() {
        const isTr = addState.mode === 'transfer', isExp = addState.mode === 'expense';
        const col = isTr ? '#3090F8' : isExp ? '#F05838' : '#40B868';
        const key = (k, label, cls) => `<button onclick="kp('${k}')" class="${cls || 'bg-white text-stone-800'} rounded-tile py-4 text-xl font-bold shadow-sm border border-pastel-border/70 tactile">${label}</button>`;
        openSheet(`
            <div class="rounded-card p-4 mb-4 text-white" style="background:linear-gradient(135deg,${isTr ? '#3090F8,#2B7BD6' : isExp ? '#F8A048,#F0863A' : '#40B868,#35A25A'})">
                <div class="flex justify-between items-center mb-1">
                    <span class="text-[11px] font-bold opacity-85">${isTr ? '轉帳' : isExp ? '支出' : '收入'}${addState.cat ? ' · ' + esc(addState.cat) : ''}</span>
                    ${addState.cat ? `<button onclick="closeSheet();setTimeout(openCatDrawer,240)" class="text-[10px] font-bold bg-white/25 px-2 py-1 rounded-md">換分類</button>` : ''}</div>
                <div id="kpAmt" class="text-5xl font-bold font-rounded tracking-tight leading-none break-all"></div>
                <div id="kpHint" class="text-xs opacity-85 mt-1.5 h-4"></div>
            </div>
            <div class="kp grid grid-cols-4 gap-2.5 mb-3">
                ${key('7', '7')}${key('8', '8')}${key('9', '9')}${key('÷', '÷', 'bg-pastel-bg text-pastel-accent')}

    function handleReceipt(e) {
        const file = e.target.files[0]; if (!file) return;
        const img = new Image(), reader = new FileReader();
        reader.onload = ev => { img.src = ev.target.result; };
        img.onload = () => {
            const max = 1280, sc = Math.min(1, max / Math.max(img.width, img.height));
            const cv = document.createElement('canvas');
            cv.width = img.width * sc; cv.height = img.height * sc;
            cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
            pendingReceipt = { base64: cv.toDataURL('image/jpeg', 0.75).split(',')[1], mime: 'image/jpeg' };
            document.getElementById('receiptBox').innerHTML = `<i class="fa-solid fa-circle-check text-lg text-pastel-green"></i><span class="font-bold text-pastel-green">單據已附加（點擊可更換）</span>`;
        };
        reader.readAsDataURL(file);
    }

    function editTxn(id) {
        const t = STATE.transactions.find(x => x.txn_id === id); if (!t) return;
        editingTxnId = id;
        addState = {
            mode: t.entry_type === '收入' ? 'income' : (t.entry_type === '轉帳' ? 'transfer' : 'expense'),
            expr: String(t.amount), cat: t.category, tag: t.tag, nature: t.nature,
            date: t.date, note: t.note || '', more: true, from: t.tag, to: t.related_id || ''
        };
        switchTab('add'); initAddForm(true);
        toast('已載入，修改後按更新');
    }
    function cancelEdit() { editingTxnId = null; pendingReceipt = null; initAddForm(); toast('已取消編輯'); }

    async function saveTransaction() {
        const amount = evalExpr(addState.expr);
        if (!amount || amount <= 0) { buzz(30); openKeypadDrawer(); return toast('請先輸入金額', true); }
        const isTr = addState.mode === 'transfer';
        if (!isTr && !addState.cat) { buzz(30); openCatDrawer(); return toast('請先選擇分類', true); }
        if (isTr) {
            const from = document.getElementById('trFrom').value, to = document.getElementById('trTo').value;
            if (from === to) return toast('轉出與轉入帳戶不能相同', true);
            PREF.set('tag', from);
            const note = addState.note || `${from} → ${to}`;
            initAddForm();
            switchTab('transactions'); buzz(14);
            viewYM = addState.date.slice(0, 7);
            return optimisticAdd({
                date: addState.date, entry_type: '轉帳', category: '', tag: from, amount, note,
                nature: '純個人', related_id: to, member_id: STATE.me.member_id, payer_id: STATE.me.member_id
            }, null, '轉帳已記錄');
        }

        const nature = document.getElementById('inpNature')?.value || '純個人';
        const isExp = addState.mode === 'expense';
        const sl = (nature === '家庭代墊' || nature === '私人拆帳') ? splitList() : [];
        if (sl.reduce((a, b) => a + b.amount, 0) > amount + 0.01) {
            buzz(30); return toast('分攤金額加總超過總額，請調整', true);
        }
        const txn = {
            date: addState.date || todayISO(),
            entry_type: isExp ? '支出' : '收入',
            category: addState.cat, tag: addState.tag, amount,
            note: addState.note, nature,
            split_detail: sl.length ? JSON.stringify(sl) : '',
            related_id: sl.length === 1 ? sl[0].member_id : '',
            member_id: STATE.me.member_id,
            payer_id: (currentMode === 'family' && isExp && nature === '家庭公帳') ? 'family_pool' : STATE.me.member_id
        };
        // 記住這次的選擇，下次直接帶入
        PREF.set('tag', addState.tag);
        PREF.set('nature', nature);
        PREF.set('cat_' + (isExp ? 'EXPENSE_CATEGORY' : 'INCOME_CATEGORY'), addState.cat);

        const receipt = pendingReceipt;
        const wantRec = document.getElementById('isRecurring')?.checked;
        const rec = wantRec ? {
            name: txn.note || txn.category, entry_type: txn.entry_type, category: txn.category,
            tag: txn.tag, amount, note: txn.note, nature,
            freq: document.getElementById('recFreq').value,
            auto_mode: document.getElementById('recMode').value,
            start_date: txn.date, end_date: document.getElementById('recEnd').value || '',
            scope: currentMode === 'family' ? 'family' : 'personal'
        } : null;

        if (editingTxnId) {
            const oldId = editingTxnId, idx = STATE.transactions.findIndex(t => t.txn_id === oldId);
            const backup = idx >= 0 ? { ...STATE.transactions[idx] } : null;
            if (idx >= 0) Object.assign(STATE.transactions[idx], txn, { _pending: true });
            editingTxnId = null; pendingReceipt = null;
            initAddForm(); renderDataViews(); switchTab('transactions'); toast('已更新'); buzz(14);
            try {
                const r = await api.call('updateTransaction', { txn_id: oldId, txn, receipt });
                const i2 = STATE.transactions.findIndex(t => t.txn_id === oldId);
                if (i2 >= 0) STATE.transactions[i2] = r.txn;
                renderDataViews();
            } catch (e) {
                if (backup && idx >= 0) STATE.transactions[idx] = backup;
                renderDataViews(); toast('更新失敗：' + e.message, true);
            }
            return;
        }

        pendingReceipt = null; initAddForm();
        viewYM = txn.date.slice(0, 7);          // 跳到該筆所在月份，確保看得到
        filters.q = ''; filters.type = 'all';
        switchTab('transactions'); buzz(14);
        await optimisticAdd(txn, receipt);
        document.getElementById('appMain').scrollTop = 0;
        if (rec) {
            try {
                const r = await api.call('saveRule', { rule: rec, first_run_done: true });
                STATE.rules.push(r.rule); renderSettings(); toast('重複性收支已建立');
            } catch (e) { toast('重複規則建立失敗：' + e.message, true); }
        }
    }

    /* --- 重複性收支 --- */

                <div class="grid grid-cols-2 gap-3">
                    <div class="field"><label class="block text-xs font-bold text-stone-600 mb-1.5">分類</label>
                        <select id="rCat" class="w-full p-3 rounded-tile bg-pastel-bg border border-pastel-border text-sm truncate">${catOpts(isExp ? 'EXPENSE_CATEGORY' : 'INCOME_CATEGORY')}</select></div>
                    <div class="field"><label class="block text-xs font-bold text-stone-600 mb-1.5">帳戶</label>
                        <select id="rTag" class="w-full p-3 rounded-tile bg-pastel-bg border border-pastel-border text-sm truncate">

                <div class="grid grid-cols-2 gap-3">
                    <div class="field"><label class="block text-xs font-bold text-stone-600 mb-1.5">週期</label>
                        <select id="rFreq" class="w-full p-3 rounded-tile bg-pastel-bg border border-pastel-border text-sm">

                    <div class="field"><label class="block text-xs font-bold text-stone-600 mb-1.5">處理方式</label>
                        <select id="rMode" class="w-full p-3 rounded-tile bg-pastel-bg border border-pastel-border text-sm">
                            <option ${r?.auto_mode !== '僅提醒' ? 'selected' : ''}>自動記帳</option><option ${r?.auto_mode === '僅提醒' ? 'selected' : ''}>僅提醒</option></select></div></div>

    function ruleTypeChanged() {
        const isExp = document.getElementById('rType').value === '支出';
        document.getElementById('rCat').innerHTML = STATE.categories
            .filter(c => c.item_group === (isExp ? 'EXPENSE_CATEGORY' : 'INCOME_CATEGORY'))
            .map(c => `<option value="${esc(c.item_name)}">${esc(c.icon_emoji)} ${esc(c.item_name)}</option>`).join('');
    }
    async function saveRule(ruleId) {
        const rule = {
            rule_id: ruleId || '', name: document.getElementById('rName').value.trim(),
            entry_type: document.getElementById('rType').value,
            amount: Number(document.getElementById('rAmount').value),
            category: document.getElementById('rCat').value, tag: document.getElementById('rTag').value,
            freq: document.getElementById('rFreq').value, auto_mode: document.getElementById('rMode').value,
            start_date: document.getElementById('rStart').value || todayISO(),
            end_date: document.getElementById('rEnd').value || '',
            nature: document.getElementById('rNature').value, note: document.getElementById('rName').value.trim(),
            scope: document.getElementById('rScope')?.value || 'personal',
            status: document.getElementById('rPaused')?.checked ? '停用' : '啟用'
        };
        if (!rule.name) return toast('請輸入名稱', true);
        if (!rule.amount || rule.amount <= 0) return toast('請輸入正確金額', true);
        closeSheet();
        try {
            const r = await api.call('saveRule', { rule });
            const i = STATE.rules.findIndex(x => x.rule_id === r.rule.rule_id);
            if (i >= 0) STATE.rules[i] = r.rule; else STATE.rules.push(r.rule);
            renderSettings(); toast('已儲存');
        } catch (e) { toast('儲存失敗：' + e.message, true); }
    }
    async function deleteRule(ruleId) {
        if (!confirm('確定要刪除這個重複性收支規則嗎？（已產生的紀錄不受影響）')) return;
        const backup = [...STATE.rules];
        STATE.rules = STATE.rules.filter(r => r.rule_id !== ruleId);
        renderSettings();
        try { await api.call('deleteRule', { rule_id: ruleId }); toast('已刪除'); }
        catch (e) { STATE.rules = backup; renderSettings(); toast('刪除失敗：' + e.message, true); }
    }

    let _newItem = { group: '', name: '', icon: 'fa-tag' };

        _newItem = { group, name: '', icon: group === 'PAYMENT_TAG' ? 'fa-credit-card' : 'fa-tag' };
        openItemSheet();
    }
    function pickNewIcon(ic) { _newItem.icon = ic; _newItem.name = document.getElementById('niName')?.value || ''; openItemSheet(); }
    function openItemSheet() {
        const g = _newItem.group;
        openSheet(`
            <h3 class="text-lg font-bold text-stone-800 mb-5">${g === 'PAYMENT_TAG' ? '新增帳戶 / 標籤' : g === 'INCOME_CATEGORY' ? '新增收入分類' : '新增支出分類'}</h3>

                <div class="w-14 h-14 rounded-tile flex items-center justify-center text-2xl flex-shrink-0"
                     style="background:${hexA('#F8A048', .16)};color:#F8A048"><i class="fa-solid ${esc(_newItem.icon)}"></i></div>
                <input id="niName" value="${esc(_newItem.name)}" placeholder="名稱，例如：富邦-信用卡"
                    class="field flex-1 w-full p-3.5 rounded-tile bg-pastel-bg border border-pastel-border text-stone-800">
            </div>
            <div class="text-xs font-bold text-stone-500 mb-2">選一個圖示</div>
            <div class="space-y-4 mb-5">
                ${ICON_PICKER.map(([label, list]) => `
                    <div>
                        <div class="text-[11px] text-pastel-muted mb-1.5">${esc(label)}</div>
                        <div class="grid grid-cols-7 gap-2">
                            ${list.map(ic => `<button onclick="pickNewIcon('${ic}')"
                                class="aspect-square rounded-xl flex items-center justify-center text-base border transition-all tactile ${_newItem.icon === ic ? 'bg-pastel-accent text-white border-pastel-accent shadow-sm' : 'bg-pastel-bg text-stone-600 border-pastel-border'}">
                                <i class="fa-solid ${ic}"></i></button>`).join('')}
                        </div></div>`).join('')}
            </div>
            <button onclick="confirmAddItem()" class="w-full py-4 bg-pastel-accent text-white font-bold rounded-tile shadow-md text-sm tactile">新增</button>`);
    }
    async function confirmAddItem() {
        const name = (document.getElementById('niName')?.value || '').trim();
        if (!name) { buzz(30); return toast('請輸入名稱', true); }
        const group = _newItem.group, icon = _newItem.icon;
        closeSheet();
        const item = { item_name: name, item_group: group, icon_emoji: icon };
        if (group === 'PAYMENT_TAG') STATE.tags.push(item); else STATE.categories.push(item);
        renderSettings(); initAddForm(true);
        if (group !== 'PAYMENT_TAG') addState.cat = name; else addState.tag = name;
        paintTagRow();
        try { await api.call('addItem', { item }); toast('已新增'); }
        catch (e) {
            if (group === 'PAYMENT_TAG') STATE.tags = STATE.tags.filter(x => x.item_name !== name);
            else STATE.categories = STATE.categories.filter(x => x.item_name !== name);
            renderSettings(); initAddForm(true); toast(e.message, true);
        }
    }
    async function archiveItem(name, group) {
        if (!confirm(`確定要停用「${name}」嗎？（歷史紀錄不受影響）`)) return;
        const bc = [...STATE.categories], bt = [...STATE.tags];
        if (group === 'PAYMENT_TAG') STATE.tags = STATE.tags.filter(x => x.item_name !== name);
        else STATE.categories = STATE.categories.filter(x => !(x.item_name === name && x.item_group === group));
        renderSettings(); initAddForm();
        try { await api.call('archiveItem', { item_name: name, item_group: group }); toast('已停用'); }
        catch (e) { STATE.categories = bc; STATE.tags = bt; renderSettings(); initAddForm(); toast(e.message, true); }
    }

    /* ---------- 設定頁動作：每一顆都要有可見回饋 ---------- */
    function btnBusy(id, text) {
        const b = document.getElementById(id); if (!b) return () => { };
        const old = b.innerHTML; b.disabled = true;
        b.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin mr-1.5"></i>${esc(text)}`;
        return () => { b.disabled = false; b.innerHTML = old; };
    }
    function actExport() { buzz(); const done = btnBusy('btnExport', '匯出中…'); try { exportCSV(); } finally { setTimeout(done, 700); } }
    async function actSync() { buzz(); const done = btnBusy('btnSync', '同步中…'); await refreshData(); done(); }
    function actReload() { buzz(); btnBusy('btnReload', '重新載入中…'); toast('正在載入最新版本…'); setTimeout(() => location.reload(), 500); }

    /* ---------- CSV 匯出 ---------- */
    function exportCSV() {
        const rows = filteredTxns();
        if (!rows.length) return toast('目前沒有可匯出的紀錄', true);
        const head = ['日期', '類型', '分類', '帳戶標籤', '金額', '備註', '費用歸屬', '記帳者'];
        const cell = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
        const csv = '\uFEFF' + [head.map(cell).join(',')]     // BOM 讓 Excel 正確辨識中文
            .concat(rows.map(t => [t.date, t.entry_type, t.category, t.tag, t.amount, t.note, t.nature, nameOf(t.member_id)].map(cell).join(',')))
            .join('\r\n');
        const name = `家庭記帳_${filters.allTime ? '全期間' : viewYM}_${currentMode === 'family' ? '家庭' : STATE.me?.nickname}.csv`;
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });

        // iOS PWA 對 <a download> 支援差，優先用系統分享
        const file = (typeof File !== 'undefined') ? new File([blob], name, { type: 'text/csv' }) : null;
        if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
            navigator.share({ files: [file], title: name }).catch(() => { });
            return;
        }
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = name; document.body.appendChild(a); a.click();
        setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1200);
        toast(`已匯出 ${rows.length} 筆`);
    }

    /* ==========================================================
       版面高度：唯一可靠的來源是 visualViewport / innerHeight
       ========================================================== */
    let LAYOUT = {};
    function measureDvh() {
        const dp = document.createElement('div');
        dp.style.cssText = 'position:fixed;top:0;left:0;width:0;height:100dvh;pointer-events:none;visibility:hidden';
        document.body.appendChild(dp);
        const px = Math.round(dp.getBoundingClientRect().height);
        dp.remove();
        return px;
    }
    function syncFrameHeight() {
        if (window.innerWidth >= 768) {                 // 桌機交回 CSS 處理
            document.documentElement.style.removeProperty('--appH');
            return;
        }
        const vv = window.visualViewport;
        // 鍵盤彈出時 iOS 會把整個版面往上捲，導致上方 Header 消失。
        // 對策：讓外框直接縮到「鍵盤上方的可視高度」，並強制把捲動位置歸零。
        const kbOpen = !!(vv && (window.innerHeight - vv.height) > 120);
        // 平時不覆寫高度：iOS PWA 的 innerHeight 會比實體可視高度少一個安全區，
        // 只有 CSS 的 100dvh 是對的。只有鍵盤彈出、需要縮小版面時才由 JS 接手。
        let h;
        if (kbOpen) {
            h = Math.round(vv.height);
            document.documentElement.style.setProperty('--appH', h + 'px');
            window.scrollTo(0, 0); document.body.scrollTop = 0;
        } else {
            // iOS PWA 的 dvh / innerHeight / visualViewport 都少報一個上方安全區，
            // 但畫面是從 y=0 開始畫的，真正可畫高度 = dvh + sat。
            // 再以 screen.height 為上限，避免其他平台重複相加而溢出。
            const satPx = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--sat')) || 0;
            const base = measureDvh();
            const scr = (window.screen && window.screen.height) ? window.screen.height : Infinity;
            h = Math.round(Math.min(base + satPx, scr));
            document.documentElement.style.setProperty('--appH', h + 'px');
        }
        // 導覽列是 fixed，主內容區必須自己讓出等高的底部空間
        const nav = document.getElementById('appNav');
        const navH = nav && !nav.classList.contains('js-hide') ? (nav.offsetHeight || Math.round(nav.getBoundingClientRect().height)) : 0;
        if (navH > 0) document.documentElement.style.setProperty('--navH', navH + 'px');
        // 實測 100dvh 換算出的像素，用來確認它是否等於實體螢幕高度
        const dvhPx = measureDvh();

        const frame = document.getElementById('appFrame');
        LAYOUT = {
            innerH: window.innerHeight,
            visualH: vv ? Math.round(vv.height) : null,
            used: h,
            screenH: window.screen ? Math.round(window.screen.height) : null,
            dvh: dvhPx,
            frameBottom: frame ? Math.round(frame.getBoundingClientRect().bottom) : null,
            navBottom: nav ? Math.round(nav.getBoundingClientRect().bottom) : null,
            navH: navH,
            standalone: !!(window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches),
            safeBottom: getComputedStyle(document.documentElement).getPropertyValue('--sab').trim() || '?',
            safeTop: getComputedStyle(document.documentElement).getPropertyValue('--sat').trim() || '?'
        };
        paintDiag();          // 量完立刻更新讀數，避免顯示的是開機當下的舊值
    }

    function diagText() {
        const L = LAYOUT;
        const gap = (L.screenH != null && L.navBottom != null) ? (L.screenH - L.navBottom) : null;
        return `frameH=${L.used ?? '?'} dvh=${L.dvh ?? '-'} in=${L.innerH ?? '?'} vv=${L.visualH ?? '-'} scr=${L.screenH ?? '-'}
frameBtm=${L.frameBottom ?? '-'} navBtm=${L.navBottom ?? '-'} navH=${L.navH ?? '-'}
底部落差=${(L.dvh != null && L.navBottom != null) ? (L.dvh - L.navBottom) : '-'}  sat=${L.safeTop || '?'}  sab=${L.safeBottom || '?'}
${L.standalone ? 'PWA' : 'WEB(Safari)'}  dpr=${window.devicePixelRatio}  statusBar=${(L.screenH != null && L.innerH != null) ? (L.screenH - L.innerH) : '-'}`;
    }
    function paintDiag() {
        const el = document.getElementById('diagBox');
        if (el) el.textContent = diagText();
    }
    function bindLayout() {
        // 讀出安全區數值供診斷用
        const probe = document.createElement('div');
        probe.style.cssText = 'position:fixed;bottom:0;height:env(safe-area-inset-bottom,0px);width:0';
        document.body.appendChild(probe);
        const probeT = document.createElement('div');
        probeT.style.cssText = 'position:fixed;top:0;height:env(safe-area-inset-top,0px);width:0';
        document.body.appendChild(probeT);
        const sat = Math.round(probeT.getBoundingClientRect().height);
        probeT.remove();
        document.documentElement.style.setProperty('--sat', sat + 'px');
        // 修正 v4.5.0 的誤判：iOS PWA 確實從 Y=0 開始繪製（所以這段留白是必要的），
        // 少報的是 innerHeight 而不是安全區。直接沿用安全區原值。
        document.documentElement.style.setProperty('--topPad', sat + 'px');
        let sab = Math.round(probe.getBoundingClientRect().height);
        probe.remove();
        // iOS 偶爾在 standalone 下把 env(safe-area-inset-bottom) 回報成 0，
        // 但機身其實有 Home Indicator。以「無實體 Home 鍵機型」為判準補上固定值。
        const standalone = !!(window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches);
        if (sab === 0 && standalone && window.innerHeight >= 780) sab = 20;
        document.documentElement.style.setProperty('--sab', sab + 'px');

        syncFrameHeight();
        // 導覽列一開始帶著 js-hide（display:none），量到的高度必然是 0。
        // 用 ResizeObserver 追蹤，它一顯示或高度變動就自動重量。
        const nav = document.getElementById('appNav');
        if (nav && window.ResizeObserver) new ResizeObserver(() => syncFrameHeight()).observe(nav);
        window.addEventListener('resize', syncFrameHeight);
        window.addEventListener('orientationchange', () => setTimeout(syncFrameHeight, 260));
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', syncFrameHeight);
            window.visualViewport.addEventListener('scroll', () => { window.scrollTo(0, 0); syncFrameHeight(); });
        }
        // 輸入框取得焦點時 iOS 常會自行捲動版面，這裡把它拉回來
        document.addEventListener('focusin', e => {
            if (!/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
            setTimeout(() => { window.scrollTo(0, 0); syncFrameHeight(); }, 120);
            setTimeout(() => { window.scrollTo(0, 0); syncFrameHeight(); }, 420);
        });
        document.addEventListener('focusout', () => setTimeout(() => { window.scrollTo(0, 0); syncFrameHeight(); }, 200));
    }

    /* ==========================================================
       自動更新：偵測到新版就跳橫幅，不必再手動刪圖示重加
       ========================================================== */
    let swReg = null, reloadedOnce = false;
    function showUpdateBar() { document.getElementById('updateBar').classList.remove('js-hide'); }
    function applyUpdate() {
        document.getElementById('updateBar').classList.add('js-hide');
        toast('更新中…');
        if (swReg && swReg.waiting) swReg.waiting.postMessage({ type: 'SKIP_WAITING' });
        setTimeout(() => location.reload(), 600);
    }
    function initServiceWorker() {
        if (!('serviceWorker' in navigator)) return;
        navigator.serviceWorker.register('./sw.js').then(reg => {
            swReg = reg;
            if (reg.waiting) showUpdateBar();
            reg.addEventListener('updatefound', () => {
                const nw = reg.installing;
                if (!nw) return;
                nw.addEventListener('statechange', () => {
                    if (nw.state === 'installed' && navigator.serviceWorker.controller) showUpdateBar();
                });
            });
            setInterval(() => reg.update().catch(() => { }), 30 * 60 * 1000);   // 每 30 分鐘查一次
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden) reg.update().catch(() => { });
            });
        }).catch(() => { });
        navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (reloadedOnce) return; reloadedOnce = true;
            location.reload();
        });
    }

    /* ---------- 啟動 ---------- */
    if (window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches) {
        document.getElementById('fakeStatusBar').classList.add('js-hide');
    }
    try { screen.orientation && screen.orientation.lock && screen.orientation.lock('portrait').catch(() => { }); } catch (e) { }
    initServiceWorker();
    applyTheme();
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (getTheme() === 'auto') applyTheme(); });
    window.addEventListener('DOMContentLoaded', () => { bindLayout(); bootstrap(); });
    </script>
