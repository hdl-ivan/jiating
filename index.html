<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <!-- black-translucent：讓網頁內容延伸到狀態列底下，狀態列才會是我們的奶油色而不是系統白 -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="家庭記帳">
    <meta name="theme-color" content="#FFF8F0">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./icon-180.png">
    <link rel="icon" href="./icon-192.png">

    <title>家庭記帳</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.3.1/css/all.min.css">
    <!-- 拖曳排序。先試同源的副本（Service Worker 快取得到、離線也能用），
         沒有才退回 CDN。版本固定，不用 @latest —— 上游改版不該在半夜弄壞使用者的 App。 -->
    <script src="./sortable.min.js" onerror="this.remove();document.write('<script src=\'https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js\'><\/script>')"></script>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        /* 取自角色頭像的色票，飽和度提高、色溫轉暖 */
                        pastel: {
                            bg: '#FFF8F0', card: '#FFFFFF', text: '#3A3330', muted: '#9A918A', border: '#F3E7D8',
                            accent: '#F8A048', accentLight: '#FFEEDA',
                            red: '#F05838', redLight: '#FFE8E2',
                            green: '#40B868', greenLight: '#E2F6E9',
                            blue: '#3090F8', blueLight: '#E4F0FF',
                            sky: '#88D8F8', skyLight: '#E9F7FE',
                            yellow: '#F8C850', yellowLight: '#FFF4D8',
                            pink: '#F0A8B0', pinkLight: '#FDECEF',
                            purple: '#A084E8'
                        }
                    },
                    borderRadius: { 'card': '24px', 'sheet': '32px', 'tile': '16px' },
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans TC', 'sans-serif'],
                        rounded: ['Comfortaa', 'Noto Sans TC', 'sans-serif']
                    },
                    boxShadow: {
                        'soft': '0 10px 30px rgba(248, 160, 72, 0.22)',
                        'card': '0 4px 18px rgba(160, 130, 100, 0.07)',
                        'glow-gold': '0 0 16px rgba(248, 200, 80, 0.75)'
                    }
                }
            }
        }
    </script>
    <style>
        /* 版面錨定：不使用任何百分比高度。
           iOS 的 position:fixed + height:100% 在工具列伸縮時解析出的值不等於實際可視高度，
           底部會差一截；直接把外框釘在視窗四邊（inset:0）才會真正貼底。 */
        html, body {
            background-color:#FBF2E6; height:100%; margin:0; padding:0;
            overflow:hidden; overscroll-behavior:none; touch-action:manipulation;
        }
        body { font-family:'Inter','Noto Sans TC',sans-serif; color:#3A3330; -webkit-tap-highlight-color:transparent; }

        /* ID 選擇器優先權高於 Tailwind class，直接覆寫外框定位。
           高度不用 inset:0 也不用 dvh —— iOS 對這兩者的解析在標準列／安全區存在時
           不見得等於使用者實際看到的高度。改由 JS 量測 visualViewport 寫入 --appH，
           這是唯一保證與螢幕所見一致的來源。 */
        #appFrame {
            position:fixed; inset:0;
            width:100%; max-width:none;
            /* iOS PWA 三個高度來源（innerHeight / visualViewport / 100dvh）
               都會少報一個「上方安全區」的量，但畫面其實是從 y=0 開始畫的，
               因此真正的可畫高度 = 100dvh + safe-area-inset-top。 */
            height:calc(100dvh + env(safe-area-inset-top, 0px));
            height:var(--appH, calc(100dvh + env(safe-area-inset-top, 0px)));
            border-radius:0; border:0;
            display:flex; flex-direction:column;
        }

        /* ── 手機：導覽列不再依賴外框的 flex 計算，直接釘在「視窗」底邊 ──
           先前三個版本都是想辦法讓外框高度正確、再讓 flex 把 nav 推到底。
           只要外框高度有一點誤差，nav 就會懸空。改成 fixed 之後，
           不論外框算成多高，nav 永遠貼在螢幕最底。 */
        @media (max-width:767px) {
            /* 必須是 absolute 不能是 fixed：
               fixed 錨定的是「視窗」（iOS 少報 62px），absolute 才錨定「外框」（實際 874）。
               這是導覽列一直懸空 62px 的最後一個原因。 */
            #appNav   { position:absolute; left:0; right:0; bottom:0; }
            #appMain  { padding-bottom:var(--navH, 92px); }
            #toast    { position:absolute; left:0; right:0; bottom:calc(var(--navH, 92px) + 14px); }
        }
        /* 桌機恢復置中的手機外框 */
        @media (min-width:768px) {
            html, body { height:auto; overflow:auto; }
            #appFrame {
                position:relative; top:auto; left:auto; right:auto; bottom:auto; margin:0 auto;
                width:100%; max-width:28rem; height:880px;
                border-radius:44px; border-width:10px;
                display:flex; flex-direction:column;
            }
        }
        #appMain { -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }
        /* 導覽列背景延伸到 Home Indicator 底下，padding 只負責把內容推上來 */
        /* iOS PWA 的版面視窗比實體螢幕矮一個上安全區（實測 62px），
           那塊區域任何元素都畫不進去，WebKit #295283 至今未解，
           且官方建議的 obscuredContentInsets 是原生 App API，網頁端拿不到。
           因此所有可點擊元件一律避開底部 64px。 */
        #appNav { background-color:#FFFFFF; padding-bottom:max(64px, calc(0.35rem + var(--sab, env(safe-area-inset-bottom, 0px)))); }
        #sheetContent, #profileModalContent { padding-bottom:max(64px, calc(1.5rem + var(--sab, env(safe-area-inset-bottom, 0px)))) !important; }
        html.dark #appNav { background-color:#221F1D !important; }
        html.dark .nav-btn { color:#8F857A; }
        /* 已加入主畫面時，整個底色改成 App 奶油色，狀態列區域才不會露出不同色 */
        /* iOS PWA 的版面視窗（812）比實體螢幕（874）矮，中間那 62px 只會被
           canvas 背景填滿——任何元素都畫不進去。把它設成與導覽列同色，
           視覺上導覽列就是延伸到螢幕最底，不會再出現那條奶油色橫帶。 */
        @media (display-mode: standalone) { html, body { background-color:#FFFFFF; } }
        html.dark, html.dark body { background-color:#221F1D !important; }
        .hide-scrollbar::-webkit-scrollbar { display:none; }
        .hide-scrollbar { -ms-overflow-style:none; scrollbar-width:none; }

        /* 拖曳排序（SortableJS，forceFallback 模式）
           分身的 position/transform 由 SortableJS 以 inline style 控制，
           這裡只負責外觀，不要寫 position 或 transform 去跟它打架。 */
        .drag-row { will-change:transform; }
        .drag-row.dragging {
            box-shadow:0 10px 24px rgba(0,0,0,.16);
            border-color:#F8A048;
            scale:1.02;
            opacity:1 !important;
        }
        .drag-row.dragging .drag-handle { color:#F8A048; }
        /* 留在原地的洞：只保留高度，讓其他卡片滑過來填補 */
        .drag-ghost { opacity:0; }
        /* 把手放右側（單手持機時拇指的自然位置），並給滿 44pt 的觸控範圍。
           圖示本身只有 16px，靠 padding 把可按範圍撐開到整列高、寬 52px。 */
        .drag-handle {
            touch-action:none; cursor:grab;
            min-width:52px; min-height:44px;
            padding:0 18px 0 14px;
            margin:-10px 0;                 /* 往上下吃滿整列，不改變列高 */
        }
        .drag-handle:active { cursor:grabbing; }

        /* ---------- 文字選取：全域鎖死、白名單開放 ----------
           touch-action:none 只能擋掉「把滑動當成捲動」，擋不掉 iOS 把長按當成選取文字。
           拖曳排序時跳出「拷貝／查詢／翻譯」那條選單，就是這個原因。
           與其在拖曳時開開關關（狀態一定會漏），不如預設全鎖，需要複製的地方再開。 */
        body { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
        input, textarea, select, [contenteditable] {
            -webkit-user-select:auto; user-select:auto; -webkit-touch-callout:default;
        }
        /* 白名單：使用者真的會想複製出去的東西 */
        .selectable {
            -webkit-user-select:text; user-select:text; -webkit-touch-callout:default; cursor:text;
        }
        input, select, textarea { font-size:16px; }

        /* iOS 的空白日期欄位會塌成比其他欄位矮一截 —— 沒有值就沒有內容撐開高度。
           固定最小高度，並讓內部的值區塊也有高度，空的跟填好的看起來才一樣大。 */
        input[type="date"], input[type="month"], input[type="time"] {
            -webkit-appearance:none; appearance:none;
            width:100%; min-width:0; max-width:100%; box-sizing:border-box; display:block;
            min-height:42px; line-height:1.25;
        }
        input[type="date"]::-webkit-date-and-time-value { text-align:left; min-height:20px; margin:0; }
        input[type="date"]::-webkit-calendar-picker-indicator { opacity:.45; }
        select { -webkit-appearance:none; appearance:none; background-image:none; min-width:0; }
        .field { min-width:0; }

        .swipe-wrap { touch-action:pan-y; }
        .swipe-inner { will-change:transform; transition:transform .24s cubic-bezier(.22,.61,.36,1); }
        .swipe-inner.dragging { transition:none; }
        .swipe-bg { transition:background-color .15s linear; }

        .js-hide { display:none !important; }

        /* 聯想套用後，被自動填入的區塊輕輕縮放一下，讓使用者看得出「剛剛發生了什麼」 */
        @keyframes popFill { 0% { transform:scale(1); } 45% { transform:scale(.972); } 100% { transform:scale(1); } }
        .pop-fill { animation:popFill .24s cubic-bezier(.22,.61,.36,1); }

        /* 同步中的轉動回饋 */
        @keyframes spinSlow { to { transform:rotate(360deg); } }
        .spin-slow { animation:spinSlow .9s linear infinite; }

        /* ── 底部導覽列：貼齊外框底邊的白色橫條 ──
           白底一路延伸進底部 64px 的死區，視覺上是完整接地的一條，
           不是浮在半空中、下面又露出一塊白的組合。
           只留圖示不留文字，所以整條比原本矮一截。 */
        #appNav {
            display:flex; justify-content:space-around; align-items:center;
            padding-top:4px;
            border-top:1px solid var(--nav-border, #E7E0D5);
            box-shadow:0 -10px 40px rgba(160,130,100,.06);
            /* 收合改用位移＋淡出。不能用 max-height + overflow:hidden，
               那個 overflow 會裁掉任何凸出導覽列的元件（v6.7.0 的加號就是這樣被切掉的）。 */
            transition:transform .2s ease, opacity .2s ease;
        }
        #appNav.kb-hide { transform:translateY(110%); opacity:0; pointer-events:none; }
        html.dark #appNav { --nav-border:#3A3430; }
        .nav-btn {
            /* 44px 是 Apple 的最小觸控目標，再小就會開始按不準 */
            width:44px; height:44px; border-radius:999px;
            display:flex; align-items:center; justify-content:center;
            font-size:19px; color:#A79E92;
            transition:color .18s ease, background .18s ease, transform .18s ease;
        }
        .nav-btn:active { transform:scale(.9); }
        .nav-btn.nav-active { color:#F8A048; background:rgba(248,160,72,.12); }
        .mode-family .nav-btn.nav-active { color:#3090F8; background:rgba(48,144,248,.12); }
        /* 加號留在橫條之內，不凸出去 —— 顏色已經足夠把它跟其他圖示分開，
           而且凸出去的元件只要外層哪天加了 overflow 就會被裁掉。 */
        .nav-add { width:52px; height:44px; }
        #addBtnInner {
            width:44px; height:44px; border-radius:999px;
            display:flex; align-items:center; justify-content:center;
            background:#F8A048; color:#fff; font-size:20px;
            box-shadow:0 4px 12px rgba(248,160,72,.4);
            transition:transform .2s ease, box-shadow .2s ease, background .3s ease;
        }
        .nav-add-on #addBtnInner { transform:rotate(45deg); box-shadow:0 4px 16px rgba(248,160,72,.55); }

        /* ───────── 深色模式 ─────────
           以覆寫實際使用到的 Tailwind 工具類別實作，
           不必改動任何一處 markup，切換即時生效。 */
        html.dark { color-scheme:dark; }
        html.dark, html.dark body { background-color:#171514 !important; color:#E9E2D8; }
        html.dark .bg-white, html.dark .bg-white\/95, html.dark .bg-white\/70, html.dark .bg-white\/60 { background-color:#221F1D !important; }
        html.dark .bg-pastel-bg { background-color:#2B2724 !important; }
        html.dark .bg-\[\#FBF2E6\] { background-color:#171514 !important; }
        html.dark .bg-stone-800 { background-color:#3A3430 !important; }
        html.dark .bg-stone-100, html.dark .bg-stone-200\/40, html.dark .bg-stone-200\/50 { background-color:#332F2C !important; }
        html.dark .text-pastel-text, html.dark .text-stone-800, html.dark .text-stone-700 { color:#EFE7DC !important; }
        html.dark .text-stone-600, html.dark .text-stone-500 { color:#BDB3A6 !important; }
        html.dark .text-pastel-muted, html.dark .text-stone-400 { color:#8F857A !important; }
        html.dark .border-pastel-border, html.dark .border-stone-100, html.dark .border-stone-200 { border-color:#3A3430 !important; }
        html.dark .border-pastel-border\/60, html.dark .border-pastel-border\/70 { border-color:#332F2C !important; }
        html.dark .bg-pastel-accentLight { background-color:rgba(248,160,72,.16) !important; }
        html.dark .bg-pastel-greenLight  { background-color:rgba(64,184,104,.16) !important; }
        html.dark .bg-pastel-redLight    { background-color:rgba(240,88,56,.16) !important; }
        html.dark .bg-pastel-blueLight   { background-color:rgba(48,144,248,.16) !important; }
        html.dark .bg-pastel-yellowLight { background-color:rgba(248,200,80,.16) !important; }
        html.dark .bg-pastel-skyLight    { background-color:rgba(136,216,248,.16) !important; }
        html.dark .bg-pastel-pinkLight   { background-color:rgba(240,168,176,.16) !important; }
        html.dark .shadow-card, html.dark .shadow-sm, html.dark .shadow-md { box-shadow:0 4px 18px rgba(0,0,0,.35) !important; }
        html.dark #appFrame { border-color:#000 !important; }
        html.dark img[src*="av"] { filter:brightness(.94); }
        /* 深色下未選取的選項底色若跟背景太接近會看不見，這裡拉高對比並補上邊框 */
        html.dark .bg-pastel-bg { background-color:#33302C !important; }
        html.dark .border-pastel-border { border-color:#4A443E !important; }
        html.dark [style*="background:rgba"] { outline:1px solid rgba(255,255,255,.10); outline-offset:-1px; }
        html.dark .text-stone-600 { color:#CFC5B8 !important; }
        html.dark input, html.dark select, html.dark textarea { color:#EFE7DC !important; }
        html.dark input::placeholder { color:#8F857A !important; }

        /* 橫向時擋住主畫面（排除桌機大螢幕） */
        #rotateGate { display:none; }
        @media (orientation:landscape) and (max-height:560px) {
            #rotateGate { display:flex; }
            #appFrame  { display:none; }
        }

        /* 主卡外殼：深色模式時白框轉為深色，彩色內卡不變，
           嵌套關係在兩種主題下都成立 */
        html.dark .hero-shell { background-color:#221F1D !important; }

        /* ───────── 家庭模式的最小視覺區隔 ─────────
           不改整體色相，只把導覽列的作用中色與加號按鈕換成主藍，
           一眼就知道「我現在在哪一本帳」。 */
        .mode-family .nav-active { color:#3090F8 !important; }
        .mode-family #addBtnInner {
            background:#3090F8 !important;
            box-shadow:0 6px 20px rgba(48,144,248,.42) !important;
        }


        /* 光環進階：脈衝發光 */
        @keyframes auraPulse {
            0%   { box-shadow:0 0 0 0 rgba(248,200,80,.75); transform:scale(1); }
            35%  { box-shadow:0 0 0 14px rgba(248,200,80,0); transform:scale(1.08); }
            70%  { box-shadow:0 0 0 0 rgba(248,200,80,.55); transform:scale(1); }
            100% { box-shadow:0 0 0 14px rgba(248,200,80,0); transform:scale(1); }
        }
        .aura-pulse { animation:auraPulse 1.3s ease-out 2; }

        /* 短週期任務：橫向微型方塊 */
        .task-rail { scroll-snap-type:x proximity; -webkit-overflow-scrolling:touch; }
        .task-card { scroll-snap-align:start; }
        @keyframes taskDone { 0%{transform:scale(1)} 45%{transform:scale(1.16)} 100%{transform:scale(1)} }
        .task-tick { animation:taskDone .42s cubic-bezier(.3,.8,.4,1); }

        /* 6. 觸覺感 UI：按下時輕微下沉 */
        /* 小型控制項：按下微微下沉 */
        .tactile { transition:transform .09s ease, box-shadow .09s ease; }
        .tactile:active { transform:translateY(2px); box-shadow:0 1px 4px rgba(160,130,100,.14) !important; }
        /* 大面積卡片：整塊下沉會有閃動感，改為微縮＋陰影變淺 */
        .tactile-card { transition:transform .12s cubic-bezier(.2,.7,.4,1), box-shadow .12s ease; }
        .tactile-card:active { transform:scale(.985); box-shadow:0 2px 8px rgba(160,130,100,.10) !important; }

        /* ───────── 籌碼：帶厚度的實體硬幣 ─────────
           左側偏移一層做出幣身厚度。滾花邊是沿著幣緣一圈的直紋，
           從側面看是「一條條橫線」，所以用 0deg 的重複漸層畫水平線，
           並且直接用深色描邊的顏色，不用色塊相間。 */
        .coin3d { position:relative; flex-shrink:0; }
        .coin3d .edge {
            position:absolute; inset:0; border-radius:9999px;
            transform:translateX(-3px);
            background:var(--cMid);
            box-shadow:0 2px 5px rgba(0,0,0,.28), inset 0 0 0 1px var(--cDark);
        }
        .coin3d .edge::after {
            content:''; position:absolute; inset:0; border-radius:9999px;
            background:repeating-linear-gradient(0deg, var(--cDark) 0 1px, transparent 1px 3px);
            opacity:.85;
        }
        .coin3d .face {
            position:absolute; inset:0; border-radius:9999px;
            background:var(--cFace); border:1.5px solid var(--cDark);
            display:flex; align-items:center; justify-content:center; overflow:hidden;
        }
        /* 第二層圓框 */
        .coin3d .face::before {
            content:''; position:absolute; inset:2.5px; border-radius:9999px;
            border:1.5px solid var(--cDark); opacity:.65;
        }
        /* 中央頭像：與第二層圓框同大小，把整個內圈填滿 */
        .coin3d .pic {
            position:absolute; inset:4px; width:auto; height:auto;
            border-radius:9999px; object-fit:cover; background:#fff;
            display:flex; align-items:center; justify-content:center;
        }
        .coin-gold   { --cFace:radial-gradient(circle at 34% 28%,#FFF0BC,#F8C850 58%,#E0A81E);
                       --cDark:#8A6410; --cMid:#E8B93A; }
        .coin-silver { --cFace:radial-gradient(circle at 34% 28%,#FBFDFE,#D5DDE3 58%,#A9B4BD);
                       --cDark:#5C6870; --cMid:#BCC6CE; }

        /* 8. 記帳完成微互動：金幣飛向大頭貼 */
        .coin { position:absolute; width:26px; height:26px; border-radius:9999px;
                background:radial-gradient(circle at 32% 30%, #FFE9A8, #F8C850 60%, #E0A81E);
                box-shadow:0 2px 8px rgba(224,168,30,.5); z-index:96; pointer-events:none;
                display:flex; align-items:center; justify-content:center;
                font-size:13px; font-weight:700; color:#8A6410; }

        /* 新增後在明細高亮該筆 */
        @keyframes newFlash { 0%{box-shadow:0 0 0 0 rgba(248,160,72,.65)} 100%{box-shadow:0 0 0 14px rgba(248,160,72,0)} }
        .is-new > .swipe-inner { animation:newFlash 1.6s ease-out 2; border-color:#F8A048 !important; }
        @keyframes spin { to { transform:rotate(360deg); } }
        .spinner { animation:spin .8s linear infinite; }
        @keyframes pulseSoft { 0%,100%{opacity:.5} 50%{opacity:1} }

    function parseInstall(raw) {

        if (/\/dev(?![\w-])/.test(s)) return { dev: true };

        if (m) {
            id = m[1];

    const localStamp = () => {

    /* GAS Web App 的 /exec 會 302 轉到 script.googleusercontent.com，
       回應較大時（例如單據影像）第一次常拿到 404 —— 這是已知的重導向抖動。
       因此對「唯讀」動作自動重試；寫入動作絕不重試，否則可能重複記帳。 */
    const READ_ONLY = ['bootstrap', 'listMembers', 'listTransactions', 'getReceipt', 'ping', 'diagnose'];
    /* ping 是「對一個全新部署發出的第一個請求」，正好是重導向抖動最容易發生的時刻，
       所以多給幾次。它是唯讀且冪等的，重試沒有任何副作用。 */
    const TRIES = { ping: 4 };
    const api = {
        async call(action, payload = {}) {
            if (CONFIG.DEMO) return DEMO_API(action, payload);
            const tries = TRIES[action] || (READ_ONLY.includes(action) ? 3 : 1);
            let lastErr;
            for (let n = 0; n < tries; n++) {
                if (n) await new Promise(z => setTimeout(z, 250 * n));   // 250ms、500ms
                try {
                    if (!CONFIG.API_URL) throw new Error('尚未設定後端網址');
                    const res = await fetch(CONFIG.API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action, familyCode: AUTH.familyCode, memberId: AUTH.memberId, ...payload }),
                        redirect: 'follow'
                    });
                    if (!res.ok) throw new Error(`連線失敗 (HTTP ${res.status})`);
                    const j = await res.json();
                    if (!j.ok) throw new Error(j.error || '後端錯誤');
                    // 任何一次回應都可能帶版本號，順手記下來做握手
                    if (j.data && j.data.apiVersion) BACKEND_VERSION = j.data.apiVersion;
                    return j.data;
                } catch (e) {
                    lastErr = e;
                    // 後端明確回報的錯誤不需要重試，直接拋出
                    if (!/HTTP|Failed to fetch|NetworkError|Load failed/i.test(e.message)) throw e;
                }
            }
            throw lastErr;
        }
    };

    let STATE = { familyName: '', members: [], categories: [], tags: [], transactions: [], rules: [], budgets: [], intents: [], goals: [], achievements: [], cheers: [], memberStats: {}, familyStats: {}, streakSaves: [], me: null, poolInitial: 0 };

/* 新增頁狀態（自建鍵盤用） */

/* 分類顏色：讓每個分類有自己的識別色，明細與圖表一致 */
const CAT_PALETTE = ['#F8A048', '#3090F8', '#40B868', '#F0A8B0', '#F8C850', '#88D8F8', '#A084E8', '#F05838'];
const FALLBACK_HEX = CAT_PALETTE;
function findItem(name) {
    return STATE.categories.find(x => x.item_name === name)
        || STATE.tags.find(x => x.item_name === name)
        || (STATE.archivedItems || []).find(x => x.item_name === name);   // 停用的舊分類也要查得到
}
function catColor(name) {
    const c = findItem(name);
    if (c && c.hex_color) return c.hex_color;
    // 沒設顏色的自訂項目（例如手動新增的「富邦-信用卡」）用名稱雜湊，
    // 保證同名永遠同色、不同名盡量不同色
    let h = 0;
    for (let i = 0; i < String(name).length; i++) h = (h * 31 + String(name).charCodeAt(i)) >>> 0;
    return FALLBACK_HEX[h % FALLBACK_HEX.length];
}
function hexA(hex, a) {
    const h = String(hex).replace('#', '');
    const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
    return `rgba(${r},${g},${b},${a})`;
}

    /* ==========================================================
       等級光環（連續記帳天數）

    /* 等級光環＝「當前」連續天數，斷了就掉回基礎階。
       門檻密集在前段（21 天是習慣養成的門檻），讓新手兩三週就能看到第一次進階，
       而不是等 100 天才有第一個回饋。 */
    const AURA = [
        { tier: 1, min: 0, name: '奶油米', color: 'text-stone-500', border: 'border-[#F3E7D8]', bg: 'bg-[#FDF7EF]', badge: 'bg-stone-400', ring: '#F3E7D8' },
        { tier: 2, min: 21, name: '暖陽橘', color: 'text-[#F8A048]', border: 'border-[#F8A048]', bg: 'bg-[#FFEEDA]', badge: 'bg-[#F8A048]', ring: '#F8A048' },
        { tier: 3, min: 50, name: '森林薄荷綠', color: 'text-[#40B868]', border: 'border-[#40B868]', bg: 'bg-[#E2F6E9]', badge: 'bg-[#40B868]', ring: '#40B868' },
        { tier: 4, min: 100, name: '海洋天空藍', color: 'text-[#3090F8]', border: 'border-[#88D8F8]', bg: 'bg-[#E9F7FE]', badge: 'bg-[#3090F8]', ring: '#88D8F8' },
        { tier: 5, min: 200, name: '紫水晶', color: 'text-[#A084E8]', border: 'border-[#A084E8]', bg: 'bg-[#F1ECFD]', badge: 'bg-[#A084E8]', ring: '#A084E8' },
        { tier: 6, min: 365, name: '耀眼星光金', color: 'text-[#D9A216]', border: 'border-[#F8C850] shadow-glow-gold', bg: 'bg-[#FFF4D8]', badge: 'bg-[#F8C850]', ring: '#F8C850' }
    ];
    function getLevelInfo(days) {
        days = Number(days) || 0;
        const level = Math.floor(days / 10) + 1;
        let i = 0;
        for (let k = 0; k < AURA.length; k++) if (days >= AURA[k].min) i = k;
        const t = AURA[i], nx = AURA[i + 1];
        const next = nx ? nx.min : days, prev = t.min;
        return {
            ...t, level, days, next, prev,
            progress: nx ? ((days - prev) / (next - prev)) * 100 : 100,
            isMax: !nx
        };
    }
    /** 歷史最高連續天數：光環會掉，但這個永久保留 */
    function bestStreak() {

    }

    /* ==========================================================

    const FUN_CATS = ['休閒娛樂', '訂閱服務'];

    function monthKeys(n) { const o = []; let ym = currentYM(); for (let i = 0; i < n; i++) { o.push(ym); ym = shiftYM(ym, -1); } return o; }

    /* 優先採用後端算好的元數據；後端若尚未部署新版就退回前端自算。
       這一層是為了讓成就不再依賴「前端持有全部歷史」——
       日後改成分頁載入時，成就邏輯不必重寫。 */
    function achievementStats() {
        const meId = STATE.me?.member_id;
        const srv = (STATE.memberStats || {})[meId];
        if (srv) return {
            streak: Number(STATE.me?.streak_days) || 0,
            count: srv.totalTxns || 0,
            receipts: srv.receipts || 0,
            advances: srv.advances || 0,
            settles: srv.settles || 0,
            goalsDone: srv.goalsDone || 0,
            surplusMonths: srv.surplusMonths || 0,
            highSaveMonths: srv.highSaveMonths || 0,
            activeDays: srv.activeDays || 0,
            surplusStreak: srv.surplusStreak || 0,
            funStreak: srv.funStreak || 0,
            budgetKeptMonths: srv.budgetKeptMonths || 0,
            disciplinedMonths: srv.disciplinedMonths || 0,
            savingRate: localSavingRate()
        };
        return localAchievementStats();
    }
    /* 本月儲蓄率永遠在前端算：它只需要當月資料，而且要能即時反映剛記的那一筆 */
    function localSavingRate() {
        const meId = STATE.me?.member_id, ym = currentYM();
        const mine = activeTxns().filter(t => t.payer_id === meId && inMonth(t.date, ym));
        const inc = mine.filter(t => t.entry_type === '收入').reduce((a, b) => a + Number(b.amount), 0);
        const exp = mine.filter(t => t.entry_type === '支出').reduce((a, b) => a + Number(b.amount), 0);
        return inc > 0 ? Math.round((inc - exp) / inc * 100) : 0;
    }
    function localAchievementStats() {
        const meId = STATE.me?.member_id;
        const mine = activeTxns().filter(t => t.payer_id === meId);
        const per = {};
        mine.forEach(t => {
            const k = String(t.date).slice(0, 7);
            per[k] = per[k] || { inc: 0, exp: 0, fun: 0 };
            const a = Number(t.amount) || 0;
            if (t.entry_type === '收入') per[k].inc += a;
            if (t.entry_type === '支出') { per[k].exp += a; if (FUN_CATS.includes(t.category)) per[k].fun += a; }
        });
        const ks = monthKeys(24);
        let surplusStreak = 0, funStreak = 0;
        for (const k of ks) { const m = per[k]; if (m && m.inc - m.exp > 0) surplusStreak++; else break; }
        for (const k of ks) { const m = per[k]; if (m && m.inc > 0 && m.fun <= m.inc * 0.1) funStreak++; else break; }
        const cur = per[currentYM()] || { inc: 0, exp: 0 };
        return {
            streak: Number(STATE.me?.streak_days) || 0,
            // 與後端定義一致：只有收支才算「記帳一筆」，還款與劃撥是資金移動
            count: mine.filter(t => t.entry_type === '支出' || t.entry_type === '收入').length,
            receipts: mine.filter(t => t.receipt_file_id).length,
            advances: mine.filter(t => t.nature === '家庭代墊' && t.entry_type === '支出').length,
            settles: mine.filter(t => t.entry_type === '還款').length,
            goalsDone: (STATE.goals || []).filter(g => g.status === '已結案' && g.owner_id === meId).length,
            surplusMonths: 0, highSaveMonths: 0, activeDays: 0,
            budgetKeptMonths: 0, disciplinedMonths: 0,
            surplusStreak, funStreak,
            savingRate: cur.inc > 0 ? Math.round((cur.inc - cur.exp) / cur.inc * 100) : 0
        };
    }

    /** 回傳徽章當前階級、下一階目標、以及往下一階的進度 */
    function badgeState(b, st) {
        const v = b.val(st) || 0;
        let tier = -1;
        for (let i = 0; i < b.goals.length; i++) if (v >= b.goals[i]) tier = i;
        const nextGoal = tier + 1 < b.goals.length ? b.goals[tier + 1] : null;
        const prevGoal = tier >= 0 ? b.goals[tier] : 0;
        const progress = nextGoal ? Math.min((v - prevGoal) / (nextGoal - prevGoal) * 100, 100) : 100;
        return { ...b, value: v, tier, nextGoal, prevGoal, progress, max: tier === b.goals.length - 1 };
    }
    function badgeList() {
        const st = achievementStats();
        return BADGES.map(b => badgeState(b, st));
    }

    /* 環形進度條。金→鑽石之間可能長達兩三年，
       在 25/50/75% 插入碎鑽節點填補「多巴胺沙漠」。 */
    function ringSvg(bs, size) {
        const R = 26, C = 2 * Math.PI * R, px = size || 76;
        const col = bs.tier >= 0 ? TIERS[bs.tier].color : '#C9BFB2';
        const nodes = bs.max ? '' : [25, 50, 75].map(p => {
            const ang = (p / 100) * 2 * Math.PI - Math.PI / 2;
            const on = bs.progress >= p;
            return `<circle cx="${(32 + R * Math.cos(ang)).toFixed(1)}" cy="${(32 + R * Math.sin(ang)).toFixed(1)}"
                r="${on ? 2.6 : 1.8}" fill="${on ? col : '#E7D9C6'}"/>`;
        }).join('');
        return `<svg viewBox="0 0 64 64" style="width:${px}px;height:${px}px">
            <circle cx="32" cy="32" r="${R}" fill="none" stroke="#F3E7D8" stroke-width="4"/>
            <circle cx="32" cy="32" r="${R}" fill="none" stroke="${col}" stroke-width="4" stroke-linecap="round"
                stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C * (1 - bs.progress / 100)).toFixed(1)}"
                transform="rotate(-90 32 32)" style="transition:stroke-dashoffset .8s ease"/>
            ${nodes}
        </svg>`;
    }

    }

    const HUE = {
        accent: ['bg-pastel-accentLight', 'text-pastel-accent'], blue: ['bg-pastel-blueLight', 'text-pastel-blue'],
        green: ['bg-pastel-greenLight', 'text-pastel-green'], sky: ['bg-pastel-skyLight', 'text-pastel-blue'],
        pink: ['bg-pastel-pinkLight', 'text-pastel-pink'], yellow: ['bg-pastel-yellowLight', 'text-[#D9A216]']
    };

    /** 把 6 個徽章的每一階展開成「可解鎖項目」，供慶祝與稱號使用。
        id 格式 badgeId_tierIndex，例如 audit_2 = 數位查帳員（金）。 */
    function achievementList() {
        const st = achievementStats(), out = [];
        BADGES.forEach(b => {
            const v = b.val(st) || 0;
            b.goals.forEach((g, i) => out.push({
                id: `${b.id}_${i}`, badgeId: b.id, tier: i, icon: b.icon,
                name: `${b.name}（${TIERS[i].name}）`, hue: 'accent',
                desc: `${b.desc} ${g} ${b.unit}`, cur: v, goal: g, unit: b.unit, done: v >= g
            }));
        });
        return out;
    }
    /** 稱號＝已解鎖中階級最高的那一個（同階取排序較後的） */
    function currentTitle(list) {
        const done = (list || achievementList()).filter(a => a.done);
        if (!done.length) return null;
        return done.reduce((best, a) => (a.tier > best.tier ? a : best), done[0]);
    }

    /* ==========================================================
       頭像渲染
       ========================================================== */
    function renderAvatar(elId, badgeId, isModal) {
        const el = document.getElementById(elId), badge = document.getElementById(badgeId);
        if (!el || !STATE.me) return;
        const i = getLevelInfo(STATE.me.streak_days);
        el.className = (isModal
            ? 'w-24 h-24 rounded-full border-[4px] flex items-center justify-center text-5xl overflow-hidden shadow-md transition-all duration-500'
            : 'w-12 h-12 rounded-full border-[3px] flex items-center justify-center text-xl overflow-hidden shadow-sm transition-all duration-500') + ` ${i.border} ${i.bg}`;
        el.innerHTML = avatarInner(STATE.me.avatar_emoji);
        /* LV 已移除：每十天升一級，跟連續天數是同一件事的兩種說法，
           擺在一起只是製造「這個數字代表什麼」的疑問。光環（顏色）留著，
           它有明確的六個階段門檻，比 LV 好懂。 */
        if (badge) badge.classList.add('js-hide');
    }

    function updateLevelDisplays() {
        if (!STATE.me) return;
        renderAvatar('userAvatar', 'levelBadge', false);
        const t = currentTitle();
        const chip = document.getElementById('titleChip');
        if (chip) {
            chip.innerHTML = t ? `<i class="fa-solid ${t.icon} mr-1"></i>${esc(t.name)}` : `<i class="fa-solid fa-seedling mr-1"></i>新手上路`;
            chip.className = 'flex-shrink-0 max-w-[92px] text-[10px] font-bold px-2.5 py-1.5 rounded-full border shadow-sm truncate ' +
                (t ? `${HUE[t.hue][0]} ${HUE[t.hue][1]} border-transparent` : 'bg-white border-pastel-border text-pastel-muted');
        }
        const s = document.getElementById('settingsAvatarContainer');
        if (s) {
            const i = getLevelInfo(STATE.me.streak_days);
            s.className = `w-16 h-16 mx-auto rounded-full border-[4px] flex items-center justify-center text-2xl overflow-hidden mb-3 ${i.border} ${i.bg}`;
            s.innerHTML = avatarInner(STATE.me.avatar_emoji);
            document.getElementById('settingsLevelName').className = `font-bold ${i.color}`;
            document.getElementById('settingsLevelName').innerText = i.name;
        }
    }

    /* ==========================================================
       計算層
       ========================================================== */
    const FAMILY_NATURES = ['家庭公帳', '家庭代墊', '公帳注資'];
    function activeTxns() { return (STATE.transactions || []).filter(t => t.status !== '作廢' && t.status !== '已修訂' && !t.is_rollup); }
    function inMonth(d, ym) { return String(d).slice(0, 7) === ym; }
    function nameOf(id) { const m = STATE.members.find(x => x.member_id === id); return m ? m.nickname : id; }
    function catIcon(name) {
        const c = findItem(name);
        return normIcon(c ? c.icon_emoji : '', c ? c.item_group : '');
    }

    /* ---------- 分攤（split_detail）解析 ----------
       家庭代墊與私人拆帳共用同一結構；舊資料（單一 related_id）視為長度 1 的陣列，
       讀取端只有一套邏輯，不需要資料遷移。 */
    function parseSplit(t) {
        if (t.split_detail) {
            try {
                const a = JSON.parse(t.split_detail);
                if (Array.isArray(a)) return a.filter(x => x && x.member_id && Number(x.amount) > 0)
                    .map(x => ({ member_id: x.member_id, amount: Number(x.amount) }));
            } catch (e) { }
        }
        if (t.nature === '私人拆帳' && t.related_id) return [{ member_id: t.related_id, amount: Number(t.amount) || 0 }];
        return [];
    }
    /** 這筆代墊／拆帳中，某成員已還了多少 */
    function paidFor(srcId, memberId) {
        return activeTxns().filter(t => t.entry_type === '還款' && t.parent_txn_id === srcId &&
            t.settle_member_id === memberId).reduce((a, b) => a + (Number(b.amount) || 0), 0);
    }
    /** 我被指定、還沒還完的所有項目（公帳代墊分攤 ＋ 私人拆帳，統一視圖） */
    function myPendingSettlements() {
        const meId = STATE.me?.member_id;
        const out = [];
        activeTxns().filter(t => (t.nature === '家庭代墊' || t.nature === '私人拆帳') && t.payer_id !== meId)
            .forEach(src => {
                const mine = parseSplit(src).find(x => x.member_id === meId);
                if (!mine) return;
                const remaining = mine.amount - paidFor(src.txn_id, meId);
                if (remaining <= 0.01) return;
                const intent = (STATE.intents || []).find(i => i.parent_txn_id === src.txn_id && i.member_id === meId);
                out.push({
                    itemType: src.nature === '家庭代墊' ? 'pool' : 'private',
                    srcId: src.txn_id, payerId: src.payer_id, payerName: nameOf(src.payer_id),
                    category: src.category, note: src.note, date: src.date,
                    expected: mine.amount, remaining, marked: !!intent
                });
            });
        return out.sort((a, b) => b.date.localeCompare(a.date));
    }
    /** 別人欠我、還沒還完的（付款人視角） */
    function othersOweMe() {
        const meId = STATE.me?.member_id;
        const out = [];
        activeTxns().filter(t => (t.nature === '家庭代墊' || t.nature === '私人拆帳') && t.payer_id === meId)
            .forEach(src => parseSplit(src).forEach(x => {
                const remaining = x.amount - paidFor(src.txn_id, x.member_id);
                if (remaining > 0.01) out.push({
                    srcId: src.txn_id, memberId: x.member_id, memberName: nameOf(x.member_id),
                    category: src.category, note: src.note, date: src.date, expected: x.amount, remaining,
                    itemType: src.nature === '家庭代墊' ? 'pool' : 'private'
                });
            }));
        return out.sort((a, b) => b.date.localeCompare(a.date));
    }

    /* ==========================================================
       Saving Jar
       劃撥儲蓄不是支出，錢沒有離開，只是被標記為「保留」。
       因此它不進損益與現金流，只用來推算保留額度。
       ========================================================== */
    const NON_PL_TYPES = ['轉帳', '劃撥儲蓄'];      // 一律不進收支統計
    function activeGoals(scope) {
        // 後端若尚未部署新版就不會回傳 goals，這裡必須容錯，否則整個首頁會崩潰
        return (STATE.goals || []).filter(g => g.status === '進行中' &&
            (scope ? g.scope === scope : true) &&
            (g.scope === 'family' || g.owner_id === STATE.me?.member_id));
    }
    function goalById(id) { return (STATE.goals || []).find(g => g.goal_id === id); }

    /** 這個目標所有劃撥紀錄（正數＝存入，負數＝提取／結案釋出） */
    function goalDeposits(goalId) {
        return activeTxns().filter(t => t.entry_type === '劃撥儲蓄' && t.related_id === goalId);
    }
    function goalSaved(goalId) {
        return goalDeposits(goalId).reduce((a, t) =>
            a + (t.settle_member_id === 'RELEASE' ? -Number(t.amount) : Number(t.amount)), 0);
    }
    /** 貼了這個目標標籤的實際花費 */
    function goalSpent(goalId) {
        const g = goalById(goalId); if (!g) return 0;
        return activeTxns().filter(t => t.entry_type === '支出' && t.tag === g.project_tag)
            .reduce((a, t) => a + Number(t.amount), 0);
    }
    /** 有效保留額：隨著貼標籤的花費同步遞減，永遠不會是負數。
        這樣旅程進行中「可支配現金」就不會出現嚇人的負值，也不必靠提醒補救。 */
    function goalReserved(goalId) {
        return Math.max(0, goalSaved(goalId) - goalSpent(goalId));
    }
    function totalReserved() {
        return activeGoals().reduce((a, g) => a + goalReserved(g.goal_id), 0);
    }

    /* 籌碼：同一天同一目標只產生一枚，避免拆成多筆刷數量。
       單次金額 ≥ 目標的 10% 是金幣，其餘是銀幣（同日多筆取當日最大單筆判定）。 */
    function goalCoins(goalId) {
        const g = goalById(goalId); if (!g) return [];
        const byDay = {};
        goalDeposits(goalId).filter(t => t.settle_member_id !== 'RELEASE').forEach(t => {
            const k = `${t.date}|${t.payer_id}`;
            const amt = Number(t.amount) || 0;
            if (!byDay[k]) byDay[k] = { date: t.date, member_id: t.payer_id, total: 0, max: 0 };
            byDay[k].total += amt;
            byDay[k].max = Math.max(byDay[k].max, amt);
        });
        const gold = g.target_amount * 0.1;
        return Object.values(byDay)
            .sort((a, b) => a.date.localeCompare(b.date))
            .map(c => ({ ...c, kind: c.max >= gold ? 'gold' : 'silver' }));
    }

    function computeSummary(mode, ym) {
        ym = ym || currentYM();
        const meId = STATE.me?.member_id, rows = activeTxns();
        const s = { monthlyIncome: 0, monthlyExpense: 0, cashBalance: 0, poolOwesMe: 0, iOweOthers: 0, poolBalance: 0, poolOwesMembers: [], membersOwePool: [], byCategory: [] };

        if (mode === 'personal') {
            const mine = rows.filter(t => isMine(t, meId));
            mine.forEach(t => {
                const a = Number(t.amount) || 0;
                if (inMonth(t.date, ym)) {
                    if (t.entry_type === '支出' && t.payer_id === meId) s.monthlyExpense += a;
                    if (t.entry_type === '收入' && t.payer_id === meId) s.monthlyIncome += a;
                }
                if (t.entry_type === '收入') s.cashBalance += a;
                else if (t.entry_type === '支出' || t.entry_type === '注資') s.cashBalance -= a;
                else if (t.entry_type === '還款') s.cashBalance += (t.related_id === meId ? a : -a);
                if (t.nature === '家庭代墊' && t.entry_type === '支出' && t.payer_id === meId) {
                    // 有分攤明細時，只有「其他人該還我」的部分算應收；
                    // 自己吸收的那一份不是任何人的債務。這是本次最重要的金額修正。
                    const sp = parseSplit(t);
                    s.poolOwesMe += t.split_detail && sp.length ? sp.reduce((x, y) => x + y.amount, 0) : a;
                }
            });
            s.cashBalance += Number(STATE.me?.initial_balance) || 0;
            s.reserved = totalReserved();
            s.available = s.cashBalance - s.reserved;     // 可支配 = 現金 − 尚未用掉的保留額
            // 還款扣減：公帳撥款與成員直接還款都算（舊資料只有前者，行為不變）
            rows.filter(t => t.entry_type === '還款' && t.related_id === meId)
                .forEach(t => s.poolOwesMe -= Number(t.amount) || 0);
            s.iOweOthers = myPendingSettlements().reduce((x, y) => x + y.remaining, 0);
            const cm = {};
            mine.filter(t => t.entry_type === '支出' && t.payer_id === meId && inMonth(t.date, ym))
                .forEach(t => { const k = t.category || '未分類'; cm[k] = (cm[k] || 0) + Number(t.amount); });
            s.byCategory = Object.entries(cm).sort((a, b) => b[1] - a[1]);
        } else {
            const fam = rows.filter(isFamilyBook);
            fam.forEach(t => {
                const a = Number(t.amount) || 0;
                if (inMonth(t.date, ym)) {
                    if (t.entry_type === '支出') s.monthlyExpense += a;
                    if (t.entry_type === '收入' || t.entry_type === '注資') s.monthlyIncome += a;
                }
                /* 公帳餘額看的是「公帳的錢包有沒有動」，不是「這筆算不算家庭的」。
                   我請客的家庭花費算家庭支出，但公帳一毛錢都沒出，餘額不該減少。
                   舊資料的家庭公帳一律 payer_id='family_pool'，行為完全不變。 */
                const poolWallet = t.payer_id === 'family_pool';
                if (t.entry_type === '注資' || (t.entry_type === '收入' && t.nature === '家庭公帳' && poolWallet)) s.poolBalance += a;
                if (t.entry_type === '支出' && t.nature === '家庭公帳' && poolWallet) s.poolBalance -= a;
                // 先前這裡沒有分辨付款人，導致「媽媽從自己口袋還給大哥」也會扣掉公帳餘額。
                // 公帳沒付錢就不該減少。
                if (t.entry_type === '還款' && t.payer_id === 'family_pool') s.poolBalance -= a;
            });
            s.poolBalance += Number(STATE.poolInitial) || 0;
            const owe = {};
            // 已指定分攤的代墊是「成員之間」的債務，不是公帳整筆欠款，
            // 因此不列入此區塊（改由待沖銷區處理），維持舊資料行為不變。
            rows.filter(t => t.nature === '家庭代墊' && t.entry_type === '支出' && !t.split_detail)
                .forEach(t => { owe[t.payer_id] = (owe[t.payer_id] || 0) + Number(t.amount); });
            rows.filter(t => t.entry_type === '還款' && t.member_id === 'family_pool' && !t.parent_txn_id)
                .forEach(t => { owe[t.related_id] = (owe[t.related_id] || 0) - Number(t.amount); });
            s.poolOwesMembers = Object.entries(owe).filter(([, v]) => v > 0.01).map(([id, v]) => ({ member: nameOf(id), amount: v }));
            const back = {};
            rows.filter(t => t.nature === '公帳注資' && t.entry_type === '支出').forEach(t => { back[t.payer_id] = (back[t.payer_id] || 0) + Number(t.amount); });
            s.membersOwePool = Object.entries(back).filter(([, v]) => v > 0.01).map(([id, v]) => ({ member: nameOf(id), amount: v }));
            const cm = {};
            fam.filter(t => t.entry_type === '支出' && inMonth(t.date, ym))
                .forEach(t => { const k = t.category || '未分類'; cm[k] = (cm[k] || 0) + Number(t.amount); });
            s.byCategory = Object.entries(cm).sort((a, b) => b[1] - a[1]);
        }
        return s;
    }

    /* ==========================================================
       開機
       ========================================================== */
    /* 安裝連結：?api=<exec網址或ID>&code=XXXXXXXX
       套用後把網址列清乾淨 —— 免得使用者把帶著代碼的連結分享出去。 */
    function applyInstallLink() {
        const q = new URLSearchParams(location.search + '&' + location.hash.replace(/^#/, ''));
        const api = q.get('api'), code = (q.get('code') || '').toUpperCase();
        if (!api && !code) return false;
        let applied = false;
        const p = api ? parseInstall(api) : null;
        if (p) { BACKEND.url = p.url; applied = true; }
        const c = (p && p.code) || (/^[A-Z0-9]{8}$/.test(code) ? code : '');
        if (c) { AUTH.familyCode = c; applied = true; }
        try { history.replaceState(null, '', location.pathname); } catch (e) { }
        return applied;
    }

    async function bootstrap() {
        document.getElementById('appVersion').innerText = CONFIG.VERSION;
        const fromLink = applyInstallLink();
        if (AUTH.familyCode && AUTH.memberId) { try { await loadAll(); return enterApp(); } catch (e) { AUTH.clear(); } }
        if (!CONFIG.API_URL && !CONFIG.DEMO) return showGate(0);
        // 連結帶了代碼、還沒選成員：填好代碼，讓 paintOtp 自動送出（不要再手動呼叫一次）
        if (fromLink && AUTH.familyCode) document.getElementById('gateCode').value = AUTH.familyCode;
        showGate(1);
    }
    function paintOtp() {
        const el = document.getElementById('gateCode'); if (!el) return;
        const v = el.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
        if (el.value !== v) el.value = v;
        const focused = document.activeElement === el;
        document.getElementById('otpBoxes').innerHTML = Array.from({ length: 8 }, (_, i) => {
            const ch = v[i] || '';
            const active = focused && i === Math.min(v.length, 7) && v.length < 8;
            return `<div class="flex-1 aspect-[3/4] max-w-[38px] rounded-xl border-2 flex items-center justify-center font-bold text-lg font-rounded transition-all
                ${ch ? 'bg-pastel-accentLight border-pastel-accent text-pastel-accent'
                     : active ? 'bg-white border-pastel-accent' : 'bg-pastel-bg border-pastel-border'}">${esc(ch)}</div>`;
        }).join('');
        if (v.length === 8 && !_otpAuto) { _otpAuto = true; setTimeout(gateSubmitCode, 180); }
        if (v.length < 8) _otpAuto = false;
    }
    let _otpAuto = false;
    async function pasteCode() {
        const el = document.getElementById('gateCode');
        try {
            const txt = await navigator.clipboard.readText();
            el.value = String(txt || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
            paintOtp(); buzz();
        } catch (e) { el.focus(); toast('請長按方格選擇「貼上」', true); }
    }
    function clearCode() {
        const el = document.getElementById('gateCode');
        el.value = ''; _otpAuto = false; paintOtp(); el.focus(); buzz();
    }
    function gateSay(text) {
        const el = document.getElementById('gateSpeech');
        if (!el) return;
        el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
        el.innerHTML = esc(text);
    }

    function showGate(step) {
        paintOtp();
        const el = document.getElementById('gateCode');
        if (el) { el.addEventListener('focus', paintOtp); el.addEventListener('blur', paintOtp); }
        gateStep(step == null ? (CONFIG.API_URL ? 1 : 0) : step);
        document.getElementById('gateScreen').classList.remove('js-hide');
        document.getElementById('splash').classList.add('js-hide');
    }
    function gateStep(n) {
        [0, 1, 2].forEach(i => document.getElementById('gateStep' + i).classList.toggle('hidden', i !== n));
        gateSay(n === 0 ? '先連上你的帳本，貼上安裝碼吧！'
            : n === 1 ? '請輸入 8 位家庭代碼，跟家人連線吧！'
                : '太好了，你是哪一位呢？');
    }
    function showGateError(m) { const e = document.getElementById('gateError'); e.innerText = m; e.classList.remove('hidden'); }

    async function pasteBackend() {
        const el = document.getElementById('gateBackend');
        try { el.value = (await navigator.clipboard.readText() || '').trim(); buzz(); }
        catch (e) { el.focus(); toast('請長按輸入框選擇「貼上」', true); }
    }
    function gateBackToBackend() {
        document.getElementById('gateBackend').value = BACKEND.isCustom ? BACKEND.url : '';
        document.getElementById('gateError').classList.add('hidden');
        gateStep(0); buzz();
    }
    async function gateSubmitBackend() {
        const raw = document.getElementById('gateBackend').value;
        const p = parseInstall(raw);
        if (p && p.dev) return showGateError('這是 /dev 開發網址，只有腳本擁有者登入時能用。請到 Apps Script 的「部署 → 管理部署作業」，複製結尾為 /exec 的那一個。');
        if (!p) return showGateError('安裝碼看起來不完整。可以直接貼「管理部署作業」裡結尾為 /exec 的完整網址，或試算表選單「② 顯示安裝碼」給的那一整串（前後不要夾到其他文字）。');
        const b = document.getElementById('gateBackendBtn'); b.disabled = true; b.innerText = '連線中…';
        const prev = BACKEND.isCustom ? BACKEND.url : '';
        BACKEND.url = p.url;
        try {
            const d = await api.call('ping');
            BACKEND_VERSION = d.apiVersion || '';
            if (!d.ready) throw new Error('連上了，但這本帳還沒初始化。請在 Google 試算表的「🏠 家庭記帳」選單執行「① 初始化 / 升級系統」。');
            document.getElementById('gateError').classList.add('hidden');
            if (p.code) { AUTH.familyCode = p.code; document.getElementById('gateCode').value = p.code; }
            gateStep(1); _otpAuto = false; paintOtp();   // 八碼齊全時 paintOtp 會自動送出
        } catch (e) {
            prev ? (BACKEND.url = prev) : BACKEND.clear();
            gateSay('連不上這個後端，再確認一下？');
            showGateError(diagnoseConnError(e, p.url));
        } finally { b.disabled = false; b.innerText = '連線'; }
    }

    /* 同樣是「連不上」，成因完全不同，處置也不同。
       把後端回來的訊息分類，直接告訴使用者該去改哪一格。 */
    function diagnoseConnError(e, url) {
        const m = String(e && e.message || e);
        if (/尚未初始化|初始化/.test(m)) return m;
        if (/家庭代碼/.test(m))
            return '這個網址連得上，但背後跑的是 6.0 之前的舊程式碼（它不認得新版的連線檢查）。'
                + '常見原因是貼了新的 Code.gs 卻沒有重新部署 —— 試算表選單跑的是編輯器裡的最新程式，'
                + '網頁應用程式跑的是「已部署的版本」，兩者可以不一樣。'
                + '請到 Apps Script：部署 → 管理部署作業 → 鉛筆 → 版本選「新版本」→ 部署，然後再試一次。';
        if (/HTTP 401|HTTP 403|Unexpected token|JSON|SyntaxError/i.test(m))
            return '這個網址回傳的不是資料，而是登入或權限頁面。'
                + '請到「部署 → 管理部署作業 → 鉛筆」，把「誰可以存取」改成「所有人」後重新部署。';
        if (/Failed to fetch|NetworkError|Load failed|HTTP 404/i.test(m))
            return '連不到這個網址。① 安裝碼的部署 ID 可能不完整（正常是 50 個字元以上，中間不能斷行）'
                + ' ② 部署時「誰可以存取」要選「所有人」。'
                + '可以先用瀏覽器直接開一次這個網址測試：' + url;
        return '連不上：' + m + '（可以先用瀏覽器直接開 ' + url + ' 看看回什麼）';
    }

    /* 統一正規化：只要有任何一個陣列欄位是 undefined（例如後端尚未部署新版），
       整個 App 就會在渲染時崩潰。與其在 17 個取用點各加防護，
       不如在資料進入的唯一入口一次補齊。 */
    const STATE_ARRAYS = ['members', 'categories', 'tags', 'transactions', 'rules', 'budgets', 'intents', 'goals', 'achievements', 'cheers', 'streakSaves'];
    function normalizeState() {
        STATE_ARRAYS.forEach(k => { if (!Array.isArray(STATE[k])) STATE[k] = []; });
        if (!STATE.memberStats || typeof STATE.memberStats !== 'object') STATE.memberStats = {};
        if (!STATE.familyStats || typeof STATE.familyStats !== 'object') STATE.familyStats = {};
        STATE.poolInitial = Number(STATE.poolInitial) || 0;
    }

    async function loadAll() {
        const d = await api.call('bootstrap');
        Object.assign(STATE, {
            familyName: d.familyName, members: d.members, categories: d.categories,
            tags: d.tags, archivedItems: d.archivedItems || [], transactions: d.transactions, rules: d.rules || [], budgets: d.budgets || [], intents: d.intents || [], goals: d.goals || [], achievements: d.achievements || [], cheers: d.cheers || [], memberStats: d.memberStats || {}, familyStats: d.familyStats || {}, streakSaves: d.streakSaves || [], poolInitial: d.poolInitial

        normalizeState();
        STATE.me = STATE.members.find(m => m.member_id === AUTH.memberId);

    /* ==========================================================
       家庭互動：打氣 + 動態廣播

    const CHEER_MSGS = ['一起加油！', '想你的帳本了', '今天也記一筆吧', '別讓連續天數斷掉！', '我們一起撐住'];

    function daysSince(iso) {
        if (!iso) return 999;
        const d = new Date(String(iso).slice(0, 10) + 'T00:00:00');
        return Math.round((new Date(todayISO() + 'T00:00:00') - d) / 86400000);
    }
    /** 超過 2 天沒記帳，連續天數快斷了 */
    function needsCheer(m) {
        return m.member_id !== 'family_pool' && m.member_id !== STATE.me?.member_id &&
            m.status !== '停用' && daysSince(m.last_entry_date) >= 2;
    }
    function cheeredToday(toId) {
        const cut = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
        return (STATE.cheers || []).some(c => c.from_member === STATE.me?.member_id &&
            c.to_member === toId && String(c.created_at).slice(0, 10) >= cut);
    }

        try { await api.call('sendCheer', { to_member: toId, message: msg }); }
        catch (e) {
            STATE.cheers = STATE.cheers.filter(c => c.cheer_id !== local.cheer_id);
            renderSettings(); renderDashboard(); toast(e.message, true);
        }
    }

    /** 家庭動態：近期成就解鎖與打氣，合併後依時間排序 */
    function familyFeed(limit) {

    /* ---------- 記帳完成微互動：金幣飛向大頭貼 ---------- */
    function coinFly() {
        const frame = document.getElementById('appFrame'), av = document.getElementById('userAvatar');
        if (!frame || !av) return;
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        const fr = frame.getBoundingClientRect(), ar = av.getBoundingClientRect();
        const tx = ar.left - fr.left + ar.width / 2 - 13, ty = ar.top - fr.top + ar.height / 2 - 13;
        const sx = fr.width / 2 - 13, sy = fr.height * 0.52;
        for (let i = 0; i < 5; i++) {
            const c = document.createElement('div');
            c.className = 'coin'; c.textContent = '$';
            c.style.left = sx + (Math.random() * 40 - 20) + 'px';
            c.style.top = sy + 'px';
            frame.appendChild(c);
            const dur = 620 + i * 70;
            c.animate([
                { transform: 'translate(0,0) scale(.5)', opacity: 0 },
                { transform: `translate(${(tx - sx) * .35}px, ${-70 - i * 8}px) scale(1)`, opacity: 1, offset: .35 },
                { transform: `translate(${tx - sx}px, ${ty - sy}px) scale(.35)`, opacity: 0 }
            ], { duration: dur, easing: 'cubic-bezier(.35,.6,.3,1)', delay: i * 55 })
                .onfinish = () => c.remove();
        }
        buzz(12);
    }

    function weekStartISO() {
        const d = new Date(todayISO() + 'T00:00:00');
        d.setDate(d.getDate() - ((d.getDay() + 6) % 7));   // 以週一為起點
        return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
    }
    function myTxns() {
        const meId = STATE.me?.member_id;
        return activeTxns().filter(t => t.payer_id === meId);
    }
    function dailyTasks() {
        const t = todayISO(), mine = myTxns().filter(x => x.date === t);
        const total = computeSummary('personal').monthlyExpense;
        const budget = budgetFor('personal', '');
        const n = daysInYM(currentYM()), day = Number(t.slice(8, 10));
        const dailyQuota = budget ? budget / n : 0;
        const todayExp = mine.filter(x => x.entry_type === '支出').reduce((a, b) => a + Number(b.amount), 0);
        return [
            { icon: 'fa-pen', name: '今天記一筆', done: mine.length > 0, go: 'add', hint: mine.length ? `已記 ${mine.length} 筆` : '還沒開張' },
            { icon: 'fa-receipt', name: '今天附一張單據', done: mine.some(x => x.receipt_file_id), go: 'add', hint: '拍發票更好對帳' },
            { icon: 'fa-gauge-high', name: '今天不超過每日額度', done: !!dailyQuota && todayExp <= dailyQuota,
              go: dailyQuota ? 'list' : 'budget',
              hint: dailyQuota ? `${fmt(todayExp)} / ${fmt(dailyQuota)}` : '尚未設定預算' }
        ];
    }
    function weeklyTasks() {
        const ws = weekStartISO(), mine = myTxns().filter(x => x.date >= ws);
        const days = new Set(mine.map(x => x.date)).size;
        const budget = budgetFor('personal', '');
        const n = daysInYM(currentYM());
        const weekQuota = budget ? budget / n * 7 : 0;      // 用「總預算的週配額」而非分類預算，
        const weekExp = mine.filter(x => x.entry_type === '支出').reduce((a, b) => a + Number(b.amount), 0);
        return [
            { icon: 'fa-calendar-check', name: '本週記帳 5 天', done: days >= 5, go: 'add', hint: `${days}/5 天` },
            { icon: 'fa-wallet', name: '本週不超過週配額', done: !!weekQuota && weekExp <= weekQuota,
              go: weekQuota ? 'list' : 'budget',
              hint: weekQuota ? `${fmt(weekExp)} / ${fmt(weekQuota)}` : '尚未設定預算' },
            { icon: 'fa-arrow-trend-down', name: '本週有一天零支出', done: hasZeroSpendDay(ws), go: 'list', hint: '給錢包放個假' }
        ];
    }
    function hasZeroSpendDay(ws) {
        const spent = new Set(myTxns().filter(x => x.date >= ws && x.entry_type === '支出').map(x => x.date));
        const t = todayISO();
        for (let d = new Date(ws + 'T00:00:00'); ; d.setDate(d.getDate() + 1)) {
            const iso = `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
            if (iso > t) break;
            if (iso < t && !spent.has(iso)) return true;      // 今天還沒過完不算
        }
        return false;
    }
    function dueReminders() {
        const t = todayISO(), meId = STATE.me?.member_id;
        return (STATE.rules || []).filter(r => r.status === '啟用' && r.auto_mode === '僅提醒' &&
            r.next_run && String(r.next_run) <= t &&
            (r.scope === 'family' ? currentMode === 'family' : r.member_id === meId) &&
            (!r.end_date || String(r.next_run) <= String(r.end_date)));
    }
    function reminderSection() {
        const due = dueReminders();
        if (!due.length) return '';
        return `<div class="space-y-2.5">
            <div class="flex items-center gap-2 text-xs font-bold text-stone-600">

                <span class="text-[10px] bg-pastel-yellowLight text-[#D9A216] px-2 py-0.5 rounded-full">${due.length}</span></div>
            ${due.map(r => `
                <div class="bg-pastel-bg rounded-tile p-3 border border-pastel-border">
                    <div class="flex justify-between items-center gap-2 mb-2">
                        <div class="min-w-0">
                            <div class="font-bold text-sm text-stone-800 truncate">${esc(r.name)}</div>
                            <div class="text-[10px] text-pastel-muted">應於 ${esc(r.next_run)} ・ ${esc(r.freq)}</div></div>
                        <div class="font-bold font-rounded ${r.entry_type === '收入' ? 'text-pastel-green' : 'text-stone-800'} flex-shrink-0">${fmt(r.amount)}</div></div>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="confirmReminder('${esc(r.rule_id)}')" class="py-2 bg-pastel-accent text-white rounded-lg text-xs font-bold tactile">記這一筆</button>
                        <button onclick="skipReminder('${esc(r.rule_id)}')" class="py-2 bg-white border border-pastel-border text-stone-600 rounded-lg text-xs font-bold tactile">這期略過</button>
                    </div></div>`).join('')}
        </div>`;
    }
    async function confirmReminder(id) {
        const r = STATE.rules.find(x => x.rule_id === id); if (!r) return;
        buzz(12);
        try {
            const res = await api.call('confirmReminder', { rule_id: id });
            STATE.transactions.push({ ...res.txn, _new: true });
            r.next_run = res.next_run;
            renderDataViews(); renderSettings(); toast('已記錄'); coinFly();
        } catch (e) { toast('失敗：' + e.message, true); }
    }
    async function skipReminder(id) {
        const r = STATE.rules.find(x => x.rule_id === id); if (!r) return;
        const backup = r.next_run;
        try {
            const res = await api.call('skipReminder', { rule_id: id });
            r.next_run = res.next_run; renderDataViews(); renderSettings(); toast('已略過本期');
        } catch (e) { r.next_run = backup; renderDataViews(); toast('失敗：' + e.message, true); }
    }

    /* ---------- 家庭共鬥成就 ----------
       指標刻意選「全家一起做到才算」的行為，而不是淨資產這類財富指標——
       財富達不成的家庭永遠達不成，而且不是靠努力可以改變的。 */
    const COOP = [
        { id: 'co_days', icon: 'fa-people-group', name: '全家不斷線', unit: '天',
          desc: '連續每天都有人記帳', goals: [7, 30, 100],
          val: () => Number((STATE.familyStats || {}).activeDayStreak) || 0 },
        { id: 'co_clear', icon: 'fa-handshake', name: '零掛帳之家', unit: '筆',
          desc: '全家沒有任何待清償項目', goals: [1],
          val: () => allPendingCount() === 0 ? 1 : 0 },
        { id: 'co_budget', icon: 'fa-shield-heart', name: '家庭守成', unit: '個月',
          desc: '家庭預算連續未超支', goals: [3, 6, 12],
          val: () => Number((STATE.familyStats || {}).budgetKeptStreak) || 0 }
    ];
    /** 全家還沒結清的分攤筆數 */
    function allPendingCount() {
        let n = 0;
        activeTxns().filter(t => (t.nature === '家庭代墊' || t.nature === '私人拆帳') && t.entry_type === '支出')
            .forEach(src => parseSplit(src).forEach(x => {
                if (x.amount - paidFor(src.txn_id, x.member_id) > 0.01) n++;
            }));
        return n;
    }
    function coopSection() {
        return `<div class="flex justify-between items-center mb-3">
            <h3 class="text-sm font-bold text-stone-800"><i class="fa-solid fa-house-chimney-user text-pastel-blue mr-1.5"></i>家庭共鬥</h3>
            <span class="text-xs text-pastel-muted">需要全家一起達成</span></div>
        <div class="space-y-2.5">
            ${COOP.map(c => {
            const v = c.val();
            let tier = -1;
            for (let i = 0; i < c.goals.length; i++) if (v >= c.goals[i]) tier = i;
            const next = tier + 1 < c.goals.length ? c.goals[tier + 1] : null;
            const pct = next ? Math.min(v / next * 100, 100) : 100;

            return `<div class="flex items-center gap-3 p-3 rounded-tile border ${done ? 'bg-pastel-blueLight border-transparent' : 'bg-white border-pastel-border'}">

                            <span class="text-[10px] font-bold flex-shrink-0 ${done ? 'text-pastel-blue' : 'text-pastel-muted'}">${next ? `${v}/${next}${esc(c.unit)}` : '已達成'}</span></div>
                        <div class="text-[10px] text-pastel-muted mt-0.5 truncate">${esc(c.desc)}</div>
                        ${next ? `<div class="w-full bg-pastel-bg rounded-full h-1.5 mt-1.5 overflow-hidden"><div class="bg-pastel-blue h-1.5 rounded-full transition-all duration-700" style="width:${pct}%"></div></div>` : ''}

    /* ---------- 續命：幫家人保住連續紀錄 ---------- */
    function savedThisMonth() {
        const ym = currentYM();
        return (STATE.streakSaves || []).some(x => x.from_member === STATE.me?.member_id && String(x.ym) === ym);

        return m.member_id !== 'family_pool' && m.member_id !== STATE.me?.member_id &&
            m.status !== '停用' && (Number(m.streak_days) || 0) > 0 && daysSince(m.last_entry_date) >= 2;
    }
    async function saveStreak(toId) {
        const m = STATE.members.find(x => x.member_id === toId); if (!m) return;
        if (!confirm(`幫 ${m.nickname} 保住 ${m.streak_days} 天的連續紀錄？\n你這個月只有一次機會。`)) return;
        buzz(14);
        try {
            const r2 = await api.call('saveStreak', { to_member: toId });
            m.last_entry_date = r2.bridged_to;
            STATE.streakSaves.push({ save_id: 'tmp' + Math.random(), from_member: STATE.me.member_id,
                to_member: toId, ym: currentYM(), bridged_to: r2.bridged_to, created_at: localStamp() });
            renderSettings(); renderDashboard();
            toast(`已幫 ${m.nickname} 保住 ${r2.streak_days} 天紀錄`);
        } catch (e) { toast(e.message, true); }

    /* ---------- 光環進階：脈衝發光 ---------- */
    function auraKey() { return 'aura_' + AUTH.memberId; }
    function checkAuraUp() {
        if (!STATE.me) return;
        const now = getLevelInfo(STATE.me.streak_days).tier;
        let seen = 0;
        try { seen = Number(localStorage.getItem(auraKey()) || 0); } catch (e) { }
        localStorage.setItem(auraKey(), String(now));
        if (!seen || now <= seen) return;             // 首次載入或掉階都不慶祝
        const el = document.getElementById('userAvatar');
        if (el) { el.classList.add('aura-pulse'); setTimeout(() => el.classList.remove('aura-pulse'), 2600); }
        const t = getLevelInfo(STATE.me.streak_days);
        toast(`光環進階：${t.name}（連續 ${t.days} 天）`);
        buzz(18);
    }

    /* ---------- 成就解鎖慶祝 ---------- */
    function achKey() { return 'ach_' + AUTH.memberId; }
    function checkNewAchievements() {
        if (!STATE.me) return;
        const list = achievementList(), doneIds = list.filter(a => a.done).map(a => a.id);
        const initKey = 'achInit_' + AUTH.memberId;
        if (!localStorage.getItem(initKey)) {
            localStorage.setItem(initKey, '1');
            localStorage.setItem(achKey(), JSON.stringify(doneIds));
            syncAchievements(list.filter(a => a.done));   // 補寫既有成就，但不慶祝
            return;
        }
        let seen = [];
        try { seen = JSON.parse(localStorage.getItem(achKey()) || '[]'); } catch (e) { }
        const fresh = doneIds.filter(id => !seen.includes(id));
        if (fresh.length) {
            localStorage.setItem(achKey(), JSON.stringify(doneIds));
            celebrate(list.find(a => a.id === fresh[0]));
            syncAchievements(list.filter(a => fresh.includes(a.id)));
        }
    }

    /* 成就狀態寫回後端，家人才看得到彼此的里程碑。
       後端以 member_id|ach_id 去重，重複呼叫是安全的。 */
    async function syncAchievements(items) {
        if (!items || !items.length) return;
        try {
            const r2 = await api.call('unlockAchievement', {
                items: items.map(a => ({ id: a.id, name: a.name, icon: a.icon }))
            });
            if (r2.achievements) { STATE.achievements = r2.achievements; renderDashboard(); }
        } catch (e) { /* 失敗不影響本機顯示，下次開 App 會再試 */ }
    }

    async function refreshData() {
        /* 按了要看得出來有反應：立刻震一下、圖示轉起來、按鈕鎖住不能連按。
           先前完全沒有回饋，使用者只能一直按，反而製造重複請求。 */
        const btn = document.getElementById('btnSyncTop'), ic = btn?.querySelector('i');
        if (btn?.dataset.busy) return;
        buzz(8);
        if (btn) { btn.dataset.busy = '1'; btn.classList.add('opacity-50', 'pointer-events-none'); }
        ic?.classList.add('spin-slow');
        try {
            const d = await api.call('bootstrap');
            Object.assign(STATE, { transactions: d.transactions, rules: d.rules || [], budgets: d.budgets || [], intents: d.intents || [], goals: d.goals || [], achievements: d.achievements || [], cheers: d.cheers || [], memberStats: d.memberStats || {}, familyStats: d.familyStats || {}, streakSaves: d.streakSaves || [], categories: d.categories, tags: d.tags, archivedItems: d.archivedItems || [], members: d.members });
            normalizeState();
            STATE.me = STATE.members.find(m => m.member_id === AUTH.memberId) || STATE.me;
            buildMemoIndex();
            renderDataViews(); renderSettings(); toast('已同步');
        } catch (e) { toast('同步失敗：' + e.message, true); }
        finally {
            if (btn) { delete btn.dataset.busy; btn.classList.remove('opacity-50', 'pointer-events-none'); }
            ic?.classList.remove('spin-slow');
        }
    }

           dasharray 的百分比才會對。舊版只畫半圓，弧長 50，比例全被放大兩倍。 */
