    /* 數字滾動：小成本、感受明顯 */
    function animateCounts(root) {
        root.querySelectorAll('[data-count]').forEach(el => {
            const to = Number(el.dataset.count) || 0, pre = el.dataset.pre || '', dur = 620, t0 = performance.now();
            const step = t => {
                const p = Math.min((t - t0) / dur, 1), e = 1 - Math.pow(1 - p, 3);
                el.textContent = pre + Math.round(to * e).toLocaleString('en-US');
                if (p < 1) requestAnimationFrame(step);
            };
            requestAnimationFrame(step);
        });
    }

    /* ---------- 預算 ---------- */
    function budgetKey(scope, category) {
        return [scope === 'family' ? 'family' : STATE.me?.member_id, scope, 'DEFAULT', category || ''].join('|');
    }
    function budgetFor(scope, category) {
        const b = (STATE.budgets || []).find(x => x.budget_id === budgetKey(scope, category));
        return b ? Number(b.amount) || 0 : 0;
    }
    /* 角色情緒狀態機。動畫只給「真的需要注意」的狀態，
       全部都在動的話，動這件事本身就失去強調的意義。
       FA 的動畫會自動遵守系統的「減少動態效果」設定，不必額外防護。 */
    function getMascotState(pct, hasData) {
        /* card = 主卡底色。刻意不直接用 color（角色色），因為那組色是給小圖示用的，
           像 #F8C850 這種亮黃配白字讀不清楚 —— 卡片用同色系但壓深一階的版本。 */
        if (!hasData) return { mood: 'FREEZE', av: 'av14', word: '這個月還沒開張，記一筆吧', color: '#88D8F8', card: ['#7FC0DE', '#5EA3C4'], badge: { icon: 'fa-moon', anim: 'fa-fade' } };
        if (pct > 100) return { mood: 'DANGER', av: 'av4', word: '已超出預算，先煞車一下', color: '#F05838', card: ['#F05838', '#D8452A'], badge: { icon: 'fa-triangle-exclamation', anim: 'fa-beat-fade' } };
        if (pct > 80) return { mood: 'WARNING', av: 'av48', word: '快到上限了，留意一下', color: '#F8C850', card: ['#EFA22B', '#D98A17'], badge: { icon: 'fa-triangle-exclamation', anim: 'fa-shake' } };
        if (pct > 50) return { mood: 'GOOD', av: 'av21', word: '節奏還可以，繼續保持', color: '#3090F8', card: ['#3090F8', '#2B7BD6'], badge: null };
        return { mood: 'GREAT', av: 'av5', word: '目前非常有餘裕！', color: '#40B868', card: ['#40B868', '#35A25A'], badge: { icon: 'fa-star', anim: 'fa-beat' } };
    }
    function mascotBadge(state) {
        if (!state.badge) return '';
        return `<span class="absolute -top-1 -right-1 w-7 h-7 rounded-full bg-white shadow-md flex items-center justify-center">
            <i class="fa-solid ${state.badge.icon} ${state.badge.anim} text-xs" style="color:${state.color}"></i></span>`;
    }

    /* ---------- 第一層：唯一一張主卡 ----------
       上部（填色）：本月還能花、進度、每日可用
       中部（填色內分隔）：淨資產 · 本月收入
       下部（白底，同一張卡）：分類預算
       一張卡回答「我現在如何」，不再散成四張。 */
    /* ---------- 第一層：唯一一張主卡（嵌套式） ----------
       外層白卡只留很小的邊（p-1），內層是隨情緒變色的彩色卡。
       兩個圓角必須同心：外圓角 = 內圓角 + 留白，否則轉角會看起來歪掉。 */
    function budgetHero(s) {
        const total = budgetFor(currentMode, '');
        const isFam = currentMode === 'family';
        const catRows = (STATE.budgets || []).filter(b => b.scope === currentMode && b.category &&
            b.budget_id === budgetKey(currentMode, b.category));
        const spentMap = Object.fromEntries(s.byCategory);

        const lower = catRows.length ? `
            <div class="px-4 pt-3 pb-3 space-y-3">
                <div class="flex justify-between items-center">
                    <span class="text-xs font-bold text-stone-600">分類預算</span>
                    <button onclick="event.stopPropagation();openBudgetSheet()" class="text-xs font-bold text-pastel-accent">調整</button></div>
                ${catRows.map(b => {
            const used = spentMap[b.category] || 0, pct2 = Math.min(used / b.amount * 100, 100), over2 = used > b.amount;
            const col = catColor(b.category);
            return `<div class="space-y-1.5">
                        <div class="flex justify-between text-xs">
                            <span class="text-stone-700 truncate"><i class="fa-solid ${esc(catIcon(b.category))} mr-1.5" style="color:${col}"></i>${esc(b.category)}</span>
                            <span class="font-bold font-rounded flex-shrink-0 ml-2 ${over2 ? 'text-pastel-red' : 'text-stone-700'}">${fmt(used)} / ${fmt(b.amount)}</span></div>
                        <div class="w-full bg-pastel-bg rounded-full h-1.5 overflow-hidden">
                            <div class="h-1.5 rounded-full transition-all duration-700" style="width:${pct2}%;background:${over2 ? '#F05838' : col}"></div></div>
                    </div>`;
        }).join('')}
            </div>`
            : `<button onclick="openBudgetSheet()" class="w-full flex items-center justify-center gap-2 py-3 text-xs font-bold text-pastel-accent tactile">
                <i class="fa-solid fa-plus"></i>設定分類預算</button>`;

        if (!total) {
            return `<div class="bg-white rounded-[28px] shadow-card border border-pastel-border/60 p-1 hero-shell">
                <button onclick="openBudgetSheet()" class="w-full text-left rounded-[24px] bg-pastel-accentLight p-5 flex items-center gap-4 tactile-card">
                    <img src="./av48.png" alt="" class="w-12 h-12 flex-shrink-0">
                    <div class="min-w-0"><div class="font-bold text-sm text-stone-800">設定${isFam ? '公帳' : '每月'}預算</div>
                    <div class="text-xs text-pastel-muted mt-0.5">知道「還能花多少」，比知道「花了多少」更有用</div></div>
                    <i class="fa-solid fa-chevron-right text-pastel-accent ml-auto"></i></button>
                ${lower}</div>`;
        }

        const used = s.monthlyExpense, left = total - used;
        const pct = Math.min(used / total * 100, 100), over = used > total;
        const n = daysInYM(currentYM()), day = Number(todayISO().slice(8, 10));
        const daily = Math.max(left, 0) / Math.max(n - day + 1, 1);
        const mood = getMascotState(used / total * 100, s.monthlyExpense > 0 || s.monthlyIncome > 0);

        return `<div class="bg-white rounded-[28px] shadow-card border border-pastel-border/60 p-1 hero-shell">
            <div onclick="openBudgetSheet()" class="relative rounded-[24px] p-5 text-white overflow-hidden tactile-card"
                 style="background:linear-gradient(135deg, ${mood.card[0]} 0%, ${mood.card[1]} 100%);transition:background .6s ease">
                <div class="absolute right-0 bottom-0 w-24 h-24 pointer-events-none">
                    <img src="./${mood.av}.png" alt="" class="w-full h-full opacity-90">
                    ${mascotBadge(mood)}
                </div>
                <div class="relative">
                    <div class="text-[11px] font-bold opacity-80 mb-1">${isFam ? '公帳本月可用' : '本月還能花'}</div>
                    <div class="text-4xl font-bold font-rounded tracking-tight mb-1">
                        <span class="num-sym text-2xl">$</span><span data-count="${Math.abs(left)}" data-pre="${over ? '-' : ''}">0</span></div>
                    <div class="w-full bg-white/25 rounded-full h-2.5 overflow-hidden mb-1.5 max-w-[62%]">
                        <div class="bg-white h-2.5 rounded-full transition-all duration-700" style="width:${pct}%"></div></div>
                    <div class="text-[11px] opacity-90 mb-2">每日可用 ${fmt(daily)} ・ 已花 ${fmt(used)} / ${fmt(total)}</div>
                    <div class="text-[11px] opacity-85 font-bold">${esc(mood.word)}</div>
                </div>
            </div>
            ${lower}</div>`;
    }

    function openBudgetSheet() {
        const scope = currentMode;
        const cats = STATE.categories.filter(c => c.item_group === 'EXPENSE_CATEGORY');
        openSheet(`
            <h3 class="text-lg font-bold text-stone-800 mb-1">${scope === 'family' ? '公帳預算' : '我的預算'}</h3>
            <p class="text-xs text-pastel-muted mb-5">留空或填 0 表示不設限。設定後每月自動沿用。</p>
            <div class="space-y-4">
                <div class="field"><label class="block text-xs font-bold text-stone-600 mb-1.5">每月總預算</label>
                    <input id="bTotal" type="number" inputmode="numeric" value="${budgetFor(scope, '') || ''}" placeholder="例如 30000"
                        class="w-full p-3.5 rounded-tile bg-pastel-accentLight border-2 border-pastel-accent/40 text-stone-800 font-bold text-lg font-rounded"></div>
                <div class="text-xs font-bold text-stone-600 pt-1">分類預算（選填）</div>
                ${cats.map(c => `
                    <div class="flex items-center gap-3">
                        <div class="w-9 h-9 rounded-tile flex items-center justify-center flex-shrink-0" style="background:${hexA(catColor(c.item_name), .16)};color:${catColor(c.item_name)}"><i class="fa-solid ${esc(normIcon(c.icon_emoji, c.item_group))}"></i></div>
                        <span class="text-sm text-stone-700 flex-1 truncate">${esc(c.item_name)}</span>
                        <input type="number" inputmode="numeric" data-cat="${esc(c.item_name)}" value="${budgetFor(scope, c.item_name) || ''}" placeholder="—"
                            class="bud-inp w-24 p-2.5 rounded-xl bg-pastel-bg border border-pastel-border text-sm text-right font-rounded">
                    </div>`).join('')}
                <button onclick="saveBudgets('${scope}')" class="w-full py-4 bg-pastel-accent text-white font-bold rounded-tile shadow-md text-sm mt-2">儲存預算</button>
            </div>`);
    }

    async function saveBudgets(scope) {
        const total = Number(document.getElementById('bTotal').value) || 0;
        const items = [{ category: '', amount: total }];
        document.querySelectorAll('.bud-inp').forEach(i => items.push({ category: i.dataset.cat, amount: Number(i.value) || 0 }));
        closeSheet();
        // 先更新本地讓畫面即時反應，再依序同步
        items.forEach(it => {
            const key = budgetKey(scope, it.category);
            const i = STATE.budgets.findIndex(b => b.budget_id === key);
            if (it.amount > 0) {
                const row = { budget_id: key, scope, ym: 'DEFAULT', category: it.category, amount: it.amount };
                if (i >= 0) STATE.budgets[i] = row; else STATE.budgets.push(row);
            } else if (i >= 0) STATE.budgets.splice(i, 1);
        });
        renderDashboard(); toast('預算已更新');
        try {
            for (const it of items) await api.call('saveBudget', { budget: { scope, ym: 'DEFAULT', category: it.category, amount: it.amount } });
        } catch (e) { toast('部分預算同步失敗：' + e.message, true); }
    }

    /* ---------- 統一待清償中心 ---------- */
    function pendingSection() {
        const list = myPendingSettlements();
        if (!list.length) return '';
        const total = list.reduce((a, b) => a + b.remaining, 0);
        const priv = list.filter(x => x.itemType === 'private');
        const grp = (type, label, icon) => {
            const items = list.filter(x => x.itemType === type);
            if (!items.length) return '';
            return `<div class="space-y-2">
                <div class="text-[11px] font-bold text-pastel-muted"><i class="fa-solid ${icon} mr-1.5"></i>${label}</div>
                ${items.map(x => `
                    <div class="bg-pastel-bg rounded-tile p-3 border border-pastel-border">
                        <div class="flex justify-between items-start gap-2 mb-2">
                            <div class="min-w-0">
                                <div class="font-bold text-sm text-stone-800 truncate">${esc(x.payerName)}代墊：${esc(x.note || x.category || '—')}</div>
                                <div class="text-[10px] text-pastel-muted">${esc(x.date)} ・ 你的分攤 ${fmt(x.expected)}${x.marked ? ' ・ <span class="text-pastel-blue font-bold">已選公帳月結</span>' : ''}</div>
                            </div>
                            <div class="font-bold font-rounded text-pastel-red flex-shrink-0">${fmt(x.remaining)}</div>
                        </div>
                        <div class="grid ${type === 'pool' ? 'grid-cols-2' : 'grid-cols-1'} gap-2">
                            <button onclick="openRepay('${esc(x.srcId)}')" class="py-2 bg-pastel-accent text-white rounded-lg text-xs font-bold tactile"><i class="fa-solid fa-hand-holding-dollar mr-1"></i>直接還款</button>
                            ${type === 'pool' ? `<button onclick="${x.marked ? `unmarkPool('${esc(x.srcId)}')` : `markPool('${esc(x.srcId)}')`}" class="py-2 rounded-lg text-xs font-bold tactile ${x.marked ? 'bg-pastel-blueLight text-pastel-blue border border-pastel-blue/30' : 'bg-white border border-pastel-border text-stone-600'}"><i class="fa-solid fa-building-columns mr-1"></i>${x.marked ? '取消公帳月結' : '記為公帳扣抵'}</button>` : ''}
                        </div>
                    </div>`).join('')}
            </div>`;
        };
        return `<div class="space-y-3">
            <div class="flex justify-between items-center">
                <span class="text-xs font-bold text-stone-600"><i class="fa-solid fa-file-invoice-dollar text-pastel-red mr-1.5"></i>我要還給別人</span>
                <span class="text-[11px] text-pastel-muted">${list.length} 筆 ・ <b class="text-pastel-red font-rounded">${fmt(total)}</b></span></div>
            ${grp('pool', '公帳代墊分攤', 'fa-users')}
            ${grp('private', '私人拆帳', 'fa-user-group')}
            ${priv.length > 1 ? `<button onclick="repayAll('private')" class="w-full py-2.5 bg-stone-800 text-white font-bold rounded-tile text-xs tactile">一鍵歸還全部私人拆帳（${fmt(priv.reduce((a, b) => a + b.remaining, 0))}）</button>` : ''}
            ${list.length > 1 ? `<button onclick="repayAll('all')" class="w-full py-2.5 bg-white border-2 border-stone-800 text-stone-800 font-bold rounded-tile text-xs tactile">一鍵歸還全部（含公帳代墊，${fmt(total)}）</button>` : ''}
        </div>`;
    }

    function receivableSection() {
        const list = othersOweMe();
        if (!list.length) return '';
        const byMember = {};
        list.forEach(x => {
            byMember[x.memberId] = byMember[x.memberId] || { name: x.memberName, items: [], remaining: 0, expected: 0 };
            byMember[x.memberId].items.push(x);
            byMember[x.memberId].remaining += x.remaining;
            byMember[x.memberId].expected += x.expected;
        });
        const total = list.reduce((a, b) => a + b.remaining, 0);
        return `<div class="space-y-2.5">
            <div class="flex justify-between items-center">
                <span class="text-xs font-bold text-stone-600"><i class="fa-solid fa-hand-holding-dollar text-pastel-green mr-1.5"></i>別人要還我</span>
                <span class="text-[11px] text-pastel-muted">${list.length} 筆 ・ <b class="text-pastel-green font-rounded">${fmt(total)}</b></span></div>
            ${Object.entries(byMember).map(([id, g]) => {
                const paid = g.expected - g.remaining, pct = g.expected ? paid / g.expected * 100 : 0;
                const m = STATE.members.find(x => x.member_id === id);
                const lv = getLevelInfo(m?.streak_days);
                return `<button onclick="openOweDetail('${esc(id)}')" class="w-full text-left bg-pastel-bg rounded-tile p-3 border border-pastel-border tactile active:bg-white">
                    <div class="flex items-center gap-3 mb-2">
                        <div class="w-8 h-8 rounded-full border-2 ${lv.border} ${lv.bg} overflow-hidden flex items-center justify-center text-xs flex-shrink-0">${avatarInner(m?.avatar_emoji)}</div>
                        <div class="flex-1 min-w-0">
                            <div class="font-bold text-sm text-stone-800 truncate">${esc(g.name)}</div>
                            <div class="text-[10px] text-pastel-muted">${g.items.length} 筆 ・ 已還 ${fmt(paid)} / ${fmt(g.expected)}</div></div>
                        <div class="flex items-center gap-1.5 flex-shrink-0">
                            <span class="font-bold font-rounded text-pastel-green">${fmt(g.remaining)}</span>
                            <i class="fa-solid fa-chevron-right text-[10px] text-pastel-muted"></i></div></div>
                    <div class="w-full bg-white rounded-full h-1.5 overflow-hidden border border-pastel-border">
                        <div class="bg-pastel-green h-1.5 rounded-full transition-all duration-700" style="width:${pct.toFixed(0)}%"></div></div>
                </button>`;
            }).join('')}
        </div>`;
    }

    /* 點「爸爸要還我 $300」→ 看得到那 300 是怎麼來的。
       總額能提醒，明細才能對帳 —— 尤其是隔了幾週之後兩邊記憶不一致的時候。 */
    function openOweDetail(memberId) {
        buzz();
        const all = othersOweMe().filter(x => x.memberId === memberId);
        if (!all.length) return;
        const m = STATE.members.find(x => x.member_id === memberId);
        const lv = getLevelInfo(m?.streak_days);
        const remaining = all.reduce((a, b) => a + b.remaining, 0);
        const expected = all.reduce((a, b) => a + b.expected, 0);
        const paid = expected - remaining;
        openSheet(`
            <div class="flex items-center gap-3 mb-4">
                <div class="w-12 h-12 rounded-full border-[3px] ${lv.border} ${lv.bg} overflow-hidden flex items-center justify-center text-lg flex-shrink-0">${avatarInner(m?.avatar_emoji)}</div>
                <div class="min-w-0">
                    <h3 class="text-lg font-bold text-stone-800 truncate">${esc(nameOf(memberId))} 要還我</h3>
                    <div class="text-[11px] text-pastel-muted">${all.length} 筆 ・ 已還 ${fmt(paid)} / ${fmt(expected)}</div></div>
                <div class="ml-auto text-right flex-shrink-0">
                    <div class="text-2xl font-bold font-rounded text-pastel-green">${fmt(remaining)}</div>
                    <div class="text-[10px] text-pastel-muted">尚未歸還</div></div>
            </div>
            <div class="space-y-2 max-h-[52vh] overflow-y-auto hide-scrollbar">
                ${all.map(x => {
            const done = x.expected - x.remaining;
            return `<div class="p-3 rounded-tile bg-pastel-bg border border-pastel-border">
                        <div class="flex items-start gap-2.5">
                            <div class="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0 text-xs"
                                 style="background:${hexA(catColor(x.category), .16)};color:${catColor(x.category)}">
                                <i class="fa-solid ${esc(catIcon(x.category))}"></i></div>
                            <div class="flex-1 min-w-0">
                                <div class="text-[13px] font-bold text-stone-800 truncate">${esc(x.note || x.category || '（無備註）')}</div>
                                <div class="text-[10px] text-pastel-muted">${esc(x.date)} ・ ${esc(x.category || '未分類')}
                                    ・ <span class="${x.itemType === 'pool' ? 'text-pastel-accent' : 'text-pastel-blue'}">${x.itemType === 'pool' ? '公帳代墊' : '私人拆帳'}</span></div>
                                ${done > 0.01 ? `<div class="text-[10px] text-pastel-green mt-0.5">已還 ${fmt(done)} / ${fmt(x.expected)}</div>` : ''}
                            </div>
                            <div class="text-right flex-shrink-0">
                                <div class="font-bold font-rounded text-pastel-green text-sm">${fmt(x.remaining)}</div></div>
                        </div>
                        <button onclick="closeSheet();openTxnSheet('${esc(x.srcId)}')"
                            class="w-full mt-2 py-1.5 rounded-lg bg-white border border-pastel-border text-[11px] font-bold text-stone-600 tactile">看這筆原始紀錄</button>
                    </div>`;
        }).join('')}
            </div>
            <button onclick="closeSheet();settleUp('${esc(nameOf(memberId))}', ${remaining}, 'member2pool')"
                class="w-full mt-4 py-3.5 bg-pastel-green text-white font-bold rounded-tile text-sm shadow-md tactile">
                <i class="fa-solid fa-money-bill-transfer mr-1.5"></i>記錄一筆結算 ${fmt(remaining)}</button>`);
    }

    /* ---------- 第二層：待辦（三類合併成一張，但個別項目仍直接列出） ---------- */
    function todoCard() {
        const secs = [reminderSection(), pendingSection(), receivableSection()].filter(Boolean);
        if (!secs.length) return '';
        const n = dueReminders().length + myPendingSettlements().length + othersOweMe().length;
        return `<div class="bg-white rounded-card shadow-card border border-pastel-border/60 border-l-4 border-l-pastel-accent p-5 space-y-4">
            <div class="flex justify-between items-center">
                <span class="text-sm font-bold text-stone-800"><i class="fa-solid fa-list-check text-pastel-accent mr-1.5"></i>待辦</span>
                <span class="text-xs text-pastel-muted">${n} 件</span></div>
            ${secs.join('<div class="border-t border-pastel-border"></div>')}
        </div>`;
    }

    /* 快速歸還：金額預帶剩餘、備註自動生成，parent_txn_id 與 settle_member_id 自動寫入 */
    function openRepay(srcId) {
        const x = myPendingSettlements().find(i => i.srcId === srcId); if (!x) return;
        openSheet(`
            <h3 class="text-lg font-bold text-stone-800 mb-1">歸還給 ${esc(x.payerName)}</h3>
            <p class="text-xs text-pastel-muted mb-5">${esc(x.note || x.category || '')} ・ 應付 ${fmt(x.expected)}</p>
            <div class="space-y-4">
                <div class="field"><label class="block text-xs font-bold text-stone-600 mb-1.5">歸還金額（可部分歸還）</label>
                    <input id="rpAmt" type="number" inputmode="decimal" value="${x.remaining}" class="w-full p-3.5 rounded-tile bg-pastel-accentLight border-2 border-pastel-accent/40 text-stone-800 font-bold text-xl font-rounded"></div>
                <div class="field"><label class="block text-xs font-bold text-stone-600 mb-1.5">日期</label>
                    <input id="rpDate" type="date" value="${todayISO()}" class="w-full py-3 px-3 rounded-tile bg-pastel-bg border border-pastel-border text-sm"></div>
                <div class="field"><label class="block text-xs font-bold text-stone-600 mb-1.5">備註</label>
                    <input id="rpNote" value="${esc(`${x.payerName}代墊：${x.category || x.note || ''}`)}" class="w-full p-3.5 rounded-tile bg-pastel-bg border border-pastel-border text-sm"></div>
                <div class="field"><label class="block text-xs font-bold text-stone-600 mb-1.5">從哪個帳戶付</label>
                    <select id="rpTag" class="w-full p-3 rounded-tile bg-pastel-bg border border-pastel-border text-sm">
                        ${STATE.tags.map(t => `<option ${PREF.get('tag', '') === t.item_name ? 'selected' : ''}>${esc(t.item_name)}</option>`).join('')}</select></div>
                <button onclick="doRepay('${esc(srcId)}')" class="w-full py-4 bg-pastel-accent text-white font-bold rounded-tile shadow-md text-sm tactile">確認歸還</button>
            </div>`);
    }

    function buildRepayTxn(x, amount, date, note, tag) {
        return {
            date: date || todayISO(), entry_type: '還款', category: '', tag: tag || '結算',
            amount, note: note || `${x.payerName}代墊：${x.category || x.note || ''}`,
            nature: x.itemType === 'pool' ? '家庭代墊' : '私人拆帳',
            member_id: STATE.me.member_id, payer_id: STATE.me.member_id,
            related_id: x.payerId, parent_txn_id: x.srcId, settle_member_id: STATE.me.member_id
        };
    }

    async function doRepay(srcId) {
        const x = myPendingSettlements().find(i => i.srcId === srcId); if (!x) return;
        const amt = Number(document.getElementById('rpAmt').value);
        if (!amt || amt <= 0) { buzz(30); return toast('請輸入金額', true); }
        if (amt > x.remaining + 0.01) { buzz(30); return toast(`不能超過應付的 ${fmt(x.remaining)}`, true); }
        const txn = buildRepayTxn(x, amt, document.getElementById('rpDate').value,
            document.getElementById('rpNote').value, document.getElementById('rpTag').value);
        closeSheet();
        if (x.marked) { try { await api.call('deleteIntent', { intent_id: `${x.srcId}|${STATE.me.member_id}` }); STATE.intents = STATE.intents.filter(i => i.parent_txn_id !== x.srcId || i.member_id !== STATE.me.member_id); } catch (e) { } }
        await optimisticAdd(txn, null, '已歸還');
    }

    /** scope: 'private' 只還私人拆帳；'all' 連公帳代墊一起（一律走路徑 A 直接還款） */
    async function repayAll(scope) {
        const all = myPendingSettlements();
        const list = scope === 'private' ? all.filter(x => x.itemType === 'private') : all;
        if (!list.length) return;
        const total = list.reduce((a, b) => a + b.remaining, 0);
        const pool = list.filter(x => x.itemType === 'pool');
        const detail = list.map(x => `・${x.payerName}（${x.itemType === 'pool' ? '公帳代墊' : '私人拆帳'}）：${fmt(x.remaining)}`).join('\n');
        const warn = pool.length
            ? `\n\n注意：其中 ${pool.length} 筆是公帳代墊，將以「直接還款」處理；\n若你原本想讓公帳月結，請改用逐筆的「記為公帳扣抵」。`
            : '';
        if (!confirm(`將產生 ${list.length} 筆還款交易，合計 ${fmt(total)}：\n\n${detail}${warn}\n\n確定嗎？`)) return;
        let okN = 0, failN = 0;
        for (const x of list) {
            try {
                await api.call('addTransaction', { txn: buildRepayTxn(x, x.remaining) });
                if (x.marked) { try { await api.call('deleteIntent', { intent_id: `${x.srcId}|${STATE.me.member_id}` }); } catch (e2) { } }
                okN++;
            } catch (e) { failN++; }
        }
        await refreshData();
        toast(failN ? `成功 ${okN} 筆、失敗 ${failN} 筆` : `已歸還 ${okN} 筆`, !!failN);
    }

    async function markPool(srcId) {
        const x = myPendingSettlements().find(i => i.srcId === srcId); if (!x) return;
        STATE.intents.push({ intent_id: `${srcId}|${STATE.me.member_id}`, parent_txn_id: srcId, member_id: STATE.me.member_id, payer_id: x.payerId, amount: x.remaining, status: '待沖銷' });
        renderDashboard(); toast('已標記為公帳月結');
        try { await api.call('saveIntent', { parent_txn_id: srcId, payer_id: x.payerId, amount: x.remaining }); }
        catch (e) { STATE.intents = STATE.intents.filter(i => i.parent_txn_id !== srcId || i.member_id !== STATE.me.member_id); renderDashboard(); toast(e.message, true); }
    }
    async function unmarkPool(srcId) {
        const bak = [...STATE.intents];
        STATE.intents = STATE.intents.filter(i => i.parent_txn_id !== srcId || i.member_id !== STATE.me.member_id);
        renderDashboard(); toast('已取消');
        try { await api.call('deleteIntent', { intent_id: `${srcId}|${STATE.me.member_id}` }); }
        catch (e) { STATE.intents = bak; renderDashboard(); toast(e.message, true); }
    }

    /* 家庭模式：公帳待沖銷（路徑 B 的核銷區） */
    function intentCard() {
        if (!(STATE.intents || []).length) return '';
        return `<div class="bg-white border border-pastel-border/60 rounded-card p-5 shadow-card space-y-3">
            <div class="text-sm font-bold text-stone-800"><i class="fa-solid fa-building-columns text-pastel-blue mr-1.5"></i>待公帳撥款沖銷</div>
            <p class="text-[11px] text-pastel-muted">成員已標記「由公帳月結」的分攤，確認撥款後才會寫入實際交易。</p>
            ${(STATE.intents || []).map(i => {
                const src = STATE.transactions.find(t => t.txn_id === i.parent_txn_id);
                return `<div class="bg-pastel-bg rounded-tile p-3 border border-pastel-border flex justify-between items-center gap-2">
                    <div class="min-w-0">
                        <div class="font-bold text-sm text-stone-800 truncate">${esc(nameOf(i.member_id))} → ${esc(nameOf(i.payer_id))}</div>
                        <div class="text-[10px] text-pastel-muted truncate">${esc(src ? (src.note || src.category) : '—')}</div></div>
                    <div class="text-right flex-shrink-0">
                        <div class="font-bold font-rounded text-sm mb-1">${fmt(i.amount)}</div>
                        <button onclick="settleIntent('${esc(i.intent_id)}')" class="px-3 py-1.5 bg-pastel-accent text-white rounded-lg text-[10px] font-bold tactile">確認撥款</button></div>
                </div>`;
            }).join('')}
        </div>`;
    }
    async function settleIntent(id) {
        const it = (STATE.intents || []).find(i => i.intent_id === id); if (!it) return;
        if (!confirm(`確認由公帳撥款 ${fmt(it.amount)} 給 ${nameOf(it.payer_id)}？`)) return;
        try {
            const res = await api.call('settleIntent', { intent_id: id });
            STATE.transactions.push(res.txn);
            if (res.remaining > 0.01) it.amount = res.remaining;
            else STATE.intents = STATE.intents.filter(i => i.intent_id !== id);
            renderDataViews(); toast('已撥款結清');
        } catch (e) { toast(e.message, true); }
    }

    /* ---------- 存錢罐 UI ---------- */
    /* 籌碼：外圈是有厚度的幣身（滾花邊 + 側面陰影），中央是投入者的角色頭像。
       金幣與銀幣只差在配色變數，結構完全相同。 */
    /* 籌碼：外圈是有厚度的幣身（橫向滾花邊），中央頭像填滿第二層圓框。
       金幣與銀幣只差在配色變數，結構完全相同。 */
    function coinSvg(c, size) {
        const px = size || 28;
        const m = STATE.members.find(x => x.member_id === c.member_id);
        const av = m?.avatar_emoji || 'av5';
        const cls = c.kind === 'gold' ? 'coin-gold' : 'coin-silver';
        const inner = String(av).startsWith('av')
            ? `<img src="./${esc(av)}.png" alt="" class="pic">`
            : `<span class="pic" style="font-size:${Math.round(px * .38)}px;color:var(--cDark)"><i class="fa-solid ${esc(isFA(av) ? av : 'fa-user')}"></i></span>`;
        return `<div class="coin3d ${cls}" style="width:${px}px;height:${px}px" title="${esc(c.date)} ${fmt(c.total)}${c.kind === 'gold' ? ' · 金幣' : ' · 銀幣'}">
            <span class="edge"></span>
            <span class="face">${inner}</span>
        </div>`;
    }

    /* 罐子：卡片主角，水位＝已存比例。進度條已移除，水位本身就是進度。 */
    function jarSvg(g, saved, big) {
        const pct = g.target_amount ? Math.min(saved / g.target_amount * 100, 100) : 0;
        const done = saved >= g.target_amount && g.target_amount > 0;
        const uid2 = 'jc' + String(g.goal_id).replace(/[^\w]/g, '');
        const body = 'M14 20 h72 a10 10 0 0 1 10 10 v76 a14 14 0 0 1 -14 14 h-64 a14 14 0 0 1 -14 -14 v-76 a10 10 0 0 1 10 -10 z';
        const lvl = 120 - 96 * pct / 100;
        return `<svg viewBox="0 0 100 132" class="${big ? 'w-full h-full' : 'w-full h-full'}">
            <defs>
                <linearGradient id="${uid2}g" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="${done ? '#FFD97A' : '#FFB979'}"/>
                    <stop offset="100%" stop-color="${done ? '#F0AF10' : '#F08A32'}"/></linearGradient>
                <clipPath id="${uid2}c"><path d="${body}"/></clipPath>
            </defs>
            <rect x="34" y="6" width="32" height="9" rx="3.5" fill="#DCCDB8"/>
            <path d="${body}" fill="#FDF6EC"/>
            <g clip-path="url(#${uid2}c)">
                <rect x="0" y="${lvl.toFixed(1)}" width="100" height="132" fill="url(#${uid2}g)"/>
                <path d="M0 ${lvl.toFixed(1)} q12 -5 25 0 t25 0 t25 0 t25 0 v10 h-100 z" fill="${done ? '#FFE29A' : '#FFC994'}" opacity=".8"/>
            </g>
            <path d="${body}" fill="none" stroke="#E7D9C6" stroke-width="3"/>
            <path d="M24 34 q6 -6 14 -6" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none" opacity=".65"/>
        </svg>`;
    }

    function jarCard(g) {
        const saved = goalSaved(g.goal_id), spent = goalSpent(g.goal_id), reserved = goalReserved(g.goal_id);
        const coins = goalCoins(g.goal_id), gold = coins.filter(c => c.kind === 'gold').length;
        const done = saved >= g.target_amount && g.target_amount > 0;
        const pct = g.target_amount ? Math.min(saved / g.target_amount * 100, 100) : 0;
        return `<div class="snap-i flex-shrink-0 w-full px-0.5">
            <div class="bg-white border border-pastel-border/60 rounded-card shadow-sm p-4 space-y-3 tactile-card">
                <!-- 罐子與數字並排：罐子仍是主角，但卡片高度比置中版少約三分之一 -->
                <div class="flex items-center gap-4">
                    <button onclick="openGoalDetail('${esc(g.goal_id)}')" class="relative w-[100px] h-[128px] flex-shrink-0">
                        ${jarSvg(g, saved)}
                        ${done ? '<i class="fa-solid fa-crown fa-beat absolute top-0 right-0 text-pastel-yellow"></i>' : ''}
                        <div class="absolute inset-0 flex items-center justify-center pt-3 pointer-events-none">
                            <span class="text-3xl font-bold font-rounded tracking-tight" style="color:${pct > 45 ? '#FFFFFF' : '#8A5A22'};text-shadow:${pct > 45 ? '0 1px 3px rgba(0,0,0,.18)' : 'none'}">${pct.toFixed(0)}<span class="text-lg">%</span></span>
                        </div>
                    </button>
                    <div class="min-w-0 flex-1">
                        <div class="flex items-start justify-between gap-2">
                            <div class="min-w-0">
                                <div class="font-bold text-stone-800 text-base truncate"><i class="fa-solid ${esc(g.icon || 'fa-piggy-bank')} mr-1.5 text-pastel-accent"></i>${esc(g.name)}</div>
                                <div class="text-[11px] text-pastel-muted truncate">${esc(g.scope === 'family' ? '家庭共同' : '個人')} ・ ${esc(nameOf(g.owner_id))}</div>
                            </div>
                            <button onclick="openGoalMenu('${esc(g.goal_id)}')" aria-label="更多" class="w-8 h-8 -mt-1 -mr-1 rounded-full flex items-center justify-center text-stone-400 flex-shrink-0 tactile"><i class="fa-solid fa-ellipsis"></i></button>
                        </div>
                        <div class="mt-2 text-2xl font-bold font-rounded text-stone-800 tracking-tight truncate">
                            <span class="num-sym text-base">$</span>${Number(saved).toLocaleString('en-US')}</div>
                        <div class="text-[11px] text-pastel-muted truncate">目標 ${fmt(g.target_amount)}${spent > 0 ? ` ・ 已花 ${fmt(spent)}` : ''}</div>
                        ${g.note ? `<div class="text-[11px] text-stone-500 mt-1 truncate">${esc(g.note)}</div>` : ''}
                    </div>
                </div>

                <div class="flex items-center gap-2">
                    <div class="flex gap-1.5 overflow-x-auto hide-scrollbar flex-1 min-w-0">
                        ${coins.length ? coins.slice(-10).map(c => coinSvg(c, 28)).join('')
                : '<span class="text-[11px] text-pastel-muted self-center">還沒有籌碼，投第一枚吧</span>'}
                    </div>
                    ${coins.length ? `<span class="text-[11px] text-pastel-muted flex-shrink-0">${coins.length} 枚${gold ? `・金 ${gold}` : ''}</span>` : ''}
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <button onclick="openDeposit('${esc(g.goal_id)}')" class="py-2.5 bg-pastel-accent text-white font-bold rounded-tile text-sm tactile"><i class="fa-solid fa-coins mr-1.5"></i>存入劃撥</button>
                    <button onclick="openGoalDetail('${esc(g.goal_id)}')" class="py-2.5 bg-pastel-bg border border-pastel-border text-stone-600 font-bold rounded-tile text-sm tactile"><i class="fa-solid fa-list-ul mr-1.5"></i>投入明細</button>
                </div>
                ${reserved > 0 && spent > 0 ? `<p class="text-[10px] text-pastel-muted">保留額 ${fmt(reserved)}（已隨貼標花費自動遞減）</p>` : ''}
            </div></div>`;
    }

    /* 目標改用左右滑動的輪播，頁面不會因為目標變多而愈拉愈長 */
    function jarSection() {
        const list = activeGoals();
        const head = `<div class="flex justify-between items-center">
            <h3 class="text-sm font-bold text-stone-800 ml-1"><i class="fa-solid fa-piggy-bank text-pastel-accent mr-1.5"></i>存錢罐${list.length > 1 ? `<span class="text-pastel-muted font-normal ml-1.5 text-xs">${list.length} 個</span>` : ''}</h3>
            <button onclick="openGoalSheet()" class="text-xs font-bold text-pastel-accent">新增目標</button></div>`;
        if (!list.length) return `${head}
            <button onclick="openGoalSheet()" class="w-full text-left bg-white border border-dashed border-pastel-accent/50 rounded-card p-5 shadow-card flex items-center gap-4 tactile-card">
                <img src="./av2.png" alt="" class="w-12 h-12 flex-shrink-0">
                <div class="min-w-0"><div class="font-bold text-sm text-stone-800">建立第一個存錢目標</div>
                <div class="text-xs text-pastel-muted mt-0.5">每次存入都會投一枚印著你頭像的籌碼</div></div>
                <i class="fa-solid fa-chevron-right text-pastel-accent ml-auto"></i></button>`;
        return `${head}
            <div id="jarRail" class="snap-x flex gap-3 overflow-x-auto hide-scrollbar -mx-1 px-1" onscroll="paintJarDots()">
                ${list.map(jarCard).join('')}
            </div>
            ${list.length > 1 ? `<div id="jarDots" class="flex justify-center gap-1.5">
                ${list.map((_, i) => `<span class="w-1.5 h-1.5 rounded-full ${i === 0 ? 'bg-pastel-accent' : 'bg-pastel-border'}"></span>`).join('')}
            </div>` : ''}`;
    }
    function paintJarDots() {
        const rail = document.getElementById('jarRail'), dots = document.getElementById('jarDots');
        if (!rail || !dots) return;
        const i = Math.round(rail.scrollLeft / Math.max(rail.clientWidth, 1));
        [...dots.children].forEach((d, j) => {
            d.className = `w-1.5 h-1.5 rounded-full ${j === i ? 'bg-pastel-accent' : 'bg-pastel-border'}`;
        });
    }

    /* ---------- 「⋯」選單：編輯 / 刪除 / 結案 ---------- */

        const g = goalById(id); if (!g) return;
        const mine = !g.owner_id || g.owner_id === STATE.me?.member_id;
        const item = (icon, label, fn, cls) => `<button onclick="closeSheet();setTimeout(()=>${fn},320)" class="w-full flex items-center gap-3 px-4 py-3.5 rounded-tile bg-pastel-bg border border-pastel-border tactile ${cls || 'text-stone-700'}">
            <i class="fa-solid ${icon} w-5 text-center"></i><span class="text-sm font-bold">${label}</span></button>`;
        openSheet(`
            <h3 class="text-lg font-bold text-stone-800 mb-1">${esc(g.name)}</h3>
            <p class="text-xs text-pastel-muted mb-5">${mine ? '' : `只有建立者 ${esc(nameOf(g.owner_id))} 可以編輯或刪除`}</p>
            <div class="space-y-2.5">
                ${item('fa-list-ul', '投入明細', `openGoalDetail('${esc(id)}')`)}
                ${mine ? item('fa-arrow-up-from-bracket', '中途提取', `openWithdraw('${esc(id)}')`) : ''}
                ${mine ? item('fa-pen', '編輯目標', `openGoalSheet('${esc(id)}')`) : ''}
                ${mine ? item('fa-flag-checkered', '歸銷結案', `openCloseGoal('${esc(id)}')`) : ''}
                ${mine ? item('fa-trash', '刪除目標', `deleteGoal('${esc(id)}')`, 'text-pastel-red') : ''}
            </div>`);

    /* ---------- 投入明細：滿版面板 ---------- */
    function openGoalDetail(id) {
        const g = goalById(id); if (!g) return;
        const saved = goalSaved(id), spent = goalSpent(id), reserved = goalReserved(id);
        const coins = goalCoins(id);
        const deps = goalDeposits(id).slice().sort((a, b) => (b.date + b.created_at).localeCompare(a.date + a.created_at));
        const spends = activeTxns().filter(t => t.entry_type === '支出' && t.tag === g.project_tag)
            .sort((a, b) => (b.date + b.created_at).localeCompare(a.date + a.created_at));
        const byMember = {};
        coins.forEach(c => { byMember[c.member_id] = (byMember[c.member_id] || 0) + 1; });
        openSheet(`
            <div class="mb-5 pb-4 border-b border-pastel-border">
                <div class="flex items-center gap-4">
                    <div class="relative w-[108px] flex-shrink-0" style="height:8.5rem">${jarSvg(g, saved, true)}
                        <div class="absolute inset-0 flex items-center justify-center pt-3 pointer-events-none">
                            <span class="text-3xl font-bold font-rounded" style="color:${(g.target_amount ? Math.min(saved / g.target_amount * 100, 100) : 0) > 45 ? '#FFFFFF' : '#8A5A22'};text-shadow:${(g.target_amount ? Math.min(saved / g.target_amount * 100, 100) : 0) > 45 ? '0 1px 3px rgba(0,0,0,.18)' : 'none'}">${(g.target_amount ? Math.min(saved / g.target_amount * 100, 100) : 0).toFixed(0)}<span class="text-lg">%</span></span></div>
                    </div>
                    <div class="min-w-0 flex-1">
                        <div class="font-bold text-stone-800 text-lg truncate"><i class="fa-solid ${esc(g.icon || 'fa-piggy-bank')} mr-1.5 text-pastel-accent"></i>${esc(g.name)}</div>
                        <div class="text-[11px] text-pastel-muted mb-2">${esc(g.scope === 'family' ? '家庭共同目標' : '個人目標')} ・ 建立者 ${esc(nameOf(g.owner_id))}</div>
                        <div class="text-2xl font-bold font-rounded text-stone-800"><span class="num-sym text-base">$</span>${Number(saved).toLocaleString('en-US')}</div>
                        <div class="text-[11px] text-pastel-muted">目標 ${fmt(g.target_amount)}</div>
                    </div>
                </div>
                ${g.note ? `<p class="text-xs text-stone-600 leading-relaxed mt-3 bg-white/70 rounded-tile p-3 border border-pastel-border">${esc(g.note)}</p>` : ''}
            </div>

            <div class="grid grid-cols-3 gap-2 mb-5 text-center">
                ${[['累計劃撥', fmt(saved), 'text-stone-800'], ['已貼標花用', fmt(spent), 'text-pastel-red'], ['目前保留額', fmt(reserved), 'text-pastel-green']]
                .map(([l, v, c]) => `<div class="bg-pastel-bg rounded-tile p-3 border border-pastel-border min-w-0">
                    <div class="text-[10px] text-pastel-muted mb-0.5">${l}</div>
                    <div class="text-sm font-bold font-rounded truncate ${c}">${v}</div></div>`).join('')}
            </div>

            <div class="mb-5">
                <div class="text-xs font-bold text-stone-600 mb-2">籌碼牆 ${coins.length} 枚</div>
                ${coins.length ? `<div class="flex flex-wrap gap-2.5 p-3.5 rounded-tile bg-pastel-bg border border-pastel-border">${coins.map(c => coinSvg(c, 36)).join('')}</div>
                <div class="flex flex-wrap gap-3 mt-2">${Object.entries(byMember).map(([mid, n]) =>
                    `<span class="text-[11px] text-pastel-muted">${esc(nameOf(mid))} ${n} 枚</span>`).join('')}</div>`
                : '<div class="text-[11px] text-pastel-muted">還沒有籌碼</div>'}
            </div>

            <div class="mb-5">
                <div class="text-xs font-bold text-stone-600 mb-2">劃撥紀錄</div>
                <div class="space-y-2">
                ${deps.length ? deps.map(t => `
                    <div class="flex justify-between items-center bg-pastel-bg rounded-tile px-3 py-3 border border-pastel-border">
                        <div class="min-w-0"><div class="text-sm font-bold text-stone-800 truncate">${esc(nameOf(t.payer_id))}${t.settle_member_id === 'RELEASE' ? (String(t.note).indexOf('結案') === 0 ? '（結案釋出）' : '（提取）') : ''}</div>
                        <div class="text-[10px] text-pastel-muted">${esc(t.date)} ・ ${esc(t.tag || '—')}</div></div>
                        <div class="font-bold font-rounded flex-shrink-0 ml-2 ${t.settle_member_id === 'RELEASE' ? 'text-pastel-muted' : 'text-pastel-green'}">${t.settle_member_id === 'RELEASE' ? '-' : '+'}${fmt(t.amount)}</div>
                    </div>`).join('') : '<div class="text-[11px] text-pastel-muted">尚無劃撥</div>'}
                </div>
            </div>

            ${spends.length ? `<div class="mb-5">
                <div class="text-xs font-bold text-stone-600 mb-2">貼標花費（會自動扣抵保留額）</div>
                <div class="space-y-2">${spends.map(t => `
                    <div class="flex justify-between items-center bg-pastel-bg rounded-tile px-3 py-3 border border-pastel-border">
                        <div class="min-w-0"><div class="text-sm font-bold text-stone-800 truncate">${esc(t.note || t.category || '—')}</div>
                        <div class="text-[10px] text-pastel-muted">${esc(t.date)} ・ ${esc(nameOf(t.payer_id))}</div></div>
                        <div class="font-bold font-rounded text-pastel-red flex-shrink-0 ml-2">-${fmt(t.amount)}</div>

            <div class="grid grid-cols-2 gap-2">

                <button onclick="closeSheet();setTimeout(()=>openWithdraw('${esc(id)}'),320)" class="py-4 bg-pastel-bg border border-pastel-border text-stone-600 font-bold rounded-tile text-sm tactile"><i class="fa-solid fa-arrow-up-from-bracket mr-1.5"></i>提取</button>
            </div>`);

    const GOAL_ICONS = ['fa-piggy-bank', 'fa-plane', 'fa-house', 'fa-car', 'fa-mobile-screen', 'fa-graduation-cap',
        'fa-heart', 'fa-camera', 'fa-laptop', 'fa-ring', 'fa-gift', 'fa-umbrella-beach'];
    let _goalDraft = {};
    function stashGoalDraft() {
        const n = document.getElementById('glName'); if (n) _goalDraft.name = n.value;
        const a = document.getElementById('glAmt'); if (a) _goalDraft.target_amount = a.value;
        const d = document.getElementById('glNote'); if (d) _goalDraft.note = d.value;
        const sc = document.getElementById('glScope'); if (sc) _goalDraft.scope = sc.value;
    }
    /* 先前這裡呼叫 openGoalSheet(id)，而它第一行就用資料庫的值覆蓋草稿，
       等於每點一次圖示就被還原一次——圖示看起來「按不動」的原因。 */
    function pickGoalIcon(ic) {
        buzz();
        stashGoalDraft();       // 先把使用者已輸入的內容保住
        _goalDraft.icon = ic;
        renderGoalSheet();      // 只重繪，不從資料庫還原
    }
    function openGoalSheet(id) {
        const g = id ? goalById(id) : null;
        _goalDraft = g ? { ...g } : { goal_id: '', name: '', icon: 'fa-piggy-bank', target_amount: '', note: '', scope: currentMode === 'family' ? 'family' : 'personal' };
        renderGoalSheet();
    }
    function renderGoalSheet() {
        const d = _goalDraft, isEdit = !!d.goal_id;
        const g = isEdit ? goalById(d.goal_id) : null;
        const mine = !g || !g.owner_id || g.owner_id === STATE.me?.member_id;
        openSheet(`
            <h3 class="text-lg font-bold text-stone-800 mb-1">${isEdit ? '編輯目標' : '新增存錢目標'}</h3>
            <p class="text-xs text-pastel-muted mb-5">${isEdit ? (mine ? '' : '只有建立者可以修改') : '例如「日本旅遊 $60,000」「換手機 $20,000」'}</p>
            <div class="space-y-4">
                <div class="flex items-center gap-3">
                    <div class="w-14 h-14 rounded-tile flex items-center justify-center text-2xl flex-shrink-0"
                         style="background:${hexA('#F8A048', .16)};color:#F8A048"><i class="fa-solid ${esc(d.icon)}"></i></div>
                    <input id="glName" value="${esc(d.name)}" ${mine ? '' : 'disabled'} placeholder="目標名稱"
                        class="field flex-1 w-full p-3.5 rounded-tile bg-pastel-bg border border-pastel-border text-stone-800"></div>
                <div class="grid grid-cols-6 gap-2">
                    ${GOAL_ICONS.map(ic => `<button type="button" onclick="pickGoalIcon('${ic}')" ${mine ? '' : 'disabled'}
                        class="aspect-square rounded-xl flex items-center justify-center border tactile ${d.icon === ic ? 'bg-pastel-accent text-white border-pastel-accent shadow-sm' : 'bg-pastel-bg text-stone-600 border-pastel-border'}">
                        <i class="fa-solid ${ic}"></i></button>`).join('')}
                </div>
                <div class="field"><label class="block text-xs font-bold text-stone-600 mb-1.5">目標金額</label>
                    <input id="glAmt" type="number" inputmode="numeric" ${mine ? '' : 'disabled'} value="${esc(d.target_amount)}"
                        class="w-full p-3.5 rounded-tile bg-pastel-accentLight border-2 border-pastel-accent/40 text-stone-800 font-bold text-lg font-rounded"></div>
                <div class="field"><label class="block text-xs font-bold text-stone-600 mb-1.5">說明（選填）</label>
                    <textarea id="glNote" rows="3" ${mine ? '' : 'disabled'} placeholder="為什麼想存這筆？想達成什麼？"
                        class="w-full p-3.5 rounded-tile bg-pastel-bg border border-pastel-border text-stone-800 text-sm leading-relaxed resize-none">${esc(d.note || '')}</textarea></div>
                ${isEdit ? '' : `<div class="field"><label class="block text-xs font-bold text-stone-600 mb-1.5">誰看得到</label>
                    <select id="glScope" class="w-full p-3 rounded-tile bg-pastel-bg border border-pastel-border text-sm">
                        <option value="personal" ${d.scope === 'personal' ? 'selected' : ''}>只有我</option>
                        <option value="family" ${d.scope === 'family' ? 'selected' : ''}>全家共同目標</option></select></div>`}
                ${g ? `<div class="text-[11px] text-pastel-muted bg-pastel-bg rounded-tile p-3">
                    記帳時選擇標籤「${esc(g.project_tag)}」的支出，會自動從這個罐子的保留額扣抵。</div>` : ''}
                ${mine ? `<button onclick="saveGoal()" class="w-full py-4 bg-pastel-accent text-white font-bold rounded-tile shadow-md text-sm tactile">${isEdit ? '儲存變更' : '建立目標'}</button>` : ''}
            </div>`);
    }
    async function saveGoal() {
        stashGoalDraft();
        const goal = {
            goal_id: _goalDraft.goal_id || '', name: String(_goalDraft.name || '').trim(),
            icon: _goalDraft.icon, target_amount: Number(_goalDraft.target_amount),
            note: _goalDraft.note || '', scope: _goalDraft.scope
        };
        if (!goal.name) { buzz(30); return toast('請輸入名稱', true); }
        if (!goal.target_amount || goal.target_amount <= 0) { buzz(30); return toast('請輸入目標金額', true); }
        closeSheet();
        try {
            const r2 = await api.call('saveGoal', { goal });
            const i = STATE.goals.findIndex(x => x.goal_id === r2.goal.goal_id);

    /* ==========================================================

    /* 空狀態讓角色出場，而不是一行冷冰冰的灰字 */

    function shiftYM(ym, n) {
        let y = Number(ym.slice(0, 4)), m = Number(ym.slice(5, 7)) + n;
        y += Math.floor((m - 1) / 12); m = ((m - 1) % 12 + 12) % 12 + 1;
        return `${y}-${pad2(m)}`;
    }

    /* 日期分組標題拆成「主標 + 日期」兩段，主標放大加深，
       讓它真的形成段落分隔，而不是一行不起眼的灰字。 */
    function dateHeader(iso) {
        const d = new Date(iso + 'T00:00:00'), now = new Date(todayISO() + 'T00:00:00');
        const diff = Math.round((now - d) / 86400000);
        const wk = ['日', '一', '二', '三', '四', '五', '六'][d.getDay()];
        const main = diff === 0 ? '今天' : diff === 1 ? '昨天' : `星期${wk}`;
        const sum = filteredTxns().filter(t => t.date === iso && t.entry_type === '支出')
            .reduce((a, b) => a + Number(b.amount), 0);
        return `<div class="flex items-baseline justify-between px-1.5 mt-6 mb-2.5">
            <div class="flex items-baseline gap-2 min-w-0">
                <span class="text-[15px] font-bold text-stone-800">${main}</span>
                <span class="text-[11px] text-pastel-muted">${d.getMonth() + 1} 月 ${d.getDate()} 日</span></div>
            ${sum ? `<span class="text-[11px] text-pastel-muted flex-shrink-0">支出 ${fmt(sum)}</span>` : ''}
        </div>`;
    }
    /** 這筆交易是否屬於「我的帳」。
        除了我付出去的，別人還給我的錢也是我的現金流入，
        否則收到還款後口袋現金不會增加，明細裡也完全看不到這筆。 */
    function isMine(t, meId) {
        return t.payer_id === meId || (t.entry_type === '還款' && t.related_id === meId);
    }
    /** 這筆是否屬於「家庭帳簿」。
        成員之間的還款（路徑 A）只是兩個人的皮夾互轉，家庭的錢總量沒變，
        而那筆花費在代墊當下就已經記進家庭帳簿了，再記一次會憑空多出金流。
        只有公帳實際撥款（payer 是 family_pool）才是家庭帳戶真的動了錢。 */
    function isFamilyBook(t) {
        if (!FAMILY_NATURES.includes(t.nature)) return false;
        if (t.entry_type === '還款' && t.payer_id !== 'family_pool') return false;
        return true;
    }
    function scopedTxns(ym) {
        const meId = STATE.me?.member_id;
        const rows = activeTxns().filter(t => !ym || inMonth(t.date, ym));
        return currentMode === 'personal' ? rows.filter(t => isMine(t, meId)) : rows.filter(isFamilyBook);
    }
    function filteredTxns() {
        // 全期間模式：跨月搜尋，找「去年那台除濕機多少錢」不必先猜月份
        let rows = filters.allTime ? scopedTxns(null) : scopedTxns(viewYM);
        if (filters.type === 'expense') rows = rows.filter(t => t.entry_type === '支出');
        if (filters.type === 'income') rows = rows.filter(t => t.entry_type === '收入');
        if (filters.natures.length) rows = rows.filter(t => filters.natures.includes(t.nature));
        if (filters.cats.length) rows = rows.filter(t => filters.cats.includes(t.category));
        if (filters.tags.length) rows = rows.filter(t => filters.tags.includes(t.tag));
        /* 成員篩選只在家庭模式有意義 —— 個人模式的明細本來就只有自己的紀錄。
           萬一切回個人模式時舊條件還留著，這裡直接忽略，不會出現「什麼都篩不到」。 */
        if (currentMode === 'family' && filters.members.length) {
            rows = rows.filter(t => filters.members.includes(t.payer_id));
        }
        if (filters.min !== '') rows = rows.filter(t => Number(t.amount) >= Number(filters.min));
        if (filters.max !== '') rows = rows.filter(t => Number(t.amount) <= Number(filters.max));
        if (filters.q) { const q = filters.q.toLowerCase(); rows = rows.filter(t => `${t.note}${t.category}${t.tag}`.toLowerCase().includes(q)); }
        return rows.sort((a, b) => (b.date + b.created_at).localeCompare(a.date + a.created_at));
    }
    function activeFilterCount() {
        return (filters.type !== 'all' ? 1 : 0) + filters.natures.length + filters.cats.length +
            filters.tags.length + (currentMode === 'family' ? filters.members.length : 0) +
            (filters.min !== '' ? 1 : 0) + (filters.max !== '' ? 1 : 0);
    }

    /* ---------- 收支節奏分析圖 ----------
       三組資料共用「同一條基準線」：
         · 每日支出：從基準線長出來的小柱（低矮、可愛，用來看哪幾天爆掉）
         · 收入累計 / 支出累計：兩條上升線
         · 剩餘預算：從月總預算開始倒扣的下降線
       只要「剩餘預算線」始終在「支出累計線」上方就代表安全；
       兩線交叉的那一天，就是花費開始吃掉安全邊際的轉折點。 */
    /* ---------- 期間分桶 ----------
       週：本週一到今天，每天一桶
       月：該月每天一桶（本月只畫到今天）
       年：該年每月一桶（今年只畫到本月）
       圖表的所有計算都改吃這組桶，才能一次支援三種區間。 */
    function rangeBuckets(range, ym) {
        const t = todayISO();
        const rows0 = activeTxnsScoped();
        const push = (arrI, arrE, idx, tx) => {
            if (idx < 0) return;
            if (tx.entry_type === '收入' || tx.entry_type === '注資') arrI[idx] += Number(tx.amount);
            if (tx.entry_type === '支出') arrE[idx] += Number(tx.amount);
        };
        if (range === 'week') {
            const ws = weekStartISO();
            const n = 7, inc = Array(n).fill(0), exp = Array(n).fill(0);
            const last = Math.min(Math.round((new Date(t + 'T00:00:00') - new Date(ws + 'T00:00:00')) / 86400000) + 1, 7);
            rows0.filter(x => x.date >= ws).forEach(x => {
                const i = Math.round((new Date(x.date + 'T00:00:00') - new Date(ws + 'T00:00:00')) / 86400000);
                if (i >= 0 && i < n) push(inc, exp, i, x);
            });
            return { n, last, inc, exp, labels: ['一', '二', '三', '四', '五', '六', '日'], title: '本週', unit: '天',
                     inRange: x => x.date >= ws, periods: 7 };
        }
        if (range === 'year') {
            const y = ym.slice(0, 4), n = 12, inc = Array(n).fill(0), exp = Array(n).fill(0);
            const last = y === t.slice(0, 4) ? Number(t.slice(5, 7)) : 12;
            rows0.filter(x => String(x.date).slice(0, 4) === y).forEach(x => push(inc, exp, Number(x.date.slice(5, 7)) - 1, x));
            return { n, last, inc, exp, labels: Array.from({ length: 12 }, (_, i) => `${i + 1}`), title: `${y} 年`, unit: '月',
                     inRange: x => String(x.date).slice(0, 4) === y, periods: 12 };
        }
        const n = daysInYM(ym), inc = Array(n).fill(0), exp = Array(n).fill(0);
        const last = ym === currentYM() ? Math.min(Number(t.slice(8, 10)), n) : n;
        rows0.filter(x => inMonth(x.date, ym)).forEach(x => push(inc, exp, Number(x.date.slice(8, 10)) - 1, x));
        return { n, last, inc, exp, labels: null, title: `${ym.slice(0, 4)} 年 ${Number(ym.slice(5, 7))} 月`, unit: '日',
                 inRange: x => inMonth(x.date, ym), periods: n };
    }
    /** 依目前模式篩出可用交易（不限月份） */
    function activeTxnsScoped() {
        const meId = STATE.me?.member_id;
        const rows = activeTxns();
        return currentMode === 'personal' ? rows.filter(t => t.payer_id === meId)
            : rows.filter(t => FAMILY_NATURES.includes(t.nature));
    }
    /** 該區間的預算額度（月預算按比例換算） */
    function rangeBudget(range, ym) {
        const b = budgetFor(currentMode, '');
        if (!b) return 0;
        if (range === 'week') return b / daysInYM(currentYM()) * 7;
        if (range === 'year') return b * 12;
        return b;
    }

    /* 把折點轉成平滑的三次貝茲曲線（Catmull-Rom 轉 Bezier）。
       轉折處不再是硬角，讀起來像趨勢而不像折線統計圖。 */
    function smoothPath(pts, yMin, yMax) {
        if (pts.length < 2) return pts.length ? `M${pts[0][0]},${pts[0][1]}` : '';
        const t = 0.22;                       // 張力：越大越彎，0.22 在這個尺寸最自然
        // 貝茲的控制點可能落在資料範圍之外，導致曲線些微溢出繪圖區
        // （累計線視覺上掉到基準線以下）。這裡把控制點夾在繪圖帶內。
        const cy = v => (yMin == null ? v : Math.min(Math.max(v, yMin), yMax));
        let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
        for (let i = 0; i < pts.length - 1; i++) {
            const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || pts[i + 1];
            const c1x = p1[0] + (p2[0] - p0[0]) * t, c1y = cy(p1[1] + (p2[1] - p0[1]) * t);
            const c2x = p2[0] - (p3[0] - p1[0]) * t, c2y = cy(p2[1] - (p3[1] - p1[1]) * t);
            d += ` C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
        }
        return d;
    }

    /* 只圓上面兩角的長條。
       SVG 的 rect rx/ry 會把四個角都圓掉，柱子一矮就變成膠囊甚至橢圓，
       底部也跟著離開基準線。所以改用 path 自己畫：
       左下 → 左上圓角 → 頂邊 → 右上圓角 → 右下 → 收合。 */
    function topRoundedBar(x, y, w, h, fill, opacity) {
        if (h <= 0) return '';
        const r = Math.min(w / 2, h);                 // 高度不足時圓角自動縮小，不會變形
        const f = v => v.toFixed(2);
        const d = `M${f(x)},${f(y + h)} L${f(x)},${f(y + r)} A${f(r)},${f(r)} 0 0 1 ${f(x + r)},${f(y)}`
            + ` L${f(x + w - r)},${f(y)} A${f(r)},${f(r)} 0 0 1 ${f(x + w)},${f(y + r)}`
            + ` L${f(x + w)},${f(y + h)} Z`;
        return `<path d="${d}" fill="${fill}" opacity="${opacity}"/>`;
    }

    function comboChartHtml(ym) {
        const B = rangeBuckets(statsRange, ym);
        const { n, last } = B;
        let ci = 0, ce = 0;
        const cumI = B.inc.map(v => (ci += v)).slice(0, last);
        const cumE = B.exp.map(v => (ce += v)).slice(0, last);
        const dayExp = B.exp.slice(0, last);
        const totalI = cumI.length ? cumI[cumI.length - 1] : 0;
        const totalE = cumE.length ? cumE[cumE.length - 1] : 0;
        if (!totalI && !totalE) return `<div class="flex flex-col items-center py-8 gap-2"><img src="./av14.png" alt="" class="w-14 h-14 opacity-70"><span class="text-xs text-pastel-muted">這個區間還沒有資料</span></div>`;

        const budget = rangeBudget(statsRange, ym);
        const remain = budget ? cumE.map(v => budget - v) : [];
        const W = 320, H = 150, L = 8, R = 8, T = 12, Bt = 128;
        const pw = W - L - R, ph = Bt - T;
        const maxV = Math.max(totalI, totalE, budget, 1);
        const x = i => L + (n === 1 ? pw / 2 : (i / (n - 1)) * pw);
        const y = v => Bt - (Math.max(v, 0) / maxV) * ph;
        const pts = a => smoothPath(a.map((v, i) => [x(i), y(v)]), T, Bt);
        const maxBar = Math.max(...dayExp, 1);
        const bw = Math.max(pw / n - 1.2, 1.4);
        const bars = dayExp.map((v, i) => {
            const hh = v > 0 ? Math.max((v / maxBar) * ph * 0.26, 2) : 0;
            return topRoundedBar(x(i) - bw / 2, Bt - hh, bw, hh, '#F8A048', .6);
        }).join('');
        let crossAt = 0;
        if (budget) for (let i = 0; i < remain.length; i++) if (remain[i] < cumE[i]) { crossAt = i + 1; break; }
        const crossMark = crossAt ? `<line x1="${x(crossAt - 1)}" y1="${T}" x2="${x(crossAt - 1)}" y2="${Bt}" stroke="#F05838" stroke-width="1" stroke-dasharray="2 3" opacity=".6"/>` : '';
        const pace = last ? totalE / last * n : 0;
        const over = budget && pace > budget;
        const tick = i => B.labels ? B.labels[i] : `${i + 1}`;
        const endLabel = statsRange === 'week' ? '日' : statsRange === 'year' ? '12 月' : `${n}日`;

        return `
        <svg viewBox="0 0 ${W} ${H}" class="w-full" style="height:150px" preserveAspectRatio="none">
            <line x1="${L}" y1="${Bt}" x2="${W - R}" y2="${Bt}" stroke="#E7D9C6" stroke-width="1.2"/>
            <line x1="${L}" y1="${T + ph / 2}" x2="${W - R}" y2="${T + ph / 2}" stroke="#F3E7D8" stroke-width="1" stroke-dasharray="3 4"/>
            ${crossMark}${bars}
            ${budget ? `<path d="${pts(remain)}" fill="none" stroke="#3090F8" stroke-width="2" stroke-dasharray="5 3" stroke-linejoin="round" stroke-linecap="round"/>` : ''}
            <path d="${pts(cumI)}" fill="none" stroke="#40B868" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
            <path d="${pts(cumE)}" fill="none" stroke="#F05838" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
        </svg>
        <div class="flex justify-between text-[10px] text-pastel-muted px-1 mt-1">
            <span>${tick(0)}${B.labels ? '' : '日'}</span><span>${tick(Math.ceil(n / 2) - 1)}${B.labels ? '' : '日'}</span>
            <span>${endLabel}${last < n ? `（目前第 ${last} ${B.unit}）` : ''}</span></div>
        <div class="grid grid-cols-2 gap-x-3 gap-y-1.5 mt-3 pt-3 border-t border-pastel-border text-[11px]">
            <span class="flex items-center gap-1.5"><span class="w-3 h-0.5 rounded bg-pastel-green"></span>收入累計 <b class="font-rounded">${fmt(totalI)}</b></span>
            <span class="flex items-center gap-1.5"><span class="w-3 h-0.5 rounded bg-pastel-red"></span>支出累計 <b class="font-rounded">${fmt(totalE)}</b></span>
            <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-sm bg-pastel-accent opacity-60"></span>每${B.unit}支出</span>
            ${budget ? `<span class="flex items-center gap-1.5"><span class="w-3 h-0.5 rounded" style="background:repeating-linear-gradient(90deg,#3090F8 0 4px,transparent 4px 7px)"></span>剩餘預算 <b class="font-rounded">${fmt(budget - totalE)}</b></span>` : '<span></span>'}
        </div>
        ${budget ? `<div class="mt-2.5 px-3 py-2 rounded-tile text-[11px] font-bold leading-relaxed ${crossAt || over ? 'bg-pastel-redLight text-pastel-red' : 'bg-pastel-greenLight text-pastel-green'}">
            <i class="fa-solid ${crossAt || over ? 'fa-triangle-exclamation' : 'fa-circle-check'} mr-1.5"></i>
            ${crossAt ? `第 ${crossAt} ${B.unit}起剩餘預算已低於支出累計，安全邊際正在被吃掉` : '剩餘預算線始終在支出累計線上方，節奏安全'}
            <br>依目前速度推估${B.title}結束約 ${fmt(pace)}${over ? `，將超出 ${fmt(pace - budget)}` : `，還有 ${fmt(budget - pace)} 空間`}
        </div>` : `<button onclick="openBudgetSheet()" class="w-full mt-2.5 py-2 rounded-tile bg-pastel-accentLight text-pastel-accent text-[11px] font-bold tactile">設定預算後，這裡會多一條倒扣線可對照</button>`}`;
    }

    /* 區間切換：週 / 月 / 年 */
    function setStatsRange(r2) { statsRange = r2; buzz(); renderStats(); }
    function rangeTabs() {
        const B = rangeBuckets(statsRange, viewYM);
        return `<div class="flex items-center gap-2">
            <div class="flex bg-stone-200/40 p-1 rounded-tile flex-1">
                ${[['week', '本週'], ['month', '月'], ['year', '年']].map(([v, l]) =>
            `<button onclick="setStatsRange('${v}')" class="flex-1 py-2 rounded-xl text-xs font-bold transition-all tactile ${statsRange === v ? 'bg-white text-pastel-text shadow-sm' : 'text-pastel-muted'}">${l}</button>`).join('')}
            </div>
            ${statsRange === 'week' ? '' : `<button onclick="openMonthPicker()" class="px-3 h-10 rounded-tile bg-white border border-pastel-border text-xs font-bold text-stone-700 shadow-sm tactile whitespace-nowrap">${statsRange === 'year' ? viewYM.slice(0, 4) + ' 年' : esc(B.title)}<i class="fa-solid fa-caret-down text-pastel-muted text-[10px] ml-1.5"></i></button>`}
        </div>`;
    }


    function renderTransactions() {
        // 清單的產生已完全交給 renderTxnList()，這裡只負責頁面骨架
        const c = document.getElementById('transactionsView');
        c.innerHTML = `
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-bold text-stone-800">${currentMode === 'personal' ? '我的明細' : '家庭公帳明細'}</h2>
                <button id="btnSyncTop" onclick="refreshData()" aria-label="同步" class="w-10 h-10 -mr-1 rounded-full flex items-center justify-center text-stone-400 text-lg tactile active:bg-pastel-bg"><i class="fa-solid fa-rotate"></i></button>
            </div>
            ${toolbarRow()}
            ${summaryStrip()}
            <div id="txnList"></div>`;
        renderTxnList();
    }

    /* 只重畫清單，不動搜尋框 —— 中文（注音／拼音）輸入時若整頁重繪，
       輸入框會被銷毀重建，組字中途就被打斷，永遠打不完一個字。 */
    /* 注意：#txnList 不能加任何 space-y-* 類別。
       Tailwind 的 space-y 產生 `.space-y-0 > :not([hidden]) ~ :not([hidden])`，
       權重（0,2,0）高於 .mt-6（0,1,0），會把日期標題的上方留白全部歸零，
       只有第一個子元素倖存——這正是「只有第一組日期間距正常」的原因。 */
    function renderTxnList() {
        const box = document.getElementById('txnList'); if (!box) return;
        const rows = filteredTxns();
        const grouped = rows.reduce((a, t) => { (a[t.date] ||= []).push(t); return a; }, {});
        // 同一天收進同一張大卡，列與列之間只用淡分隔線（iOS 群組清單的作法）
        let list = Object.keys(grouped).sort().reverse().map(date => `
            ${dateHeader(date)}
            <div class="bg-white border border-pastel-border/60 rounded-card shadow-sm overflow-hidden mb-1">
                ${grouped[date].map((t, i, arr) => txnRow(t, i === arr.length - 1)).join('')}
            </div>`).join('');
        if (!rows.length) list = activeFilterCount() || filters.q
            ? emptyState('av37', '找不到符合的紀錄', '換個關鍵字或把篩選條件放寬一點', { label: '清除篩選', fn: 'clearAllFilters()' })
            : emptyState('av46', `${viewYM.slice(5, 7)} 月還是一片空白`, '記下第一筆，這個月的故事就開始了', { label: '記一筆', fn: "switchTab('add')" });
        box.innerHTML = `${swipeHint()}${list}`;
        bindSwipe();
    }

    /* ---------- 明細頁頂部工具列 + 摘要卡 ----------
       原本年月、摘要、搜尋、滑動說明四段各佔一列共約 210px，
       這裡把年月與搜尋併成一列、摘要壓成兩行、說明只顯示三次。 */
    let _searchOpen = false;
    function toggleSearchBar() {
        _searchOpen = !_searchOpen;
        if (!_searchOpen && filters.q) { filters.q = ''; }
        renderTransactions();
        if (_searchOpen) setTimeout(() => document.getElementById('txnSearch')?.focus(), 60);
    }
    function toolbarRow() {
        const fc = activeFilterCount();
        const btn = (icon, on, fn, badge) => `<button onclick="${fn}" class="relative w-9 h-9 rounded-full flex items-center justify-center border tactile ${on ? 'bg-pastel-accent text-white border-pastel-accent' : 'bg-white text-stone-500 border-pastel-border'}">
            <i class="fa-solid ${icon} text-sm"></i>${badge ? `<span class="absolute -top-1 -right-1 w-4 h-4 bg-pastel-accent text-white text-[9px] font-bold rounded-full flex items-center justify-center border border-white">${badge}</span>` : ''}</button>`;
        return `<div class="flex items-center gap-2">
            <div class="flex-1 flex items-center justify-between bg-white rounded-tile border border-pastel-border shadow-sm px-1 h-11 min-w-0">
                ${filters.allTime
                ? `<button onclick="toggleAllTime()" class="flex-1 h-full flex items-center justify-center gap-2 text-xs font-bold text-pastel-accent"><i class="fa-solid fa-infinity"></i>全部期間 ・ 回到單月</button>`
                : `<button onclick="changeMonth(-1)" class="w-9 h-9 flex items-center justify-center text-stone-500"><i class="fa-solid fa-chevron-left text-sm"></i></button>
                   <button onclick="openMonthPicker()" class="flex-1 font-bold text-stone-800 text-sm truncate">${viewYM.slice(0, 4)} 年 ${Number(viewYM.slice(5, 7))} 月<i class="fa-solid fa-caret-down text-pastel-muted text-[10px] ml-1.5"></i></button>
                   <button onclick="changeMonth(1)" class="w-9 h-9 flex items-center justify-center text-stone-500 ${viewYM >= currentYM() ? 'opacity-30' : ''}"><i class="fa-solid fa-chevron-right text-sm"></i></button>`}
            </div>
            ${btn('fa-magnifying-glass', _searchOpen || !!filters.q, 'toggleSearchBar()')}
            ${btn('fa-sliders', fc > 0, 'openFilterSheet()', fc || '')}
        </div>
        ${_searchOpen ? `<div class="relative">
            <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-pastel-muted text-xs"></i>
            <input id="txnSearch" oninput="onSearchInput()" oncompositionstart="onCompStart()" oncompositionend="onCompEnd()" value="${esc(filters.q)}"
                placeholder="${filters.allTime ? '搜尋全部期間' : '搜尋本月備註、分類、帳戶'}"
                class="w-full bg-white border border-pastel-border rounded-full pl-10 pr-24 py-2.5 text-sm focus:outline-none focus:border-pastel-accent shadow-sm">
            <button onclick="toggleAllTime()" class="absolute right-1.5 top-1/2 -translate-y-1/2 px-2.5 py-1.5 rounded-full text-[10px] font-bold ${filters.allTime ? 'bg-pastel-accent text-white' : 'bg-pastel-bg text-pastel-muted border border-pastel-border'}">全期間</button>
        </div>` : ''}
        ${fc ? `<div class="flex items-center justify-between bg-pastel-accentLight border border-pastel-accent/30 rounded-tile px-3 py-2 text-[11px] font-bold text-pastel-accent">
            <span>已套用 ${fc} 個篩選條件</span>
            <button onclick="clearAllFilters()" class="underline">清除</button></div>` : ''}`;
    }

    /* 摘要卡：深色滿版三欄。
       主卡已經是橘色，明細頁若也用橘色兩頁視覺重心會撞在一起；
       深色底讓這一頁有自己的識別，綠／紅金額在深底上對比也更強。 */
    function summaryStrip() {
        const rows = filters.allTime ? scopedTxns(null) : scopedTxns(viewYM);
        const inc = rows.filter(t => t.entry_type === '收入' || t.entry_type === '注資').reduce((a, b) => a + Number(b.amount), 0);
        const exp = rows.filter(t => t.entry_type === '支出').reduce((a, b) => a + Number(b.amount), 0);
        const net = inc - exp;
        let cmp = '';
        if (!filters.allTime) {
            const prev = scopedTxns(shiftYM(viewYM, -1)).filter(t => t.entry_type === '支出')
                .reduce((a, b) => a + Number(b.amount), 0);
            if (prev > 0) {
                const d = (exp - prev) / prev * 100;
                cmp = `<div class="text-right text-[11px] font-bold mt-2 ${d <= 0 ? 'text-[#7BE0A5]' : 'text-[#FF9B85]'}">
                    <i class="fa-solid fa-arrow-${d <= 0 ? 'down' : 'up'} mr-1"></i>比上月${d <= 0 ? '少' : '多'}花 ${Math.abs(d).toFixed(0)}%</div>`;
            }
        }
        const cell = (label, val, cls, sign) => `<div class="flex-1 text-center min-w-0">
            <div class="text-[10px] text-white/55 mb-1">${label}</div>
            <div class="text-base font-bold font-rounded truncate ${cls}">${sign}${fmt(Math.abs(val))}</div></div>`;
        return `<div class="rounded-card px-3 py-3.5 shadow-md" style="background:#3A3430">
            <div class="flex items-center divide-x divide-white/10">
                ${cell('收入', inc, 'text-[#7BE0A5]', '+')}
                ${cell('支出', exp, 'text-[#FF9B85]', '-')}
                ${cell('結餘', net, net >= 0 ? 'text-white' : 'text-[#FF9B85]', net >= 0 ? '' : '-')}
            </div>${cmp}</div>`;
    }

    /* 滑動說明只顯示三次，學會之後就不再佔位 */
    function swipeHint() {
        let n = 0;
        try { n = Number(localStorage.getItem('swipeHint') || 0); } catch (e) { }
        if (n >= 3) return '';
        try { localStorage.setItem('swipeHint', String(n + 1)); } catch (e) { }
        return `<p class="text-[10px] text-pastel-muted text-center bg-white/70 rounded-full py-1.5 border border-pastel-border">
            <i class="fa-solid fa-arrow-left mr-1"></i>左滑作廢　·　右滑編輯<i class="fa-solid fa-arrow-right ml-1"></i>　·　點一下看詳情</p>`;
    }
    /* 單筆不再是獨立卡片：改為群組卡內的一列。
       支出金額改用深灰而非紅色——大面積紅色會讓瀏覽帳目變成一種壓力，
       紅色留給真正的警訊（超支、欠款）。 */
    /** 代墊／拆帳的清償進度：誰還了多少、還清了沒。
        家庭帳簿不再多一筆還款之後，靠這一行維持「誰還了什麼」的可見性。 */
    function settleSummary(t) {
        if (t.entry_type !== '支出') return null;
        if (t.nature !== '家庭代墊' && t.nature !== '私人拆帳') return null;
        const sp = parseSplit(t);
        const parts = sp.length ? sp
            : (t.related_id ? [{ member_id: t.related_id, amount: Number(t.amount) || 0 }] : []);
        if (!parts.length) return null;
        const expected = parts.reduce((a, b) => a + b.amount, 0);
        const paid = parts.reduce((a, b) => a + Math.min(paidFor(t.txn_id, b.member_id), b.amount), 0);
        const done = paid >= expected - 0.01;
        const who = parts.length === 1 ? nameOf(parts[0].member_id) : `${parts.length} 人`;
        return { expected, paid, done, who };
    }

    function txnRow(t, isLast) {
        const meId = STATE.me?.member_id;
        const isTr = t.entry_type === '轉帳';
        const isJar = t.entry_type === '劃撥儲蓄';
        const isRepay = t.entry_type === '還款';
        // 還款要看方向：我付出去是流出，別人還給我是流入。
        // 先前一律當成流入而顯示綠色的 +，付款那一方看起來就變成「收入」。
        const repayIn = isRepay && t.related_id === meId && t.payer_id !== meId;
        const isExp = t.entry_type === '支出' || t.entry_type === '注資' || (isRepay && !repayIn);
        const icon = t.category ? catIcon(t.category)
            : isRepay ? (repayIn ? 'fa-hand-holding-dollar' : 'fa-money-bill-transfer')
                : isJar ? 'fa-piggy-bank' : isTr ? 'fa-right-left' : isExp ? 'fa-money-bill-transfer' : 'fa-sack-dollar';
        const col = t.category ? catColor(t.category)
            : (isTr ? '#3090F8' : isJar ? '#F8A048' : isRepay ? (repayIn ? '#40B868' : '#9A918A') : isExp ? '#9A918A' : '#40B868');
        const amtCls = isTr || isJar ? 'text-pastel-blue' : isExp ? 'text-stone-800' : 'text-pastel-green';
        const sign = isTr || isJar ? '' : isExp ? '-' : '+';
        const repayLabel = isRepay
            ? `還款 ・ ${esc(nameOf(t.payer_id))} → ${esc(nameOf(t.related_id))}` : '';
        return `
        <div class="swipe-wrap relative w-full ${isLast ? '' : 'border-b border-pastel-border/50'} ${t._pending ? 'pending' : ''} ${t._new ? 'is-new' : ''}" data-id="${esc(t.txn_id)}">
            <div class="swipe-bg absolute inset-0 flex items-center justify-between pl-3 pr-6 text-white font-bold text-sm opacity-0 bg-pastel-blue">
                <span class="flex items-center">
                    <span class="sw-edit flex flex-col items-center justify-center gap-0.5 w-[68px] py-1"><i class="fa-solid fa-pen"></i><span class="text-[10px]">編輯</span></span>
                    <span class="sw-copy flex flex-col items-center justify-center gap-0.5 w-[68px] py-1"><i class="fa-solid fa-copy"></i><span class="text-[10px]">再記一次</span></span>
                </span>
                <span class="sw-void flex items-center gap-2">作廢<i class="fa-solid fa-trash"></i></span>
            </div>
            <div class="swipe-inner bg-white px-4 py-3.5 flex justify-between items-center relative w-full">
                <div class="flex items-center gap-3.5 min-w-0">
                    <div class="w-10 h-10 rounded-full flex items-center justify-center text-base flex-shrink-0"
